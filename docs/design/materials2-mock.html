<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MiniDen S27 装修材料库第二轮 · 设计稿（静态原型）</title>
<!--
  状态用 hash 切换（规格见 docs/design/materials.md §0.2）：
  #room 选中卫生间 · #wall 选中单面墙 + 色板选择器（悬停预览墨绿）· #floor 地面选择器（大图）· #tile 墙砖选择器 + 高度
  #paper 墙纸选择器 · #custom 自定义颜色 · #vanity 洗手台 · #toilet 马桶 · #shower 淋浴 · #tub 浴缸
  #door 门 · #window 窗 · #cabinet 台面 / 橱柜 · #nosel 装修里什么都没选
  只是设计稿：数据写死。缩略图是 canvas 程序化画的（验证规格 §7 的做法），没有外部图片。
-->
<style>
:root{
  --bg:#1b1815; --panel:#232019; --panel2:#2c2822; --line:#332f29;
  --text:#ece7df; --muted:#a89f92; --accent:#d9a05b; --ok:#5cbf72; --danger:#e06c5a; --warn:#e0b341;
  --stage-bg:#141210; --field-bg:#141210; --on-fg:#141210;
  --hint-bg:rgba(27,24,21,.8); --totals-bg:rgba(27,24,21,.85);
  --warn-bg:rgba(224,179,65,.10); --warn-line:rgba(224,179,65,.35);
  --accent-hover:#e4b06f; --accent-soft:rgba(217,160,91,.14); --accent-line:rgba(217,160,91,.55);
  --sel-bg:#3b342b; --sel-text:#f6f1e9; --danger-soft:rgba(224,108,90,.12); --danger-line:rgba(224,108,90,.45);
  --menu-bg:#25211b; --shadow-pop:0 10px 36px rgba(0,0,0,.5);
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:16px; --r-1:6px; --r-2:10px;
  /* S26 新增（规格 §6.1） */
  --mat-thumb:36px; --tile-gap:8px; --sw-line:rgba(255,255,255,.14); --preview-line:#7fb8ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:13px}
button{font:inherit;color:inherit}
.btn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--r-1);font-size:var(--fs-2);cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-fg);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{height:24px;font-size:var(--fs-1);padding:0 8px}
.kbd{font-size:11px;opacity:.7;font-weight:400}
.seg{display:inline-flex;background:var(--field-bg);border:1px solid var(--line);border-radius:var(--r-1);padding:2px;gap:2px}
.seg button{height:26px;border:1px solid transparent;background:none;color:var(--muted);padding:0 11px;border-radius:4px;font-size:var(--fs-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--sel-bg);color:var(--sel-text);border-color:var(--accent-line)}
.seg.sm button{height:22px;padding:0 8px;font-size:var(--fs-1)}
.seg button:disabled{opacity:.38}

/* 顶栏 + 模式条（同 S25） */
#topbar{height:49px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.brand{font-weight:700;font-size:16px}
.vsep{width:1px;height:20px;background:var(--line)}
#modeSeg{display:flex;gap:2px;height:100%}
#modeSeg button{position:relative;background:none;border:none;color:var(--muted);font-size:var(--fs-3);font-weight:600;padding:0 12px}
#modeSeg button.on{color:var(--text)}
#modeSeg button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.spacer{flex:1}
#modebar{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
.tools{display:flex;gap:2px}
.tools button{height:30px;padding:0 10px;border-radius:var(--r-1);border:1px solid transparent;background:none;color:var(--muted)}
.tools button.on{background:var(--sel-bg);color:var(--sel-text);border-color:var(--accent-line)}
.mbLbl{font-size:var(--fs-1);color:var(--muted)}

#main{flex:1;display:flex;min-height:0}
.left{width:clamp(260px,24vw,400px);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
#props{width:clamp(240px,21vw,300px);flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panelHead{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.panelHead .ttl{font-size:var(--fs-1);color:var(--muted);font-weight:600;flex:1}
.xbtn{height:22px;padding:0 8px;font-size:11px;border-radius:var(--r-1);border:1px solid var(--line);background:none;color:var(--muted)}

/* 装修左栏：房间行加 3 个小色块（地 / 墙 / 砖） */
.roomRow{display:flex;align-items:center;gap:10px;padding:7px 12px;border-left:2px solid transparent}
.roomRow.on{background:var(--sel-bg);border-left-color:var(--accent)}
.roomRow .nm{flex:1;min-width:0;font-size:var(--fs-2)}
.roomRow .nm small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips3{display:flex;gap:3px}
.chips3 i{width:14px;height:14px;border-radius:3px;border:1px solid var(--sw-line);display:block;background-size:cover}
.chips3 i.none{background:none;border-style:dashed;opacity:.5}
.placeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 12px}
.placeBtn{height:58px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text)}
.placeBtn svg{width:26px;height:26px}

/* ---------- 材质选择器（左栏） ---------- */
#picker{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;z-index:5}
.picking #picker{display:flex}
.mpHead{display:flex;align-items:center;gap:6px;padding:8px 10px 6px 6px}
.mpHead .back{width:28px;height:28px;border:none;background:none;color:var(--muted);font-size:16px;border-radius:6px}
.mpHead .ttl{flex:1;min-width:0}
.mpHead .ttl b{display:block;font-size:var(--fs-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpHead .ttl small{display:block;font-size:11px;color:var(--muted)}
.mpScope{padding:0 12px 8px;display:flex;align-items:center;gap:8px;font-size:var(--fs-1);color:var(--muted)}
.mpTools{display:flex;gap:6px;padding:0 12px 8px}
.mpTools input{flex:1;min-width:0;height:28px;background:var(--field-bg);border:1px solid var(--line);border-radius:var(--r-1);color:var(--text);padding:0 8px;font-size:var(--fs-2)}
.mpTabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chip{height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--muted);font-size:var(--fs-1);white-space:nowrap}
.chip.on{background:var(--sel-bg);color:var(--sel-text);border-color:var(--accent-line)}
.chip .n{opacity:.6;margin-left:3px}
.mpTone{display:flex;align-items:center;gap:4px;padding:0 12px 8px;font-size:11px;color:var(--muted)}
.mpTone .chip{height:22px;padding:0 8px;font-size:11px}
.mpTone .div{width:1px;height:14px;background:var(--line);margin:0 4px}
.mpBody{flex:1;overflow:hidden;padding:0 12px;border-top:1px solid var(--line)}
.mpSec{font-size:11px;color:var(--muted);font-weight:600;margin:10px 0 6px;display:flex;justify-content:space-between}
.strip{display:flex;gap:6px}
.strip .t{width:36px;height:36px;border-radius:6px;border:1px solid var(--sw-line);position:relative;background-size:cover;flex:none}
.strip .t .cnt{position:absolute;right:-4px;top:-5px;font-size:9px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:0 3px;line-height:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--tile-gap)}
.tile{border:none;background:none;text-align:left;cursor:pointer;min-width:0}
.tile .th{display:block;width:100%;aspect-ratio:4/3;border-radius:7px;border:1px solid var(--sw-line);background-size:cover;position:relative}
.tile .nm{display:block;font-size:11.5px;line-height:1.3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.tile .sp{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on .th{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.tile.on .th::after,.pal i.on::after{content:'✓';position:absolute;right:3px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--accent);color:var(--on-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile.hov .th,.pal i.hov{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--preview-line)}
.grid.small{grid-template-columns:repeat(5,1fr);gap:6px}
.grid.small .tile .nm,.grid.small .tile .sp{display:none}
.grid.small .tile .th{aspect-ratio:1}
/* 公共色板：每个色系一行，左边色系名，从浅到深 */
.pal{display:grid;grid-template-columns:40px repeat(6,1fr);gap:5px;align-items:center}
.pal .fam{font-size:11px;color:var(--muted);white-space:nowrap}
.pal i{display:block;height:28px;border-radius:6px;border:1px solid var(--sw-line);position:relative;cursor:pointer}
.pal i.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.pal i.plus{background:conic-gradient(#e06c5a,#e0b341,#5cbf72,#5f9fd9,#a47ad9,#e06c5a);border-color:transparent}
.pal i.plus::before{content:'＋';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mpFoot{border-top:1px solid var(--line);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;flex:none;background:var(--panel)}
.readout{display:flex;align-items:center;gap:8px;font-size:var(--fs-1)}
.readout i{width:22px;height:22px;border-radius:5px;border:1px solid var(--sw-line);display:block;background-size:cover}
.readout b{font-weight:600}
.readout .tag{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:9px;border:1px solid var(--preview-line);color:var(--preview-line)}
.mpHelp{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
/* 自定义颜色：选择器里的内嵌面板（不再裸露系统取色器） */
.custom{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.custom .bar{height:14px;border-radius:7px;position:relative;border:1px solid var(--sw-line)}
.custom .bar i{position:absolute;top:-3px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6);transform:translateX(-9px)}
.custom .lbl{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.custom .row{display:flex;gap:8px;align-items:center}
.custom input{width:90px;height:26px;background:var(--field-bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 6px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---------- 画布 ---------- */
#stage{flex:1;position:relative;background:var(--stage-bg);min-width:0;overflow:hidden}
#stage svg{position:absolute;inset:0;width:100%;height:100%}
.ovl{position:absolute;z-index:9;display:flex;align-items:center;gap:6px}
#crumbs{left:12px;top:12px;background:var(--totals-bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;height:34px;font-size:var(--fs-2)}
#crumbs .sep{color:var(--muted)}
#hint{left:12px;bottom:12px;max-width:calc(100% - 210px);background:var(--hint-bg);padding:6px 10px;border-radius:var(--r-1);font-size:var(--fs-1);color:var(--muted);line-height:1.5}
#hint b{color:var(--text);font-weight:600}
#totals{right:12px;bottom:12px;height:34px;padding:0 12px;background:var(--totals-bg);border:1px solid var(--line);border-radius:8px;font-size:var(--fs-2)}
#totals b{color:var(--ok)}
#legend{right:12px;top:12px;background:var(--totals-bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted);flex-direction:column;align-items:flex-start;gap:3px}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:18px;height:6px;border-radius:1px;display:block}

/* ---------- 右栏：检视 ---------- */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);height:40px;flex:none}
.tab{height:39px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:var(--fs-2);font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .n{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--panel2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.pbody{flex:1;overflow:hidden;padding:12px;display:none;flex-direction:column;gap:12px}
.kicker{font-size:11px;color:var(--muted)}
.pbody>*{flex-shrink:0}
.pbody h3{font-size:var(--fs-3);font-weight:600;line-height:1.35}
.secH{font-size:var(--fs-1);color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:-4px}
.secH a{color:var(--accent);font-weight:400;font-size:11px;text-decoration:none}
/* 材质行：缩略图 + 名字 + 规格 + 状态 + ▸ */
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);text-align:left;cursor:pointer;min-height:46px}
.mrow:hover{border-color:var(--muted)}
.mrow.open{background:var(--sel-bg);border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .mt{width:var(--mat-thumb);height:var(--mat-thumb);border-radius:6px;border:1px solid var(--sw-line);flex:none;background-size:cover}
.mrow .mt.none{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.07) 4px 5px);}
.mrow .mx{flex:1;min-width:0}
.mrow .lb{display:block;font-size:11px;color:var(--muted)}
.mrow .nm{display:block;font-size:var(--fs-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sp{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .st{font-size:10.5px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mrow .st.own{border-color:var(--accent-line);color:var(--accent)}
.mrow .go{color:var(--muted);font-size:12px}
.sub{display:flex;flex-direction:column;gap:6px;padding:2px 0 2px 8px;border-left:2px solid var(--line);margin-left:6px}
.sub .irow>.il{width:40px}
.irow{display:flex;align-items:center;gap:8px;font-size:var(--fs-2)}
.irow>.il{width:56px;flex:none;color:var(--muted);font-size:var(--fs-1)}
.num{width:58px;height:26px;background:var(--field-bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 6px;font-size:var(--fs-2)}
.unit{color:var(--muted);font-size:var(--fs-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sel{flex:none;white-space:nowrap;height:26px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 8px;font-size:var(--fs-2);display:inline-flex;align-items:center;gap:6px}
/* 小图示单选（洗手台 / 马桶 / 淋浴 / 浴缸 / 门板 / 窗格 / 帘型 / 柜门） */
.icons{display:grid;gap:5px}
.icons.c5{grid-template-columns:repeat(5,1fr)} .icons.c4{grid-template-columns:repeat(4,1fr)} .icons.c3{grid-template-columns:repeat(3,1fr)} .icons.c2{grid-template-columns:repeat(2,1fr)}
.ic{border:1px solid var(--line);border-radius:7px;background:var(--field-bg);padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.ic svg{width:30px;height:30px;stroke:#cfc8bc;fill:none;stroke-width:1.4}
.ic span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ic.on{background:var(--sel-bg);border-color:var(--accent-line)}
.ic.on svg{stroke:var(--accent)}
.ic.on span{color:var(--sel-text)}
.ic:disabled{opacity:.35}
/* 一排色块（≤ 8 个时直接放在检视面板里） */
.swRow{display:flex;gap:5px;flex-wrap:nowrap}
.swRow i{width:24px;height:24px;border-radius:6px;border:1px solid var(--sw-line);display:block;position:relative;flex:none;background-size:cover}
.swRow i.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.swRow i.more{background:conic-gradient(#e06c5a,#e0b341,#5cbf72,#5f9fd9,#a47ad9,#e06c5a)}
.swRow.big i{width:34px;height:34px}
.note{font-size:var(--fs-1);line-height:1.55;padding:7px 9px;border-radius:var(--r-1)}
.note.info{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.note.danger{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger)}
.link{color:var(--accent);font-size:var(--fs-1);background:none;border:none;text-align:left;padding:0;cursor:pointer}
.wallList{display:flex;flex-direction:column;gap:2px}
.wallList div{display:flex;align-items:center;gap:8px;font-size:var(--fs-1);padding:4px 6px;border-radius:6px}
.wallList div:hover{background:var(--panel2)}
.wallList i{width:16px;height:16px;border-radius:4px;border:1px solid var(--sw-line);display:block}
.wallList .x{margin-left:auto;color:var(--muted)}
.actions{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}

/* ===== S27 新增 ===== */
.mrow.c{min-height:40px;padding:4px 8px 4px 0;gap:8px;background:none;border-color:transparent;border-radius:6px}
.mrow.c:hover{background:var(--panel2);border-color:var(--line)}
.mrow.c .rl{width:56px;flex:none;padding-left:8px;font-size:var(--fs-1);color:var(--muted)}
.mrow.c .mt{width:28px;height:28px}
.mrow.c.open,.mrow.c[aria-expanded=true]{background:var(--panel2);border-color:var(--line)}
.mrow.c.open{background:var(--sel-bg);border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .chev{color:var(--muted);font-size:11px;width:12px;text-align:center}
.exp{display:flex;flex-direction:column;gap:6px;margin:-4px 0 2px 8px;padding-left:8px;border-left:2px solid var(--line)}
.exp .irow>.il{width:36px}
.exp .irow>.il{width:36px}
.metal{display:block}
.m-chrome{background:linear-gradient(135deg,#f6f8fa 0%,#a9b0b6 45%,#eef1f3 62%,#8d949a 100%)}
.m-nickel{background:linear-gradient(135deg,#e2dfd8 0%,#a8a49b 50%,#d6d2ca 70%,#8f8b83 100%)}
.m-black{background:linear-gradient(135deg,#3a3a3c,#1e1e20)}
.m-brass{background:linear-gradient(135deg,#f0d9a0 0%,#b8924a 50%,#e3c27e 70%,#8d6a2f 100%)}
.m-bronze{background:linear-gradient(135deg,#9a7856 0%,#5a4230 55%,#7d6046 75%,#3e2c1e 100%)}
.swRow.lab{gap:4px}
.swRow.lab span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);width:30px;white-space:nowrap}
.swRow.lab span.on{color:var(--sel-text)}
.swRow.lab span i{width:26px;height:22px}
.special{display:flex;align-items:center;justify-content:center;font-size:10px;color:#2a2622;font-weight:700}

<script>
/* ===== 数据（与规格 §3、§4 一致） ===== */
const PAL=[ // 9 个色系，从浅到深
 ['白',[['纯白','#f7f6f2'],['冷白','#eef0ef'],['奶白','#f3ecdf'],['暖白','#f2efe8'],['象牙白','#efe8da']]],

 ['蓝',[['冰蓝','#d4e0e6'],['雾蓝','#a9b8c2'],['灰蓝','#8a9cab'],['牛仔蓝','#5f7a96'],['石板蓝','#5f7486'],['海军蓝','#2f3e55']]],
 ['粉 · 陶',[['藕粉','#e6d2ca'],['裸粉','#e3c4b6'],['玫瑰灰','#c9a7a3'],['陶土','#c98c6c'],['砖红','#a65f4a'],['酒红','#6e3a3c']]],
 ['黄 · 赭',[['奶油黄','#e8d3a6'],['芥末黄','#c9a54a'],['赭石','#b97a45']]],
 ['紫',[['薰衣草','#cfc7d8'],['灰紫','#8f8199']]],
 ['深色',[['墨黑','#2b2b2d'],['巧克力','#5a4637']]],
];
const ROOMS=[
 {id:'b1',nm:'卧室 1',x:0,y:0,w:230,h:170,floor:['plank','#d6c0a0',19],fn:'浅色白橡 · 直铺',wall:'#a9b8c2',wn:'雾蓝',tile:null,area:'22.3 m²'},
 {id:'ba',nm:'卫生间',x:0,y:170,w:230,h:110,floor:['grid','#e2e0da',60],fn:'白色哑光砖 60×60',wall:'#f2efe8',wn:'暖白',tile:'#f2f1ec',area:'14.9 m²'},
 {id:'b2',nm:'卧室 2',x:0,y:280,w:230,h:150,floor:['plank','#b28c60',19],fn:'跟全屋 · 自然橡木',wall:'#d8cdb9',wn:'墙纸 · 细格纹 亚麻',paper:true,tile:null,area:'18.6 m²'},
 {id:'lv',nm:'客厅',x:230,y:0,w:330,h:360,floor:['plank','#b28c60',19],fn:'跟全屋 · 自然橡木',wall:'#f2efe8',wn:'暖白',tile:null,area:'52.0 m²'},
 {id:'kt',nm:'厨房',x:230,y:360,w:330,h:70,floor:['grid','#929290',60],fn:'灰色大板砖 60×120',wall:'#f2efe8',wn:'暖白',tile:'#3a4a5c',area:'6.0 m²'},
];

/* ===== 程序化缩略图（规格 §7）：统一按真实尺寸画——缩略图代表 120 × 90 cm 的一块 ===== */
const TH={w:192,h:144,pxcm:1.6};          // 2 倍屏：显示 96 × 72
const cache=new Map();
function rng(s){ return ()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0)>>>0)%1000/1000; }
function shade(hex,k){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; r=Math.max(0,Math.min(255,r*k)); g=Math.max(0,Math.min(255,g*k)); b=Math.max(0,Math.min(255,b*k)); return `rgb(${r|0},${g|0},${b|0})`; }
function thumb(kind,c,a,b,seed){
  const key=[kind,c,a,b,seed].join('|'); if(cache.has(key)) return cache.get(key);
  const cv=document.createElement('canvas'); cv.width=TH.w; cv.height=TH.h; const g=cv.getContext('2d'); const R=rng(seed||7), P=TH.pxcm;
  g.fillStyle=c; g.fillRect(0,0,TH.w,TH.h);
  if(kind==='plank'||kind==='spc'){ const w=(a||19)*P, L=(b||120)*P; let col=0;
    for(let x=0;x<TH.w;x+=w,col++){ const off=(col%2? L/2 : (col%3? L/3:0));
      for(let y=-off;y<TH.h;y+=L){ g.fillStyle=shade(c,.9+R()*.2); g.fillRect(x,y,w-1,L-1);
        g.strokeStyle='rgba(0,0,0,.06)'; for(let k=0;k<4;k++){ g.beginPath(); const xx=x+R()*w; g.moveTo(xx,y); g.lineTo(xx+R()*3,y+L); g.stroke(); } } }
    g.fillStyle='rgba(0,0,0,.18)'; for(let x=0;x<TH.w;x+=w) g.fillRect(x-1,0,1,TH.h); }
  else if(kind==='herr'){ const w=(a||9)*P, L=w*6; g.save(); g.translate(TH.w/2,TH.h/2); g.rotate(Math.PI/4);
    for(let i=-20;i<20;i++) for(let j=-20;j<20;j++){ const x=i*w, y=j*w*2+(i%2?w:0); g.fillStyle=shade(c,.88+R()*.24);
      if((i+j)%2){ g.fillRect(x,y,w-1,L/3-1);} else { g.fillRect(x,y,L/3-1,w-1);} }
    g.restore(); }
  else if(kind==='grid'||kind==='subway'||kind==='subwayS'){ const tw=(a||60)*P, th=(b||a||60)*P;
    for(let y=0,r=0;y<TH.h+th;y+=th,r++) for(let x=-tw;x<TH.w+tw;x+=tw){ const xo=(kind==='subway'&&r%2)? tw/2:0; g.fillStyle=shade(c,.95+R()*.08); g.fillRect(x+xo,y,tw-1.5,th-1.5); }
    if(kind!=='grid'||a<30){ g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,0,TH.w,2); } }
  else if(kind==='check'){ const t=30*P; for(let y=0;y<TH.h;y+=t) for(let x=0;x<TH.w;x+=t){ g.fillStyle=((x+y)/t)%2?'#262628':'#e8e6e0'; g.fillRect(x,y,t-1,t-1);} }
  else if(kind==='hex'){ const r=(a||20)/2*P; g.strokeStyle=shade(c,.7); g.lineWidth=1.5;
    for(let y=0,k=0;y<TH.h+r*2;y+=r*1.73,k++) for(let x=(k%2?r*1.5:0);x<TH.w+r*3;x+=r*3){ g.beginPath(); for(let i=0;i<6;i++){ const t=Math.PI/3*i; g.lineTo(x+r*Math.cos(t), y+r*Math.sin(t)); } g.closePath(); g.stroke(); } }
  else if(kind==='marble'){ g.strokeStyle=b||'rgba(90,90,95,.35)'; for(let k=0;k<7;k++){ g.lineWidth=.6+R()*1.6; g.beginPath(); let x=R()*TH.w, y=0; g.moveTo(x,y); while(y<TH.h){ x+=R()*30-12; y+=10+R()*14; g.lineTo(x,y);} g.stroke(); } }
  else if(kind==='terrazzo'){ for(let k=0;k<160;k++){ g.fillStyle=['#8a8a86','#b9a68b','#5a5c60','#efe8da'][k%4]; g.beginPath(); g.ellipse(R()*TH.w,R()*TH.h,1+R()*3,1+R()*2,R()*3,0,7); g.fill(); } }
  else if(kind==='noise'||kind==='concrete'){ const img=g.getImageData(0,0,TH.w,TH.h); for(let i=0;i<img.data.length;i+=4){ const n=(R()-.5)*(kind==='noise'?34:18); img.data[i]+=n; img.data[i+1]+=n; img.data[i+2]+=n; } g.putImageData(img,0,0); }
  else if(kind==='travertine'){ for(let y=0;y<TH.h;y+=3){ g.fillStyle=`rgba(120,95,60,${R()*.12})`; g.fillRect(0,y,TH.w,1+R()*2);} g.fillStyle='rgba(0,0,0,.2)'; g.fillRect(0,TH.h/2,TH.w,1.5); g.fillRect(TH.w/2,0,1.5,TH.h/2); }
  else if(kind==='encaustic'){ const t=20*P; for(let y=0;y<TH.h;y+=t) for(let x=0;x<TH.w;x+=t){ g.fillStyle='#e9e4da'; g.fillRect(x,y,t-1,t-1); g.fillStyle=b||'#2f3e55'; g.beginPath(); g.moveTo(x+t/2,y+3); g.lineTo(x+t-3,y+t/2); g.lineTo(x+t/2,y+t-3); g.lineTo(x+3,y+t/2); g.fill(); g.fillStyle='#e9e4da'; g.beginPath(); g.arc(x+t/2,y+t/2,t/6,0,7); g.fill(); } }
  /* 墙纸（幅宽 53 cm 一个周期内画图案） */
  else if(kind==='wp-stripe'){ for(let x=0;x<TH.w;x+=18){ g.fillStyle=b; g.fillRect(x,0,6,TH.h);} }
  else if(kind==='wp-grid'){ g.strokeStyle=b; g.lineWidth=1; for(let x=0;x<TH.w;x+=14){ g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,TH.h); g.stroke(); } for(let y=0;y<TH.h;y+=14){ g.beginPath(); g.moveTo(0,y+.5); g.lineTo(TH.w,y+.5); g.stroke(); } }
  else if(kind==='wp-geo'){ g.strokeStyle=b; g.lineWidth=1.4; for(let y=0;y<TH.h+30;y+=26) for(let x=0;x<TH.w+30;x+=30){ g.beginPath(); g.moveTo(x,y); g.lineTo(x+15,y+13); g.lineTo(x+30,y); g.stroke(); } }
  else if(kind==='wp-leaf'){ g.fillStyle=b; for(let k=0;k<26;k++){ const x=R()*TH.w,y=R()*TH.h,rot=R()*3; g.save(); g.translate(x,y); g.rotate(rot); g.beginPath(); g.ellipse(0,0,9,3.5,0,0,7); g.fill(); g.restore(); } }
  else if(kind==='wp-floral'){ for(let y=8,k=0;y<TH.h;y+=20,k++) for(let x=(k%2?14:4);x<TH.w;x+=24){ g.fillStyle=b; for(let i=0;i<5;i++){ g.beginPath(); g.arc(x+3*Math.cos(i*1.26),y+3*Math.sin(i*1.26),2,0,7); g.fill(); } g.fillStyle='#e8d3a6'; g.beginPath(); g.arc(x,y,1.4,0,7); g.fill(); } }
  else if(kind==='wp-herr'){ g.strokeStyle=b; g.lineWidth=1.2; for(let x=0;x<TH.w;x+=16) for(let y=0;y<TH.h;y+=10){ g.beginPath(); if((x/16)%2){ g.moveTo(x,y); g.lineTo(x+16,y+8);} else { g.moveTo(x,y+8); g.lineTo(x+16,y);} g.stroke(); } }
  else if(kind==='wp-scale'){ g.strokeStyle=b; g.lineWidth=1.2; for(let y=0,k=0;y<TH.h+12;y+=10,k++) for(let x=(k%2?10:0);x<TH.w+20;x+=20){ g.beginPath(); g.arc(x,y,10,0,Math.PI); g.stroke(); } }
  else if(kind==='wp-linen'){ for(let y=0;y<TH.h;y+=2){ g.fillStyle=`rgba(0,0,0,${R()*.06})`; g.fillRect(0,y,TH.w,1);} for(let x=0;x<TH.w;x+=2){ g.fillStyle=`rgba(255,255,255,${R()*.05})`; g.fillRect(x,0,1,TH.h);} }
  else if(kind==='wood'){ for(let y=0;y<TH.h;y+=2){ g.fillStyle=`rgba(0,0,0,${.03+R()*.08})`; g.fillRect(0,y,TH.w,1); } }
  else if(kind==='steel'){ const gr=g.createLinearGradient(0,0,TH.w,TH.h); gr.addColorStop(0,'#d7d9da'); gr.addColorStop(.5,'#a9adb0'); gr.addColorStop(1,'#cfd2d4'); g.fillStyle=gr; g.fillRect(0,0,TH.w,TH.h); for(let y=0;y<TH.h;y+=1.5){ g.fillStyle=`rgba(255,255,255,${R()*.08})`; g.fillRect(0,y,TH.w,.7);} }
  const u=cv.toDataURL('image/jpeg',.85); cache.set(key,u); return u;
}
const bg=(t)=>`background-image:url(${t})`;

/* 地面 45 种（现有 20 + 新增 25；★ = 新） */
const FLOORS={
 '木地板':[['深烟熏橡木','直铺 17×120','plank','#5e5650',17],['自然橡木','直铺 19×190','plank','#b28c60',19],['浅色白橡','直铺 19×190','plank','#d6c0a0',19],['胡桃木','直铺 19×190','plank','#6a4830',19],['灰洗橡木','直铺 19×190','plank','#988f86',19],

  B.classList.add('picking'); document.getElementById('mpScope').style.display='none';
  document.getElementById('mpKicker').textContent='卫生间'; document.getElementById('mpTitle').textContent='天花';
  tabs.innerHTML=chips(['常用 2','全部色板 42'],1); document.getElementById('dSmall').classList.add('on');
  let pal='<div class="pal">'; PAL.forEach(([fam,cs])=>{ pal+=`<span class="fam">${fam}</span>`; for(let i=0;i<6;i++){ const c=cs[i]; pal+= c?`<i title="${c[0]}" style="background:${c[1]}" class="${c[0]==='雾蓝'?'hov':''}"></i>`:'<span></span>'; } }); pal+='</div>';
  mpb.innerHTML=`<div class="mpSec"><span>常用</span></div><div class="grid">${tileHTML('background:#fff','白（缺省）','',1)}${tileHTML('background:#f2efe8;position:relative','跟墙','= 暖白',0)}</div><div class="mpSec"><span>公共色板</span><span style="font-weight:400">整间同色 = 选和墙一样的颜色</span></div>`+pal;
  ro.innerHTML=`<i style="background:#a9b8c2"></i><span><b>雾蓝</b> · 天花</span><span class="tag">预览中</span>`;
}
if(showPick==='scheme'){
  document.getElementById('mpKicker').textContent='整套房子 · 6 个房间'; document.getElementById('mpTitle').textContent='整屋配色';
  document.querySelector('.mpTools').style.display='none'; tabs.style.display='none'; document.getElementById('mpTone').style.display='none';
  const SC=[['北欧浅木','plank','#d6c0a0','#f2efe8',null,'#f7f6f2','#f7f6f2','#efeeea','m-nickel','#f7f6f2','#ffffff','白墙 · 浅橡 · 拉丝镍'],
   ['日式原木','plank','#b28c60','#e9e4da',null,'#b48a5a','#c9a77c','#b48a5a','m-black','#b28c60','#ffffff','米白 · 原木 · 哑光黑'],
   ['现代灰','grid','#929290','#bfc2c1',null,'#cfd1cd','#5a5c60','#a3a19c','m-black','#bfc2c1','#ffffff','云灰 · 大板砖 · 哑光黑'],
   ['奶油风','plank','#e2d3b8','#efe8da',null,'#f2efe8','#f2efe8','#ecebe6','m-brass','#efe8da','#efe8da','象牙白 · 白蜡 · 拉丝金'],
   ['深色复古','herr','#6a4830','#dcd6cb','#4f604f','#5b3a24','#4f604f','#ecebe6','m-brass','#5b3a24','#ffffff','燕麦 + 墨绿 · 胡桃人字'],
   ['海岸蓝白','plank','#988f86','#f7f6f2','#a9b8c2','#f7f6f2','#2f3e55','#efeeea','m-chrome','#f7f6f2','#ffffff','纯白 + 雾蓝 · 灰洗橡 · 铬']];
  const card=(s,i)=>{ const [nm,fk,fc,wall,acc,door,cab,top,hw,base,ceil,desc]=s; const fl=thumb(fk,fc,fk==='grid'?60:19,null,3);
    const hwc={'m-nickel':'#bdb9b0','m-black':'#1e1e20','m-brass':'#c9a04f','m-chrome':'#d8dde1'}[hw];
    const svg=`<svg viewBox="0 0 140 84"><defs><pattern id="sf${i}" width="70" height="52" patternUnits="userSpaceOnUse"><image href="${fl}" width="70" height="52"/></pattern></defs><rect width="140" height="84" fill="${wall}"/>${acc?`<rect x="92" y="5" width="48" height="49" fill="${acc}"/>`:''}<rect width="140" height="5" fill="${ceil}"/><rect y="56" width="140" height="28" fill="url(#sf${i})"/><rect y="52" width="140" height="4" fill="${base}" stroke="rgba(0,0,0,.15)" stroke-width=".5"/><rect x="16" y="14" width="22" height="42" fill="${door}" stroke="rgba(0,0,0,.25)" stroke-width=".6"/><circle cx="34" cy="36" r="1.8" fill="${hwc}"/><rect x="54" y="36" width="34" height="20" fill="${cab}" stroke="rgba(0,0,0,.25)" stroke-width=".6"/><rect x="52" y="33" width="38" height="3" fill="${top}" stroke="rgba(0,0,0,.2)" stroke-width=".4"/><line x1="71" y1="36" x2="71" y2="56" stroke="rgba(0,0,0,.25)" stroke-width=".6"/><rect x="66" y="42" width="3" height="1.4" fill="${hwc}"/><rect x="73" y="42" width="3" height="1.4" fill="${hwc}"/></svg>`;
    return `<button class="scheme${i===4?' on':''}${i===1&&S2==='scheme'?' hov':''}">${svg}<span class="sn">${nm}</span><span class="sd">${desc}</span></button>`; };
  mpb.innerHTML=`<div class="mpSec"><span>6 套方案</span><span style="font-weight:400">悬停 = 整套预览</span></div><div class="schemeGrid">${SC.map(card).join('')}</div>
  <div class="note info" style="margin-top:10px;font-size:11px">每套包含：地面、墙面、强调墙、门、柜、台面、五金、踢脚线、天花。套完以后每一项都能单独再改。</div>`;
  document.querySelector('.mpFoot').outerHTML=`<div class="applySheet"><div class="readout"><b>深色复古</b><span style="color:var(--muted);font-size:11px">燕麦墙 · 墨绿强调墙 · 胡桃人字 · 黄铜</span></div>
   ${irow('范围',seg(['全屋 6 间','只这个房间'],0))}${irow('方式',seg(['覆盖所有设置','只填没设过的'],0))}
   <div style="display:flex;gap:8px;align-items:center"><span class="unit" style="flex:1;white-space:normal">会改 6 个房间、5 扇门、1 组橱柜</span><button class="btn primary">套用</button></div></div>`;
  if(S2==='applied') document.getElementById('stage').insertAdjacentHTML('beforeend',`<div class="toast">已套用「深色复古」到 6 个房间 · 强调墙放在了各卧室最长的墙上 <a>⌘Z 撤回</a></div>`);
  if(S2==='scheme') document.getElementById('stage').insertAdjacentHTML('beforeend',`<div class="toast" style="border-color:var(--preview-line)">预览：日式原木（整套房子）· 移开鼠标 = 恢复</div>`);
}

/* 3D 视图示意（等轴测伪 3D；真实实现是 three.js 叠加层，规格 §S27a） */
if(S2==='3d'){
  document.querySelectorAll('#viewSeg button, .seg button').forEach(()=>{});
  const vs=document.querySelectorAll('#topbar .seg')[0].children; vs[0].classList.remove('on'); vs[2].classList.add('on');
  document.getElementById('legend').style.display='none';
  const fl=thumb('plank','#d6c0a0',19,null,3);
  document.getElementById('plan').setAttribute('viewBox','0 0 800 700');
  document.getElementById('plan').innerHTML=`<defs><pattern id="pf" width="60" height="45" patternUnits="userSpaceOnUse" patternTransform="skewX(-30) scale(1,.6)"><image href="${fl}" width="60" height="45"/></pattern><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#1c1e22"/></linearGradient></defs>
   <rect width="800" height="700" fill="url(#sky)"/>
   <polygon points="120,90 680,90 680,430 120,430" fill="#a9b8c2"/>
   <polygon points="0,0 120,90 120,430 0,560" fill="#97a6b0"/>
   <polygon points="800,0 680,90 680,430 800,560" fill="#8e9da7"/>
   <polygon points="0,0 800,0 680,90 120,90" fill="#f3f1ed"/>
   <polygon points="120,430 680,430 800,560 800,700 0,700 0,560" fill="url(#pf)"/>
   <polygon points="120,90 680,90 680,430 120,430" fill="#4f604f"/>
   <rect x="120" y="418" width="560" height="12" fill="#f7f6f2"/><polygon points="0,548 120,418 120,430 0,560" fill="#f7f6f2"/><polygon points="800,548 680,418 680,430 800,560" fill="#f7f6f2"/>
   <rect x="300" y="150" width="200" height="150" fill="#cfe3f5" stroke="#f2f1ec" stroke-width="8"/><line x1="400" y1="150" x2="400" y2="300" stroke="#f2f1ec" stroke-width="5"/><line x1="300" y1="225" x2="500" y2="225" stroke="#f2f1ec" stroke-width="5"/>
   <g opacity=".85"><rect x="170" y="440" width="230" height="120" rx="8" fill="#8f8a86"/><rect x="170" y="430" width="230" height="30" rx="6" fill="#a8a29c"/></g>
   <!-- 选中：上墙（面片 0.10 + 边线 1.0） -->
   <polygon points="120,90 680,90 680,430 120,430" fill="#d9a05b" fill-opacity=".10" stroke="#d9a05b" stroke-width="1.5"/>
   <!-- 悬停：地面（面片 0.16 + 边线 0.70） -->
   <polygon points="120,430 680,430 800,560 800,700 0,700 0,560" fill="#d9a05b" fill-opacity=".16" stroke="#d9a05b" stroke-opacity=".7" stroke-width="1.5"/>
   <path d="M560 600 l0 22 l6 -6 l5 11 l4 -2 l-5 -11 l8 0 z" fill="#fff" stroke="#000" stroke-width="1"/>`;
  const tip=document.getElementById('pick3dTip'); tip.style.display='block';
  tip.innerHTML='<b>卧室 1 · 地面</b><span><i class="sw" style="'+T('plank','#d6c0a0',19,null,3)+'"></i>浅色白橡 · 这个房间</span>';
  requestAnimationFrame(()=>{ const st=document.getElementById('stage').getBoundingClientRect(), sv=document.getElementById('plan').getBoundingClientRect(); const k=Math.min(sv.width/800, sv.height/700); const ox=(sv.width-800*k)/2, oy=(sv.height-700*k)/2; tip.style.left=(ox+560*k+14)+'px'; tip.style.top=(oy+600*k+18)+'px'; });
  document.getElementById('crumbs').insertAdjacentHTML('afterend','');
}
if(S2==='pipette'){
  const tools=document.querySelectorAll('#modebar .tools button'); tools[0].classList.remove('on');
  document.querySelector('#modebar .tools').insertAdjacentHTML('beforeend','<button class="on" title="吸管（按住 Alt 临时用）">⧉ 吸管 <span class="kbd">Alt</span></button>');
  document.getElementById('mbLbl').textContent='吸管：点一个东西吸取它的材质，再点同类的东西粘贴 · Esc 退出';
  const svg=document.getElementById('plan'); svg.insertAdjacentHTML('beforeend',`<g transform="translate(118,150)"><rect x="236" y="6" width="318" height="8" fill="none" stroke="#d9a05b" stroke-width="2" stroke-dasharray="5 3"/><g transform="translate(420,28) rotate(0)"><path d="M0 22 L12 10 L16 14 L4 26 L0 26 Z" fill="#fff" stroke="#141210" stroke-width="1.2"/><path d="M12 10 L18 4 a3 3 0 0 1 4 4 L16 14" fill="#d9a05b" stroke="#141210" stroke-width="1.2"/></g></g>`);
  const tip=document.getElementById('pick3dTip'); tip.style.display='block';
  tip.innerHTML='<b><i class="sw" style="background:#4f604f"></i>已吸取：墨绿涂料</b><span>点同类（墙面）粘贴 → 客厅 · 上墙 · Esc 退出</span>';
  requestAnimationFrame(()=>{ const sv=svg.getBoundingClientRect(), st=document.getElementById('stage').getBoundingClientRect(); const k=Math.min(sv.width/795, sv.height/811); const ox=(sv.width-795*k)/2, oy=(sv.height-811*k)/2; const cx=ox+(118+440)*k, cy=oy+(150+52)*k; const w=tip.offsetWidth; tip.style.left=((cx+12+w>st.width-8)?(cx-12-w):(cx+12))+'px'; tip.style.top=(cy)+'px'; });
}
if(S2==='upper'){ document.getElementById('plan').insertAdjacentHTML('beforeend',`<g transform="translate(118,150)"><rect x="240" y="410" width="120" height="13" fill="none" stroke="#e8e4dc" stroke-width="1.2" stroke-dasharray="5 3"/><rect x="430" y="410" width="120" height="13" fill="none" stroke="#e8e4dc" stroke-width="1.2" stroke-dasharray="5 3"/><text x="300" y="404" font-size="9" fill="#e8e4dc" text-anchor="middle" style="paint-order:stroke;stroke:#141210;stroke-width:2.5px">吊柜（虚线）</text></g>`); }

const H2={room2:'<b>卫生间</b> · 地面 · 墙面 · 墙砖 · 踢脚线 · 天花 · 五金',wains:'<b>卧室 2</b> · 预览：护墙板 竖条压条 120',ceil:'<b>卫生间</b> · 预览天花：雾蓝（室内视角看得到）','3d':'单击 = 选中 · 双击地面 = 走过去 · 拖 = 转头 · WASD = 走 · ? 快捷键',hw:'<b>洗手台</b> · 五金单独设置：哑光黑',mirror:'<b>镜子</b> · 矩形 60 × 80',bath2:'<b>淋浴</b> · 黑框 · 透明玻璃',door2:'<b>门</b> · 两格框 · 长杆把手 · 拉丝镍',upper:'<b>橱柜</b> · 吊柜 70 · 双色（海军蓝 / 暖白）',scheme:'整屋配色 · 悬停一张卡 = 整套预览',applied:'已套用「深色复古」',pipette:'<b>吸管</b> · 已吸取：墨绿涂料 ｜ 点同类粘贴 · Esc 退出',usage:'清单 · 装修用量'};
document.getElementById('hint').innerHTML=H2[S2]||'';
if(['3d','hw','mirror','bath2','door2','upper','usage','scheme','applied','pipette'].includes(S2)) document.getElementById('legend').style.display='none';
})();
</script>
