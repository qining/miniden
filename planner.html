function mergeByMaterial(root, minMeshes){
  if(!MERGE_ON) return root;
  root.updateMatrixWorld(true);
  const meshes=[];
  root.traverse(o=>{ if(o!==root && o.isMesh && o.geometry && o.material && !Array.isArray(o.material)) meshes.push(o); });
  if(meshes.length < (minMeshes==null?4:minMeshes)) return root;
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets=new Map();
  for(const m of meshes){
    // 透明材质不合并：多层透明面依赖逐网格的由远及近排序，合并会改变混合结果
    if(m.material.transparent || m.material.opacity<1) continue;
    const key=m.material.uuid+'|'+(m.castShadow?1:0)+(m.receiveShadow?1:0)+'|'+(m.renderOrder||0);
    let b=buckets.get(key);
    if(!b){ b={mat:m.material, cs:!!m.castShadow, rs:!!m.receiveShadow, ro:m.renderOrder||0, list:[]}; buckets.set(key,b); }
    b.list.push(m);
  }
  for(const b of buckets.values()){
    if(b.list.length<2) continue;         // 只有一个成员就别重建：避免顶点浮点漂移导致贴图采样偏移
    const geos=[];
    for(const m of b.list){
      const src = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      src.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld));
      geos.push(src);
      if(m.parent) m.parent.remove(m);
    }
    const merged=_concatGeos(geos);
    for(const g of geos) g.dispose();
    const mesh=new THREE.Mesh(merged, b.mat);
    mesh.castShadow=b.cs; mesh.receiveShadow=b.rs; mesh.renderOrder=b.ro;
    mesh.userData.mergedOwned=true;      // 合并出来的几何归本组所有，可安全释放
    root.add(mesh);
  }
  return root;
}
/* 只释放本组自有的几何；材质与贴图是共享的，释放会导致反复重传 GPU */
function disposeOwned(root){
  root.traverse(o=>{
    if(o.isMesh && o.geometry && o.userData.mergedOwned) o.geometry.dispose();
    else if(o.isMesh && o.geometry && o.geometry.userData && o.geometry.userData.owned) o.geometry.dispose();
  });
}
function modelCtx(g, spec, col, col2, matlib, it){
  const cm = cm2ft;
  const add=(mm,x,y,z,bottomAligned,h)=>{ mm.position.set(x||0,(bottomAligned?(y||0)+h/2:(y||0)),z||0);
    mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm; };
  const C = {
    g, THREE, cm, spec, col, col2,
    it, cct: it? itemCCT(it) : (spec.cct||3000), lum: it? itemLum(it) : (spec.lum||800),
    w: cm2ft(spec.w), d: cm2ft(spec.d), h: cm2ft(spec.h),
    seatH: cm2ft(spec.seatH || 45),
    m: matlib,
    /* 材质工厂：M(色, {rough, metal, clear, sheen, fabric, wood}) */
    M(color, o){ o=o||{};
      const p = {color:new THREE.Color(color), roughness:(o.rough==null?.7:o.rough), metalness:o.metal||0};
      if(o.envI!=null) p.envMapIntensity=o.envI;
      if(o.plastic){ p.map=plasticTexture(); p.normalMap=normalFromTexture(plasticTexture(),0.35);
                     if(o.envI==null) p.envMapIntensity=.32; }
      if(o.fabric){ p.map=fabricTexture(); p.roughness=(o.rough==null?.95:o.rough); p.envMapIntensity=(o.envI==null?.25:o.envI); }
      if(o.leather){ p.map=leatherTexture(); p.normalMap=normalFromTexture(leatherTexture(),1.1);
                     p.roughness=(o.rough==null?.55:o.rough); if(o.envI==null) p.envMapIntensity=.35; }
      if(o.wood){ const tx=woodSpecies(typeof o.wood==='string'?o.wood:(spec.wood||'oak'));
        p.map=tx; p.normalMap=normalFromTexture(tx,0.85);
        p.roughness=(o.rough==null?.42:o.rough); if(o.clear==null) o.clear=.38;
        if(o.envI==null) p.envMapIntensity=.6; }
      // 兜底：任何没显式指定贴图的材质也给一张极淡的微表面贴图。
      // 纯色平面在近景和光追里一眼假，而这几张贴图都接近白色，几乎不改变原有配色。
      if(!p.map && !o.flat){
        const base = (o.metal||0) >= 0.5 ? brushedSteelTexture()
                   : (o.metal||0) > 0    ? powderCoatTexture()
                   : laminateTexture();
        p.map = base;
        p.normalMap = normalFromTexture(base, (o.metal||0)>=0.5 ? 0.30 : 0.35);
        if(p.envMapIntensity==null) p.envMapIntensity = (o.metal||0)>=0.5 ? .85 : .32;
      }
      if(o.clear!=null || o.sheen!=null){
        const mm=new THREE.MeshPhysicalMaterial(p);
        if(o.clear!=null){ mm.clearcoat=o.clear; mm.clearcoatRoughness=(o.clearRough==null?.18:o.clearRough); }
        if(o.sheen!=null){ mm.sheen=o.sheen; mm.sheenRoughness=.6; mm.sheenColor=new THREE.Color(o.sheenColor||0xffffff); }
        return mm;
      }
      return new THREE.MeshStandardMaterial(p);
    },
    /* 方盒（y=底面高度） */
    box(w,h,d,mat,x,y,z){ return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),x,y,z,true,h); },
    /* 圆角方盒（y=底面高度，r=倒角半径，seg=倒角细分） */
    rb(w,h,d,r,mat,x,y,z,seg){ return add(new THREE.Mesh(rboxGeo(w,h,d,r,seg||3),mat),x,y,z,true,h); },
    /* 圆柱/圆锥（y=底面高度） */
    cyl(rTop,rBot,h,mat,x,y,z,seg){ return add(new THREE.Mesh(new THREE.CylinderGeometry(rTop,rBot,h,seg||20),mat),x,y,z,true,h); },
    /* 胶囊管：len 为总长，center 定位，axis 'x'|'y'|'z' */
    tube(len,r,mat,x,y,z,axis){ const mm=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(0.005,len-2*r),4,14),mat);
      mm.position.set(x||0,y||0,z||0);
      if(axis==='x') mm.rotation.z=Math.PI/2; if(axis==='z') mm.rotation.x=Math.PI/2;
      mm.castShadow=true; g.add(mm); return mm; },
    sph(r,mat,x,y,z,seg){ const mm=new THREE.Mesh(new THREE.SphereGeometry(r,seg||18,(seg||18)*0.7),mat);
      mm.position.set(x||0,y||0,z||0); mm.castShadow=true; g.add(mm); return mm; },
    torus(R,r,mat,x,y,z,rotX){ const mm=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,24),mat);
      mm.position.set(x||0,y||0,z||0); if(rotX) mm.rotation.x=rotX; mm.castShadow=true; g.add(mm); return mm; },
    /* 旋转体：pts=[[半径,高度],...] 自下而上 */
    lathe(pts,mat,x,y,z,seg){ const v=pts.map(p=>new THREE.Vector2(Math.max(0.0005,p[0]),p[1]));
      const mm=new THREE.Mesh(new THREE.LatheGeometry(v,seg||24),mat);
      mm.position.set(x||0,y||0,z||0); mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm; },
    /* 任意多边形拉伸：pts=[[x,y],...]（在局部平面内），depth=厚度；
       plane:'xy'(默认,沿z拉伸) | 'xz'(平放,沿y拉伸) | 'zy'(侧立,沿x拉伸)；bevel 可选圆角 */
    ext(pts,depth,mat,x,y,z,plane,bevel){
      const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
      const o={depth:depth, bevelEnabled:!!bevel, curveSegments:10};
      if(bevel){ o.bevelSize=bevel; o.bevelThickness=bevel; o.bevelSegments=3; o.depth=Math.max(0.004,depth-2*bevel); }
      const geo=new THREE.ExtrudeGeometry(sh,o); geo.computeVertexNormals();
      const mm=new THREE.Mesh(geo,mat);
      if(plane==='xz') mm.rotation.x=Math.PI/2;
      if(plane==='zy') mm.rotation.y=Math.PI/2;
      mm.position.set(x||0,y||0,z||0); mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm; },
    /* 软包坐垫：圆角+顶面微鼓+四周包边线 */
    cushion(w,h,d,mat,x,y,z,pipeMat){
      const c=add(new THREE.Mesh(rboxGeo(w,h,d,Math.min(h*0.45,cm2ft(5)),4),mat),x,y,z,true,h);
      const top=new THREE.Mesh(rboxGeo(w*0.93,h*0.55,d*0.93,Math.min(h*0.32,cm2ft(4)),3),mat);
      top.position.set(x||0,(y||0)+h*0.86,z||0); top.castShadow=true; g.add(top);
      const seam=new THREE.Mesh(rboxGeo(w+0.014,cm2ft(1.1),d+0.014,cm2ft(0.55),2), pipeMat||mat);
      seam.position.set(x||0,(y||0)+h*0.5,z||0); g.add(seam);
      return c; },
    /* 锥形腿：tilt>0 向外撇 */
    legT(topR,botR,h,mat,x,z,tilt){ const mm=new THREE.Mesh(new THREE.CylinderGeometry(botR,topR,h,14),mat);
      mm.position.set(x,h/2,z); if(tilt){ mm.rotation.z=-Math.sign(x||1)*tilt; mm.rotation.x=Math.sign(z||1)*tilt; }
      mm.castShadow=true; g.add(mm); return mm; },
    /* 五金：球形/长条拉手、脚轮 */
    knob(r,mat,x,y,z){ return C.sph(r,mat,x,y,z,16); },
    bar(len,r,mat,x,y,z,axis){ C.tube(len,r,mat,x,y,z,axis||'x');
      const ax=(axis||'x')==='x'?[1,0,0]:[0,0,1];
      for(const s2 of [-1,1]) C.tube(r*3.4,r*0.75,mat, (x||0)+ax[0]*s2*(len/2-r*1.4), (y||0)-r*1.7, (z||0)+ax[2]*s2*(len/2-r*1.4),'y'); },
    /* 脚轮：r = 轮子外半径（外沿正好切地）。
       原版拿 TorusGeometry(r, r*0.42) 放在 y=r，外半径其实是 1.42r，
       整个轮子会沉到地板下 0.42r——「所有部件贴地」那条断言必挂。 */
    caster(r,mat,x,z){ const t=r*0.30;
      const w=new THREE.Mesh(new THREE.TorusGeometry(Math.max(r-t,r*0.2),t,8,16),mat);
      w.rotation.y=Math.PI/2; w.position.set(x,r,z); w.castShadow=true; g.add(w);
      C.cyl(r*0.3,r*0.3,r*1.2,mat,x,r*0.9,z,10); },
    /* 网格阵列辅助 */
    rep(n,fn){ for(let i=0;i<n;i++) fn(i, n>1? i/(n-1) : 0.5); },
  };
  return C;
}
/* 家具 3D 造型工厂 */

/* 贴图兜底：各 kind 分支里就地 new 出来的材质很容易漏贴图（实测漏了十几处）。
   建完模统一扫一遍，按金属度补一张极淡的微表面贴图 + 法线贴图。
   玻璃、纯自发光件跳过；已有贴图的只补法线。
   要显式退出的话，给材质挂 userData.noTex / noNrm。 */
function ensureTextured(root){
  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of list){
      if(!m || m.isMeshBasicMaterial) continue;
      if(m.transparent && m.opacity != null && m.opacity < 0.8) continue;      // 玻璃
      if(m.emissiveIntensity != null && m.emissiveIntensity >= 1.5) continue;  // 发光面
      const metal = m.metalness || 0;
      if(!m.map && !(m.userData && m.userData.noTex)){
        const base = metal >= 0.5 ? brushedSteelTexture()
                   : metal > 0    ? powderCoatTexture()
                   : laminateTexture();
        m.map = base;
        if(m.envMapIntensity == null || m.envMapIntensity === 1)
          m.envMapIntensity = metal >= 0.5 ? .85 : .32;
        m.needsUpdate = true;
      }
      if(m.map && !m.normalMap && !(m.userData && m.userData.noNrm)){
        m.normalMap = normalFromTexture(m.map, metal >= 0.5 ? .30 : .45);
        m.needsUpdate = true;
      }
    }
  });
  return root;
}

function furn3D(it, spec){
  const wf=cm2ft(spec.w), df=cm2ft(spec.d), hf=cm2ft(spec.h);
  const col = new THREE.Color(itemColor(it));
  const _fm = furnMats(spec, col);              // 按 kind 选贴图/粗糙度/环境反射（见 furnMats）
  const mat = _fm.mat, matD = _fm.matD;
  const g = new THREE.Group();
  const box=(w,h,d,m,x=0,y=0,z=0)=>{
    const mm=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m||mat);
    mm.position.set(x,y+h/2,z); mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm;
  };
  const cyl=(r,h,m,x=0,y=0,z=0)=>{
    const mm=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24), m||mat);
    mm.position.set(x,y+h/2,z); mm.castShadow=true; g.add(mm); return mm;
  };
  const kind=spec.kind||'box';
  const col2 = spec.color2 ? new THREE.Color(spec.color2) : null;
  const modelKey = spec.model || spec.id;
  if(!isLight(spec) && MODELS[modelKey]){
    const matlib = {
      fab:  new THREE.MeshStandardMaterial({map:fabricTexture(), color:col, roughness:.95, envMapIntensity:.25}),
      fabD: new THREE.MeshStandardMaterial({map:fabricTexture(), color:col.clone().multiplyScalar(.86), roughness:.95, envMapIntensity:.25}),
      wood: (()=>{ const tx=woodSpecies(spec.wood||'oak');
              return new THREE.MeshPhysicalMaterial({map:tx, normalMap:normalFromTexture(tx,0.85),
                color:col, roughness:.40, clearcoat:.40, clearcoatRoughness:.20, envMapIntensity:.7}); })(),
      chrome:new THREE.MeshStandardMaterial({color:0xc6cad0, roughness:.14, metalness:.94,
        map:brushedSteelTexture(), normalMap:normalFromTexture(brushedSteelTexture(),0.25), envMapIntensity:.95}),
      steel: new THREE.MeshStandardMaterial({color:0x9aa0a6, roughness:.35, metalness:.75,
        map:brushedSteelTexture(), normalMap:normalFromTexture(brushedSteelTexture(),0.35), envMapIntensity:.8}),
      black: new THREE.MeshStandardMaterial({color:0x24262a, roughness:.44, metalness:.5,
        map:powderCoatTexture(), normalMap:normalFromTexture(powderCoatTexture(),0.45), envMapIntensity:.5}),
      white: new THREE.MeshStandardMaterial({color:0xeeece7, roughness:.55,
        map:laminateTexture(), normalMap:normalFromTexture(laminateTexture(),0.4), envMapIntensity:.3}),
      plastic:new THREE.MeshStandardMaterial({color:0x33363b, roughness:.6,
        map:plasticTexture(), normalMap:normalFromTexture(plasticTexture(),0.35), envMapIntensity:.32}),
      leather:new THREE.MeshStandardMaterial({color:0x8a6b52, roughness:.55,
        map:leatherTexture(), normalMap:normalFromTexture(leatherTexture(),1.1), envMapIntensity:.35}),
      glass: new THREE.MeshPhysicalMaterial({color:0xaecbe0, transparent:true, opacity:.28, roughness:.06, metalness:.05}),
    };
    try{
      MODELS[modelKey](modelCtx(g, spec, col, col2, matlib, it));
      ensureTextured(g);
      mergeByMaterial(g);
      g.position.set(it.x, 0, it.y);
      g.rotation.y = -(it.rot||0)*Math.PI/180;
      return g;
    }catch(e){ console.warn('model '+modelKey+' failed, fallback:', e); }
  }
  if(isLight(spec)){
    const cct=itemCCT(it), lm=itemLum(it), lc=cctToRGB(cct);
    const emis=new THREE.MeshStandardMaterial({color:0xffffff, emissive:lc, emissiveIntensity:2.4, roughness:.85});
    emis.userData.emisBase=2.4;   // 供总开关关灯时熄灭灯罩
    const trim=new THREE.MeshStandardMaterial({color:new THREE.Color(itemColor(it)), roughness:.45, metalness:.35});
    const P=(y,dist,ang)=>{ // 统一造光源：吸顶用聚光，吊灯/镜前灯用点光
      // 家用灯具是漫射光源，不是舞台聚光：主体一律用点光（全向泛光），
      // 只有嵌入式筒灯额外叠一盏"宽角+高半影"的下照光模拟灯杯，且仍保留大量泛光。
      const L=new THREE.PointLight(lc, lm*0.72/(4*Math.PI), dist, 2);
      L.position.set(0,y,0); L.castShadow=!!spec.shadow;
      L.userData.baseI=L.intensity; g.add(L);
      if(ang){
        const wide=Math.min(1.30, ang);                    // ≥75°，接近家用筒灯的宽配光
        const cd=lm*0.28/(2*Math.PI*(1-Math.cos(wide)));
        const S2=new THREE.SpotLight(lc, cd, dist, wide, 0.92, 2);   // penumbra .92 = 边缘几乎无界
        S2.position.set(0,y,0); S2.target.position.set(0,-1,0);
        S2.castShadow=false; S2.userData.baseI=S2.intensity; g.add(S2.target); g.add(S2);
      }
      return L;
    };
    if(kind==='downlight'){
      const r=wf/2;
      // 嵌入式：只有薄边圈与发光面露在天花面上，筒体在天花之上（室内看不见）
      const ring=new THREE.Mesh(new THREE.CylinderGeometry(r, r, .035, 24), trim);
      ring.position.set(0, CEIL_H-.017, 0); g.add(ring);                       // 齐平边圈
      const cone=new THREE.Mesh(new THREE.CylinderGeometry(r*0.90, r*0.72, .30, 24, 1, true),
        new THREE.MeshStandardMaterial({color:0xf2f0ec, roughness:.35, side:THREE.DoubleSide}));
      cone.position.set(0, CEIL_H+.13, 0); g.add(cone);                        // 内反射杯（凹进去）
      const lens=new THREE.Mesh(new THREE.CylinderGeometry(r*0.72,r*0.72,.02,24), emis);
      lens.position.set(0, CEIL_H+.02, 0); g.add(lens);                        // 发光面在天花之上→显凹陷
      const can=new THREE.Mesh(new THREE.CylinderGeometry(r*1.05, r*1.05, .48, 16), trim);
      can.position.set(0, CEIL_H+.30, 0); g.add(can);                          // 筒体（藏在天花上方）
      P(CEIL_H-0.04, 26, 1.25);
    } else if(kind==='ceilingLight'){
      const r=wf/2;
      const dome=new THREE.Mesh(new THREE.SphereGeometry(r,24,12,0,Math.PI*2,Math.PI*0.52,Math.PI*0.48), emis);
      dome.position.set(0, CEIL_H-hf*0.15, 0); dome.rotation.x=Math.PI; g.add(dome);
      cyl(r*0.55, .07, trim, 0, CEIL_H-.07);
      P(CEIL_H-hf*0.5, 28, 0);      // 吸顶灯=全向泛光
    } else if(kind==='vanityLight'){
      const n = wf>cm2ft(75)?4:3;
      box(wf, .10, .16, trim, 0, CEIL_H-3.1);                  // 背板（镜上方 ~2.0m）
      for(let i=0;i<n;i++){
        const x=-wf/2 + wf*(i+0.5)/n;
        const gl=new THREE.Mesh(new THREE.SphereGeometry(cm2ft(5),14,10), emis);
        gl.position.set(x, CEIL_H-3.28, 0.02); g.add(gl);
      }
      const L=new THREE.PointLight(lc, lm/(4*Math.PI), 16, 2);
      L.position.set(0, CEIL_H-3.3, 0.25); L.userData.baseI=L.intensity; g.add(L);
    } else if(kind==='pendant'){
      const drop=CEIL_H-cm2ft(165);
      cyl(.03, drop, trim, 0, CEIL_H-drop);                    // 吊杆
      const sh=new THREE.Mesh(new THREE.ConeGeometry(wf/2, hf, 24, 1, true), trim);
      sh.material=trim.clone(); sh.material.side=THREE.DoubleSide;   // 独立一份，避免污染共享材质
      sh.position.set(0, CEIL_H-drop-hf/2, 0); sh.rotation.x=Math.PI; g.add(sh);
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(cm2ft(4),14,10), emis);
      bulb.position.set(0, CEIL_H-drop-hf*0.85, 0); g.add(bulb);
      P(CEIL_H-drop-hf*0.9, 24, 0);
    }
    mergeByMaterial(g);
    g.position.set(it.x, 0, it.y);
    g.rotation.y = -(it.rot||0)*Math.PI/180;
    return g;
  }
  // —— 高精度材质：织物有织纹、木材有木纹、金属分哑光/镀铬 ——
  const matWood = new THREE.MeshStandardMaterial({map:furnWoodTexture(), color:0x8a6b4a, roughness:.62});
  const matFab  = new THREE.MeshStandardMaterial({map:fabricTexture(), color:col, roughness:.95, envMapIntensity:.25});
  const matFabD = new THREE.MeshStandardMaterial({map:fabricTexture(), color:col.clone().multiplyScalar(.88), roughness:.95, envMapIntensity:.25});
  const matPipe = new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(.78), roughness:.9});
  const matChrome=new THREE.MeshStandardMaterial({color:0xc6cad0, roughness:.16, metalness:.92});
  const matBlackMet=new THREE.MeshStandardMaterial({color:0x2a2c30, roughness:.42, metalness:.55});
  // —— 造型基元 ——
  const rb=(w,h,d,r,m,x=0,y=0,z=0,seg)=>{                 // 圆角体（y 为底部对齐）
    const mm=new THREE.Mesh(rboxGeo(w,h,d,r,seg), m||mat);
    mm.position.set(x,y+h/2,z); mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm;
  };
  const cushion=(w,h,d,m,x,y,z,crown)=>{                  // 软包坐垫：圆角+顶面微鼓+四周走线
    const c=rb(w,h,d,Math.min(h*0.42,cm2ft(4.5)),m,x,y,z,4);
    c.scale.y=1; c.geometry=c.geometry;
    const cr=(crown==null?0.035:crown);
    const top=new THREE.Mesh(rboxGeo(w*0.94,h*0.5,d*0.94,Math.min(h*0.3,cm2ft(4)),3), m||mat);
    top.position.set(x, y+h+cr-h*0.25, z); top.castShadow=true; g.add(top);   // 隆起
    const seam=new THREE.Mesh(rboxGeo(w+0.012,cm2ft(1.0),d+0.012,cm2ft(0.5),2), matPipe);

  const legT=(topR,botR,h,m,x,z,tilt)=>{                  // 锥形腿（可外撇）

          mm.position.set(a*(wf/2-.12),(hf-.12)/2,b*(df/2-.12)); g.add(mm); }); }
      break;
    }
    case 'tvBench': {
      const T=cm2ft(1.8), PL=cm2ft(2.5);                            // 板厚 / 踢脚高
      const hM=new THREE.MeshStandardMaterial({color:0xb4b8be, roughness:.3, metalness:.8});
      const body=hf-PL;
      box(T, body, df, mat, -(wf/2-T/2), PL, 0);
      box(T, body, df, mat,  (wf/2-T/2), PL, 0);
      box(wf-2*T, T, df, mat, 0, hf-T, 0);
      box(wf-2*T, T, df, mat, 0, PL, 0);
      box(wf-2*T, body-2*T, cm2ft(0.5), matD, 0, PL+T, -(df/2-cm2ft(0.25)));
      const nD=Math.max(2, Math.round(wf/cm2ft(60)));               // 门数
      const dw=(wf-2*T-cm2ft(0.6)*(nD+1))/nD, dh=body-2*T-cm2ft(1.2);
      for(let i=0;i<nD;i++){
        const x=-(wf/2-T)+cm2ft(0.6)+dw/2+i*(dw+cm2ft(0.6));
        box(dw, dh, cm2ft(1.6), mat, x, PL+T+cm2ft(0.6), df/2-cm2ft(0.8));
        box(dw*0.42, cm2ft(1.0), cm2ft(1.0), hM, x, PL+T+dh*0.82, df/2+cm2ft(0.5));   // 长条拉手
      }
      box(wf-cm2ft(6), PL, df-cm2ft(6), matD, 0, 0, 0);             // 内缩踢脚
      box(Math.min(wf-.5,4.8), 2.5, .1, new THREE.MeshStandardMaterial({color:0x0a0a0c, roughness:.3}), 0, hf+.35, 0); // 电视
      break;
    }
    case 'shoeCab': {                                   // STÄLL / TRONES：翻斗门，门板下缘外倾
      const T=cm2ft(1.6), hM=new THREE.MeshStandardMaterial({color:0xb4b8be, roughness:.3, metalness:.8});
      box(wf, hf, df-cm2ft(3), mat, 0, 0, -cm2ft(1.5));             // 柜体（浅一点给门板留位）
      const n=Math.max(1, Math.round(hf/cm2ft(35)));
      const fh=(hf-cm2ft(1.2)*(n+1))/n;
      for(let i=0;i<n;i++){
        const y=cm2ft(1.2)+i*(fh+cm2ft(1.2));
        const dr=box(wf-cm2ft(2.4), fh, cm2ft(1.8), mat, 0, y, df/2-cm2ft(2.2));
        dr.rotation.x=-0.055;                                       // 翻斗门微微外倾
        dr.position.z += cm2ft(0.9);
        box(wf*0.30, cm2ft(0.9), cm2ft(0.9), hM, 0, y+fh*0.80, df/2-cm2ft(0.7));
      }
      break;
    }
    case 'dresser': case 'nightstand': {                 // 真抽屉面板：有缝、有把手、面板凸出柜体
      const T=cm2ft(1.8), REV=cm2ft(0.7);                           // 板厚 / 抽屉缝
      const hM=new THREE.MeshStandardMaterial({color:0xb4b8be, roughness:.3, metalness:.8});
      const bodyD=df-cm2ft(2.2);
      box(T, hf, bodyD, mat, -(wf/2-T/2), 0, -cm2ft(1.1));
      box(T, hf, bodyD, mat,  (wf/2-T/2), 0, -cm2ft(1.1));
      box(wf, T, bodyD, mat, 0, hf-T, -cm2ft(1.1));                 // 台面
      box(wf-2*T, T, bodyD, mat, 0, 0, -cm2ft(1.1));
      box(wf-2*T, hf-T, cm2ft(0.5), matD, 0, 0, -(df/2-cm2ft(0.25)));
      const n = kind==='nightstand' ? Math.max(1,Math.round(hf/cm2ft(26)))
                                    : Math.max(2,Math.round(hf/cm2ft(24)));
      const fh=(hf-T-REV*(n+1))/n;
      for(let i=0;i<n;i++){
        const y=REV+i*(fh+REV);
        box(wf-2*REV, fh, cm2ft(2.0), mat, 0, y, df/2-cm2ft(1.0));  // 抽屉面板
        // 长条拉手（两端有支脚）
        const hw=Math.min(wf*0.42, cm2ft(38));
        box(hw, cm2ft(0.9), cm2ft(0.9), hM, 0, y+fh*0.55, df/2+cm2ft(0.55));
        for(const sx of [-1,1]) box(cm2ft(0.8), cm2ft(0.8), cm2ft(1.1), hM,
          sx*hw*0.44, y+fh*0.55-cm2ft(0.05), df/2+cm2ft(0.15));
      }
      break;
    }
    case 'bookcase': {
      if(spec.glassShelf){                              // VITTSJÖ：黑钢方管 + 钢化玻璃层板
        const st=new THREE.MeshStandardMaterial({color:col, roughness:.38, metalness:.72});
        const gl=new THREE.MeshPhysicalMaterial({color:0xbcd6e6, transparent:true, opacity:.24,
                   roughness:.05, metalness:.05});
        const P0=cm2ft(2.2);                            // 立柱截面
        for(const sx of [-1,1]) for(const sz of [-1,1])
          box(P0,hf,P0, st, sx*(wf/2-P0/2), 0, sz*(df/2-P0/2));
        const n=4;                                      // 4 层玻璃（含顶板）
        for(let i=0;i<n;i++){
          const y = (i===0? cm2ft(2) : hf*i/(n-1) - cm2ft(1.0));
          box(wf-2*P0, cm2ft(1.4), P0, st, 0, y, -(df/2-P0/2));   // 前后横撑
          box(wf-2*P0, cm2ft(1.4), P0, st, 0, y,  (df/2-P0/2));
          box(wf-2*P0-cm2ft(0.4), cm2ft(0.8), df-2*P0-cm2ft(0.4), gl, 0, y+cm2ft(1.4), 0);
        }
        for(const sz of [-1,1]) box(cm2ft(1.2), cm2ft(1.2), df-2*P0, st, -(wf/2-P0/2), hf-cm2ft(1.2), 0*sz);
        break;
      }
      // BILLY 式板式书柜：两侧板 + 顶底板 + 薄背板围出真正的内腔，层板嵌在腔内
      const T=cm2ft(1.8), BT=cm2ft(0.5);
      const backM=new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(.88), roughness:.9});
      box(T, hf, df, mat, -(wf/2-T/2), 0, 0);                       // 左侧板
      box(T, hf, df, mat,  (wf/2-T/2), 0, 0);                       // 右侧板
      box(wf-2*T, T, df, mat, 0, hf-T, 0);                          // 顶板
      box(wf-2*T, T, df, mat, 0, 0, 0);                             // 底板
      box(wf-2*T, hf-2*T, BT, backM, 0, T, -(df/2-BT/2));           // 背板
      const inner=hf-2*T, ST=cm2ft(1.6);
      const nBay=Math.max(2, Math.round(inner/cm2ft(34)));          // BILLY 层高约 34cm
      const gap=(inner-ST*(nBay-1))/nBay;
      for(let i=1;i<nBay;i++){
        const y=T + i*gap + (i-1)*ST;
        box(wf-2*T-cm2ft(0.3), ST, df-BT-cm2ft(1.2), mat, 0, y, cm2ft(0.6));
      }
      break;
    }
    case 'rug': {
      const mm = new THREE.Mesh(new THREE.BoxGeometry(wf,.06,df), mat);   // 绒面贴图 + 强法线
      mm.position.y=.03; mm.receiveShadow=true; g.add(mm);
      const edge = new THREE.Mesh(rboxGeo(wf+cm2ft(0.6), .045, df+cm2ft(0.6), cm2ft(0.3), 2), matD);
      edge.position.y=.022; edge.receiveShadow=true; g.add(edge);          // 包边
      break;
    }
    case 'lamp': {
      cyl(.5,.06,matD); cyl(.05,hf-1.1,matMetal);
      const shade = new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,1.1,20,1,true), new THREE.MeshStandardMaterial({color:0xf5efdf, emissive:0x776a3f, emissiveIntensity:.6, side:THREE.DoubleSide}));
      shade.position.y = hf-.6; g.add(shade);
      const pt = new THREE.PointLight(0xffe8b8, .5, 14); pt.position.y=hf-.6; g.add(pt);
      break;
    }
    default: box(wf,hf,df,mat);
  }
  ensureTextured(g);
  mergeByMaterial(g);
  g.position.set(it.x, 0, it.y);
  g.rotation.y = -it.rot*Math.PI/180;
  return g;
}
/* 增量同步：只重建"几何/材质相关属性变了"的家具；单纯移动或旋转只更新变换矩阵。
   原先每次家具变动都全量重建——拖动时每个指针事件都重建全部家具几何（10 件约 300ms）。*/
function furnSig(it, spec, shadow){
  return [spec.id, spec.w, spec.d, spec.h, spec.kind, spec.model||'', spec.color||'', spec.color2||'',
          it.color||'', it.cct||'', it.dim==null?'':it.dim, shadow?1:0,
          it.custom? JSON.stringify(it.custom):''].join('|');
}
function sync3D(){
  if(!three) return;
  if(!three.furnMap) three.furnMap=new Map();
  const map=three.furnMap, alive=new Set();
  let lightBudget=6;                       // 只给前几盏灯开阴影，避免帧率崩塌
  let changed=0;
  for(const it of state.items){
    const base=itemSpec(it); if(!base) continue;
    let spec=base, shadow=false;
    if(isLight(base) && lightBudget>0){ shadow=true; spec=Object.assign({},base,{shadow:true}); lightBudget--; }
    alive.add(it.uid);
    const sig=furnSig(it, base, shadow);
    const prev=map.get(it.uid);
    if(prev && prev.sig===sig){                        // 几何没变 → 只更新位姿
      prev.g.position.set(it.x, 0, it.y);
      prev.g.rotation.y = -(it.rot||0)*Math.PI/180;
      continue;
    }
    if(prev){ disposeOwned(prev.g); three.furnGroup.remove(prev.g); }
    const g=furn3D(it,spec);
    three.furnGroup.add(g);
    map.set(it.uid, {g, sig});
    changed++;
  }
  for(const [uid,rec] of [...map]){                    // 清理已删除的家具
    if(alive.has(uid)) continue;
    disposeOwned(rec.g); three.furnGroup.remove(rec.g); map.delete(uid); changed++;
  }
  if(changed) applyLightMode();                        // 只有增删/换件才需要重算照明
  requestShadowUpdate();
}
function sync3Dfull(){                                 // 强制全量重建（材质方案整体变化时用）
  if(!three) return;
  disposeOwned(three.furnGroup); three.furnGroup.clear();
  if(three.furnMap) three.furnMap.clear();
  sync3D();
}

   UI

/* 瑞典语字母折叠：目录里有 Å/Ä/Ö（还有当直径符号用的 Ø），英文键盘打不出来。
   搜索时把「查询词」和「商品名」两边都折成 ASCII 再比对，所以 poang / POÄNG /
   poäng 都能搜到 POÄNG，而列表显示的仍然是正确的瑞典语拼写。
   NFD 分解能处理 å ä ö é ü 这类「基字母+变音符」；ø æ ß đ ł ð þ 不可分解，单独映射。*/
const FOLD_EXTRA = {'ø':'o','æ':'ae','ß':'ss','œ':'oe','đ':'d','ł':'l','ð':'d','þ':'th','ŋ':'n'};
const _foldCache = new Map();
function foldText(s){
  if(!s) return '';
  const hit=_foldCache.get(s); if(hit!==undefined) return hit;
  const v = s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')        // 去掉变音符号（CJK 不受影响）
    .replace(/[øæßœđłðþŋ]/g, ch=>FOLD_EXTRA[ch]||ch);
  if(_foldCache.size<4000) _foldCache.set(s, v);            // 逐字输入会产生很多临时串，封顶
  return v;
}

/* =====================================================================
   目录缩略图：把每件家具用独立的小 renderer 渲成 3/4 视角小图，
   替掉原来那个纯色块。按需渲染（滚动到可视区才画）+ 结果缓存，
   所以开局不会卡；搜索重建列表时直接命中缓存。
   ===================================================================== */
const THUMB_W = 320, THUMB_H = 240;      // 卡片按 4:3 显示，渲得大一点才看得清
let _thumbGL = null, _thumbDead = false;
function thumbGL(){
  if(_thumbGL || _thumbDead) return _thumbGL;
  try{
    const cv = document.createElement('canvas'); cv.width = THUMB_W; cv.height = THUMB_H;
    const r = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, preserveDrawingBuffer:true});
    r.setPixelRatio(1); r.setSize(THUMB_W, THUMB_H, false);
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
    r.physicallyCorrectLights = false;          // 缩略图要的是看清造型，不是物理正确
    const scene = new THREE.Scene();
    // 注意：physicallyCorrectLights=false 时 three 会把光照乘 π 作补偿，
    // 按物理直觉给的强度会高出三倍多——浅色件直接推成纯白，
    // 沙色和石灰色两个配色的缩略图看起来一模一样。这组数是实测调出来的。
    scene.add(new THREE.AmbientLight(0xffffff, 0.22));
    scene.add(new THREE.HemisphereLight(0xe6effc, 0x8e8578, 0.28));
    const k = new THREE.DirectionalLight(0xfff6e8, 0.55); k.position.set(4, 7, 6); scene.add(k);
    const f = new THREE.DirectionalLight(0xd8e8ff, 0.18); f.position.set(-5, 2, -4); scene.add(f);
    const cam = new THREE.PerspectiveCamera(26, THUMB_W/THUMB_H, 0.02, 400);
    _thumbGL = {r, cv, scene, cam};
  }catch(e){ _thumbDead = true; console.warn('缩略图渲染器不可用:', e.message); }
  return _thumbGL;
}
const _thumbCache = new Map();
function furnThumb(spec){
  if(_thumbCache.has(spec.id)) return _thumbCache.get(spec.id);
  let url = null;
  const G = thumbGL();
  if(G){
    let g = null;
    try{
      g = furn3D({uid:-1, ref:spec.id, x:0, y:0, rot:0}, spec);
      g.position.set(0,0,0);
      g.rotation.y = -Math.PI*0.17;                       // 微微转个角度，看得出体块
      g.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(g);
      if(box.isEmpty()) throw new Error('空包围盒');
      const size = new THREE.Vector3(), ctr = new THREE.Vector3();
      box.getSize(size); box.getCenter(ctr);
      const R = Math.max(size.length()*0.5, 0.05);
      // 视角按体型选：吸顶灯本来就是从下往上看的；地毯/爬行垫这种扁平件
      // 用常规 25° 仰角看基本是一条线，得压成俯视。
      const flat = size.y < 0.22 * Math.max(size.x, size.z);
      const dir = isLight(spec) ? new THREE.Vector3(0.45, -0.42, 1).normalize()
                : flat          ? new THREE.Vector3(0.34, 1.00, 0.62).normalize()
                                : new THREE.Vector3(0.58, 0.46, 1).normalize();
      // 按包围盒八个角的投影迭代贴合。用包围球半径定距离会把细高件（书柜）
      // 缩到只占画面 15%，displayed 到 52px 就什么都看不见了。
      const corners = [];
      for(let i=0;i<8;i++) corners.push(new THREE.Vector3(
        (i&1)?box.max.x:box.min.x, (i&2)?box.max.y:box.min.y, (i&4)?box.max.z:box.min.z));
      let dist = R / Math.tan(26*Math.PI/360) * 1.1;
      for(let iter=0; iter<4; iter++){
        G.cam.position.copy(ctr).addScaledVector(dir, dist);
        G.cam.lookAt(ctr);
        G.cam.updateMatrixWorld(true);
        G.cam.matrixWorldInverse.copy(G.cam.matrixWorld).invert();
        G.cam.updateProjectionMatrix();
        let mx = 0;
        for(const c of corners){ const p = c.clone().project(G.cam);
          mx = Math.max(mx, Math.abs(p.x), Math.abs(p.y)); }
        if(!(mx > 0)) break;
        dist *= mx / 0.90;                      // 目标：最长边占画面 90%
        if(Math.abs(mx - 0.90) < 0.02) break;
      }
      G.cam.position.copy(ctr).addScaledVector(dir, dist);
      G.cam.lookAt(ctr);
      G.cam.updateMatrixWorld(true);
      G.cam.matrixWorldInverse.copy(G.cam.matrixWorld).invert();
      G.cam.updateProjectionMatrix();
      G.scene.add(g);
      G.r.render(G.scene, G.cam);
      // 第二遍：按真实剪影收紧并居中。包围盒的角常常是空气——开放式框架（爬爬架）
      // 和平面旋转过的矩形（爬行垫）尤其明显，只按包围盒取景会白留三四成画面。
      const meas = document.createElement('canvas'); meas.width = THUMB_W; meas.height = THUMB_H;
      const mg = meas.getContext('2d'); mg.drawImage(G.cv, 0, 0);
      const md = mg.getImageData(0, 0, THUMB_W, THUMB_H).data;
      let bx0=1e9, bx1=-1, by0=1e9, by1=-1;
      for(let y=0;y<THUMB_H;y++) for(let x=0;x<THUMB_W;x++){
        if(md[(y*THUMB_W+x)*4+3] > 12){
          if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; } }
      if(bx1 >= 0){
        const sxs=(bx1-bx0+1)/THUMB_W, sys=(by1-by0+1)/THUMB_H;
        const k=Math.max(sxs, sys);
        const ndcx=((bx0+bx1+1)/2/THUMB_W)*2-1, ndcy=-(((by0+by1+1)/2/THUMB_H)*2-1);
        if(k > 0.03 && (k < 0.86 || Math.abs(ndcx) > 0.04 || Math.abs(ndcy) > 0.04)){
          const rt=new THREE.Vector3(), upv=new THREE.Vector3(), fw=new THREE.Vector3();
          G.cam.matrixWorld.extractBasis(rt, upv, fw);
          const halfH=Math.tan(26*Math.PI/360)*dist, halfW=halfH*G.cam.aspect;
          const tgt=ctr.clone().addScaledVector(rt, ndcx*halfW).addScaledVector(upv, ndcy*halfH);
          dist *= Math.min(1.6, Math.max(0.4, k/0.90));
          G.cam.position.copy(tgt).addScaledVector(dir, dist);
          G.cam.lookAt(tgt);
          G.cam.updateMatrixWorld(true);
          G.cam.matrixWorldInverse.copy(G.cam.matrixWorld).invert();
          G.cam.updateProjectionMatrix();
          G.r.render(G.scene, G.cam);
        }
      }
      url = G.cv.toDataURL('image/png');
    }catch(e){ url = null; }
    if(g){ G.scene.remove(g); try{ disposeOwned(g); }catch(e){} }
  }
  _thumbCache.set(spec.id, url);
  return url;
}
/* 渲染排队：每帧最多占用十几毫秒，滚动时不掉帧 */
const _thumbQ = [];
let _thumbBusy = false;
function _thumbFallback(el, spec){ el.style.backgroundImage=''; el.style.backgroundColor = spec.color || '#7d848e'; }
function _thumbApply(el, spec, url){
  if(url){ el.style.backgroundImage = 'url('+url+')'; el.style.backgroundColor = '#12151a'; el.classList.add('has'); }
  else _thumbFallback(el, spec);
}
function queueThumb(el, spec){
  if(spec.img){ el.style.backgroundImage = 'url('+spec.img+')'; el.style.backgroundColor='transparent';
                el.classList.add('has'); return; }
  if(_thumbCache.has(spec.id)){ _thumbApply(el, spec, _thumbCache.get(spec.id)); return; }
  _thumbQ.push([el, spec]);
  if(!_thumbBusy){ _thumbBusy = true; setTimeout(_runThumbs, 0); }
}
function _runThumbs(){
  const t0 = performance.now();
  while(_thumbQ.length && performance.now()-t0 < 16){
    const [el, spec] = _thumbQ.shift();
    if(!el.isConnected) continue;
    _thumbApply(el, spec, furnThumb(spec));
  }
  if(_thumbQ.length) setTimeout(_runThumbs, 0);
  else _thumbBusy = false;
}
let _thumbIO = null;
function observeThumbs(container){
  const all = [...CATALOG, ...state.customCat];
  const nodes = container.querySelectorAll('.ph[data-thumb]');
  if(!('IntersectionObserver' in window)){          // 没有 IO 就全排队
    nodes.forEach(el=>{ const sp = all.find(c=>c.id===el.dataset.thumb); if(sp) queueThumb(el, sp); });
    return;
  }
  if(!_thumbIO){
    _thumbIO = new IntersectionObserver(es=>{
      for(const e of es){
        if(!e.isIntersecting) continue;
        _thumbIO.unobserve(e.target);
        const sp = [...CATALOG, ...state.customCat].find(c=>c.id===e.target.dataset.thumb);
        if(sp) queueThumb(e.target, sp);
      }
    }, {root: $('#catList'), rootMargin: '220px 0px'});
  }
  nodes.forEach(el=>_thumbIO.observe(el));
}

function buildCatalog(filter=''){
  const listEl = $('#catList'); listEl.innerHTML='';
  const cats = {};
  const all = [...CATALOG, ...state.customCat];
  const q = foldText(String(filter).trim());
  for(const c of all){
    if(q && !(foldText(c.name).includes(q) || foldText(c.cat).includes(q))) continue;
    (cats[c.cat] = cats[c.cat]||[]).push(c);
  }
  let first=true;
  for(const cat in cats){
    const grp = document.createElement('div'); grp.className='catGroup'+((first||filter)?' open':''); first=false;
    const h = document.createElement('h3'); h.innerHTML=`${cat}<span>▾</span>`;
    h.onclick=()=>grp.classList.toggle('open');
    grp.appendChild(h);
    const items = document.createElement('div'); items.className='catGrid';
    for(const c of cats[cat]){
      const card = document.createElement('div'); card.className='catCard';
      const p = fmtPrice(c);
      const tip = (c.name + (c.note? ' — '+c.note : '')).replace(/"/g,'&quot;');
      card.innerHTML = `<div class="ph" data-thumb="${c.id}" style="background-color:${c.color}"></div>
        <div class="meta">
          <div class="nm2" title="${tip}">${c.name}</div>
          <div class="sub"><span>${fmtLen(cm2ft(c.w))}×${fmtLen(cm2ft(c.d))}</span>${p?`<b class="${isBuiltIn(c)?'builtin':''}">${p}</b>`:''}</div>
        </div>`;
      card.onclick=()=>addItem(c.id);
      items.appendChild(card);
    }
    grp.appendChild(items); listEl.appendChild(grp);
  }
  observeThumbs(listEl);
  // 分类展开时里面的行才进入可视区，得再挂一次
  listEl.querySelectorAll('.catGroup h3').forEach(h=>{
    const prev = h.onclick;
    h.onclick = ()=>{ prev && prev(); setTimeout(()=>observeThumbs(listEl), 0); };
  });
}

/* =====================================================================
   币种：美元 / 加元
   两地标价常常不只差一个汇率（IKEA 加拿大定价普遍比美国高出汇率之外的一截，
   Avenlur / QUADRO 这类本来就只给加元价），所以：
     - price   = 美国实际标价（USD）
     - priceCA = 加拿大实际标价（CAD）
   哪个币种有当地实际标价就直接用；只有另一边的价时才按汇率折算，
   并且**必须标上 ≈**，让用户知道那不是当地实际标价。
   ===================================================================== */
const FX_DEFAULT = 1.38;                 // 1 USD ≈ ? CAD（2026-09 量级，可在界面上改）
function fxRate(){ const v = +(state.fx || FX_DEFAULT); return (v > 0.2 && v < 5) ? v : FX_DEFAULT; }
function curNow(){ return state.cur === 'cad' ? 'cad' : 'usd'; }
const CUR_SYM = {usd:'US$', cad:'CA$'};
/* 固定在墙/天花上的灯（筒灯/吸顶灯/镜前灯/吊灯）是公寓自带的，不参与购物 */
function isBuiltIn(spec){ return isLight(spec); }
/* 返回 {v, exact} 或 null。exact=false 表示是汇率折算出来的估值 */
function priceOf(spec, cur){
  if(!spec || isBuiltIn(spec)) return null;
  cur = cur || curNow();
  const usd = (spec.price != null && spec.price > 0) ? spec.price : null;
  const cad = (spec.priceCA != null && spec.priceCA > 0) ? spec.priceCA : null;
  if(cur === 'cad'){
    if(cad != null) return {v: cad, exact: true};
    if(spec.caNA) return null;                       // 加拿大不售，折算出来也没意义
    if(usd != null) return {v: usd * fxRate(), exact: false};
  } else {
    if(usd != null) return {v: usd, exact: true};
    if(cad != null) return {v: cad / fxRate(), exact: false};
  }
  return null;
}
function fmtMoney(v, cur){
  cur = cur || curNow();
  return CUR_SYM[cur] + Math.round(v).toLocaleString();
}
function fmtPrice(spec, cur){
  if(isBuiltIn(spec)) return '公寓自带';
  if((cur || curNow()) === 'cad' && spec.caNA && spec.priceCA == null) return '加拿大无售';
  const p = priceOf(spec, cur);
  if(!p) return '';
  return (p.exact ? '' : '≈') + fmtMoney(p.v, cur);
}
function setCurrency(c){
  state.cur = (c === 'cad') ? 'cad' : 'usd';
  syncCurUI(); buildCatalog($('#catSearch') ? $('#catSearch').value : '');
  updateTotals(); updatePlacedList(); updateProps(); save();
}
function syncCurUI(){
  const c = curNow();
  const a = $('#curUSD'), b = $('#curCAD'), f = $('#fxRate');
  if(a) a.classList.toggle('on', c === 'usd');
  if(b) b.classList.toggle('on', c === 'cad');
  if(f && document.activeElement !== f) f.value = fxRate();
}

function addItem(refId){
  // 放到当前视图中心附近
  const cx = (vb.x+vb.w/2)/S, cy=(vb.y+vb.h/2)/S;
  const it = {uid:uidSeq++, ref:refId, x:Math.round(cx*4)/4, y:Math.round(cy*4)/4, rot:0};
  state.items.push(it); selected=it.uid;
  drawFurniture(); save();
}
function updateTotals(){
  const cur = curNow();
  let sum=0, buy=0, fixed=0, approx=0, unknown=0, na=0;
  for(const it of state.items){
    const s=itemSpec(it); if(!s) continue;
    if(isBuiltIn(s)){ fixed++; continue; }
    buy++;
    const p=priceOf(s, cur);
    if(!p){ if(cur==='cad' && s.caNA) na++; else unknown++; continue; }
    sum += p.v; if(!p.exact) approx++;
  }
  const tail = [];
  if(approx)  tail.push(`${approx} 件按汇率折算`);
  if(na)      tail.push(`${na} 件加拿大无售`);
  if(unknown) tail.push(`${unknown} 件无价`);
  if(fixed)   tail.push(`${fixed} 件固定灯具不计价`);
  $('#totals').innerHTML = `采购 ${buy} 件 · 合计约 <b>${approx?'≈':''}${fmtMoney(sum, cur)}</b>` +
    (tail.length ? ` <span class="muted" style="font-size:11px">（${tail.join('、')}）</span>` : '');
}
function updatePlacedList(){
  const el2 = $('#plRows'); el2.innerHTML='';
  const buy = [], fixed = [];
  for(const it of state.items){
    const s=itemSpec(it); if(!s) continue;
    (isBuiltIn(s) ? fixed : buy).push([it, s]);
  }
  $('#plCount').textContent = buy.length;
  const mkRow = (it, s, showPrice)=>{
    const row=document.createElement('div'); row.className='plRow'+(it.uid===selected?' sel':'');
    const p = showPrice ? fmtPrice(s) : '';
    row.innerHTML=`<div class="dot" style="background:${itemColor(it)}"></div><span>${s.name}</span>`+
      (p?`<span class="plPrice">${p}</span>`:'')+`<span class="x" title="删除">✕</span>`;
    row.onclick=(e)=>{ if(e.target.classList.contains('x')){ state.items=state.items.filter(i=>i.uid!==it.uid); if(selected===it.uid)selected=null; drawFurniture(); save(); }
      else { selected=it.uid; drawFurniture(); } };
    el2.appendChild(row);
  };
  for(const [it, s] of buy) mkRow(it, s, true);
  // 固定灯具是公寓自带的，跟购物无关——单独一节，不进采购清单、不计价
  if(fixed.length){
    const h=document.createElement('div'); h.className='plFixedHead';
    h.textContent=`固定灯具 ${fixed.length} 件 · 公寓自带，不计价`;
    el2.appendChild(h);
    for(const [it, s] of fixed) mkRow(it, s, false);
  }
}
function updateProps(){
  const it = state.items.find(i=>i.uid===selected);
  if(!it){ $('#pTitle').textContent='未选中家具'; $('#pInfo').style.display='block'; $('#pFields').style.display='none'; return; }

    : (_pp && !_pp.exact ? '当地没有实际标价，按汇率 1 USD = '+fxRate()+' CAD 折算，仅供参考' : '');
  const a=$('#pUrl'); if(s.url){a.href=s.url; a.textContent='打开产品页 ↗';} else {a.removeAttribute('href'); a.textContent='—';}

}

/* ===== 2D 量尺寸 =====
   点第一下定起点，移动时实时预览，点第二下落定。可以连续量多条，
   长度跟着单位切换走。Esc 或再点一次「量尺寸」退出。 */
const meas = {on:false, list:[], p0:null, hover:null};
function measFmt(a, b){
  const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
  return {L, txt: fmtLen(L, {precise:true})};
}
function drawMeasure(){
  if(!gMeas) return;
  gMeas.innerHTML = '';
  const k = Math.max(0.05, (svg.getScreenCTM()||{a:1}).a || 1);   // 标注按屏幕尺寸恒定
  const seg = (a, b, live)=>{
    const col = live ? '#ffd45e' : '#26e0a8';
    el('line',{x1:a[0]*S, y1:a[1]*S, x2:b[0]*S, y2:b[1]*S, stroke:col,
      'stroke-width':1.6/k, 'stroke-dasharray': live? (5/k)+' '+(4/k) : ''}, gMeas);
    for(const p of [a, b]){                                    // 端点十字
      el('line',{x1:(p[0]-4/k/S)*S, y1:p[1]*S, x2:(p[0]+4/k/S)*S, y2:p[1]*S, stroke:col,'stroke-width':1.4/k}, gMeas);
      el('line',{x1:p[0]*S, y1:(p[1]-4/k/S)*S, x2:p[0]*S, y2:(p[1]+4/k/S)*S, stroke:col,'stroke-width':1.4/k}, gMeas);
    }
    const {txt} = measFmt(a, b);
    const mx=(a[0]+b[0])/2*S, my=(a[1]+b[1])/2*S;
    let ang = Math.atan2(b[1]-a[1], b[0]-a[0])*180/Math.PI;
    if(ang > 90 || ang < -90) ang += 180;                      // 字不倒着写
    const g2 = el('g',{transform:`translate(${mx} ${my}) rotate(${ang})`}, gMeas);
    const w = txt.length*6.2/k + 10/k, h = 14/k;
    el('rect',{x:-w/2, y:-h-3/k, width:w, height:h, rx:3/k, fill:'rgba(12,14,18,.82)',
      stroke:col,'stroke-width':0.8/k}, g2);
    const t = el('text',{x:0, y:-6/k,'text-anchor':'middle','font-size':10/k, fill:col}, g2);
    t.textContent = txt;
  };
  for(const m of meas.list) seg(m[0], m[1], false);
  if(meas.p0 && meas.hover) seg(meas.p0, meas.hover, true);
}
function measStart(){
  meas.on = true; meas.p0 = null; meas.hover = null;
  $('#btnMeas').classList.add('on');
  document.body.classList.add('measuring');
  $('#hint').innerHTML = '<b>量尺寸</b>：点一下定起点，再点一下落定 · 按住 Shift 锁定水平/垂直 · Esc 退出 · 「清除」删除全部';
  drawMeasure();
}
function measEnd(){
  if(!meas.on) return;
  meas.on = false; meas.p0 = null; meas.hover = null;
  $('#btnMeas').classList.remove('on');
  document.body.classList.remove('measuring');
  if(state.view === '2d') setView('2d');
  drawMeasure();
}
function measClear(){ meas.list = []; meas.p0 = null; meas.hover = null; drawMeasure(); }
function measSnap(p, ref, shift){
  if(!shift || !ref) return p;
  return Math.abs(p[0]-ref[0]) > Math.abs(p[1]-ref[1]) ? [p[0], ref[1]] : [ref[0], p[1]];
}
function measClick(ftPt, shift){
  const p = measSnap(ftPt, meas.p0, shift);
  if(!meas.p0){ meas.p0 = p; }
  else { meas.list.push([meas.p0, p]); meas.p0 = null; }
  meas.hover = null; drawMeasure();
}
function measMove(ftPt, shift){
  if(!meas.on || !meas.p0) return;
  meas.hover = measSnap(ftPt, meas.p0, shift);
  drawMeasure();
}

/* 视图共三档：'2d' | 'doll'(3D 俯瞰) | 'fp'(室内)。
   后两档共用同一个 WebGL 画布，只是相机模式不同——所以到处要问的是"是不是 3D"。 */
function is3D(){ return state.view === 'doll' || state.view === 'fp'; }
function setView(v){
  if(v === '3d') v = 'doll';                       // 兼容旧调用
  state.view = v;
  const in3 = is3D(), fp = (v === 'fp');
  $('#btn2d').classList.toggle('on', v==='2d');
  $('#btnDoll').classList.toggle('on', v==='doll');

  $('#svg2d').style.display = v==='2d'?'block':'none';
  $('#c3d').style.display = in3?'block':'none';
  $('#hint').innerHTML = v==='2d'
    ? '拖动=移动 · 圆点手柄/R键=旋转（Shift自由/[ ]微调）· D=复制 · Delete=删除 · 滚轮=缩放 · 拖空白=平移<br><b>双击地面 = 站到该处看（室内视角）</b> · 红色描边 = 与其他家具重叠'
    : (fp ? '室内视角：左键拖动=<b>原地转头</b> · <b>双击地面=走过去</b> · W/A/S/D=走动 · 滚轮=前后（摆家具请切 3D 俯瞰）'
          : '左键拖动=环绕 · <b>Shift+左键 / 右键 = 平移</b> · 滚轮=缩放 · <b>拖动家具=移动（Shift 拖=旋转）</b> · <b>双击地面=站到那儿看</b>');
  $('#dnSeg').style.display = in3?'flex':'none';
  $('#lampSeg').style.display = in3?'flex':'none';
  // 光追只在室内视角有意义：俯瞰是掀了天花板的剖切图，追出来的光照根本不成立
  $('#btnPT').style.display = fp?'inline-block':'none';
  $('#measSeg').style.display = v==='2d'?'flex':'none';
  if(v!=='2d' && typeof measEnd==='function') measEnd();
  if(in3){
    show3DLoading(three?'正在更新 3D 场景…':'正在生成 3D 场景（首次需要几秒）…');
    // 用 setTimeout 而非 rAF 派发：无合成帧时 rAF 可能一直不触发，会把场景卡住不建
    setTimeout(()=>{
      try{
        if(!three) init3D(); else if(geoDirty3D) buildStatic3D();
        geoDirty3D=false; sync3D();
        if(fp && pendingFP){ const q=pendingFP; pendingFP=null; fpJumpTo(q[0], q[1]); }
        else setCamMode(fp ? 'fp' : 'doll');
      }catch(e){ console.error(e); $('#loadTxt').textContent='3D 场景生成失败：'+e.message; }
      setTimeout(hide3DLoading, 80);
    }, 40);
  } else hide3DLoading();
}

/* ===== 侧栏：收起 / 拖宽 =====
   挑家具是个费眼的活，得能把目录拉宽；不挑的时候又能收起来把画布让出来。
   宽度和折叠状态都记在 localStorage 里。 */
const PANEL_KEY = 'planner_panels_v1';
function panelState(){
  try{ return JSON.parse(localStorage.getItem(PANEL_KEY)) || {}; }catch(e){ return {}; }
}
function panelSave(p){ try{ localStorage.setItem(PANEL_KEY, JSON.stringify(p)); }catch(e){} }
function applyPanels(){
  if(CALIB || IMGONLY) return;             // 校准模式锁死布局
  const p = panelState();
  const cat = $('#catalog'), pr = $('#props');
  if(p.catW) cat.style.width = p.catW + 'px';
  if(p.prW)  pr.style.width  = p.prW + 'px';
  cat.classList.toggle('collapsed', !!p.catHid);
  pr.classList.toggle('collapsed', !!p.prHid);
  $('#catTab').classList.toggle('show', !!p.catHid);
  $('#propsTab').classList.toggle('show', !!p.prHid);
  $('#splitL').classList.toggle('hidden', !!p.catHid);
  $('#splitR').classList.toggle('hidden', !!p.prHid);
  fitCanvasSoon();
}
function setPanel(which, hidden){
  const p = panelState();
  p[which === 'cat' ? 'catHid' : 'prHid'] = !!hidden;
  panelSave(p); applyPanels();
}
let _fitT = null;
function fitCanvasSoon(){
  // 3D 画布本身挂了 ResizeObserver，会自己跟；这里只需要重画按屏幕尺寸定的叠加层
  clearTimeout(_fitT);
  _fitT = setTimeout(()=>{
    if(state.view === '2d'){ drawFurniture(); drawMeasure(); if(wallEdit.on) drawWallEdit(); }
    if(three) requestRender();
  }, 70);
}
function installSplitter(id, target, side){
  const sp = $(id), el2 = $(target);
  if(!sp || !el2) return;
  sp.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const startX = ev.clientX, startW = el2.getBoundingClientRect().width;
    sp.classList.add('dragging');
    sp.setPointerCapture(ev.pointerId);
    const move = e2=>{
      const dx = (e2.clientX - startX) * (side === 'left' ? 1 : -1);
      const w = Math.max(220, Math.min(window.innerWidth*0.7, startW + dx));
      el2.style.width = w + 'px';
      fitCanvasSoon();
    };
    const up = ()=>{
      sp.classList.remove('dragging');
      sp.removeEventListener('pointermove', move);
      sp.removeEventListener('pointerup', up);
      const p = panelState();
      p[side === 'left' ? 'catW' : 'prW'] = Math.round(el2.getBoundingClientRect().width);
      panelSave(p);
    };
    sp.addEventListener('pointermove', move);
    sp.addEventListener('pointerup', up);
  });
  // 双击分隔条：恢复默认宽度
  sp.addEventListener('dblclick', ()=>{
    el2.style.width = (side === 'left' ? 400 : 300) + 'px';
    const p = panelState(); p[side==='left'?'catW':'prW'] = (side==='left'?400:300);
    panelSave(p); fitCanvasSoon();
  });
}

function setDoorWidth(newLenFt){
  const s=wallEdit.sel; if(!s||s.kind!=='door') return;
  const d=selDoor(); if(!d) return;
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6, u=[dx/L,dy/L];
  const link=doorLinkage(d, s);
  const moveEnd = (wallEdit.dEndSel!=null) ? wallEdit.dEndSel : (d.hinge?0:1);
  const rg=link.range(moveEnd);
  let L2=Math.max(DOOR_MIN, newLenFt);
  if(moveEnd===1){ L2=Math.min(L2, L+rg[1]); L2=Math.max(L2, Math.max(DOOR_MIN, L+rg[0])); }
  else           { L2=Math.min(L2, L-rg[0]); L2=Math.max(L2, Math.max(DOOR_MIN, L-rg[1])); }
  if(Math.abs(L2-L)<1e-9){ wMsg('已到墙垛允许的极限', true); return; }
  if(moveEnd===1) link.apply(d.x1,d.y1, d.x1+u[0]*L2, d.y1+u[1]*L2);
  else            link.apply(d.x2-u[0]*L2, d.y2-u[1]*L2, d.x2, d.y2);
  geoChanged(); updateWallBarFromSel();
  if(Math.abs(L2-Math.max(DOOR_MIN,newLenFt))>1e-6) wMsg('门宽已夹到墙垛允许范围：'+lenLabel(L2), true);
}
function nudgeDoor(signAlong, stepFt){ // 激活端点则改宽，否则整体滑动
  const s=wallEdit.sel; if(!s||s.kind!=='door') return false;
  const d=selDoor(); if(!d) return false;
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6, u=[dx/L,dy/L];
  let dd=stepFt*signAlong;
  const link=doorLinkage(d, s);
  const cl=(k,v)=>{ const r=link.range(k); return Math.max(r[0], Math.min(r[1], v)); };
  if(wallEdit.dEndSel===0){
    dd=cl(0,dd); if(L-dd<DOOR_MIN) dd=L-DOOR_MIN;
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1+u[0]*dd, d.y1+u[1]*dd, d.x2, d.y2);
  } else if(wallEdit.dEndSel===1){
    dd=cl(1,dd); if(L+dd<DOOR_MIN) dd=DOOR_MIN-L;
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1, d.y1, d.x2+u[0]*dd, d.y2+u[1]*dd);
  } else {
    dd=Math.max(link.range(0)[0], Math.min(link.range(1)[1], dd));
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1+u[0]*dd, d.y1+u[1]*dd, d.x2+u[0]*dd, d.y2+u[1]*dd);
  }
  geoChanged(); updateWallBarFromSel(); return true;
}

/* 视角模式：娃娃屋 / 室内漫游 */
const EYE_H = 5.35;              // 人眼高度 ≈163cm
function setCamMode(m){
  if(!three) return;
  three.camMode=m;
  if(is3D()) state.view = m;                       // 相机档位就是视图档位
  const inFP = (m==='fp' && is3D());
  $('#btnDoll').classList.toggle('on', m==='doll' && is3D());
  $('#btnFP').classList.toggle('on', inFP);
  $('#btnPT').style.display = inFP?'inline-block':'none';
  const {cam, controls} = three;
  if(m==='fp'){
    const p=three.fpPos || new THREE.Vector3(22, EYE_H, 27);
    cam.position.copy(p);
    const dir = (three.fpDir || new THREE.Vector3(-0.75,-0.06,-0.66)).clone().normalize();
    three.fpYaw = Math.atan2(dir.x, dir.z);
    three.fpPitch = Math.asin(Math.max(-1,Math.min(1,dir.y)));
    // 第一人称：完全停用 OrbitControls（它会把俯仰夹到水平面并反推相机位置 → 转头时升高/翻向）
    controls.enabled=false;
    cam.fov=68; cam.updateProjectionMatrix();
    fpAim();
    $('#hint').innerHTML='室内视角：左键拖动=<b>原地转头</b> · <b>双击地面=走过去</b> · W/A/S/D=走动 · 滚轮=前后（摆家具请切娃娃屋视角）';
  } else {
    if(three.camMode!=='doll'){ three.fpPos=cam.position.clone();
      three.fpDir=controls.target.clone().sub(cam.position).normalize(); }
    controls.enabled=true;
    controls.enableRotate=true; controls.enablePan=true; controls.enableZoom=true;
    controls.minDistance=0; controls.maxDistance=Infinity;
    controls.maxPolarAngle=Math.PI/2-0.02;
    cam.fov=55; cam.updateProjectionMatrix();
    cam.position.set(28, 42, 50); controls.target.set(26,0,20);
    $('#hint').innerHTML='左键拖动=环绕 · <b>Shift+左键 / 右键 = 平移</b> · 滚轮=缩放 · <b>拖动家具=移动（Shift 拖=旋转）</b>';
  }
  applyBackdrop(); applyLightMode();
  controls.update(); requestRender();
}
/* 第一人称：只改朝向，站立位置不动（OrbitControls 是绕目标公转，会把人挪走） */
function fpAim(){
  if(!three) return;
  const {cam, controls}=three;
  const y=three.fpYaw||0, p=three.fpPitch||0;
  const dir=new THREE.Vector3(Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p));
  cam.up.set(0,1,0);
  cam.lookAt(cam.position.x+dir.x, cam.position.y+dir.y, cam.position.z+dir.z);  // 直接定朝向
  controls.target.copy(cam.position).addScaledVector(dir, 6);                     // 仅为切回娃娃屋时保持连续
  three.fpDir=dir.clone();
  requestRender();
  return dir;
}
function fpForward(){ const y=three.fpYaw||0;
  return new THREE.Vector3(Math.sin(y),0,Math.cos(y)).normalize(); }
/* 点是否在户型内（含阳台），用于限制漫游范围 */
function insideFloorPt(x,z){
  const test=(poly)=>{ let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if((yi>z)!==(yj>z) && x<(xj-xi)*(z-yi)/(yj-yi)+xi) inside=!inside; }
    return inside; };
  return test(FLOORPTS) || test(PATIO);
}
/* 街景式：双击地面走过去（保持朝向，平滑移动） */
function walkTo(x,z){
  if(!three) return;
  const cam=three.cam, from=cam.position.clone(), to=new THREE.Vector3(x, EYE_H, z);
  const dist=from.distanceTo(to);
  const dur=Math.min(900, 260+dist*45);
  const t0=performance.now();
  if(three.walk){ clearInterval(three.walk.iv); three.walk.cancel=true; }
  const ease=t=>t<.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const anim={cancel:false};
  // 用定时器而非 rAF 驱动：页面无合成帧时 rAF 会被饿死，动画卡在原地
  anim.iv=setInterval(()=>{
    if(anim.cancel){ clearInterval(anim.iv); return; }
    const t=Math.min(1,(performance.now()-t0)/dur);
    cam.position.lerpVectors(from, to, ease(t));
    cam.position.y=EYE_H;
    fpAim();
    if(t>=1){ clearInterval(anim.iv); three.walk=null; requestShadowUpdate(); }
  }, 16);
  three.walk=anim;
}
/* ===== 3D 里直接拖动家具：射线拾取 → 投影到地面 → 改 x/y（Shift 拖动=就地旋转） ===== */
function pickFurniture(ev){
  if(!three) return null;
  const cv=three.canvas, r=cv.getBoundingClientRect();
  // r147 的 Raycaster 不刷新 matrixWorld，而本 app 按需渲染：刚改完位姿还没渲染就射线，会打到旧位置
  three.cam.updateMatrixWorld(true);
  three.furnGroup.updateMatrixWorld(true);
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(ndc, three.cam);
  const hits=rc.intersectObjects(three.furnGroup.children, true);
  if(!hits.length || !three.furnMap) return null;
  const g2uid=new Map();
  for(const [uid,rec] of three.furnMap) g2uid.set(rec.g, uid);
  const cands=[];
  for(const h of hits){
    let o=h.object;
    while(o && o.parent!==three.furnGroup) o=o.parent;   // 回溯到家具组
    if(!o) continue;
    const uid=g2uid.get(o); if(uid==null) continue;
    if(cands.some(c=>c.uid===uid)) continue;
    const it=state.items.find(i=>i.uid===uid);
    const sp=it?itemSpec(it):null;
    cands.push({uid, group:o, point:h.point, isLight:!!(sp&&isLight(sp))});
  }
  if(!cands.length) return null;
  // 俯视时吸顶灯永远挡在射线最前面；只要底下还有别的家具，就优先拾取家具
  const nonLight=cands.filter(c=>!c.isLight);
  const pick = nonLight.length ? nonLight[0] : cands[0];
  return {uid:pick.uid, group:pick.group, point:pick.point};
}
function groundAt(ev){
  const cv=three.canvas, r=cv.getBoundingClientRect();
  three.cam.updateMatrixWorld(true);
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(ndc, three.cam);
  const p=new THREE.Vector3();
  return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), p) ? p : null;
}
(function install3DDrag(){
  const canvas=$('#c3d'); if(!canvas) return;
  let d3=null;
  canvas.addEventListener('pointerdown', ev=>{
    if(!three || !is3D() || wallEdit.on || ev.button!==0) return;
    if(three.camMode==='fp') return;              // 室内视角只走动/看，不动家具（会误触）
    const hit=pickFurniture(ev); if(!hit) return;
    const it=state.items.find(i=>i.uid===hit.uid); if(!it) return;
    const g0=groundAt(ev); if(!g0) return;
    selected=hit.uid; drawFurniture(); updateProps();
    d3={uid:hit.uid, dx:it.x-g0.x, dy:it.y-g0.z, rot0:it.rot||0,
        sx:ev.clientX, moved:false, wasCtl:three.controls.enabled};
    three.controls.enabled=false;                 // 拖家具时不要转相机
    three.dragging3D=true;
    try{ canvas.setPointerCapture(ev.pointerId); }catch(_){}
    ev.stopPropagation();
  }, true);                                        // 捕获阶段：抢在 FP 转头/Orbit 之前
  canvas.addEventListener('pointermove', ev=>{
    if(!d3) return;
    const it=state.items.find(i=>i.uid===d3.uid); if(!it) return;
    if(ev.shiftKey){                               // Shift 拖动 = 就地旋转
      it.rot = Math.round((d3.rot0 + (ev.clientX-d3.sx)*0.5)*10)/10;
    } else {
      const p=groundAt(ev); if(!p) return;
      it.x = Math.round((p.x+d3.dx)*100)/100;
      it.y = Math.round((p.z+d3.dy)*100)/100;
    }
    d3.moved=true;
    drawFurniture();                               // 内部会 sync3D（增量，约 4ms）
    ev.stopPropagation();
  }, true);
  const endDrag=ev=>{
    if(!d3) return;
    three.controls.enabled=d3.wasCtl;
    three.dragging3D=false;
    if(d3.moved) save();
    d3=null;
    try{ canvas.releasePointerCapture(ev.pointerId); }catch(_){}
  };
  canvas.addEventListener('pointerup', endDrag, true);
  canvas.addEventListener('pointercancel', endDrag, true);
})();
(function installFPLook(){
  const canvas=$('#c3d'); if(!canvas) return;
  let drag=null;
  canvas.addEventListener('dblclick', e=>{      // 室内=走过去（Google 街景逻辑）；俯瞰=站到那儿
    if(!three || !is3D()) return;
    if(pickFurniture(e)) return;                 // 双击家具不触发
    if(three.camMode === 'doll'){
      const r0=canvas.getBoundingClientRect();
      const nd=new THREE.Vector2(((e.clientX-r0.left)/r0.width)*2-1, -((e.clientY-r0.top)/r0.height)*2+1);
      three.cam.updateMatrixWorld(true);
      const rc0=new THREE.Raycaster(); rc0.setFromCamera(nd, three.cam);
      const h0=new THREE.Vector3();
      if(!rc0.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), h0)) return;
      if(!insideFloorPt(h0.x, h0.z)) return;
      e.preventDefault();
      gotoInterior(h0.x, h0.z);
      return;
    }
    if(three.camMode!=='fp') return;

    const r=canvas.getBoundingClientRect();
    const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    three.cam.updateMatrixWorld(true);      // 射线必须基于最新的相机矩阵
    const rc=new THREE.Raycaster(); rc.setFromCamera(ndc, three.cam);
    const hit=new THREE.Vector3();
    if(!rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), hit)) return;
    if(!insideFloorPt(hit.x,hit.z)){ return; }   // 不走到户型外
    e.preventDefault(); walkTo(hit.x, hit.z);
  });
  canvas.addEventListener('pointerdown', e=>{
    if(!three || three.camMode!=='fp' || !is3D()) return;
    if(three.dragging3D) return;                 // 正在拖家具，不要同时转头
    drag={x:e.clientX, y:e.clientY, btn:e.button};
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drag || !three || three.camMode!=='fp') return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    if(drag.btn===2){                       // 右键=平移站位（贴地滑动）
      const f=fpForward(), r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();
      const mv=new THREE.Vector3().addScaledVector(r,-dx*0.012).addScaledVector(f, dy*0.012);
      three.cam.position.add(mv); three.cam.position.y=EYE_H;
    } else {                                // 左键=原地转头（与娃娃屋一致的"抓住场景拖动"手感）
      three.fpYaw   += dx*0.0045;
      three.fpPitch  = Math.max(-1.25, Math.min(1.25, three.fpPitch + dy*0.0045));
    }
    fpAim();
  });
  const end=e=>{ if(drag){ drag=null; try{ canvas.releasePointerCapture(e.pointerId); }catch(_){} } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', e=>{     // 滚轮=前后走，而不是拉远拉近
    if(!three || three.camMode!=='fp' || !is3D()) return;
    e.preventDefault();
    three.cam.position.addScaledVector(fpForward(), (e.deltaY>0?-1:1)*0.55);
    three.cam.position.y=EYE_H;
    fpAim();
  }, {passive:false});
})();

const fpKeys={};
window.addEventListener('keydown', e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(!three || three.camMode!=='fp' || !is3D()) return;
  const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ fpKeys[k]=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{ fpKeys[e.key.toLowerCase()]=false; });
function fpStep(){
  if(!three || three.camMode!=='fp') return;
  const any=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].some(k=>fpKeys[k]);
  if(!any) return;
  const {cam}=three;
  const fwd=fpForward();
  const right=new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const sp=(fpKeys['shift']?0.34:0.14);
  const mv=new THREE.Vector3();
  if(fpKeys['w']||fpKeys['arrowup'])    mv.addScaledVector(fwd, sp);
  if(fpKeys['s']||fpKeys['arrowdown'])  mv.addScaledVector(fwd,-sp);
  if(fpKeys['a']||fpKeys['arrowleft'])  mv.addScaledVector(right,-sp);
  if(fpKeys['d']||fpKeys['arrowright']) mv.addScaledVector(right, sp);
  cam.position.add(mv); cam.position.y=EYE_H;
  fpAim();
}

$('#ptDnOn').onclick =()=>{ state.ptDN=true;  syncPTUI(); save(); };
$('#ptDnOff').onclick=()=>{ state.ptDN=false; syncPTUI(); save(); };
function syncPTUI(){
  const q=state.ptQ||'normal';
  document.querySelectorAll('#ptSeg button').forEach(x=>x.classList.toggle('on', x.dataset.q===q));
  const on=state.ptDN!==false;
  $('#ptDnOn').classList.toggle('on', on); $('#ptDnOff').classList.toggle('on', !on);
  // 把每档具体是什么写清楚，别让用户猜「精细」到底精细在哪
  const Q=PT_QUALITY[q]||PT_QUALITY.normal;
  const cv=three&&three.canvas, W=cv?(cv.clientWidth||cv.width):1280, H=cv?(cv.clientHeight||cv.height):800;
  const sc=Math.min(1, Math.sqrt(Q.maxPx/(W*H)));
  const info=$('#ptQInfo');
  if(info) info.textContent = Q.spp+' 次采样 · '+Q.bounces+' 次弹射 · '
    + Math.round(W*sc)+'×'+Math.round(H*sc)+' 像素'
    + (q==='fine' ? '（很慢，弱显卡建议先用草稿试）' : q==='draft' ? '（最快，用来试构图）' : '');
}
$('#photoCancel').onclick=()=>{ if(three&&three.photo) three.photo.cancel(); };
$('#photoModal').onclick=(e)=>{ if(e.target.id==='photoModal') e.target.style.display='none'; };
/* 底图对照 */
function setUnderlay(v){
  showUnderlay=v;
  $('#btnUnderlay').classList.toggle('on', v);
  build2D();
}
$('#btnUnderlay').onclick=()=>{ $('#btnUnderlay').blur();
  if(CALIB){ return; }               // 校准审计模式本身就带底图
  setUnderlay(!showUnderlay); };
/* 原图 */
$('#btnRefPhoto').onclick=()=>{ const p=$('#refPhoto'); p.style.display = p.style.display==='block'?'none':'block'; };
/* 导入导出 */
$('#btnSaveJson').onclick=()=>{
  const blob = new Blob([JSON.stringify({items:state.items, customCat:state.customCat},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='家具布局.json'; a.click();
};
$('#btnLoadJson').onclick=()=>$('#fileJson').click();
$('#fileJson').addEventListener('change', ev=>{
  const f=ev.target.files[0]; if(!f) return;
  f.text().then(t=>{ try{ const s=JSON.parse(t); state.items=s.items||[]; state.customCat=s.customCat||[];
    uidSeq=Math.max(0,...state.items.map(i=>i.uid),0)+1; selected=null; buildCatalog(); refresh(); save(); }
    catch(e){ alert('文件格式错误'); } });
  ev.target.value='';
});
/* 导出图片 */
$('#btnExport').onclick=()=>{
  if(is3D() && three){
    const a=document.createElement('a'); a.href=three.renderer.domElement.toDataURL('image/png');
    a.download='3D渲染.png'; a.click(); return;
  }
  // 序列化时内嵌样式（页面CSS不会随SVG导出）
  const r=svg.getBoundingClientRect();
  const clone = svg.cloneNode(true);
  const st = document.createElementNS(NS,'style');
  st.textContent = `.wall{stroke:#0c0d0f;stroke-linecap:square}.glass{stroke:#7fb8ff}
    .roomlabel{fill:#8b929b;font-size:13px;text-anchor:middle}.roomlabel tspan.dim{font-size:11px;fill:#6b727b}
    .dimlabel{fill:#5d646e;font-size:9.5px;text-anchor:middle}
    text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}`;
  clone.insertBefore(st, clone.firstChild);
  clone.setAttribute('width', r.width*2); clone.setAttribute('height', r.height*2);
  const ser = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  const blob = new Blob([ser],{type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=r.width*2; c.height=r.height*2;
    const g=c.getContext('2d'); g.fillStyle='#101215'; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img,0,0,c.width,c.height);
    try{ const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='2D平面布局.png'; a.click(); }
    catch(e){ alert('导出失败，请直接截图。'); }
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{ alert('导出失败，请直接截图。'); URL.revokeObjectURL(url); };
  img.src=url;
  // 提示：自定义家具的外链图片不会出现在导出的PNG里（浏览器安全限制）
};

function refresh(){ drawFurniture(); if(three) sync3D(); }

/* ---------- 启动 ---------- */
if(location.hash==='#dump'){
  document.body.innerHTML='<pre id="dump">'+JSON.stringify({W:WALLS.map(s=>[+(s.x1*11.2).toFixed(2),+(s.y1*11.2).toFixed(2),+(s.x2*11.2).toFixed(2),+(s.y2*11.2).toFixed(2),s.t,s.wd||0]),F:FLOORPTS.map(p=>[+(p[0]*11.2).toFixed(2),+(p[1]*11.2).toFixed(2)]),S:FIXED.filter(f=>f.fill==='#0c0d0f'||f.fill==='#15171a').map(f=>f.poly.map(p=>[+(p[0]*11.2).toFixed(2),+(p[1]*11.2).toFixed(2)]))})+'</pre>';
  throw new Error('dump-only');
}
loadGeo();
if(location.search.indexOf('testgeo')>=0){  // 无痕测试种子（不写入存档）
  USERGEO.walls.push({x1:C(230,300)[0],y1:C(230,300)[1],x2:C(230,380)[0],y2:C(230,380)[1],t:'w',wd:8});
  USERGEO.walls.push({x1:C(230,340)[0],y1:C(230,340)[1],x2:C(280,340)[0],y2:C(280,340)[1],t:'g',wd:6});
  USERGEO.polys.push({pts:[C(205,325),C(220,328),C(222,342),C(211,347),C(202,338)]});
  const _sg=saveGeo; saveGeo=()=>{};
}
build2D();
if(!load()){ state.items=[]; refresh(); } else { refresh(); }   // 默认空白户型，不预置家具
buildCatalog();
if(typeof syncPTUI==='function') syncPTUI();
if(typeof syncCurUI==='function') syncCurUI();
syncUnitUI();
if(location.hash==='#3d') setView('doll');
window.addEventListener('hashchange', ()=>location.reload()); // hash 切换时强制重载，避免旧页面残留
// 同步3D当家具变动（简单节流）
const _origDraw = drawFurniture;
drawFurniture = function(){ _origDraw(); if(three && is3D()) sync3D(); };
</script>
</body>
