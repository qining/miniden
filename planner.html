<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公寓家具规划器 · 2B2B</title>
<style>
  :root{
    --bg:#17191d; --panel:#1f2228; --panel2:#262a31; --line:#33383f;
    --text:#e8eaed; --muted:#9aa0a8; --accent:#4c8dff; --accent2:#37c2a0;
    --danger:#e05656;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  }
  /* ---------- top bar ---------- */
  #topbar{
    display:flex; align-items:center; gap:10px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); z-index:20;
  }
  #topbar .title{font-weight:700; font-size:15px; margin-right:6px;}
  #topbar .title small{color:var(--muted); font-weight:400; margin-left:6px;}
  .seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{
    background:none; border:none; color:var(--muted); padding:6px 14px; cursor:pointer; font-size:13px;
  }
  .seg button.on{background:var(--accent); color:#fff;}
  select,input[type=text],input[type=number],input[type=url]{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font-size:13px; outline:none;
  }
  #wallbar{display:flex; align-items:center; gap:10px; padding:6px 14px; background:#15171b; border-bottom:1px solid #23262b; flex-wrap:nowrap; overflow:hidden; height:34px;}
  #wallbar .wlbl{color:var(--muted); font-size:12px;}
  #wallbar #wThick{width:52px; background:#0f1114; color:var(--fg); border:1px solid #2a2e34; border-radius:4px; padding:2px 4px;}
  #wallbar #wMsg{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;}
  #btnWallEdit.on{background:#26e0a8; color:#0b0d10;}
  #btnUnderlay.on{background:#3d8bfd; color:#fff;}
  #btnPT{background:#0f7a5a; color:#fff;}
  #loading3d{position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    gap:14px; background:rgba(16,18,21,.92); color:#cfd4dc; font-size:14px; letter-spacing:.5px;}
  #loading3d .spin{width:26px; height:26px; border:3px solid #333a45; border-top-color:#4c8dff;
    border-radius:50%; animation:spin3d .8s linear infinite;}
  @keyframes spin3d{to{transform:rotate(360deg)}}
  #photoBar{display:flex; align-items:center; gap:12px; padding:7px 16px; background:#241c3d; border-bottom:1px solid #3a2f5e; color:#cfc6f0; font-size:13px;}
  #photoModal{position:fixed; inset:0; background:rgba(8,9,12,.93); z-index:50; align-items:center; justify-content:center;}
  #photoOut{text-align:center; padding:20px;}
  #ptModal{position:fixed; inset:0; background:rgba(8,9,12,.72); z-index:60;
    align-items:center; justify-content:center;}
  #ptDlg{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px 16px; min-width:340px; box-shadow:0 18px 60px rgba(0,0,0,.55);}
  #ptDlg h3{font-size:14px; margin-bottom:14px;}
  #ptDlg .ptRow{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  #ptDlg .ptRow>label{font-size:12px; color:var(--muted); width:34px; flex:none;}
  #ptDlg .ptHint{font-size:11px; color:var(--muted); margin:0 0 12px 44px; line-height:1.5;}
  body.wall-editing #catalog, body.wall-editing #placedList, body.wall-editing #customForm{pointer-events:none; opacity:.4;}
  .wHit{cursor:pointer;} .pHit{cursor:pointer;}
  .wEnd,.pVert{cursor:grab;} .pMid{cursor:copy;}
  button.btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  button.btn:hover{border-color:var(--accent);}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.btn.danger{color:var(--danger);}
  .spacer{flex:1;}
  /* ---------- main layout ---------- */
  #main{flex:1; display:flex; min-height:0; position:relative;}
  #catalog{
    width:400px; min-width:240px; max-width:70vw;
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; position:relative;
  }
  #catalog.collapsed, #props.collapsed{display:none;}
  #catalog.collapsed + .splitter, .splitter.hidden{display:none;}
  /* 拖动改宽度的分隔条 */
  .splitter{width:6px; flex:none; cursor:col-resize; background:transparent; position:relative;}
  .splitter::after{content:''; position:absolute; left:2px; top:0; bottom:0; width:2px;
    background:var(--line); transition:background .12s;}
  .splitter:hover::after, .splitter.dragging::after{background:var(--accent);}
  /* 面板收起后留一条可点开的竖条 */
  .panelTab{width:24px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:none; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    color:var(--muted); font-size:11px; writing-mode:vertical-rl; letter-spacing:2px;}
  .panelTab:hover{color:var(--fg); background:#20242b;}
  .panelTab.show{display:flex;}
  #propsTab{border-right:none; border-left:1px solid var(--line);}
  .panelHead{display:flex; align-items:center; gap:8px; padding:8px 10px 0 10px;}
  .panelHead .ttl{font-size:12px; color:var(--muted); font-weight:600; flex:1;}
  .panelHead .xbtn{background:#20242b; border:1px solid var(--line); color:var(--muted);
    border-radius:5px; padding:2px 7px; font-size:11px; cursor:pointer;}
  .panelHead .xbtn:hover{color:var(--fg); border-color:var(--accent);}
  #catalog .search{padding:10px; border-bottom:1px solid var(--line);}
  #catalog .search input{width:100%;}
  #catList{flex:1; overflow-y:auto; padding-bottom:20px;}
  /* 卡片网格：挑家具靠的是看图，列表里塞小图根本挑不动 */
  .catGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:8px; padding:8px 10px 12px 10px;}
  .catCard{background:#1b1f26; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    transition:border-color .12s, transform .08s, background .12s;}
  .catCard:hover{border-color:var(--accent); background:#20252e; transform:translateY(-1px);}
  .catCard .ph{width:100%; aspect-ratio:4/3; background:#12151a center/contain no-repeat;
    border-bottom:1px solid var(--line);}
  .catCard .meta{padding:6px 8px 8px;}
  .catCard .nm2{font-size:12px; line-height:1.3; color:var(--fg);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .catCard .sub{font-size:10.5px; color:var(--muted); margin-top:3px;
    display:flex; justify-content:space-between; gap:6px;}
  .catCard .sub b{color:var(--accent2); font-weight:600; white-space:nowrap;}
  .catCard .sub b.builtin{color:var(--muted); font-weight:400;}
  .catGroup{border-bottom:1px solid var(--line);}
  .catGroup>h3{
    font-size:12px; color:var(--muted); padding:8px 12px; cursor:pointer; user-select:none;
    display:flex; justify-content:space-between; font-weight:600;
  }
  .catGroup>h3:hover{color:var(--text);}
  /* 收起/展开靠 .open。注意容器类名 v3.3 从 .items 改成了 .catGrid，
     这两条选择器当时漏改，分类就再也收不起来了。 */
  .catGroup .catGrid{display:none;}
  .catGroup.open .catGrid{display:grid;}
  .catGroup>h3 span{transition:transform .15s;}
  .catGroup.open>h3 span{transform:rotate(180deg);}
  .catItem{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer;
  }
  .catItem:hover{background:var(--panel2);}
  .catItem .sw{width:52px; height:42px; border-radius:6px; flex:none; border:1px solid rgba(255,255,255,.13);
    background-size:contain; background-repeat:no-repeat; background-position:center;}
  .catItem .sw.has{border-color:rgba(255,255,255,.09); background-color:rgba(255,255,255,.035);}
  .catItem .nm{font-size:12.5px; line-height:1.25;}
  .catItem .nm small{display:block; color:var(--muted); font-size:11px;}
  .catItem .price{margin-left:auto; font-size:11px; color:var(--accent2); flex:none;}
  #customForm{padding:10px 12px; border-top:1px solid var(--line); background:var(--panel);}
  #customForm h3{font-size:12px; color:var(--muted); margin-bottom:8px;}
  #customForm .row{display:flex; gap:6px; margin-bottom:6px;}
  #customForm input{width:100%; font-size:12px;}
  #customForm input[type=color]{width:40px; padding:2px; height:30px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;}
  /* ---------- canvas area ---------- */
  #stage{flex:1; position:relative; min-width:0; background:#101215;}
  #svg2d{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  #c3d{position:absolute; inset:0; width:100%; height:100%; display:none;}
  #hint{
    position:absolute; left:12px; bottom:10px; font-size:11.5px; color:var(--muted);
    background:rgba(23,25,29,.8); padding:6px 10px; border-radius:8px; pointer-events:none; line-height:1.6;
  }
  #totals{
    position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--text);
    background:rgba(23,25,29,.85); padding:8px 12px; border-radius:8px; border:1px solid var(--line);
  }
  #totals b{color:var(--accent2);}
  #refPhoto{
    position:absolute; right:12px; top:12px; width:230px; border:1px solid var(--line); border-radius:8px;
    display:none; z-index:15; box-shadow:0 4px 20px rgba(0,0,0,.5);
  }
  /* ---------- right props ---------- */
  #props{
    width:300px; min-width:220px; max-width:50vw;
    background:var(--panel); border-left:1px solid var(--line);
    padding:0 12px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;
  }
  #props h3{font-size:13px;}
  #props .muted{color:var(--muted); font-size:12px; line-height:1.6;}
  #props .field{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  #props .field label{width:58px; color:var(--muted); flex:none;}
  #props .field input{width:100%;}
  #props a{color:var(--accent); font-size:12px; word-break:break-all;}
  #placedList{border-top:1px solid var(--line); padding-top:8px;}
  #placedList h3{font-size:12px; color:var(--muted); margin-bottom:6px;}
  #placedList h3{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  #curBox{margin-left:auto; display:flex; align-items:center; gap:6px;}
  .seg.tiny button{padding:2px 7px; font-size:11px;}
  #fxBox{font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:3px;}
  #fxBox input{width:46px; padding:2px 4px; font-size:11px; background:#171a20; color:var(--fg);
    border:1px solid var(--line); border-radius:4px;}
  .plRow .plPrice{margin-left:auto; font-size:11px; color:var(--accent2); flex:none; padding-right:4px;}
  .plFixedHead{margin:9px 0 4px; padding-top:7px; border-top:1px dashed var(--line);
    font-size:10.5px; color:var(--muted);}
  .catItem .price.builtin{color:var(--muted); font-size:10px;}

  .plRow{display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 6px; border-radius:6px; cursor:pointer;}
  .plRow:hover,.plRow.sel{background:var(--panel2);}
  .plRow .dot{width:10px;height:10px;border-radius:3px;flex:none;}
  .plRow .x{margin-left:auto; color:var(--muted); cursor:pointer; padding:0 4px;}
  .plRow .x:hover{color:var(--danger);}
  /* svg styles */
  /* #calib 锁死旧版布局：校准输出必须逐字节不变，不能被侧栏宽度这类 UI 改动带偏。
     （v3.3 把目录面板从 270px 加宽到 400px，画布宽度一变整张图就位移了。） */
  body.calib #catalog{width:270px !important; min-width:0 !important; max-width:none !important;}
  body.calib #props{width:250px !important; min-width:0 !important; max-width:none !important; padding:12px !important;}
  body.calib .splitter, body.calib .panelTab, body.calib .panelHead{display:none !important;}
  body.calib #measSeg{display:none !important;}
  body.measuring #svg2d{cursor:crosshair;}
  body.measuring .furn{pointer-events:none;}
  .wall{stroke:#0c0d0f; stroke-linecap:butt;}
  .glass{stroke:#7fb8ff;}
  .roomlabel{fill:#8b929b; font-size:13px; text-anchor:middle;}
  .roomlabel tspan.dim{font-size:11px; fill:#6b727b;}
  .dimlabel{fill:#5d646e; font-size:9.5px; text-anchor:middle;}
  .furn{cursor:grab;}
  .furn.dragging{cursor:grabbing;}
  .furn text{pointer-events:none; user-select:none;}
  .rotHandle{cursor:crosshair; pointer-events:all;}
  #ctxDims{pointer-events:none;}
</style>
</head>
<body>
<div id="topbar">
  <div class="title">家具规划器<small id="titleSub">2室2卫 · v3.9</small></div>
  <div class="seg" id="viewSeg">
    <button id="btn2d" class="on">2D 平面</button>
    <button id="btnDoll">3D 俯瞰</button>
    <button id="btnFP">室内视角</button>
  </div>
  <div class="seg" id="lampSeg" style="display:none">
    <button id="lampOn" class="on">灯 开</button>
    <button id="lampOff">灯 关</button>
  </div>
  <div class="seg" id="dnSeg" style="display:none">
    <button id="dnDay" class="on">白天</button>
    <button id="dnNight">夜晚</button>
  </div>
  <button class="btn" id="btnWallEdit">编辑墙体</button>
  <div class="seg" id="measSeg"><button id="btnMeas">量尺寸</button><button id="btnMeasClr">清除</button></div>
  <div class="seg" id="unitSeg">
    <button data-u="cm" class="on">cm</button>
    <button data-u="ft">英尺</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnPT" style="display:none" title="GPU 路径追踪：真全局光照 / 真反射折射 / 真软阴影（慢）">光追渲染</button>
  <button class="btn" id="btnUnderlay" title="把官方 layout 图垫在矢量图下，便于对照/描图">底图对照</button>
  <button class="btn" id="btnRefPhoto">原户型图</button>
  <button class="btn" id="btnExport">导出图片</button>
  <button class="btn" id="btnSaveJson">导出布局</button>
  <button class="btn" id="btnLoadJson">导入布局</button>
  <input type="file" id="fileJson" accept=".json" style="display:none">
</div>
<div id="wallbar" style="display:none">
  <div class="seg" id="wtoolSeg">
    <button data-t="select" class="on">选择/调整</button>
    <button data-t="wall">画墙</button>
    <button data-t="poly">画柱/异形</button>
    <button data-t="door">加门</button>
  </div>
  <span id="doorCtl" style="visibility:hidden">
    <label class="wlbl">门宽 <input id="dWidth" type="number" min="10" max="400" step="1"> <span id="dwU">cm</span></label>
    <button class="btn" id="dEndBtn">端点：整体</button>
    <button class="btn" id="dKind">类型：平开</button>
    <button class="btn" id="dHinge">换铰链侧</button>
    <button class="btn" id="dSide">换开向</button>
    <button class="btn" id="dWood">深木色</button>
  </span>
  <select id="wType" title="墙类型">
    <option value="w">实墙</option><option value="g">玻璃/窗</option>
    <option value="d">门洞</option><option value="o">开口</option>
  </select>
  <label class="wlbl">厚 <input id="wThick" type="number" min="2" max="60" step="1" value="9"> cm</label>
  <button class="btn" id="wDelete">删除所选</button>
  <button class="btn" id="wRestore" title="恢复全部内置墙体到原始状态">重置内置</button>
  <button class="btn" id="wDone">完成</button>
  <span id="wMsg"></span>
</div>
<div id="photoBar" style="display:none"><span id="photoTxt">照片级渲染中…</span>
  <div style="flex:1"></div><button class="btn" id="photoCancel">取消</button></div>
<div id="photoModal" style="display:none"><div id="photoOut"></div></div>
<div id="ptModal" style="display:none"><div id="ptDlg">
  <h3>光线追踪渲染</h3>
  <div class="ptRow"><label>画质</label>
    <span class="seg" id="ptSeg">
      <button data-q="draft">草稿</button>
      <button data-q="normal" class="on">标准</button>
      <button data-q="fine">精细</button>
    </span>
  </div>
  <div class="ptHint" id="ptQInfo"></div>
  <div class="ptRow"><label>降噪</label>
    <span class="seg" id="ptDnSeg">
      <button id="ptDnOn" class="on">开</button>
      <button id="ptDnOff">关</button>
    </span>
    <span class="ptHint" style="margin:0">À-Trous 保边滤波，贴图细节不受影响</span>
  </div>
  <div class="ptRow" style="justify-content:flex-end; margin-top:14px; gap:10px">
    <button class="btn" id="ptCancel">取消</button>
    <button class="btn primary" id="ptGo">开始渲染</button>
  </div>
</div></div>
<div id="main">
  <div class="panelTab" id="catTab" title="展开家具目录">家具目录 ▸</div>
  <div id="catalog">
    <div class="panelHead"><span class="ttl">家具目录</span>
      <button class="xbtn" id="catCollapse" title="收起面板">收起 ◂</button></div>
    <div class="search"><input id="catSearch" type="text" placeholder="搜索家具（如 poang→POÄNG / 沙发）"></div>
    <div id="catList"></div>
    <div id="customForm">
      <h3>＋ 自定义家具（网上看中的）</h3>
      <div class="row"><input id="cfName" type="text" placeholder="名称，如 West Elm 沙发"></div>
      <div class="row">
        <input id="cfW" type="number" placeholder="宽 cm"><input id="cfD" type="number" placeholder="深 cm"><input id="cfH" type="number" placeholder="高 cm">
      </div>
      <div class="row">
        <input id="cfColor" type="color" value="#8a7d6b" title="颜色">
        <input id="cfImg" type="url" placeholder="图片URL（可选）">
        <button class="btn primary" id="cfAdd">添加</button>
      </div>
    </div>
  </div>
  <div class="splitter" id="splitL"></div>
  <div id="stage">
    <svg id="svg2d" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="c3d"></canvas>
    <img id="refPhoto" src="work/709_rot.jpg" alt="原户型图" onerror="this.style.opacity=.3" >
    <div id="hint">拖动=移动 · 圆点手柄/R键=旋转（按住Shift自由角度）· D=复制 · Delete=删除 · 滚轮=缩放 · 拖空白=平移<br>红色描边 = 与其他家具重叠</div>
    <div id="totals"></div>
    <div id="loading3d" style="display:none">
      <div class="spin"></div><span id="loadTxt">正在生成 3D 场景…</span>
    </div>
  </div>
  <div class="splitter" id="splitR"></div>
  <div id="props">
    <div class="panelHead"><span class="ttl">属性 / 清单</span>
      <button class="xbtn" id="propsCollapse" title="收起面板">收起 ▸</button></div>
    <h3 id="pTitle">未选中家具</h3>
    <div class="muted" id="pInfo">点击左侧目录添加家具；点击画布中的家具进行编辑。所有尺寸均为真实比例。</div>
    <div id="pFields" style="display:none; flex-direction:column; gap:8px;">
      <div class="field"><label>宽×深×高</label><span id="pDims" style="font-size:12px"></span></div>
      <div class="field"><label>旋转</label><input id="pRot" type="number" step="0.1" style="width:64px"> °
        <input id="pRotSlider" type="range" min="0" max="359.5" step="0.5" style="width:104px;vertical-align:middle">
        <button class="btn" id="pRot90" style="padding:2px 8px">+90°</button></div>
      <div class="field"><label>颜色</label><input id="pColor" type="color" style="width:50px;padding:2px;height:28px"></div>
      <div id="pLightRow" style="display:none">
        <div class="field"><label>色温</label>
          <input id="pCCT" type="range" min="2200" max="6500" step="100" style="width:110px">
          <span id="pCCTv" style="font-size:12px;width:52px;display:inline-block"></span></div>
        <div class="field"><label>亮度</label>
          <input id="pDim" type="range" min="5" max="300" step="5" style="width:110px">
          <span id="pDimv" style="font-size:12px;width:42px;display:inline-block"></span></div>
        <div id="cctBar" style="height:10px;border-radius:3px;margin:2px 0 6px;
          background:linear-gradient(90deg,#ff9e42,#ffcf9a,#fff4e6,#ffffff,#e8f0ff,#cfe0ff)"></div>

/* ---------- 预设布局 ---------- */
const mid = (a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const rotFromFront = (fx,fy)=> Math.atan2(-fx,fy)*180/Math.PI; // 物体正面(局部+y)朝向(fx,fy)
const PN = [-0.904,-0.427];        // 隔墙内法线（指向客厅）
const off = (p,n,l)=>[p[0]+n[0]*l, p[1]+n[1]*l];
const ROT_WALL = rotFromFront(PN[0],PN[1]);   // 背靠隔墙、面朝西北
const ROT_FACE = rotFromFront(-PN[0],-PN[1]); // 面朝隔墙(电视)

let state = {
  items: [],       // {uid, ref?, custom?{name,w,d,h,color,img}, x,y,rot, color?}
  customCat: [],   // 自定义目录
  unit: 'cm',
  view: '2d',
};
let uidSeq = 1;
const $ = s => document.querySelector(s);
function itemSpec(it){
  if(it.ref){ const c = CATALOG.find(c=>c.id===it.ref) || state.customCat.find(c=>c.id===it.ref);
    return c; }
  return it.custom;
}
function itemName(it){ const s=itemSpec(it); return s? s.name : '?'; }
/* 色温(K) → 线性 RGB（Tanner Helland 近似），用于灯光与灯具发光面 */
function cctToRGB(k){
  k=Math.max(1800,Math.min(7500,k))/100;
  let r,g,b;
  if(k<=66){ r=255; g=99.47*Math.log(k)-161.12; }
  else { r=329.7*Math.pow(k-60,-0.1332); g=288.12*Math.pow(k-60,-0.0755); }
  if(k>=66) b=255;
  else if(k<=19) b=0;
  else b=138.52*Math.log(k-10)-305.04;
  const cl=v=>Math.max(0,Math.min(255,v))/255;
  return new THREE.Color(cl(r),cl(g),cl(b));
}
function itemCCT(it){ const s=itemSpec(it)||{}; return it.cct || s.cct || 3000; }
function itemLum(it){ const s=itemSpec(it)||{}; return (it.lum || s.lum || 800) * (it.dim==null?1:it.dim); }
/* isLight = 固定在墙/天花上的灯具：公寓自带，不计价，走 furn3D 的灯具分支。
   hasLightCtl = 属性面板要不要给色温/亮度控件——可调光的落地灯（spec.dimmable）
   虽然要花钱买，但同样需要调光。 */
function isLight(spec){ return spec && ['downlight','ceilingLight','vanityLight','pendant'].includes(spec.kind); }
function hasLightCtl(spec){ return !!spec && (isLight(spec) || !!spec.dimmable); }
function itemColor(it){ return it.color || (itemSpec(it)||{}).color || '#8a7d6b'; }

const GEO_VERSION = 3; // 户型几何版本：旧版本存档坐标不兼容，自动放弃
// 注意：USERGEO 的 hiddenW/ovW/hiddenP/ovP 按 WALLS/FIXED 数组下标寻址——
// 以后改动内置几何条目顺序/增删时 bump 下方的 USERGEO_VERSION（与家具存档解耦，家具不受影响）。
function save(){
  try{ localStorage.setItem('planner_v1', JSON.stringify({geo:GEO_VERSION, items:state.items, customCat:state.customCat, unit:state.unit})); }catch(e){}
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem('planner_v1')); if(s && s.geo===GEO_VERSION && Array.isArray(s.items)){ state.items=s.items; state.customCat=s.customCat||[]; state.unit=s.unit||'cm';
    uidSeq = Math.max(0,...state.items.map(i=>i.uid),0)+1; return true; } }catch(e){}
  return false;
}
/* ---------- 用户自定义墙体/结构（画墙、改墙、柱与异形墙） ---------- */
let USERGEO = { walls:[], polys:[], doors:[], hiddenW:[], hiddenP:[], hiddenD:[], ovW:{}, ovP:{}, ovD:{} };
let showUnderlay = false;   // 底图对照：把官方 layout 垫在矢量下描图（普通/编辑模式均可用）
let geoDirty3D = false;
const USERGEO_VERSION = 1; // 内置几何条目顺序变动时 bump（与家具存档的 GEO_VERSION 解耦）
function saveGeo(){
  try{ localStorage.setItem('planner_userGeo_v1', JSON.stringify(Object.assign({geo:GEO_VERSION, uv:USERGEO_VERSION}, USERGEO))); }catch(e){}
}
function loadGeo(){
  try{ const s=JSON.parse(localStorage.getItem('planner_userGeo_v1'));
    if(s && s.geo===GEO_VERSION && s.uv===USERGEO_VERSION){
      const A=v=>Array.isArray(v)?v:[], O=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
      USERGEO={walls:A(s.walls), polys:A(s.polys).filter(p=>p&&Array.isArray(p.pts)), doors:A(s.doors),
               hiddenW:A(s.hiddenW), hiddenP:A(s.hiddenP), hiddenD:A(s.hiddenD), ovW:O(s.ovW), ovP:O(s.ovP), ovD:O(s.ovD)};
    } else if(s){ localStorage.removeItem('planner_userGeo_v1'); }
  }catch(e){ try{ localStorage.removeItem('planner_userGeo_v1'); }catch(_){} }
}
function geoChanged(){ geoDirty3D=true; saveGeo(); build2D(); if(typeof requestShadowUpdate==='function') requestShadowUpdate(); }
/* 有效几何：内置(扣除隐藏、应用覆盖) + 用户新增；CALIB 校准模式永远用纯净内置几何 */
function effWalls(){
  if(CALIB) return WALLS;
  const out=[];
  WALLS.forEach((s,i)=>{ if(USERGEO.hiddenW.includes(i)) return;
    const o=USERGEO.ovW[i];
    out.push(Object.assign({}, s, o||{}, {_src:'b', _i:i})); });
  USERGEO.walls.forEach((s,i)=>out.push(Object.assign({}, s, {_src:'u', _i:i})));
  return out;
}
function effFixed(){
  if(CALIB) return FIXED;
  const out=[];
  FIXED.forEach((f,i)=>{ if(USERGEO.hiddenP.includes(i)) return;
    const o=USERGEO.ovP[i];
    out.push(o?Object.assign({},f,{poly:o,_src:'b',_i:i}):Object.assign({},f,{_src:'b',_i:i})); });
  USERGEO.polys.forEach((p,i)=>out.push({name:'', poly:p.pts, fill:'#0c0d0f', _src:'u', _i:i}));
  return out;
}

}

   ===================================================================== */
const svg = $('#svg2d');
const NS = 'http://www.w3.org/2000/svg';
let S = 22;                 // px per ft（基准，viewBox 缩放）
let vb = {x:-1.5*S, y:-1*S, w: 56*S, h: 46*S};
let selected = null;
let gFurn=null, gSel=null, gMeas=null;

function el(n, attrs, parent){
  const e = document.createElementNS(NS,n);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function ptx(p){ return [p[0]*S, p[1]*S]; }
/* 2D 墙体多边形：每段 'w' 墙 → 中心线±半厚的矩形；端头若触到其他 'w' 墙或结构 FIXED 块，
   则沿轴向延长（延长量=对方半厚），使 T 型接头/转角在视觉上完全咬合（与 3D wallMesh 的 ext 同思路）。
   中心线与厚度不变，只做端头收口，不影响校准足迹。*/
function drawFixtures(root){

      EL(fx, cy, 1.6, 1.3, '#1b1f25');                        // 龙头/下水端
      LINE(fx-2.6, cy-3.2, fx+2.6, cy-3.2, 1.0);

function doorGeom(d){
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6;
  const H = d.hinge? [d.x2,d.y2] : [d.x1,d.y1];
  const T = d.hinge? [d.x1,d.y1] : [d.x2,d.y2];
  const n = [dy/L*d.side, -dx/L*d.side];          // 开向法线
  return {dx,dy,L,H,T,n,u:[dx/L,dy/L]};
}
const DOOR_MIN = 0.5;      // 门最小净宽(ft)，全局统一
const STUB_MIN = 0.18;     // 联动墙垛最短保留长度(ft)
const LINK_TOL = 0.5;      // 墙垛端点跟随容差(ft)：描摹几何实际误差可达 0.4ft
function doorLinkage(d, sel){
  // 只读解析（不写 override）；首次 apply() 时才 materialize，避免"只是点选就冻结内置几何"
  const dx0=d.x2-d.x1, dy0=d.y2-d.y1, L0=Math.hypot(dx0,dy0)||1e-6, u=[dx0/L0,dy0/L0];
  const ends=[[d.x1,d.y1],[d.x2,d.y2]];
  // 承载门洞段：取"最近的"且与门共线、覆盖门中点的 'd'/'o' 段
  let carrierRef=null, cBest=0.6;
  const dmx=(d.x1+d.x2)/2, dmy=(d.y1+d.y2)/2;
  for(const sg of effWalls()){
    if(sg.t!=='d' && sg.t!=='o') continue;
    const sdx=sg.x2-sg.x1, sdy=sg.y2-sg.y1, sl=Math.hypot(sdx,sdy)||1e-6;
    if(Math.abs((sdx/sl)*u[0]+(sdy/sl)*u[1])<0.85) continue;         // 必须近共线
    const dd=Math.hypot((sg.x1+sg.x2)/2-dmx,(sg.y1+sg.y2)/2-dmy);
    if(dd<cBest){ cBest=dd; carrierRef={src:sg._src,i:sg._i}; }
  }
  // 墙垛跟随：每个"墙端点"只归属最近的那个门端点，避免同一面墙被两端各写一次而压成零长
  const nbRefs=[[],[]];
  for(const sg of effWalls()){
    if(sg.t==='d'||sg.t==='o') continue;
    if(carrierRef && sg._src===carrierRef.src && sg._i===carrierRef.i) continue;
    const sl2=Math.hypot(sg.x2-sg.x1, sg.y2-sg.y1)||1e-6;
    const colin=Math.abs(((sg.x2-sg.x1)/sl2)*u[0]+((sg.y2-sg.y1)/sl2)*u[1]);
    if(colin<0.85) continue;      // 只有与门共线的墙垛才跟随；垂直/斜交墙不动（否则会被拉斜）
    for(const [ex,ey,eIdx] of [[sg.x1,sg.y1,1],[sg.x2,sg.y2,2]]){
      let bk=-1, bd=LINK_TOL;
      ends.forEach((p,k)=>{ const dd=Math.hypot(ex-p[0],ey-p[1]); if(dd<bd){bd=dd;bk=k;} });
      if(bk>=0) nbRefs[bk].push({src:sg._src, i:sg._i, end:eIdx,
        // 另一端（固定端）在门轴上的投影，用于计算可扩展上限
        oT:(()=>{ const ox=eIdx===1?sg.x2:sg.x1, oy=eIdx===1?sg.y2:sg.y1;
                  const cl=Math.abs(((sg.x2-sg.x1)/(Math.hypot(sg.x2-sg.x1,sg.y2-sg.y1)||1e-6))*u[0]
                                   +((sg.y2-sg.y1)/(Math.hypot(sg.x2-sg.x1,sg.y2-sg.y1)||1e-6))*u[1]);
                  return cl>0.7 ? (ox-d.x1)*u[0]+(oy-d.y1)*u[1] : null; })() });
    }
  }
  let mat=null;
  return {
    u, L0, ends,
    materialize(){
      if(mat) return mat;
      const rw=(r)=> r.src==='b' ? ensureOvW(r.i) : USERGEO.walls[r.i];
      const dObj = sel.src==='b' ? ensureOvD(sel.i) : USERGEO.doors[sel.i];
      const undo=[[dObj, Object.assign({},dObj)]];
      const push=(o)=>{ if(o && !undo.some(z=>z[0]===o)) undo.push([o, Object.assign({},o)]); };
      const carrier = carrierRef ? rw(carrierRef) : null; push(carrier);
      const nb=[[],[]];
      nbRefs.forEach((arr,k)=>arr.forEach(r=>{ const w=rw(r); if(!w) return;
        // 记录该端点原始坐标：apply 时按"门端点位移量"增量平移，保留描摹几何的原始相对关系
        nb[k].push([w, r.end, r.end===1?w.x1:w.x2, r.end===1?w.y1:w.y2]); push(w); }));
      mat={dObj,carrier,nb,undo};
      return mat;
    },
    // 端 k 沿 ±u 允许移动的范围（保证联动墙垛不被压成负长度/翻转）
    range(k){
      const t0 = k===0 ? 0 : L0;                       // 当前端点在门轴上的参数
      let lo=-40, hi=40;
      for(const r of nbRefs[k]){

        if(r.oT <= t0){ lo=Math.max(lo, (r.oT+STUB_MIN)-t0); }   // 垛在该端之前
        else          { hi=Math.min(hi, (r.oT-STUB_MIN)-t0); }   // 垛在该端之后
      }
      return [Math.min(lo,0), Math.max(hi,0)];   // 必须包含 0：否则夹取会把门推向反方向
    },
    apply(nx1,ny1,nx2,ny2){
      const m=this.materialize();
      m.dObj.x1=nx1; m.dObj.y1=ny1; m.dObj.x2=nx2; m.dObj.y2=ny2;
      if(m.carrier){ m.carrier.x1=nx1; m.carrier.y1=ny1; m.carrier.x2=nx2; m.carrier.y2=ny2; }
      const d0=[nx1-ends[0][0], ny1-ends[0][1]], d1=[nx2-ends[1][0], ny2-ends[1][1]];
      for(const [r,e,ox,oy] of m.nb[0]){ if(e===1){r.x1=ox+d0[0];r.y1=oy+d0[1];} else {r.x2=ox+d0[0];r.y2=oy+d0[1];} }
      for(const [r,e,ox,oy] of m.nb[1]){ if(e===1){r.x1=ox+d1[0];r.y1=oy+d1[1];} else {r.x2=ox+d1[0];r.y2=oy+d1[1];} }

    rollback(){ if(mat) for(const [r,o] of mat.undo) Object.assign(r,o); }
  };
}
function bifoldZig(d){ // 半开折叠门：返回 4 块板的线段 [[p1,p2],...]
  const g=doorGeom(d), a=[d.x1,d.y1], u=g.u, n=g.n;
  const Lq=g.L/4, c=Math.cos(0.9), sn=Math.sin(0.9); // 每板折 ~52°
  const segs=[];
  // 左侧对（从 x1 端向中间折）
  const N0=a, N1=[a[0]+(u[0]*c+n[0]*sn)*Lq, a[1]+(u[1]*c+n[1]*sn)*Lq];
  const N2=[a[0]+u[0]*2*Lq*c, a[1]+u[1]*2*Lq*c];
  segs.push([N0,N1],[N1,N2]);
  // 右侧对（从 x2 端向中间折）
  const b=[d.x2,d.y2];
  const M1=[b[0]+(-u[0]*c+n[0]*sn)*Lq, b[1]+(-u[1]*c+n[1]*sn)*Lq];
  const M2=[b[0]-u[0]*2*Lq*c, b[1]-u[1]*2*Lq*c];
  segs.push([b,M1],[M1,M2]);
  return segs;
}
function drawDoorSymbol(d, root){
  const g=doorGeom(d);
  const leafCol = d.wood? '#8a5a33' : '#e2ded4';
  if(d.kind==='slide'){
    // 错位双板
    const a=[d.x1,d.y1], u=g.u, n=g.n;
    const seg=(t0,t1s,o)=>{
      const p1=[a[0]+u[0]*g.L*t0+n[0]*o, a[1]+u[1]*g.L*t0+n[1]*o];
      const p2=[a[0]+u[0]*g.L*t1s+n[0]*o, a[1]+u[1]*g.L*t1s+n[1]*o];
      el('line',{x1:p1[0]*S,y1:p1[1]*S,x2:p2[0]*S,y2:p2[1]*S,stroke:leafCol,'stroke-width':3.2,'stroke-linecap':'butt'},root);
    };
    seg(0,0.52,0.09); seg(0.06,0.58,-0.09);   // 半开：外扇滑到内扇上，右侧开口
    return;
  }
  if(d.kind==='bifold'){
    for(const seg of bifoldZig(d)){
      el('path',{d:`M ${seg[0][0]*S} ${seg[0][1]*S} L ${seg[1][0]*S} ${seg[1][1]*S}`,
        fill:'none',stroke:leafCol,'stroke-width':2.6,'stroke-linejoin':'miter'},root);
    }
    return;
  }
  const HALF=Math.PI/4; // 半开 45°
  const arc=(H,T,side)=>{
    const vx=T[0]-H[0], vy=T[1]-H[1], L=Math.hypot(vx,vy);
    const c=Math.cos(HALF), sn=Math.sin(HALF);
    const tip=[H[0]+vx*c+vy*side*sn, H[1]+vy*c-vx*side*sn];  // 45° 半开门扇
    el('line',{x1:H[0]*S,y1:H[1]*S,x2:tip[0]*S,y2:tip[1]*S,stroke:leafCol,'stroke-width':3,'stroke-linecap':'butt'},root);
    const sweep = side>0 ? 1 : 0;
    el('path',{d:`M ${tip[0]*S} ${tip[1]*S} A ${L*S} ${L*S} 0 0 ${sweep} ${T[0]*S} ${T[1]*S}`,
      fill:'none',stroke:'#8b929b','stroke-width':1,'stroke-dasharray':'3 3'},root);
  };
  if(d.kind==='double'){
    const m=[(d.x1+d.x2)/2,(d.y1+d.y2)/2];
    arc([d.x1,d.y1], m, d.side);
    arc([d.x2,d.y2], m, -d.side);
  } else {
    arc(g.H, g.T, d.hinge? -d.side : d.side);
  }
}
function wallPolys(){
  const ww = effWalls().filter(s=>s.t==='w').map(s=>{
    const dx=s.x2-s.x1, dy=s.y2-s.y1, L=Math.hypot(dx,dy);
    return L<0.01?null:{s,L,ux:dx/L,uy:dy/L,half:(s.wd||6.5)/2/S};
  }).filter(Boolean);
  const structs = effFixed().filter(f=>f.fill==='#0c0d0f'||f.fill==='#15171a').map(f=>f.poly);
  const distSeg=(px,py,w)=>{
    let t=(px-w.s.x1)*w.ux+(py-w.s.y1)*w.uy; t=Math.max(0,Math.min(w.L,t));
    return Math.hypot(px-(w.s.x1+w.ux*t), py-(w.s.y1+w.uy*t));
  };
  const nearPoly=(px,py,poly)=>{
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if((yi>py)!==(yj>py) && px<(xj-xi)*(py-yi)/(yj-yi)+xi) inside=!inside;
      const dx=xj-xi,dy=yj-yi,l=Math.hypot(dx,dy)||1;
      let t=((px-xi)*dx+(py-yi)*dy)/(l*l); t=Math.max(0,Math.min(1,t));
      if(Math.hypot(px-(xi+dx*t), py-(yi+dy*t))<0.12) return true;
    }
    return inside;
  };
  return ww.map(w=>{
    const ends=[[w.s.x1,w.s.y1],[w.s.x2,w.s.y2]], ext=[0,0], mit=[null,null];
    ends.forEach((p,k)=>{
      let e=0, endPartner=null, nEnd=0, bodyTouch=false;
      for(const o of ww){
        if(o===w) continue;
        const de=Math.min(Math.hypot(p[0]-o.s.x1,p[1]-o.s.y1), Math.hypot(p[0]-o.s.x2,p[1]-o.s.y2));
        if(de<0.08){ nEnd++; endPartner=o; }
        else if(distSeg(p[0],p[1],o) < o.half+0.03){
          bodyTouch=true;
          // T型口：延长到恰好抵达对方远侧面（端点若不在对方中线上，固定延长 o.half 会越出对方外皮）
          const dirOut=[(k===0?w.s.x1-w.s.x2:w.s.x2-w.s.x1)/w.L, (k===0?w.s.y1-w.s.y2:w.s.y2-w.s.y1)/w.L];
          const uox=(o.s.x2-o.s.x1)/o.L, uoy=(o.s.y2-o.s.y1)/o.L;
          const den=dirOut[0]*uoy-dirOut[1]*uox;
          let ee=o.half;
          if(Math.abs(den)>0.35){
            const t=((o.s.x1-p[0])*uoy-(o.s.y1-p[1])*uox)/den;   // 轴向到对方中线
            // 斜交时端头矩形的横向半宽会斜着冒出对面外皮，需扣除其投影
            const reach=(o.half - w.half*Math.sqrt(Math.max(0,1-den*den)))/Math.abs(den);
            ee=Math.max(0, Math.min(t + reach, o.half*1.5));
          }
          e=Math.max(e,ee);
        }
      }
      if(endPartner && nEnd===1 && !bodyTouch){
        // 端对端墙角：真斜接。把角点两侧的边界线求交，消除轴向延长造成的外鼓台阶
        const B=endPartner;
        const dirA=[(k===0?w.s.x1-w.s.x2:w.s.x2-w.s.x1)/w.L, (k===0?w.s.y1-w.s.y2:w.s.y2-w.s.y1)/w.L];
        const bAtStart=Math.hypot(p[0]-B.s.x1,p[1]-B.s.y1)<Math.hypot(p[0]-B.s.x2,p[1]-B.s.y2);
        const dirB=[(bAtStart?B.s.x1-B.s.x2:B.s.x2-B.s.x1)/B.L, (bAtStart?B.s.y1-B.s.y2:B.s.y2-B.s.y1)/B.L];
        const crossAB=dirA[0]*dirB[1]-dirA[1]*dirB[0];
        if(Math.abs(crossAB)>0.08){
          const nA=[-dirA[1],dirA[0]], nB=[-dirB[1],dirB[0]];
          const corners=[];
          for(const sA of [1,-1]){
            let best=null;
            for(const sB of [1,-1]){
              const rx=sB*nB[0]*B.half-sA*nA[0]*w.half, ry=sB*nB[1]*B.half-sA*nA[1]*w.half;
              const t=(rx*dirB[1]-ry*dirB[0])/crossAB;
              const X=[p[0]+sA*nA[0]*w.half+t*dirA[0], p[1]+sA*nA[1]*w.half+t*dirA[1]];
              const d=Math.hypot(X[0]-p[0],X[1]-p[1]);
              if(!best||d<best.d) best={X,d};
            }
            corners.push(best);
          }
          const lim=3*Math.max(w.half,B.half)+0.2;
          if(corners[0].d<lim && corners[1].d<lim){ mit[k]=[corners[0].X,corners[1].X]; return; }
        }
        e=Math.max(e,B.half); // 近共线或超限：回退轴向延长
      } else if(endPartner){ e=Math.max(e,endPartner.half); }
      for(const poly of structs) if(nearPoly(p[0],p[1],poly)) e=Math.max(e,0.05); // 结构块只需微量咬合，不可越出其外缘
      ext[k]=e;
    });
    const nx=-w.uy, ny=w.ux;
    let a1,a2,b1,b2;
    if(mit[0]){ a1=mit[0][1]; a2=mit[0][0]; } // 端0的 dirA=-u：sA=+1 对应 -n 侧
    else{ const ax=ends[0][0]-w.ux*ext[0], ay=ends[0][1]-w.uy*ext[0];
      a1=[ax+nx*w.half,ay+ny*w.half]; a2=[ax-nx*w.half,ay-ny*w.half]; }
    if(mit[1]){ b1=mit[1][0]; b2=mit[1][1]; }
    else{ const bx=ends[1][0]+w.ux*ext[1], by=ends[1][1]+w.uy*ext[1];
      b1=[bx+nx*w.half,by+ny*w.half]; b2=[bx-nx*w.half,by-ny*w.half]; }
    return [a1,b1,b2,a2];
  });
}

function build2D(){
  svg.innerHTML='';
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const root = el('g',{id:'root'},svg);
  if(CALIB || showUnderlay){
    el('image',{href:CAL.img, x:0,y:0,width:CAL.w,height:CAL.h,opacity:IMGONLY?1:(CALIB?0.6:0.55),
      transform:`scale(${S/SC} ${S/SC})`},root);
  }
  if(IMGONLY){ gFurn = el('g',{id:'furn'},root); gSel = el('g',{id:'ctxDims'},root); gMeas = el('g',{id:'meas'},root); return; }
  // 地板底
  const floorPts = FLOORPTS.map(p=>ptx(p).join(',')).join(' ');
  el('polygon',{points:floorPts, fill:CALIB?'rgba(40,120,255,0.15)':(showUnderlay?'rgba(29,32,37,0.4)':'#221d1a'), stroke:CALIB?'#ff3355':'none','stroke-width':CALIB?2:0},root);
  // 阳台
  el('polygon',{points:PATIO.map(p=>ptx(p).join(',')).join(' '), fill:showUnderlay?'rgba(24,27,31,0.45)':'#181b1f', stroke:'#33383f','stroke-width':1.5},root);
  // 地板纹理线（简单斜线；底图对照时隐藏以免干扰描图）
  const clip = el('clipPath',{id:'floorClip'},root);
  el('polygon',{points:floorPts},clip);
  const gTex = el('g',{'clip-path':'url(#floorClip)',opacity:showUnderlay?0:.25},root);
  for(let i=-20;i<70;i++){
    el('line',{x1:i*S*1.2, y1:-5*S, x2:(i*1.2-18)*S, y2:50*S, stroke:'#2a2e34','stroke-width':1},gTex);
  }
  // 固定物件
  for(const f of effFixed()){
    if(CALIB && f.noCal) continue;   // 新增厨房设备等不进校准视图
    const structural = f.fill==='#0c0d0f' || f.fill==='#15171a';
    el('polygon',{points:f.poly.map(p=>ptx(p).join(',')).join(' '), fill:(CALIB&&!structural)?'none':f.fill, stroke:(CALIB&&!structural)?'#9aa0a8':'#41464e','stroke-width':1},root);
    if(f.name){ const c=f.poly.reduce((a,p)=>[a[0]+p[0]/f.poly.length,a[1]+p[1]/f.poly.length],[0,0]);
      el('text',{x:c[0]*S,y:c[1]*S+3,class:'dimlabel','font-size':9},root).textContent=f.name; }
  }
  // 中岛
  el('path',{d:islandPath(S), fill:CALIB?'none':'#4a4640', stroke:CALIB?'#4a5058':'#6b655d','stroke-width':1.5},root);
  const ilb=C(276,226);
  el('text',{x:ilb[0]*S, y:ilb[1]*S, class:'dimlabel','font-size':10},root).textContent =
    CALIB ? '中岛 7\'×2\'2"' : ('中岛 '+fmtLen2(7, 2+2/12));
  // 内部示意墙
  for(const s of INNER) el('line',{x1:s.x1*S,y1:s.y1*S,x2:s.x2*S,y2:s.y2*S,stroke:'#2c3037','stroke-width':3},root);
  // 墙：实心矩形 + 端头封口（触到其他墙/结构块的端头延长进对方体内，消除 T 口豁缝与转角台阶）
  for(const q of wallPolys()){
    el('polygon',{points:q.map(p=>(p[0]*S)+','+(p[1]*S)).join(' '), fill:'#0c0d0f',
      'fill-opacity':showUnderlay?0.72:1},root);
  }
  for(const s of effWalls()){
    if(s.t!=='g') continue;
    el('line',{x1:s.x1*S,y1:s.y1*S,x2:s.x2*S,y2:s.y2*S,class:'glass','stroke-width':s.wd||3.5},root);
    el('line',{x1:s.x1*S,y1:s.y1*S,x2:s.x2*S,y2:s.y2*S,stroke:'#cfe6ff','stroke-width':1},root);
  }
  if(!CALIB) drawFixtures(root);
  // 西北落地窗带钢梁位置（黑方块示意）
  if(!CALIB){
    const BD=[C(131.13,161.31),C(88,226),C(85.2,229.78),C(71,249),C(63,267)];
    const sl=[]; let tt=0;
    for(let i=0;i<BD.length-1;i++){ const L=Math.hypot(BD[i+1][0]-BD[i][0],BD[i+1][1]-BD[i][1]); sl.push(L); tt+=L; }
    for(const f of [0.205,0.445,0.715]){
      let r=tt*f, p=BD[BD.length-1];
      for(let i=0;i<sl.length;i++){ if(r<=sl[i]){ const t=r/sl[i];
        p=[BD[i][0]+(BD[i+1][0]-BD[i][0])*t, BD[i][1]+(BD[i+1][1]-BD[i][1])*t]; break; } r-=sl[i]; }
      el('rect',{x:p[0]*S-2.6,y:p[1]*S-2.6,width:5.2,height:5.2,fill:'#17181b',stroke:'#3c4046','stroke-width':0.8},root);
    }
  }
  // 门扇符号（平开=门扇+摆弧；双开=对开两扇；推拉=错位双板）
  for(const d of effDoors()) drawDoorSymbol(d, root);
  // 房间标签
  for(const L of LABELS){
    const lx=L.p[0]*S, ly=L.p[1]*S;
    const t = el('text',{x:lx,y:ly,class:'roomlabel',fill:L.small?'#6b727b':'#8b929b',
      'font-size':L.small?9:13, transform:`rotate(${L.rot} ${lx} ${ly})`},root);
    const t1=el('tspan',{x:lx,dy:0},t); t1.textContent=L.t;
    const dtxt = (CALIB ? (L.d || '') : (L.wd ? fmtLen2(L.wd, L.dp) : (L.d || '')));
    if(dtxt){ const t2=el('tspan',{x:lx,dy:14,class:'dim'},t); t2.textContent=dtxt; }
  }
  for(const D of DIMTXT){
    el('text',{x:D.p[0]*S,y:D.p[1]*S,class:'dimlabel',transform:`rotate(${D.rot} ${D.p[0]*S} ${D.p[1]*S})`},root).textContent=D.t;
  }
  // 家具层
  gFurn = el('g',{id:'furn'},root);
  gSel = el('g',{id:'ctxDims'},root);
  gEdit = el('g',{id:'wedit'},root);
  gMeas = el('g',{id:'meas'},root);
  drawMeasure();
  drawWallEdit();
  drawFurniture();
}

function furnShape(it, spec){
  const wf=cm2ft(spec.w), df=cm2ft(spec.d);
  const g = el('g',{class:'furn','data-uid':it.uid});
  const col = itemColor(it);
  const kind = spec.kind||'box';
  const wp=wf*S, dp=df*S;
  const body = el('g',{},g);
  const R = (x,y,w,h,rx,fill,extra)=>el('rect',Object.assign({x:x*S,y:y*S,width:w*S,height:h*S,rx:rx,fill:fill},extra||{}),body);
  const isRug = kind==='rug';
  // 灯具：用照明平面图常用符号，并按色温着色
  if(isLight(spec)){
    const cc=cctToRGB(itemCCT(it)), hex='#'+cc.getHexString();
    const r=wp/2;
    if(kind==='downlight'){
      el('circle',{cx:0,cy:0,r:r,fill:hex,'fill-opacity':.30,stroke:hex,'stroke-width':1.4},body);
      el('line',{x1:-r,y1:0,x2:r,y2:0,stroke:hex,'stroke-width':1},body);
      el('line',{x1:0,y1:-r,x2:0,y2:r,stroke:hex,'stroke-width':1},body);
    } else if(kind==='ceilingLight'){
      el('circle',{cx:0,cy:0,r:r,fill:hex,'fill-opacity':.26,stroke:hex,'stroke-width':1.6},body);
      el('circle',{cx:0,cy:0,r:r*0.55,fill:'none',stroke:hex,'stroke-width':1},body);
      for(let a=0;a<8;a++){ const t=a*Math.PI/4;
        el('line',{x1:Math.cos(t)*r*0.6,y1:Math.sin(t)*r*0.6,x2:Math.cos(t)*r,y2:Math.sin(t)*r,stroke:hex,'stroke-width':.8},body); }
    } else if(kind==='vanityLight'){
      el('rect',{x:-wp/2,y:-dp/2,width:wp,height:dp,rx:2,fill:hex,'fill-opacity':.26,stroke:hex,'stroke-width':1.3},body);
      const n=spec.w>75?4:3;
      for(let i=0;i<n;i++) el('circle',{cx:-wp/2+wp*(i+.5)/n,cy:0,r:Math.min(dp,wp/n)*0.30,fill:hex,'fill-opacity':.75},body);
    } else {
      el('circle',{cx:0,cy:0,r:r,fill:hex,'fill-opacity':.28,stroke:hex,'stroke-width':1.5},body);
      el('circle',{cx:0,cy:0,r:r*0.3,fill:hex,'fill-opacity':.8},body);
      for(let a=0;a<4;a++){ const t=a*Math.PI/2+Math.PI/4;
        el('line',{x1:Math.cos(t)*r,y1:Math.sin(t)*r,x2:Math.cos(t)*r*1.5,y2:Math.sin(t)*r*1.5,stroke:hex,'stroke-width':.9},body); }
    }
    const lb=el('text',{x:0,y:dp/2+9,'text-anchor':'middle','font-size':8,fill:hex,'pointer-events':'none'},body);
    lb.textContent=itemCCT(it)+'K';
    return g;
  }
  if(kind==='playMat'){
    R(-wf/2,-df/2,wf,df,5,col,{stroke:'rgba(0,0,0,.35)','stroke-width':1.2});
    R(-wf/2+.12,-df/2+.12,wf-.24,df-.24,4,'rgba(255,255,255,.10)');
    el('line',{x1:0,y1:-dp/2+3,x2:0,y2:dp/2-3,stroke:'rgba(0,0,0,.28)','stroke-width':1.4,'stroke-dasharray':'6 4'},body);
  } else
  // 新品类 2D 俯视图例
  if(['shelf','crib','cart','deskSitStand','swivelChair','playCouch','tableFold','tableDrawer'].includes(kind)){
    const dk2='rgba(0,0,0,.30)', lt2='rgba(255,255,255,.22)';
    if(kind==='shelf'){
      R(-wf/2,-df/2,wf,df,2,col,{stroke:'rgba(0,0,0,.45)','stroke-width':1.2});
      const cols=Math.max(1,Math.round(wf/cm2ft(39)));
      for(let c=1;c<cols;c++) el('line',{x1:(-wf/2+wf*c/cols)*S,y1:-dp/2,x2:(-wf/2+wf*c/cols)*S,y2:dp/2,stroke:dk2,'stroke-width':1},body);
    } else if(kind==='crib'){
      R(-wf/2,-df/2,wf,df,3,col,{stroke:'rgba(0,0,0,.45)','stroke-width':1.4});
      R(-wf/2+.18,-df/2+.18,wf-.36,df-.36,2,'rgba(255,255,255,.30)');
      const n=Math.round(wf/cm2ft(7));
      for(let i=1;i<n;i++){ const x=(-wf/2+wf*i/n)*S;
        el('line',{x1:x,y1:-dp/2,x2:x,y2:-dp/2+3.5,stroke:dk2,'stroke-width':.9},body);
        el('line',{x1:x,y1:dp/2-3.5,x2:x,y2:dp/2,stroke:dk2,'stroke-width':.9},body); }
    } else if(kind==='cart'){
      R(-wf/2,-df/2,wf,df,2,col,{stroke:'rgba(0,0,0,.45)','stroke-width':1.2});
      R(-wf/2+.1,-df/2+.1,wf-.2,df-.2,1.5,'rgba(0,0,0,.18)');
      el('line',{x1:-wp/2,y1:-dp/2+2,x2:wp/2,y2:-dp/2+2,stroke:lt2,'stroke-width':2},body);
    } else if(kind==='deskSitStand'){
      R(-wf/2,-df/2,wf,df,2,col,{stroke:'rgba(0,0,0,.45)','stroke-width':1.2});
      for(const sx of [-1,1]) R(sx*(wf/2-cm2ft(20))-cm2ft(3), -df/2+cm2ft(8), cm2ft(6), df-cm2ft(16), 1, dk2);
    } else if(kind==='swivelChair'){
      el('circle',{cx:0,cy:0,r:wp*0.46,fill:col,stroke:'rgba(0,0,0,.4)','stroke-width':1.2},body);
      for(let i=0;i<5;i++){ const a=i*Math.PI*2/5+Math.PI/2;
        el('line',{x1:0,y1:0,x2:Math.cos(a)*wp*0.5,y2:Math.sin(a)*wp*0.5,stroke:dk2,'stroke-width':1.4},body); }
      el('path',{d:`M ${-wp*0.42} ${-dp*0.28} A ${wp*0.44} ${wp*0.44} 0 0 1 ${wp*0.42} ${-dp*0.28}`,
        fill:'none',stroke:dk2,'stroke-width':3.2},body);
    } else if(kind==='playCouch'){
      R(-wf/2,-df/2,wf,df,4,col,{stroke:'rgba(0,0,0,.4)','stroke-width':1.2});
      R(-wf/2+.08,-df/2+.08,wf-.16,cm2ft(20),3,'rgba(0,0,0,.20)');
      el('line',{x1:0,y1:-dp/2+8,x2:0,y2:dp/2,stroke:lt2,'stroke-width':1.4},body);
    } else {   // tableFold / tableDrawer
      R(-wf/2,-df/2,wf,df,2,col,{stroke:'rgba(0,0,0,.45)','stroke-width':1.2});
      for(let i=1;i<6;i++) el('line',{x1:-wp/2,y1:-dp/2+dp*i/6,x2:wp/2,y2:-dp/2+dp*i/6,stroke:'rgba(0,0,0,.10)','stroke-width':.8},body);
      if(kind==='tableDrawer') R(-Math.min(wf*0.21,cm2ft(23)), df/2-cm2ft(4), Math.min(wf*0.42,cm2ft(46)), cm2ft(3), 1, dk2);
    }
  } else
  // 主体
  if(kind==='tableRound' || (kind==='sideTable' && spec.w===spec.d && spec.w>=60)){
    el('circle',{cx:0,cy:0,r:wp/2,fill:col,stroke:'rgba(0,0,0,.4)','stroke-width':1.2},body);
  } else {
    R(-wf/2,-df/2,wf,df, isRug?3:4, col, {stroke:'rgba(0,0,0,.45)','stroke-width':isRug?0.8:1.2, opacity:isRug?0.82:1});
  }
  // 细节
  const dk='rgba(0,0,0,.22)', lt='rgba(255,255,255,.28)';
  if(kind==='sofa'){
    R(-wf/2+.08,-df/2+.08, wf-.16, df*.28, 3, dk);            // 靠背
    R(-wf/2+.08,-df/2, .55, df, 3, dk);                        // 扶手
    R(wf/2-.63,-df/2, .55, df, 3, dk);
    el('line',{x1:0,y1:(-df/2+df*.3)*S,x2:0,y2:df/2*S,stroke:'rgba(0,0,0,.25)','stroke-width':1},body); // 坐垫分缝
  } else if(kind==='sofaL'){
    R(-wf/2+.08,-df/2+.08, wf-.16, df*.2,3, dk);
    R(wf/2-cm2ft(78), -df/2+df*.2, cm2ft(78), df*.8-.08, 3, 'rgba(0,0,0,.12)'); // 贵妃位
  } else if(kind==='bed'){
    R(-wf/2+.12,-df/2+.55, wf-.24, df-.7, 3, 'rgba(255,255,255,.5)');           // 床垫
    R(-wf/2+.28,-df/2+.75, wf*.42-.3, 1.05, 2, lt);                              // 枕头
    R(.02,-df/2+.75, wf*.42-.3, 1.05, 2, lt);
    R(-wf/2+.12, df/2-2.6, wf-.24, 2.2, 2, 'rgba(120,140,170,.35)');            // 被子
  } else if(kind==='armchair'){
    R(-wf/2+.06,-df/2+.06, wf-.12, df*.3, 3, dk);
  } else if(kind==='chair'||kind==='officeChair'||kind==='stool'){
    if(kind!=='stool') R(-wf/2+.05,-df/2+.05, wf-.1, df*.25, 2, dk);
  } else if(kind==='tvBench'){
    R(-Math.min(wf-.3,4.8)/2, -df/2-.12, Math.min(wf-.3,4.8), .14, 0, '#111');  // 电视(壁挂示意在柜后)
  } else if(kind==='desk'){
    R(-wf/2+.15, -df/2+.15, 1.5, df-.5, 2, dk); // 显示器示意
  } else if(kind==='climber'){                                  // 爬爬架：外框 + 横档示意
    R(-wf/2+.08,-df/2+.08, wf-.16, df-.16, 3, 'rgba(0,0,0,.10)');
    const nR=Math.max(3, Math.min(9, Math.round(wf/1.3)));
    for(let i=1;i<nR;i++){
      const x=(-wf/2 + wf*i/nR)*S;
      el('line',{x1:x,y1:-dp/2+4,x2:x,y2:dp/2-4,stroke:'rgba(0,0,0,.28)','stroke-width':1.1},body);
    }
    el('line',{x1:-wp/2+3,y1:-dp/2+3,x2:wp/2-3,y2:dp/2-3,stroke:'rgba(0,0,0,.20)','stroke-width':1},body);
    el('line',{x1:-wp/2+3,y1:dp/2-3,x2:wp/2-3,y2:-dp/2+3,stroke:'rgba(0,0,0,.20)','stroke-width':1},body);
  } else if(kind==='dresser'||kind==='nightstand'||kind==='bookcase'||kind==='shoeCab'){
    el('line',{x1:-wp/2+3,y1:0,x2:wp/2-3,y2:0,stroke:dk,'stroke-width':1},body);
  } else if(kind==='lamp'){
    el('circle',{cx:0,cy:0,r:wp/2,fill:'none',stroke:col,'stroke-width':2},body);
    el('circle',{cx:0,cy:0,r:2.5,fill:col},body);
  }
  // 自定义图片
  if(spec.img){
    el('image',{href:spec.img, x:-wp/2, y:-dp/2, width:wp, height:dp, preserveAspectRatio:'xMidYMid slice', opacity:.9},body);
  }
  // 标签（旋转过半时反转，保证文字不倒置）
  if(!isRug && wf>1.6){
    const r=((it.rot%360)+360)%360;
    const t = el('text',{x:0,y:3,'text-anchor':'middle','font-size':Math.min(10, wp/6),fill:'rgba(255,255,255,.85)',
      transform:(r>90&&r<270)?'rotate(180)':''},g);
    t.textContent = (spec.name||'').split(' ')[0];
  }
  return g;
}

function drawFurniture(){
  if(!gFurn) return;
  gFurn.innerHTML=''; gSel.innerHTML='';
  // 地毯先画
  const layer = (it)=>{ const sp=itemSpec(it)||{};
    if(sp.kind==='rug') return 0;                  // 地毯最底
    if(isLight(sp)) return 2;                      // 灯具永远最上层
    return 1; };
  const sorted = [...state.items].sort((a,b)=>layer(a)-layer(b));
  const boxes = [];
  for(const it of sorted){
    const spec = itemSpec(it); if(!spec) continue;
    const g = furnShape(it, spec);
    g.setAttribute('transform',`translate(${it.x*S} ${it.y*S}) rotate(${it.rot})`);
    gFurn.appendChild(g);
    boxes.push({it, spec});
  }
  // 重叠检测
  for(let i=0;i<boxes.length;i++){
    const a=boxes[i]; if((a.spec.kind==='rug')) continue;
    let hit=false;
    const tuck=(x,y)=>['chair','stool','officeChair'].includes(x)&&['tableRound','tableRect','desk','coffeeTable'].includes(y);
    for(let j=0;j<boxes.length;j++){
      if(i===j) continue; const b=boxes[j];
      if(b.spec.kind==='rug') continue;
      if(tuck(a.spec.kind,b.spec.kind)||tuck(b.spec.kind,a.spec.kind)) continue;
      if(!vOverlap(a.spec,b.spec)) continue;      // 高度不重叠（如吸顶灯 vs 矮家具）不算碰撞
      if(obbOverlap(a.it,a.spec,b.it,b.spec)){hit=true;break;}
    }
    if(hit){
      const g=gFurn.querySelector(`[data-uid="${a.it.uid}"]`);
      if(g) g.querySelector('rect,circle').setAttribute('stroke','#e05656'),
            g.querySelector('rect,circle').setAttribute('stroke-width',2.5);
    }
  }
  // 选中框
  if(selected!=null){
    const it = state.items.find(i=>i.uid===selected);
    if(it){ const spec=itemSpec(it);
      const wf=cm2ft(spec.w), df=cm2ft(spec.d);
      const gs = el('g',{transform:`translate(${it.x*S} ${it.y*S}) rotate(${it.rot})`},gSel);
      el('rect',{x:-wf/2*S-4,y:-df/2*S-4,width:wf*S+8,height:df*S+8,fill:'none',stroke:'#4c8dff','stroke-width':1.5,'stroke-dasharray':'5 3'},gs);
      const rh = el('circle',{cx:0, cy:(-df/2)*S-16, r:6, fill:'#4c8dff', class:'rotHandle','data-uid':it.uid},gs);
      el('line',{x1:0,y1:-df/2*S-4,x2:0,y2:-df/2*S-10,stroke:'#4c8dff','stroke-width':1.5},gs);
      // 尺寸标注
      const lbl = el('text',{x:0, y:df/2*S+16, 'text-anchor':'middle','font-size':11, fill:'#7fb8ff'},gs);
      lbl.textContent = fmtDims(spec);
    }
  }
  updateTotals(); updatePlacedList(); updateProps();
}

/* ===== 长度单位 =====
   'cm' → 公制厘米；'ft' → 英尺+英寸（美国房产惯例，13'2" 这种写法）。
   内部一律用英尺存储，只在显示时转换。 */
function fmtLen(ft, opt){
  opt = opt || {};
  if(state.unit === 'cm'){
    const cmv = ft * 30.48;
    if(opt.precise && cmv < 100) return (Math.round(cmv*10)/10) + ' cm';
    return Math.round(cmv) + ' cm';
  }
  const neg = ft < 0; ft = Math.abs(ft);
  let F = Math.floor(ft);
  let I = (ft - F) * 12;
  I = opt.precise ? Math.round(I*4)/4 : Math.round(I);   // 精确模式到 1/4 英寸
  if(I >= 12){ F += 1; I = 0; }
  let si = '';
  if(I > 0){
    const wi = Math.floor(I), fr = I % 1;
    const frs = fr===0.25?'1/4' : fr===0.5?'1/2' : fr===0.75?'3/4' : '';
    si = (wi ? wi : '') + (wi && frs ? '-' : '') + frs + '"';   // 0-1/4" 这种写法不对，应是 1/4"
  }
  const body = F ? (F + "'" + (si ? ' ' + si : '')) : (si || '0"');
  return (neg ? '−' : '') + body;
}

function obbCorners(it,spec){
  // 圆形家具（圆桌/转椅/圆几）按内接方近似，避免方角误报碰撞
  const round = spec.w===spec.d && ['tableRound','sideTable','lamp','officeChair','stool'].includes(spec.kind);
  const k = round? 0.72 : 1;
  const wf=cm2ft(spec.w)/2*k, df=cm2ft(spec.d)/2*k, r=it.rot*Math.PI/180;
  const c=Math.cos(r), s=Math.sin(r);

function obbOverlap(a,sa,b,sb){
  const ca=obbCorners(a,sa), cb=obbCorners(b,sb);
  const axes=[];
  for(const cs of [ca,cb]) for(let i=0;i<2;i++){
    const e=[cs[(i+1)%4][0]-cs[i][0], cs[(i+1)%4][1]-cs[i][1]];
    const L=Math.hypot(e[0],e[1]); axes.push([-e[1]/L, e[0]/L]);
  }
  for(const ax of axes){
    let mina=1e9,maxa=-1e9,minb=1e9,maxb=-1e9;
    for(const p of ca){const v=p[0]*ax[0]+p[1]*ax[1]; mina=Math.min(mina,v); maxa=Math.max(maxa,v);}
    for(const p of cb){const v=p[0]*ax[0]+p[1]*ax[1]; minb=Math.min(minb,v); maxb=Math.max(maxb,v);}
    if(maxa<minb+0.02 || maxb<mina+0.02) return false;
  }

  if(ev.key==='Delete'||ev.key==='Backspace'){ state.items=state.items.filter(i=>i.uid!==selected); selected=null; drawFurniture(); save(); }
  else if(ev.key==='r'||ev.key==='R'){ it.rot=(it.rot+ (ev.shiftKey?-15:15))%360; drawFurniture(); save(); }
  else if(ev.key==='['||ev.key===']'){ const st=ev.shiftKey?0.1:0.5;

              wallEdit.tool==='poly'?'连续点击放顶点；点回起点 / 双击 / 回车 = 闭合；Esc 取消':wallEdit.tool==='door'?'点击任意门洞放置门（已有门则选中）；选中后可换 平开/双开/推拉、铰链侧、开向':'悬停会亮出墙体；点击选中（含门扇），拖空白平移，滚轮缩放');

function applyDrawWallChain(){
  const pts=wallEdit.drawPts;
  let added=0;
  for(let i=0;i<pts.length-1;i++){
    if(Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1])<0.05) continue;
    USERGEO.walls.push({x1:pts[i][0],y1:pts[i][1],x2:pts[i+1][0],y2:pts[i+1][1],
      t:$('#wType').value, wd:cmToWd(+$('#wThick').value||9)});
    added++;
  }
  wallEdit.drawPts=[]; wallEdit.hover=null;
  if(added){ geoChanged(); wMsg('已添加 '+added+' 段墙'); } else drawWallEdit();
}
function closeDrawPoly(){
  let pts=wallEdit.drawPts;
  wallEdit.drawPts=[]; wallEdit.hover=null;
  pts=pts.filter((p,i)=> i===0 || Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1])>0.05);
  if(pts.length>=3){
    USERGEO.polys.push({pts:pts.map(p=>[p[0],p[1]])});
    wallEdit.sel={kind:'p',src:'u',i:USERGEO.polys.length-1};
    geoChanged(); wMsg('已添加多边形（'+pts.length+' 个顶点）');
  } else drawWallEdit();
  updateWallBarFromSel();
}
function deleteSel(){
  const s=wallEdit.sel; if(!s) return;
  drag=null;   // 拖动中删除：先解除拖拽，避免后续 move 继续拉扯已删对象
  if(s.kind==='door'){
    if(s.src==='u') USERGEO.doors.splice(s.i,1);
    else { delete USERGEO.ovD[s.i]; if(!USERGEO.hiddenD.includes(s.i)) USERGEO.hiddenD.push(s.i); }
    wallEdit.sel=null; geoChanged(); updateWallBarFromSel(); wMsg('已删除门'); return;
  }
  if(s.kind==='w'){
    if(s.src==='u') USERGEO.walls.splice(s.i,1);

function wallEditDown(ev){

  }
  if(ev.button!==0) return;
  const p0=svgPoint(ev);

      u:(()=>{const dx=dd.x2-dd.x1,dy=dd.y2-dd.y1,L=Math.hypot(dx,dy)||1e-6;return [dx/L,dy/L];})(),
      o:{x1:dd.x1,y1:dd.y1,x2:dd.x2,y2:dd.y2}};

  }

      if(sgm.t!=='d' && sgm.t!=='o') continue;
      const dx=sgm.x2-sgm.x1, dy=sgm.y2-sgm.y1, L2=dx*dx+dy*dy; if(L2<1e-9) continue;
      let tt=((p0[0]-sgm.x1)*dx+(p0[1]-sgm.y1)*dy)/L2; tt=Math.max(0,Math.min(1,tt));

    if(!best){ wMsg('请点击一个门洞/开口（可先用画墙工具画一段类型=门洞的墙）', true); return; }
    // 该门洞上已有门 → 选中它

    USERGEO.doors.push({x1:best.x1,y1:best.y1,x2:best.x2,y2:best.y2,kind:'swing',hinge:0,side:1,wood:false});

  }
  if(wallEdit.tool==='wall' || wallEdit.tool==='poly'){
    const p=snapPt(p0,ev);
    const pts=wallEdit.drawPts;

    if(pts.length){
      const last=pts[pts.length-1];

         Math.hypot(p[0]-pts[0][0],p[1]-pts[0][1])<Math.min(0.35, 11/pxPerFt())){ closeDrawPoly(); return; }

  if(t.classList && t.classList.contains('dHit')){
    if(ev.altKey){ // Alt+点击穿透选中门下面的门洞段
      let best=null,bd=Math.min(0.5,14/pxPerFt());

        const dx=sgm.x2-sgm.x1, dy=sgm.y2-sgm.y1, L2=dx*dx+dy*dy; if(L2<1e-9) continue;
        let tt=((p0[0]-sgm.x1)*dx+(p0[1]-sgm.y1)*dy)/L2; tt=Math.max(0,Math.min(1,tt));
        const dd=Math.hypot(p0[0]-(sgm.x1+dx*tt), p0[1]-(sgm.y1+dy*tt));
        if(dd<bd){bd=dd;best=sgm;}
      }
      if(best){ wallEdit.sel={kind:'w', src:best._src, i:best._i}; drawWallEdit(); updateWallBarFromSel(); return; }
    }
    if(!(wallEdit.sel&&wallEdit.sel.kind==='door'&&wallEdit.sel.src===t.dataset.src&&wallEdit.sel.i===+t.dataset.i)) wallEdit.dEndSel=null;
    wallEdit.sel={kind:'door', src:t.dataset.src, i:+t.dataset.i};
    const dd=selDoor();
    const link=doorLinkage(dd, wallEdit.sel);
    drag={mode:'dMove', px:p0[0], py:p0[1], cX:ev.clientX, cY:ev.clientY, link, moved:false,
      u:(()=>{const dx=dd.x2-dd.x1,dy=dd.y2-dd.y1,L=Math.hypot(dx,dy)||1e-6;return [dx/L,dy/L];})(),
      o:{x1:dd.x1,y1:dd.y1,x2:dd.x2,y2:dd.y2}};
    svg.setPointerCapture(ev.pointerId);
    drawWallEdit(); updateWallBarFromSel(); return;
  }
  if(t.classList && t.classList.contains('wHit')){
    wallEdit.sel={kind:'w', src:t.dataset.src, i:+t.dataset.i};
    const selRef={src:wallEdit.sel.src, i:wallEdit.sel.i};
    drag={mode:'wMove', px:p0[0], py:p0[1], cX:ev.clientX, cY:ev.clientY, selRef, seg:null,

    const pts=selPolyPts();

          orig:pts.map(q=>[q[0],q[1]]), moved:false};
    svg.setPointerCapture(ev.pointerId);
    drawWallEdit(); updateWallBarFromSel(); return;
  }
  wallEdit.sel=null; drawWallEdit(); updateWallBarFromSel();
  drag={mode:'pan', px:ev.clientX, py:ev.clientY, vx:vb.x, vy:vb.y, k:1/svg.getScreenCTM().a};

function wallEditMove(ev){
 try{
  const p0=svgPoint(ev);
  if(wallEdit.tool!=='select' && !drag){   // 拖拽中的手柄在任何工具模式下都要继续响应
    if(wallEdit.drawPts.length){ wallEdit.hover=snapPt(p0,ev); drawWallEdit(); }
    return;
  }
  if(!drag){
    // 悬停高亮
    const t=ev.target; let hv=null;
    if(t.classList && t.classList.contains('wHit')) hv={kind:'w', src:t.dataset.src, i:+t.dataset.i};
    else if(t.classList && t.classList.contains('pHit')) hv={kind:'p', src:t.dataset.src, i:+t.dataset.i};
    const cur=wallEdit.hoverSel;
    if(JSON.stringify(hv)!==JSON.stringify(cur)){ wallEdit.hoverSel=hv; drawWallEdit(); }
    return;
  }
  if(drag.mode==='dMove'){
    if(!drag.moved && Math.hypot(ev.clientX-drag.cX, ev.clientY-drag.cY)<5) return;
    drag.moved=true;
    let t=FT2((p0[0]-drag.px)*drag.u[0]+(p0[1]-drag.py)*drag.u[1]); // 仅沿墙方向滑动
    const r0=drag.link.range(0), r1=drag.link.range(1);
    t=Math.max(Math.max(r0[0],r1[0]), Math.min(Math.min(r0[1],r1[1]), t));
    drag.link.apply(drag.o.x1+drag.u[0]*t, drag.o.y1+drag.u[1]*t,
                    drag.o.x2+drag.u[0]*t, drag.o.y2+drag.u[1]*t);
    const L=Math.hypot(drag.o.x2-drag.o.x1,drag.o.y2-drag.o.y1);
    wMsg('滑动 '+lenLabel(Math.abs(t))+' · 门宽 '+lenLabel(L));
    build2Dlight(); return;
  }
  if(drag.mode==='dEnd'){
    const t=(p0[0]-drag.o.x1)*drag.u[0]+(p0[1]-drag.o.y1)*drag.u[1]; // 投影到门线
    const L0=Math.hypot(drag.o.x2-drag.o.x1,drag.o.y2-drag.o.y1);
    const rg=drag.link.range(drag.end);
    if(drag.end===0){
      const base=0, lim=[base+rg[0], Math.min(base+rg[1], L0-DOOR_MIN)];
      const tt=FT2(Math.max(lim[0], Math.min(lim[1], t)));
      drag.link.apply(drag.o.x1+drag.u[0]*tt, drag.o.y1+drag.u[1]*tt, drag.o.x2, drag.o.y2);
      wMsg('门宽 '+lenLabel(L0-tt));
    } else {
      const lim=[Math.max(L0+rg[0], DOOR_MIN), L0+rg[1]];
      const tt=FT2(Math.max(lim[0], Math.min(lim[1], t)));
      drag.link.apply(drag.o.x1, drag.o.y1, drag.o.x1+drag.u[0]*tt, drag.o.y1+drag.u[1]*tt);
      wMsg('门宽 '+lenLabel(tt));
    }
    build2Dlight(); return;
  }
  if(drag.mode==='wEnd'){
    const p=snapPt(p0,ev,wallEdit.sel||undefined);
    if(drag.end===0){ drag.seg.x1=p[0]; drag.seg.y1=p[1]; } else { drag.seg.x2=p[0]; drag.seg.y2=p[1]; }
    const L=Math.hypot(drag.seg.x2-drag.seg.x1,drag.seg.y2-drag.seg.y1);
    wMsg('长 '+lenLabel(L));
    build2Dlight(); return;
  }
  if(drag.mode==='pVert'){
    const p=snapPt(p0,ev);
    drag.pts[drag.vi][0]=p[0]; drag.pts[drag.vi][1]=p[1];
    build2Dlight(); return;
  }
  if(drag.mode==='wMove'){
    if(!drag.moved && Math.hypot(ev.clientX-drag.cX, ev.clientY-drag.cY)<5) return; // 屏幕像素阈值防误触
    drag.moved=true;
    if(!drag.seg) drag.seg = drag.selRef.src==='b' ? ensureOvW(drag.selRef.i) : USERGEO.walls[drag.selRef.i];
    const dx=FT2(p0[0]-drag.px), dy=FT2(p0[1]-drag.py); // 平移量化 0.01ft(3mm)
    drag.seg.x1=drag.ox1+dx; drag.seg.y1=drag.oy1+dy; drag.seg.x2=drag.ox2+dx; drag.seg.y2=drag.oy2+dy;
    build2Dlight(); return;
  }
  if(drag.mode==='pMove'){
    if(!drag.moved && Math.hypot(ev.clientX-drag.cX, ev.clientY-drag.cY)<5) return;
    drag.moved=true;
    if(!drag.pts) drag.pts = drag.selRef.src==='b' ? ensureOvP(drag.selRef.i) : USERGEO.polys[drag.selRef.i].pts;
    const dx=FT2(p0[0]-drag.px), dy=FT2(p0[1]-drag.py);
    drag.pts.forEach((q,i)=>{ q[0]=drag.orig[i][0]+dx; q[1]=drag.orig[i][1]+dy; });
    build2Dlight(); return;
  }
 }catch(e){ wMsg('编辑器错误: '+e.message, true); }
}

/* 2D 地面双击 → 直接站到该处的室内视角 */
function fpJumpTo(fx, fz){
  const pt=[fx,fz];
  // 朝"背离最近墙"的方向看，保证视线进入房间
  let bd=1e9, bn=null;
  for(const sg of effWalls()){
    const dx=sg.x2-sg.x1, dy=sg.y2-sg.y1, L2=dx*dx+dy*dy; if(L2<1e-9) continue;
    let t=((pt[0]-sg.x1)*dx+(pt[1]-sg.y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const px=sg.x1+dx*t, py=sg.y1+dy*t, d=Math.hypot(pt[0]-px, pt[1]-py);
    if(d<bd){ bd=d; bn=[pt[0]-px, pt[1]-py]; }
  }
  let dir;
  if(bn && bd>0.05 && bd<9) dir=new THREE.Vector3(bn[0],0,bn[1]).normalize();
  else { const c=FLOORPTS.reduce((a,p)=>[a[0]+p[0]/FLOORPTS.length, a[1]+p[1]/FLOORPTS.length],[0,0]);
    dir=new THREE.Vector3(c[0]-fx, 0, c[1]-fz);
    dir = dir.lengthSq()<0.04 ? new THREE.Vector3(0,0,-1) : dir.normalize(); }
  three.fpPos=new THREE.Vector3(fx, EYE_H, fz);
  three.fpDir=dir.clone();
  setCamMode('fp');
  three.cam.position.set(fx, EYE_H, fz);
  three.fpYaw=Math.atan2(dir.x, dir.z); three.fpPitch=0;
  fpAim();
}
/* 双击地面 = 站到那儿的室内视角。
   注意不能先 setView('doll') 再 fpJumpTo——setView 会在 40ms 后异步
   setCamMode('doll')，把 fpJumpTo 刚设好的第一人称又掰回俯瞰。
   这里用 pendingFP 交接，不依赖时序。 */
let pendingFP = null;
function gotoInterior(fx, fz){
  if(three){ setView('fp'); fpJumpTo(fx, fz); }
  else { pendingFP = [fx, fz]; setView('fp'); }   // 场景还没建，等 setView 建完再跳
}
svg.addEventListener('dblclick', ev=>{
  if(!wallEdit.on){
    if(state.view!=='2d') return;
    if(ev.target.closest('.furn')) return;                 // 双击家具不跳转
    if(meas.on) return;                                    // 量尺寸模式下双击不跳转
    const p=svgPoint(ev);
    ev.preventDefault();
    gotoInterior(p[0], p[1]);
    return;
  }
  if(!wallEdit.on) return;
  ev.preventDefault();
  if(wallEdit.tool==='wall') applyDrawWallChain();
  else if(wallEdit.tool==='poly') closeDrawPoly();
});

/* =====================================================================
   3D 渲染 (Three.js)
   ===================================================================== */
let three = null;
function init3D(){
  const canvas = $('#c3d');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true,
    powerPreference:'high-performance', stencil:false});
  renderer.shadowMap.autoUpdate = false;      // 阴影只在场景真正变化时重算（相机移动不需要重算）
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141821);
  const cam = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
  // 场景中心
  const CTR = [26, 20];
  cam.position.set(CTR[0]+2, 42, CTR[1]+30);
  const controls = new THREE.OrbitControls(cam, canvas);
  controls.target.set(CTR[0], 0, CTR[1]);
  controls.maxPolarAngle = Math.PI/2 - 0.02;
  controls.enablePan = true;
  controls.screenSpacePanning = true;
  controls.panSpeed = 1.0;
  controls.mouseButtons = {LEFT:THREE.MOUSE.ROTATE, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.PAN};
  controls.touches = {ONE:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN};
  // Shift 按住时左键=平移（Mac 触控板右键拖动不便）
  window.addEventListener('keydown', e=>{ if(e.key==='Shift' && three)
    three.controls.mouseButtons.LEFT = THREE.MOUSE.PAN; });
  window.addEventListener('keyup', e=>{ if(e.key==='Shift' && three)
    three.controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE; });
  canvas.addEventListener('contextmenu', e=>e.preventDefault());
  controls.update();
  // 光
  const amb = new THREE.AmbientLight(0xf2f4f8, .28); scene.add(amb);
  const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a3226, .55); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffeeda, 1.85);
  sun.position.set(-18, 30, 38);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  const sc = 32;
  sun.shadow.camera.left=-sc; sun.shadow.camera.right=sc;
  sun.shadow.camera.top=sc; sun.shadow.camera.bottom=-sc;
  sun.shadow.camera.far = 120;
  sun.target.position.set(CTR[0],0,CTR[1]); scene.add(sun.target);
  scene.add(sun);
  three = {renderer, scene, cam, controls, canvas, furnGroup:new THREE.Group(), needsRender:true, dpr:Math.min(devicePixelRatio||1,2),
           sun, amb, hemi, sunHome:sun.position.clone(), photo:null};
  buildEnvironment();
  buildStatic3D();
  scene.add(three.furnGroup);
  const resize=()=>{
    const w=canvas.clientWidth||canvas.parentElement.clientWidth, h=canvas.clientHeight||canvas.parentElement.clientHeight;
    renderer.setSize(w,h,false); renderer.setPixelRatio(three.lowRes? Math.min(1.0,three.dpr) : three.dpr);
    cam.aspect=w/h; cam.updateProjectionMatrix(); requestRender();
  };
  new ResizeObserver(resize).observe(canvas.parentElement); resize();
  controls.addEventListener('change', requestRender);
  // 交互期临时降采样（静止后立刻恢复满分辨率重绘，静态画质不受影响）
  const interact=()=>{
    if(three.lowRes!==true){ three.lowRes=true; renderer.setPixelRatio(Math.min(1.0, three.dpr)); requestRender(); }
    clearTimeout(three.hiTimer);
    three.hiTimer=setTimeout(()=>{ three.lowRes=false;
      renderer.setPixelRatio(three.dpr); requestRender(); }, 220);
  };
  for(const ev of ['pointerdown','pointermove','wheel'])
    canvas.addEventListener(ev, e=>{ if(e.type!=='pointermove' || e.buttons) interact(); }, {passive:true});
  (function loop(){ requestAnimationFrame(loop);
    fpStep();
    if(three.camMode!=='fp') controls.update();          // FP 由 fpAim 直接控相机
    if(three.photo) return;                              // 照片模式自己控制渲染
    if(three.needsRender){ three.needsRender=false; renderer.render(scene,cam); }
  })();
}
/* 由颜色贴图生成法线贴图（Sobel），给木纹/织物真实的微起伏与掠射高光 */
/* 确定性随机数：程序化贴图必须可复现——否则每次刷新木纹/天际线都变，
   也无法做像素级回归比对。*/
let _rs=0x2f6e2b1;
function srand(seed){ _rs=(seed>>>0)||1; }
function rnd01(){ let x=_rs; x^=x<<13; x>>>=0; x^=x>>>17; x^=x<<5; x>>>=0; _rs=x; return x/4294967296; }
const _nrmCache=new WeakMap();
/* 法线贴图：优先用 GPU（一次 shader pass 出图），失败再退回 CPU Sobel。
   CPU 版对 512² 要跑 26 万像素 × 8 邻域采样，GPU 版是一次全屏 pass。*/
let _nrmGL=null;
function _nrmGPU(tex, strength, N){
  try{
    if(!_nrmGL){
      const cv=document.createElement('canvas');
      const r=new THREE.WebGLRenderer({canvas:cv, antialias:false, preserveDrawingBuffer:true, alpha:false});
      _nrmGL={r, cv,
        cam:new THREE.OrthographicCamera(-1,1,1,-1,0,1),
        scene:new THREE.Scene(),
        mat:new THREE.ShaderMaterial({
          uniforms:{tSrc:{value:null}, uTexel:{value:new THREE.Vector2(1/512,1/512)}, uStr:{value:1}},
          vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',
          fragmentShader:`
            uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uStr; varying vec2 vUv;
            float lum(vec2 p){ vec3 c=texture2D(tSrc,p).rgb; return dot(c,vec3(0.299,0.587,0.114)); }
            void main(){
              vec2 t=uTexel;
              float dx=(lum(vUv+vec2(-t.x,-t.y))+2.0*lum(vUv+vec2(-t.x,0.0))+lum(vUv+vec2(-t.x,t.y)))
                      -(lum(vUv+vec2( t.x,-t.y))+2.0*lum(vUv+vec2( t.x,0.0))+lum(vUv+vec2( t.x,t.y)));
              float dy=(lum(vUv+vec2(-t.x,-t.y))+2.0*lum(vUv+vec2(0.0,-t.y))+lum(vUv+vec2(t.x,-t.y)))
                      -(lum(vUv+vec2(-t.x, t.y))+2.0*lum(vUv+vec2(0.0, t.y))+lum(vUv+vec2(t.x, t.y)));
              vec3 n=normalize(vec3(dx*uStr, dy*uStr, 1.0));
              gl_FragColor=vec4(n*0.5+0.5, 1.0);
            }`,
          depthTest:false, depthWrite:false}),
      };
      const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2), _nrmGL.mat);
      q.frustumCulled=false; _nrmGL.scene.add(q);
    }
    const G=_nrmGL;
    G.r.setPixelRatio(1); G.r.setSize(N,N,false);
    G.mat.uniforms.tSrc.value=tex;
    G.mat.uniforms.uTexel.value.set(1/N,1/N);
    G.mat.uniforms.uStr.value=(strength==null?1:strength)*2.2;
    G.r.render(G.scene, G.cam);
    const out=document.createElement('canvas'); out.width=N; out.height=N;
    out.getContext('2d').drawImage(G.cv,0,0,N,N);
    return out;
  }catch(e){ return null; }
}
function _nrmCPU(src, strength, N){
  const c0=document.createElement('canvas'); c0.width=N; c0.height=N;
  const g0=c0.getContext('2d'); g0.drawImage(src,0,0,N,N);
  const d=g0.getImageData(0,0,N,N).data;
  const H=new Float32Array(N*N);
  for(let i=0,p=0;i<H.length;i++,p+=4) H[i]=(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114)/255;
  const c=document.createElement('canvas'); c.width=N; c.height=N;
  const g=c.getContext('2d'); const out=g.createImageData(N,N);
  const S=(strength==null?1:strength)*2.2;
  const at=(x,y)=>H[((y+N)%N)*N+((x+N)%N)];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const dx=(at(x-1,y-1)+2*at(x-1,y)+at(x-1,y+1))-(at(x+1,y-1)+2*at(x+1,y)+at(x+1,y+1));
    const dy=(at(x-1,y-1)+2*at(x,y-1)+at(x+1,y-1))-(at(x-1,y+1)+2*at(x,y+1)+at(x+1,y+1));
    let nx=dx*S, ny=dy*S, nz=1;
    const l=Math.hypot(nx,ny,nz); nx/=l; ny/=l; nz/=l;
    const i=(y*N+x)*4;
    out.data[i]=(nx*0.5+0.5)*255; out.data[i+1]=(ny*0.5+0.5)*255;
    out.data[i+2]=(nz*0.5+0.5)*255; out.data[i+3]=255;
  }
  g.putImageData(out,0,0);
  return c;
}
function normalFromTexture(tex, strength){
  if(_nrmCache.has(tex)) return _nrmCache.get(tex);
  const src=tex.image;
  const N=Math.min(512, src.width||256);
  const cv=_nrmGPU(tex, strength, N) || _nrmCPU(src, strength, N);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.copy(tex.repeat);
  _nrmCache.set(tex,t); return t;
}
const _speciesCache={};
/* 木材树种贴图：松木(蜜黄+节疤)/榉木(浅粉白)/白蜡(暖白)/胡桃(深棕)
   —— 与 color 相乘，所以贴图本身以高亮度基调 + 木纹明暗为主 */
function woodSpecies(name){
  srand(2000 + name.length*97 + (name.charCodeAt(0)||0));
  if(_speciesCache[name]) return _speciesCache[name];
  const P={
    pine:  {base:'#f0dcb8', grain:'rgba(150,110,62,%A)', light:'rgba(255,246,226,%A)', knots:5, gw:[0.6,2.6], n:52, rep:[1.4,1.4]},
    beech: {base:'#f4e5d2', grain:'rgba(168,132,96,%A)', light:'rgba(255,250,242,%A)', knots:1, gw:[0.4,1.4], n:70, rep:[1.6,1.6]},
    birch: {base:'#f6ecdc', grain:'rgba(178,150,116,%A)', light:'rgba(255,252,246,%A)', knots:1, gw:[0.4,1.2], n:64, rep:[1.6,1.6]},
    oak:   {base:'#e8d9bf', grain:'rgba(126,96,58,%A)',  light:'rgba(252,244,228,%A)', knots:2, gw:[0.7,3.0], n:48, rep:[1.2,1.2]},
    walnut:{base:'#c8a276', grain:'rgba(78,50,28,%A)',   light:'rgba(226,196,158,%A)', knots:2, gw:[0.6,2.4], n:56, rep:[1.3,1.3]},
  }[name] || {base:'#f0e2cc', grain:'rgba(150,118,80,%A)', light:'rgba(255,250,240,%A)', knots:2, gw:[0.5,2], n:56, rep:[1.5,1.5]};
  const N=512, c=document.createElement('canvas'); c.width=N;c.height=N;
  const g=c.getContext('2d');
  const rnd=(a,b)=>a+rnd01()*(b-a);
  g.fillStyle=P.base; g.fillRect(0,0,N,N);
  // 心材/边材色带
  for(let i=0;i<8;i++){
    const y=rnd(0,N), h=rnd(12,70);
    g.fillStyle=P.grain.replace('%A', (0.03+rnd01()*0.05).toFixed(3));
    g.fillRect(0,y,N,h);
  }
  // 顺纹长纹理（松木是笔直平行纹）
  for(let i=0;i<P.n;i++){
    const y=rnd(0,N), a=(0.05+rnd01()*0.22).toFixed(3);
    g.strokeStyle=(rnd01()<0.62? P.grain : P.light).replace('%A',a);
    g.lineWidth=rnd(P.gw[0],P.gw[1]);
    g.beginPath(); g.moveTo(-20,y);
    g.bezierCurveTo(N*0.3, y+rnd(-3,3), N*0.7, y+rnd(-3,3), N+20, y+rnd(-2,2));
    g.stroke();
  }
  // 节疤（松木标志性）
  for(let k=0;k<P.knots;k++){
    const kx=rnd(50,N-50), ky=rnd(40,N-40), R=rnd(7,17), el=rnd(1.4,2.4);
    for(let r=R;r>0;r-=1.1){
      g.strokeStyle=P.grain.replace('%A',(0.10+ (R-r)/R*0.30).toFixed(3));
      g.lineWidth=1.0;
      g.beginPath(); g.ellipse(kx,ky,r*el,r,rnd(-0.4,0.4),0,Math.PI*2); g.stroke();
    }
    g.fillStyle=P.grain.replace('%A','0.55');
    g.beginPath(); g.ellipse(kx,ky,R*0.28*el,R*0.28,0,0,Math.PI*2); g.fill();
    // 纹理绕过节疤的分流
    for(let i=0;i<7;i++){
      const yy=ky+rnd(-R*2.6,R*2.6);
      g.strokeStyle=P.grain.replace('%A',(0.06+rnd01()*0.12).toFixed(3));
      g.lineWidth=rnd(0.5,1.6);
      g.beginPath(); g.moveTo(kx-R*3.6, yy);
      g.quadraticCurveTo(kx, ky+(yy-ky)*2.1, kx+R*3.6, yy); g.stroke();
    }
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(P.rep[0],P.rep[1]); t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  _speciesCache[name]=t; return t;
}
let _steelTex=null;
/* 拉丝不锈钢的粗糙度贴图：竖向细密拉丝 → 沿纹理方向拉长高光 */
function brushedSteelTexture(){
  srand(1006);
  if(_steelTex) return _steelTex;
  const W=64,H=512, c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#5c5c5c'; g.fillRect(0,0,W,H);           // 基准粗糙度
  for(let i=0;i<520;i++){
    const x=rnd01()*W, v=rnd01()<0.5?255:0;
    g.strokeStyle=`rgba(${v},${v},${v},${0.02+rnd01()*0.055})`;
    g.lineWidth=0.4+rnd01()*1.3;
    g.beginPath(); g.moveTo(x, rnd01()*H*0.3); g.lineTo(x+(rnd01()-.5)*1.5, H); g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(3,1.2); _steelTex=t; return t;
}
let _woodTexCache=null;
/* 地板：深冷灰褐宽板（对照 704/705 实拍——深烟熏橡木，偏冷灰不偏橙） */
function woodTexture(){
  srand(1001);
  if(_woodTexCache) return _woodTexCache;
  const N=1024; const c=document.createElement('canvas'); c.width=N;c.height=N;
  const g=c.getContext('2d');
  const PH=N/8;                                       // 8 块板 ≈ 板宽 18cm
  const rnd=(a,b)=>a+rnd01()*(b-a);
  g.fillStyle='#4c4643'; g.fillRect(0,0,N,N);
  for(let p=0;p<8;p++){
    const y0=p*PH;
    // 每块板独立底色（真实木地板板与板之间色差明显）
    const v=rnd(-9,9), warm=rnd(-3,4);
    const base=[Math.round(80+v+warm), Math.round(74+v), Math.round(70+v-warm*0.5)];
    g.save(); g.beginPath(); g.rect(0,y0,N,PH); g.clip();
    g.fillStyle=`rgb(${base[0]},${base[1]},${base[2]})`; g.fillRect(0,y0,N,PH);
    // 板内纵向色带（心材/边材过渡）
    for(let i=0;i<7;i++){
      const yy=y0+rnd(0,PH), hh=rnd(2,PH*0.30), d=rnd(-14,12);
      g.fillStyle=`rgba(${base[0]+d|0},${base[1]+d|0},${base[2]+d|0},.55)`;
      g.fillRect(0,yy,N,hh);
    }
    // 大教堂纹（cathedral grain）：成对内嵌拱形
    const groups=Math.round(rnd(2,4));
    for(let k=0;k<groups;k++){
      const cx=rnd(0,N), cy=y0+rnd(PH*0.2,PH*0.8), w=rnd(70,190), amp=rnd(PH*0.18,PH*0.42);
      const dark=rnd01()<0.5;
      for(let r=0;r<7;r++){
        const sc=1-r*0.11;
        g.strokeStyle=dark?`rgba(46,40,37,${rnd(0.10,0.24)})`:`rgba(132,124,117,${rnd(0.07,0.16)})`;
        g.lineWidth=rnd(0.7,2.0);
        g.beginPath();
        g.moveTo(cx-w*sc, cy+amp*sc*0.55);
        g.quadraticCurveTo(cx, cy-amp*sc, cx+w*sc, cy+amp*sc*0.55);
        g.stroke();
      }
    }
    // 细木孔/纹理线
    for(let i=0;i<90;i++){
      const yy=y0+rnd(1,PH-1), a=rnd(0.04,0.17);
      g.strokeStyle=rnd01()<0.55?`rgba(40,35,33,${a})`:`rgba(140,132,125,${a*0.8})`;
      g.lineWidth=rnd(0.4,1.3);
      const x0=rnd(-100,N), len=rnd(120,520);
      g.beginPath(); g.moveTo(x0,yy);
      g.bezierCurveTo(x0+len*0.33, yy+rnd(-2,2), x0+len*0.66, yy+rnd(-2,2), x0+len, yy+rnd(-1.5,1.5));
      g.stroke();
    }
    // 偶发节疤
    if(rnd01()<0.45){
      const kx=rnd(60,N-60), ky=y0+rnd(PH*0.25,PH*0.75), kr=rnd(3,7);
      for(let r=kr;r>0;r-=1.2){
        g.strokeStyle=`rgba(38,32,29,${0.30-r*0.02})`; g.lineWidth=1.1;
        g.beginPath(); g.ellipse(kx,ky,r*1.9,r,0,0,Math.PI*2); g.stroke();
      }
    }
    g.restore();
    // 板缝：暗缝 + 上侧微亮倒角（LVP/实木复合的微V型倒角）
    g.strokeStyle='rgba(22,18,17,.9)'; g.lineWidth=2.0;
    g.beginPath(); g.moveTo(0,y0+PH-1); g.lineTo(N,y0+PH-1); g.stroke();
    g.strokeStyle='rgba(150,142,134,.16)'; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(0,y0+PH-3); g.lineTo(N,y0+PH-3); g.stroke();
    // 端缝（每块板 2 条，错缝布置）
    for(const ex of [ (p*331)%N, (p*331+N/2+97)%N ]){
      g.strokeStyle='rgba(22,18,17,.85)'; g.lineWidth=1.8;
      g.beginPath(); g.moveTo(ex,y0+1); g.lineTo(ex,y0+PH-2); g.stroke();
      g.strokeStyle='rgba(150,142,134,.12)'; g.lineWidth=1.0;
      g.beginPath(); g.moveTo(ex+2,y0+1); g.lineTo(ex+2,y0+PH-2); g.stroke();
    }
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(0.227,0.227);   // 8板/4.4ft ≈ 板宽17cm
  t.encoding=THREE.sRGBEncoding; t.anisotropy=8;   // 必须标 sRGB，否则被当线性图渲染而发白
  _woodTexCache=t; return t;
}
let _oakTexCache=null;
/* 橱柜/岛台：灰褐色木纹饰面（对照 708 效果图 + 705 实拍岛台侧板） */
function grayOakTexture(){
  srand(1002);
  if(_oakTexCache) return _oakTexCache;
  const c=document.createElement('canvas'); c.width=256;c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#7c766f'; g.fillRect(0,0,256,256);
  for(let i=0;i<90;i++){                          // 竖向grain
    const x=rnd01()*256, a=0.04+rnd01()*0.13;
    g.strokeStyle=rnd01()<0.5?`rgba(92,87,82,${a*1.25})`:`rgba(158,152,146,${a*0.85})`;
    g.lineWidth=0.6+rnd01()*2.6;
    g.beginPath(); g.moveTo(x,0);
    g.bezierCurveTo(x+(rnd01()-.5)*10,85, x+(rnd01()-.5)*10,170, x+(rnd01()-.5)*6,256);
    g.stroke();
  }
  for(let i=0;i<7;i++){                            // 深色节疤条带
    const x=rnd01()*256;
    g.strokeStyle=`rgba(96,91,86,${0.12+rnd01()*0.10})`; g.lineWidth=3+rnd01()*7;
    g.beginPath(); g.moveTo(x,0); g.quadraticCurveTo(x+12,128,x-6,256); g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,1);

let _quartzTexCache=null;
/* 台面：白色石英 + 浅灰纹（对照 704 岛台面 / 708 台面·背板） */
