  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,N,N);
  for(let i=0;i<70;i++){
    const y=rnd01()*N, a=0.05+rnd01()*0.13;
    g.strokeStyle=`rgba(90,70,50,${a})`; g.lineWidth=0.5+rnd01()*1.8;
    g.beginPath(); g.moveTo(-10,y);
    g.bezierCurveTo(N*0.3,y+(rnd01()-.5)*4, N*0.7,y+(rnd01()-.5)*4, N+10,y+(rnd01()-.5)*3);
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(2,2); t.encoding=THREE.sRGBEncoding; _fwoodTex=t; return t;
}
function roundedRectShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
const _rboxCache={};
function rboxGeo(w,h,d,r,seg){
  r=Math.max(0.006, Math.min(r, w/2-0.004, h/2-0.004, d/2-0.004));
  const key=[w,h,d,r,seg||3].map(v=>v.toFixed(3)).join('_');
  if(_rboxCache[key]) return _rboxCache[key];
  // 注意：bevelSize 会把轮廓向外扩张 r，所以基形要先缩 2r，成品才恰好是 w×h×d
  const geo=new THREE.ExtrudeGeometry(roundedRectShape(Math.max(0.002,w-2*r), Math.max(0.002,h-2*r), Math.max(0.001,r*0.6)),
    {depth:Math.max(0.004,d-2*r), bevelEnabled:true, bevelSize:r, bevelThickness:r,
     bevelSegments:(seg||3), curveSegments:8, steps:1});
  geo.center(); geo.computeVertexNormals();
  _rboxCache[key]=geo; return geo;
}
/* =====================================================================
   逐商品建模注册表：MODELS[specId] = (C) => {...}
   每件家具按官网商品图单独建模；未注册的回退到通用 kind 造型。
   坐标：原点在家具中心地面，y 向上，+z = 正面（朝房间），-z = 背面（靠墙）
   ===================================================================== */
const MODELS = {};

/* =====================================================================
   儿童爬爬架建模工具箱
   —— 这类产品全是「杆件 + 侧板 + 绳网 + 攀岩点」的组合，
      先把这几件做扎实，7 个型号就都能照实物拼出来。
   ===================================================================== */
function pgKit(C){
  const T = C.THREE, cm = C.cm, g = C.g;
  const V = (p)=> new T.Vector3(p[0], p[1], p[2]);
  const K = {};
  /* 任意两点之间的圆棒：横档 / 圆管 / 绳 */
  K.rod = (mat, p0, p1, r, seg)=>{
    const a = V(p0), b = V(p1), d = new T.Vector3().subVectors(b, a), L = d.length();
    if(L < 1e-5) return null;
    const m = new T.Mesh(new T.CylinderGeometry(r, r, L, seg||10), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), d.clone().normalize());
    m.castShadow = m.receiveShadow = true; g.add(m); return m;
  };
  /* 任意两点之间的方料：立柱 / 扁腿 / 横梁。w 为截面宽（绕自身轴 roll 弧度） */
  K.beam = (mat, p0, p1, w, t, roll)=>{
    const a = V(p0), b = V(p1), d = new T.Vector3().subVectors(b, a), L = d.length();
    if(L < 1e-5) return null;
    const m = new T.Mesh(new T.BoxGeometry(w, L, t), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), d.clone().normalize());
    if(roll) m.rotateOnAxis(new T.Vector3(0,1,0), roll);
    m.castShadow = m.receiveShadow = true; g.add(m); return m;
  };
  /* 侧板：pts 画在 (z, y) 平面上，沿 -x 方向拉厚 thick（板占 x-thick … x） */
  K.side = (pts, thick, mat, x, y, z, bevel)=>{
    const m = C.ext(pts, thick, mat, 0, 0, 0, 'xy', bevel);
    m.rotation.y = -Math.PI/2;
    m.position.set(x, y, z);
    return m;
  };
  /* 横档梯：两条侧轨 + n 根圆档。a/b 是梯子下端/上端的中线端点 */
  K.ladder = (matRail, matRung, a, b, width, n, railW, rungR)=>{
    const A = V(a), B = V(b), d = new T.Vector3().subVectors(B, A);
    const ax = new T.Vector3().crossVectors(d, new T.Vector3(0,1,0));
    if(ax.lengthSq() < 1e-6) ax.set(1,0,0);
    ax.normalize().multiplyScalar(width/2);
    for(const s of [-1, 1])
      K.beam(matRail, [A.x+ax.x*s, A.y+ax.y*s, A.z+ax.z*s],
                      [B.x+ax.x*s, B.y+ax.y*s, B.z+ax.z*s], railW, railW*0.55);
    for(let i=0;i<n;i++){
      const t = (i+0.5)/n;
      const p = new T.Vector3().copy(A).addScaledVector(d, t);
      K.rod(matRung, [p.x-ax.x, p.y-ax.y, p.z-ax.z], [p.x+ax.x, p.y+ax.y, p.z+ax.z], rungR, 10);
    }
  };
  /* 绳网：四角围成的矩形区域内拉经纬绳，交点打结 */
  K.net = (mat, o, ex, ez, nx, nz, r)=>{
    const O = V(o);
    for(let i=0;i<=nx;i++){
      const u = i/nx;
      K.rod(mat, [O.x+ex[0]*u, O.y+ex[1]*u, O.z+ex[2]*u],
                 [O.x+ex[0]*u+ez[0], O.y+ex[1]*u+ez[1], O.z+ex[2]*u+ez[2]], r, 6);
    }
    for(let j=0;j<=nz;j++){
      const v = j/nz;
      K.rod(mat, [O.x+ez[0]*v, O.y+ez[1]*v, O.z+ez[2]*v],
                 [O.x+ez[0]*v+ex[0], O.y+ez[1]*v+ex[1], O.z+ez[2]*v+ex[2]], r, 6);
    }
  };
  /* 攀岩点：彩色异形抓手（两片错位的圆角块 + 螺丝） */
  K.hold = (i, x, y, z, nx, s)=>{
    const PAL = [0x2f7fd6, 0x3fa93f, 0xf2c318, 0x8a3fb5, 0xe0483c, 0xe87c1e, 0xd94f9a];
    const mt = C.M(PAL[i % PAL.length], {rough:.38, clear:.55});
    s = s || 1;
    const a = new T.Mesh(rboxGeo(cm(9)*s, cm(5.5)*s, cm(5)*s, cm(1.6)*s, 3), mt);
    const b = new T.Mesh(rboxGeo(cm(6)*s, cm(4)*s, cm(6.5)*s, cm(1.6)*s, 3), mt);
    const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(0,0,1), V(nx).normalize());
    a.position.set(x, y, z); a.quaternion.copy(q); a.translateZ(cm(2.5));
    b.position.set(x, y, z); b.quaternion.copy(q);
    b.translateZ(cm(3.4)); b.translateY(cm(-1.6)); b.rotateZ(0.35);
    a.castShadow = b.castShadow = true; g.add(a); g.add(b);
    const sc = new T.Mesh(new T.CylinderGeometry(cm(0.7), cm(0.7), cm(1.2), 8),
      C.M(0xc9ccd2, {rough:.28, metal:.85}));
    sc.position.set(x, y, z); sc.quaternion.copy(q); sc.rotateX(Math.PI/2); sc.translateY(cm(4.2));
    g.add(sc);
  };
  /* 木螺丝/圆帽：接缝处点缀，近看不至于「一块整木」 */
  K.screw = (mat, x, y, z, nx, r)=>{
    const m = new T.Mesh(new T.CylinderGeometry(r, r, cm(0.5), 8), mat);
    m.position.set(x, y, z);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), V(nx).normalize());
    g.add(m); return m;
  };
  return K;
}

/* ---- Avenlur Chestnut 8-in-1 可折叠爬爬架 ---- */
MODELS['chestnut'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  const wood = C.M(C.col, {wood:'pine', rough:.46});
  const woodD = C.M(new C.THREE.Color(C.col).multiplyScalar(.92), {wood:'pine', rough:.5});
  const acc = C.col2 ? C.M(C.col2, {rough:.45, clear:.4}) : woodD;   // 彩色横杆款
  const rope = C.M(0xe8e2d4, {rough:.95});
  const BT = cm(3.2);                                    // 板厚
  const frames = [-0.42, -0.06, 0.40];                   // 三榀 A 形架的 x 位置
  // 屋脊横梁（同时是猴子架单杠）
  K.rod(wood, [-W*0.47, H-cm(3), 0], [W*0.47, H-cm(3), 0], cm(3.0), 14);
  // 梁上的花瓣形折叠连接盘
  for(const fx of [-0.47,-0.30,-0.06,0.16,0.40,0.47]){
    const p = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(7.5), cm(7.5), cm(2.2), 16), woodD);
    p.rotation.z = Math.PI/2; p.position.set(W*fx, H-cm(3), 0); p.castShadow=true; C.g.add(p);
    K.screw(C.M(0x2a2c30,{rough:.4,metal:.6}), W*fx+cm(1.3), H-cm(3), 0, [1,0,0], cm(1.6));
  }
  // A 形架：扁腿 + 落地横撑
  for(const fx of frames){
    for(const sz of [-1, 1]){
      K.beam(wood, [W*fx, H-cm(3), 0], [W*fx, cm(1.5), sz*D*0.47], cm(9), BT);
      K.beam(woodD, [W*fx-cm(6), cm(1.5), sz*D*0.47], [W*fx+cm(6), cm(1.5), sz*D*0.47], cm(7), cm(4));
    }
    K.beam(wood, [W*fx, H*0.30, -D*0.33], [W*fx, H*0.30, D*0.33], cm(6), cm(3));   // 中部拉撑
  }
  // 落地长边纵梁
  for(const sz of [-1, 1])
    K.beam(woodD, [-W*0.46, cm(2.2), sz*D*0.47], [W*0.46, cm(2.2), sz*D*0.47], cm(8), cm(3.6));
  // 左端：竖向肋木（瑞典梯）
  for(let i=0;i<9;i++){
    const y = cm(14) + i*(H-cm(24))/8;
    K.beam(acc, [-W*0.47, y, -D*0.30], [-W*0.47, y, D*0.30], cm(5.5), cm(3.4));
  }
  for(const sz of [-1,1]) K.beam(wood, [-W*0.47, 0, sz*D*0.30], [-W*0.47, H-cm(3), sz*D*0.30], cm(8), BT);
  // 中段：圆档梯（爬到梁上）
  K.ladder(wood, acc, [W*0.16, cm(2), D*0.42], [W*0.16, H-cm(8), D*0.05], cm(42), 6, cm(6), cm(1.9));
  // 右端外侧：攀岩板 + 抓手
  const rw = D*0.52, rTop = H-cm(10), rBot = cm(4);
  const rockX = W*0.40 + cm(6);
  K.beam(wood, [rockX, rBot, D*0.46], [rockX, rTop, -D*0.02], rw, cm(2.6), Math.PI/2);
  for(let i=0;i<10;i++){
    const t = (i+0.5)/10;
    const y = rBot + (rTop-rBot)*t, z = D*0.46 + (-D*0.48)*t;
    K.hold(i, rockX+cm(2.2), y, z + (i%2? cm(9):-cm(9)), [1,0,0.35], 0.95);
  }
  // 绳网 + 吊环 + 圆盘秋千
  K.net(rope, [W*0.02, H-cm(8), -D*0.05], [W*0.20, 0, 0], [0, -H*0.55, D*0.30], 4, 4, cm(0.9));
  for(const sx of [-0.16, -0.10]){
    K.rod(rope, [W*sx, H-cm(6), 0], [W*sx, H*0.42, D*0.06], cm(0.9), 6);
    C.torus(cm(7), cm(1.6), acc, W*sx, H*0.40, D*0.06, Math.PI/2);
  }
  for(const sx of [-0.30, -0.24]) K.rod(rope, [W*sx, H-cm(6), 0], [W*(sx*0.96), H*0.30, D*0.10], cm(0.9), 6);
  const disc = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(19), cm(19), cm(3.2), 20), wood);
  disc.position.set(-W*0.27, H*0.29, D*0.10); disc.castShadow = true; C.g.add(disc);
  // 前方长斜坡（滑梯/爬坡两用）
  const s0 = [-W*0.20, H*0.56, -D*0.16], s1 = [W*0.06, cm(2), D*0.52];
  K.beam(wood, s0, s1, D*0.20, cm(2.8), Math.PI/2);
  for(const sw of [-1, 1]){
    const off = sw*D*0.10;
    K.beam(woodD, [s0[0], s0[1]+cm(4), s0[2]+off], [s1[0], s1[1]+cm(4), s1[2]+off], cm(5), cm(5));
  }
};

/* ---- Avenlur Hazel 折叠攀爬三角 + 斜坡 + 拱桥（三件套） ---- */
MODELS['hazel'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  const wood = C.M(C.col, {wood:'pine', rough:.44});
  const woodD = C.M(new C.THREE.Color(C.col).multiplyScalar(.9), {wood:'pine', rough:.5});
  const acc = C.col2 ? C.M(C.col2, {rough:.42, clear:.45}) : wood;
  const BT = cm(2.0);
  /* 1) 右侧：攀爬三角（两片梯形侧板 + 圆档） */
  const triX = W*0.30, triHalf = D*0.46;
  const triPts = (s)=>[[-triHalf,0],[-triHalf+cm(5),0],[cm(3),H-cm(2)],[-cm(3),H-cm(2)],[triHalf-cm(5),0],[triHalf,0],
                       [cm(6),H-cm(6)],[-cm(6),H-cm(6)]];
  for(const sx of [-1, 1]){
    // 侧板做成「人」字：两条斜腿 + 顶部圆头
    for(const lz of [-1, 1]){
      K.beam(wood, [triX+sx*D*0.22, cm(1), lz*triHalf], [triX+sx*D*0.22, H-cm(4), 0], cm(7), BT+cm(0.6));
    }
    const cap = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(3.5), cm(3.5), BT+cm(0.6), 14), wood);
    cap.rotation.z = Math.PI/2; cap.position.set(triX+sx*D*0.22, H-cm(4), 0); C.g.add(cap);
    for(const lz of [-1,1]) K.screw(C.M(0xbfc3c9,{rough:.3,metal:.8}),
      triX+sx*(D*0.22+BT*0.6), cm(6), lz*(triHalf-cm(4)), [sx,0,0], cm(1.0));
  }
  for(let side=0; side<2; side++){
    const lz = side? 1 : -1;
    for(let i=0;i<7;i++){
      const t = (i+1)/8;
      const y = cm(1) + (H-cm(5))*t, z = lz*triHalf*(1-t);
      K.rod(acc, [triX-D*0.22, y, z], [triX+D*0.22, y, z], cm(1.7), 10);
    }
  }
  /* 2) 中间：可翻面斜坡板（一面光滑滑梯，一面圆木攀爬点） */
  const rTop = [W*0.06, H*0.62, 0], rBot = [-W*0.16, cm(2), 0];
  K.beam(wood, rTop, rBot, D*0.60, cm(2.4), Math.PI/2);
  for(const s of [-1,1]) K.beam(woodD, [rTop[0], rTop[1]+cm(2), s*D*0.29], [rBot[0], rBot[1]+cm(2), s*D*0.29], cm(3.4), cm(3.4));
  for(let i=0;i<5;i++){
    const t = (i+0.6)/6;
    const x = rTop[0] + (rBot[0]-rTop[0])*t, y = rTop[1] + (rBot[1]-rTop[1])*t + cm(2.6);
    for(const s of [-0.5, 0.5]){
      const k = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(4.2), cm(4.2), cm(1.8), 14), woodD);
      k.position.set(x + (i%2? cm(3):-cm(3)), y, s*D*0.22);
      k.rotation.x = Math.PI/2; k.rotation.z = -0.42; k.castShadow = true; C.g.add(k);
    }
  }
  const hook = C.M(0xb9bdc4, {rough:.3, metal:.85});
  for(const s of [-1,1]) K.rod(hook, [rTop[0]-cm(3), rTop[1]+cm(3), s*D*0.26], [rTop[0]+cm(5), rTop[1]+cm(6), s*D*0.26], cm(1.0), 8);
  /* 3) 左侧：拱桥 / 摇摇板 */
  const arcX = -W*0.34, arcR = D*0.62, arcH = H*0.86;
  const arcPts = [];
  const NA = 16;
  for(let i=0;i<=NA;i++){ const a = Math.PI*i/NA; arcPts.push([Math.cos(a)*arcR, Math.sin(a)*arcH]); }
  for(let i=NA;i>=0;i--){ const a = Math.PI*i/NA; arcPts.push([Math.cos(a)*(arcR-cm(9)), Math.sin(a)*(arcH-cm(9))]); }
  for(const sx of [-1, 1]) K.side(arcPts, BT+cm(0.4), wood, arcX + sx*D*0.24 + (sx>0?BT:0), cm(0.4), 0);
  for(let i=1;i<NA;i++){
    const a = Math.PI*(i+0.0)/NA;
    const z = Math.cos(a)*(arcR-cm(4.5)), y = Math.sin(a)*(arcH-cm(4.5)) + cm(0.4);
    K.beam(acc, [arcX-D*0.24, y, z], [arcX+D*0.24, y, z], cm(5.5), cm(2.2), 0);
  }
  for(const sx of [-1,1]) for(const sz of [-1,1])
    K.beam(woodD, [arcX+sx*D*0.24, cm(0.4), sz*(arcR-cm(2))], [arcX+sx*D*0.24, cm(3.4), sz*(arcR-cm(10))], cm(5), cm(4));
};

/* ---- Avenlur Magnolia 7-in-1 室内木质游乐架 ---- */
MODELS['magnolia'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  const wood = C.M(C.col, {wood:'pine', rough:.44});
  const woodD = C.M(new C.THREE.Color(C.col).multiplyScalar(.9), {wood:'pine', rough:.5});
  const acc = C.col2 ? C.M(C.col2, {rough:.42, clear:.45}) : wood;
  const rope = C.M(0xf0ebdd, {rough:.95});
  const BT = cm(3.0);
  // 梯形骨架：四条外撇扁腿（下宽上窄）
  const topHW = W*0.40, topHD = D*0.30, botHW = W*0.49, botHD = D*0.47;
  const legTop = [], legBot = [];
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const a = [sx*botHW, 0, sz*botHD], b = [sx*topHW, H-cm(4), sz*topHD];
    K.beam(wood, a, b, cm(9), BT);
    legTop.push(b); legBot.push(a);
  }
  // 顶部：一圈边框 + 横向猴子架圆档
  for(const sz of [-1,1]) K.beam(wood, [-topHW, H-cm(4), sz*topHD], [topHW, H-cm(4), sz*topHD], cm(7), cm(4));
  for(const sx of [-1,1]) K.beam(wood, [sx*topHW, H-cm(4), -topHD], [sx*topHW, H-cm(4), topHD], cm(7), cm(4));
  const nBar = Math.max(5, Math.round(W*2/cm(18)));
  for(let i=1;i<nBar;i++){
    const x = -topHW + 2*topHW*i/nBar;
    K.rod(wood, [x, H-cm(4), -topHD+cm(2)], [x, H-cm(4), topHD-cm(2)], cm(2.2), 10);
  }
  // 左侧面：圆档梯
  K.ladder(wood, wood, [-botHW+cm(3), cm(2), -botHD*0.55], [-topHW+cm(3), H-cm(8), -topHD*0.55], D*0.52, 6, cm(7), cm(2.1));
  // 后侧面：横档（另一面梯）
  for(let i=0;i<5;i++){
    const t = (i+0.7)/6, y = H*t;
    const sx1 = -(botHW + (topHW-botHW)*t), sx2 = -sx1;
    K.rod(wood, [sx1*0.98, y, -(botHD + (topHD-botHD)*t)*0.98], [sx2*0.98, y, -(botHD + (topHD-botHD)*t)*0.98], cm(2.1), 10);
  }
  // 中间：绳网 + 顶部横杆
  K.net(rope, [-W*0.10, H-cm(9), -D*0.16], [W*0.30, 0, 0], [0, -H*0.55, D*0.10], 5, 5, cm(0.8));
  K.rod(acc, [-W*0.10, H-cm(9), -D*0.16], [W*0.20, H-cm(9), -D*0.16], cm(2.0), 10);
  // 右中：攀岩板 + 抓手
  const rockX0 = W*0.10, rockX1 = W*0.34;
  K.beam(wood, [(rockX0+rockX1)/2, cm(1), D*0.30], [(rockX0+rockX1)/2, H-cm(8), D*0.13],

/* ---- QUADRO 模块化管件系统：彩色塑料管 + 黑色接头 + 彩色面板 ---- */
function qKit(C){
  const T = C.THREE, cm = C.cm, g = C.g, K = pgKit(C);
  const PAL = {r:0xd41b12, y:0xf7c800, g:0x008a37, b:0x0050a0, dg:0x005c26};
  const M = {};
  // 注意：clearcoat + 高 envMapIntensity 会给彩色塑料罩一层白，颜色直接变粉彩色
  for(const k in PAL) M[k] = C.M(PAL[k], {rough:.30, clear:.22, clearRough:.10, envI:.22, plastic:true});
  M.node = C.M(0x121316, {rough:.52, envI:.25, plastic:true});
  const TR = cm(2.0), NR = cm(2.9);            // 管半径 / 接头半尺寸
  const Q = {M, TR, NR, K};
  /* 一根管：胶囊管身 + 两端黑色立方接头 */
  Q.tube = (c, p0, p1)=>{
    K.rod(M[c] || M.r, p0, p1, TR, 9);
    for(const p of [p0, p1]){
      const n = new T.Mesh(new T.BoxGeometry(NR*2, NR*2, NR*2), M.node);   // 接头用简单盒子：数量多，倒角开销不值
      n.position.set(p[0], p[1], p[2]); n.castShadow = true; g.add(n);
    }
  };
  /* 一块面板：带边框的方板。plane: 'xz'(水平) | 'xy' | 'zy' */
  Q.panel = (c, cx, cy, cz, sx, sz, plane)=>{
    const t = cm(1.6);
    const dims = plane === 'xy' ? [sx, sz, t] : plane === 'zy' ? [t, sz, sx] : [sx, t, sz];
    const m = new T.Mesh(new T.BoxGeometry(dims[0], dims[1], dims[2]), M[c] || M.r);
    m.position.set(cx, cy, cz); m.castShadow = m.receiveShadow = true; g.add(m);
    // 面板中央的 QUADRO 压印（一小片深色圆角块）
    const lg = new T.Mesh(new T.BoxGeometry(Math.min(sx,sz)*0.34, cm(0.4), Math.min(sx,sz)*0.16),
      C.M(0x7a1410, {rough:.6}));
    if(plane === 'xz'){ lg.position.set(cx, cy + t/2 + cm(0.2), cz); g.add(lg); }
    return m;
  };
  /* 圆盘（方向盘 / 装饰轮） */
  Q.wheel = (c, x, y, z, r, axis)=>{
    const m = new T.Mesh(new T.CylinderGeometry(r, r, cm(2.2), 22), M[c] || M.y);
    m.position.set(x, y, z);
    if(axis === 'x') m.rotation.z = Math.PI/2; else if(axis === 'z') m.rotation.x = Math.PI/2;
    m.castShadow = true; g.add(m);
    const hub = new T.Mesh(new T.CylinderGeometry(r*0.16, r*0.16, cm(3.0), 12), M.r);
    hub.position.copy(m.position); hub.rotation.copy(m.rotation); g.add(hub);
    for(let i=0;i<4;i++){
      const sp = new T.Mesh(new T.BoxGeometry(r*1.5, cm(2.4), cm(2.0)), M[c] || M.y);
      sp.position.copy(m.position); sp.rotation.copy(m.rotation); sp.rotateY(i*Math.PI/4); g.add(sp);
    }
  };
  /* 一圈矩形框（四根管） */
  Q.ring = (cols, y, x0, x1, z0, z1)=>{
    Q.tube(cols[0], [x0,y,z0], [x1,y,z0]);
    Q.tube(cols[1], [x1,y,z0], [x1,y,z1]);
    Q.tube(cols[2], [x1,y,z1], [x0,y,z1]);
    Q.tube(cols[3], [x0,y,z1], [x0,y,z0]);
  };
  return Q;
}

  Q.tube('g', [x0, ym, z0], [x0, ym, z1]);                // 站板托梁

  Q.ring(['y','r','g','b'], ySide, x1, ex, z0, z1);
  for(const sz of [z0, z1]) Q.tube('b', [ex, yb, sz], [ex, ySide, sz]);
  Q.panel('y', (x1+ex)/2, ySide + cm(1.2), z0 + (z1-z0)*0.28, (ex-x1)-cm(1), (z1-z0)*0.5, 'xz');
  Q.panel('b', (x1+ex)/2, ySide + cm(1.2), z0 + (z1-z0)*0.76, (ex-x1)-cm(1), (z1-z0)*0.42, 'xz');

/* QUADRO A0140 大塔 + 超长滑梯 188×125×165 */
MODELS['qtower'] = (C)=>{
  const Q = qKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  // ---- 右侧塔身 ----
  const tx0 = W*0.10, tx1 = W/2 - Q.NR, tz0 = -D/2 + Q.NR, tz1 = D/2 - Q.NR;
  const yb = Q.NR, yDeck = H*0.42, yMid = H*0.66, yTop = H - Q.NR;
  Q.ring(['y','b','g','r'], yb,    tx0, tx1, tz0, tz1);
  Q.ring(['r','y','b','g'], yDeck, tx0, tx1, tz0, tz1);
  Q.ring(['g','r','y','b'], yMid,  tx0, tx1, tz0, tz1);
  Q.ring(['b','g','r','y'], yTop,  tx0, tx1, tz0, tz1);
  const corners = [[tx0,tz0,'r'],[tx1,tz0,'y'],[tx1,tz1,'b'],[tx0,tz1,'g']];
  for(const [sx,sz,c] of corners) Q.tube(c, [sx, yb, sz], [sx, yTop, sz]);
  Q.panel('b', (tx0+tx1)/2, yb + H*0.10, (tz0+tz1)/2, (tx1-tx0)-cm(1), (tz1-tz0)-cm(1), 'xz');   // 低层踏板
  Q.panel('r', (tx0+tx1)/2, yDeck + cm(1.2), (tz0+tz1)/2, (tx1-tx0)-cm(1), (tz1-tz0)-cm(1), 'xz'); // 出发平台
  Q.panel('dg', tx1 - cm(1), yMid - H*0.12, (tz0+tz1)/2, (tz1-tz0)-cm(2), H*0.22, 'zy');           // 侧挡板
  // 塔顶护栏
  Q.tube('y', [tx0, yTop, tz0], [tx0, yTop, tz1]);
  Q.tube('g', [tx0, yMid, tz0], [tx1, yMid, tz0]);
  // ---- 左侧超长滑梯 ----
  const sTopX = tx0, sBotX = -W/2 + Q.NR;
  const sTopY = yDeck, sBotY = yb;
  const shw = D*0.34;                                     // 半宽
  const cols = ['b','g','y','r'];
  for(let i=0;i<4;i++){
    const t0 = i/4, t1 = (i+1)/4;
    const cx = sTopX + (sBotX - sTopX)*(t0+t1)/2;
    const cy = sTopY + (sBotY - sTopY)*(t0+t1)/2 + cm(2);
    const seg = Math.hypot((sBotX-sTopX)/4, (sBotY-sTopY)/4);
    const p = Q.panel(cols[i], cx, cy, 0, seg, shw*2, 'xz');
    p.rotation.z = Math.atan2(-(sBotY-sTopY), -(sBotX-sTopX)) + Math.PI;
  }
  for(const sz of [-1, 1]){                               // 滑梯两侧护边
    Q.tube('y', [sTopX, sTopY + cm(9), sz*shw], [ (sTopX+sBotX)/2, (sTopY+sBotY)/2 + cm(9), sz*shw]);
    Q.tube('b', [(sTopX+sBotX)/2, (sTopY+sBotY)/2 + cm(9), sz*shw], [sBotX, sBotY + cm(9), sz*shw]);
    Q.tube('g', [sBotX, sBotY + cm(9), sz*shw], [sBotX, sBotY, sz*shw]);
  }
  Q.tube('r', [sBotX, yb, -shw], [sBotX, yb, shw]);
  Q.tube('y', [(sTopX+sBotX)/2, yb, -shw], [(sTopX+sBotX)/2, yb, shw]);   // 中支撑
  for(const sz of [-1,1]) Q.tube('g', [(sTopX+sBotX)/2, yb, sz*shw],
                                     [(sTopX+sBotX)/2, (sTopY+sBotY)/2, sz*shw]);
  Q.wheel('y', (sTopX+sBotX)*0.42, yb + H*0.16, shw + cm(3), cm(20), 'z');
};

/* ===== 逐商品模型：由官网商品图逐件建模（2026-09） ===== */
MODELS['ps2026-tbl'] = (C) => {
  const cm=C.cm, TH=C.THREE, W=C.w, D=C.d, H=C.h;
  const TT=cm(2.6), yU=H-TT;
  const birch=C.col.clone().lerp(new TH.Color(0xffffff),0.20);
  if(C.col2) birch.lerp(C.col2,0.16);
  const mTop=C.M(C.col,{wood:true,rough:.42,clear:.36,clearRough:.24});
  const mLeg=C.M(birch,{wood:true,rough:.46,clear:.30,clearRough:.28});
  const mRed=C.M(0xC4262E,{rough:.40,metal:.18,clear:.55,clearRough:.22});
  const mHw=C.m.steel;
  /* 松木实木厚板台面：平面四角圆角 + 边缘倒圆 */
  const bv=cm(0.35), rr=cm(1.8), hx=W/2, hz=D/2, tp=[];
  [[hx-rr,hz-rr,0],[rr-hx,hz-rr,Math.PI/2],[rr-hx,rr-hz,Math.PI],[hx-rr,rr-hz,Math.PI*1.5]]
    .forEach(c=>{ for(let i=0;i<=3;i++){ const a=c[2]+i*Math.PI/6; tp.push([c[0]+rr*Math.cos(a),c[1]+rr*Math.sin(a)]); } });
  C.ext(tp, TT, mTop, 0, H-bv, 0, 'xz', bv);
  /* 两组桦木 X 形交叉腿：位于短边方向的竖直面内，腿杆首尾按水平面切口 */
  const legX=W/2-cm(6.5), t=cm(3.4), lb=cm(0.3);
  const zT=D/2-cm(6.0), zB=D/2-cm(7.0);
  const e=cm(2.3)*Math.hypot(yU,zT+zB)/yU;
  const yX=yU*zB/(zT+zB);
  const legPts=(zt,zb)=>[[-zt-e,yU],[-zt+e,yU],[-zb+e,0],[-zb-e,0]];
  const pA=legPts(-zT,zB), pB=legPts(zT,-zB);
  [-1,1].forEach(s=>{
    const X=s*legX, xo=(s<0?X-t:X), xi=(s<0?X:X-t);
    C.ext(pA, t, mLeg, xo+lb, 0, 0, 'zy', lb);
    C.ext(pB, t, mLeg, xi+lb, 0, 0, 'zy', lb);
    /* 端头铰接横梁 + 折叠铰链 */
    C.box(t*2, cm(3.3), (zT-cm(2.5))*2, mLeg, X, yU-cm(3.3), 0);
    [-1,1].forEach(q=> C.box(t*2.2, cm(0.7), cm(5), mHw, X, yU-cm(0.8), q*(zT-cm(1.2))));
    /* 斜向支撑板：从交叉点斜升到台面下中部的安装座 */

MODELS['orfjall'] = (C) => {

  const prof=[[0,4.4],[27.2,4.25],[29.8,5.0],[29.8,6.6],[27.2,7.7],[0,9.9]].map(p=>[cm(p[0]),cm(p[1])]);

      const b = C.cyl(cm(0.55), cm(0.55), cm(0.3), bolt,

MODELS['raskog'] = (C) => {
  const T = C.THREE, cm = C.cm, hw = C.w / 2, hd = C.d / 2, H = C.h;
  const paint = C.M(C.col, {rough:.36, metal:.22, clear:.30, clearRough:.28});
  const dark  = C.M(C.col2 || 0x2f3236, {rough:.46, metal:.08});
  const grey  = C.m.steel, chrome = C.m.chrome;

  const tr = cm(0.85);
  const postX = cm(6.6), postZ = hd - cm(1.45);
  const railX = hw - tr - cm(0.35);
  const yRail = H * 0.1450, yPostBot = H * 0.2715, yPostTop = H - cm(0.45);
  const railEnd = cm(15.0), castZ = cm(18.3);
  const tHW = hw - cm(1.0), tHD = postZ - tr;

  const rrPath = (p, a, b, r) => {
    p.moveTo(a, b - r);
    p.absarc(a - r, b - r, r, 0, Math.PI / 2, false);
    p.lineTo(-(a - r), b);
    p.absarc(-(a - r), b - r, r, Math.PI / 2, Math.PI, false);
    p.lineTo(-a, -(b - r));
    p.absarc(-(a - r), -(b - r), r, Math.PI, Math.PI * 1.5, false);
    p.lineTo(a - r, -b);
    p.absarc(a - r, -(b - r), r, Math.PI * 1.5, Math.PI * 2, false);
    p.lineTo(a, b - r);
  };
  const emit = (shape, depth, bev, mat, y0) => {
    const geo = new T.ExtrudeGeometry(shape, {depth: Math.max(0.004, depth - 2 * bev),
      bevelEnabled: bev > 0, bevelSize: bev, bevelThickness: bev, bevelSegments: 2,
      curveSegments: 5, steps: 1});
    geo.rotateX(-Math.PI / 2); geo.computeVertexNormals();
    const mm = new T.Mesh(geo, mat);
    mm.position.set(0, y0 + bev, 0);
    mm.castShadow = mm.receiveShadow = true; C.g.add(mm); return mm;
  };
  const ring = (a, b, r, t, h, bev, mat, y0) => {
    const sh = new T.Shape(); rrPath(sh, a, b, r);
    const ho = new T.Path(); rrPath(ho, a - t, b - t, Math.max(cm(0.2), r - t));
    sh.holes.push(ho);
    return emit(sh, h, bev, mat, y0);
  };
  const meshFloor = (a, b, t, mat, y0) => {
    const sh = new T.Shape(); rrPath(sh, a, b, cm(1.4));
    const mx = a * 2 - cm(4.6), mz = b * 2 - cm(4.6);
    const nx = Math.max(3, Math.round(mx / cm(4.3))), nz = Math.max(3, Math.round(mz / cm(4.3)));   // 孔距放稀：原来 3.3cm 一件就 45k 面
    const px = mx / nx, pz = mz / nz, rx = px * 0.43, rz = pz * 0.43;
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
      const cx = -mx / 2 + (i + 0.5) * px, cz = -mz / 2 + (j + 0.5) * pz;
      const ph = new T.Path();
      ph.moveTo(cx, cz - rz); ph.lineTo(cx + rx, cz); ph.lineTo(cx, cz + rz);
      ph.lineTo(cx - rx, cz); ph.lineTo(cx, cz - rz);
      sh.holes.push(ph);
    }
    return emit(sh, t, 0, mat, y0);
  };
  const seg = (p, q, r, mat) => {
    const d = new T.Vector3(q[0] - p[0], q[1] - p[1], q[2] - p[2]);
    const L = d.length();
    const mm = C.tube(L, r, mat, (p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2, 'y');
    mm.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    return mm;
  };
  const bend = (pts, n, r, mat) => {
    const cv = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[1], p[2])), false, 'centripetal');
    const ps = cv.getPoints(n);
    for (let i = 0; i < n; i++) seg([ps[i].x, ps[i].y, ps[i].z], [ps[i + 1].x, ps[i + 1].y, ps[i + 1].z], r, mat);
  };

  for (const sx of [-1, 1]) {
    seg([sx * railX, yRail, -railEnd], [sx * railX, yRail, railEnd], tr, paint);
    for (const sz of [-1, 1]) {
      seg([sx * postX, yPostBot, sz * postZ], [sx * postX, yPostTop, sz * postZ], tr, paint);
      bend([
        [sx * postX, yPostBot + cm(5.0), sz * postZ],
        [sx * postX, yPostBot, sz * postZ],
        [sx * postX, yRail + cm(4.2), sz * postZ],
        [sx * (postX + cm(4.6)), yRail + cm(0.9), sz * (postZ - cm(0.2))],
        [sx * railX, yRail, sz * (postZ - cm(2.5))],
        [sx * railX, yRail, sz * railEnd],
        [sx * railX, yRail, sz * (railEnd - cm(4.0))]
      ], 7, tr, paint);
      C.cyl(cm(1.05), cm(1.0), cm(0.62), paint, sx * postX, yPostTop - cm(0.2), sz * postZ, 18);

      const sw = sx * (railX - cm(0.65)), wx = sx * (railX - cm(2.7)), cz = sz * castZ;
      C.lathe([[cm(0.05), 0], [cm(1.42), 0], [cm(1.52), cm(0.4)], [cm(1.52), cm(1.9)],
               [cm(1.05), cm(2.3)], [cm(0.95), cm(3.5)], [cm(0.58), cm(3.8)], [cm(0.58), cm(5.4)]],
              grey, sw, cm(5.3), cz, 18);

MODELS['figgy'] = (C) => {
  const acc  = C.col2 ? C.col.clone().lerp(C.col2, 0.5) : C.col.clone();
  const fab  = C.M(C.col, {fabric:true, rough:.93, sheen:.30});
  const web  = C.M(acc.clone().multiplyScalar(.84), {fabric:true, rough:.99});
  const zip  = C.M(acc.clone().multiplyScalar(.62), {rough:.45, metal:.20});
  const tagW = C.M(0xf2f0e8, {rough:.85});
  const tagG = C.M(0x3d7a4b, {rough:.85});
  const S = (w, h, d, r, mat, x, y, z, seg) => {
    const rr = Math.max(0.006, Math.min(r, w/4 - 0.002, h/4 - 0.002, d/2 - 0.004));
    return C.rb(Math.max(w - 2*rr, 0.01), Math.max(h - 2*rr, 0.01), d, rr, mat, x, y + rr, z, seg);
  };
  const pad = C.cm(0.6);
  const grip = (fx, fy, fz, dir) => {
    const L = C.cm(20), th = C.cm(3.2), t = C.cm(1.2);
    const eh = th + C.cm(1.6), ew = C.cm(3.4);
    if (dir === 0) {
      S(L, th, t, C.cm(0.35), web, fx, fy - th/2, fz + pad - t/2, 2);
      for (const s of [-1,1])
        S(ew, eh, t*0.86, C.cm(0.3), web, fx + s*(L/2 - ew/2), fy - eh/2, fz + pad - t*0.63, 2);
    } else {
      S(t, th, L, C.cm(0.35), web, fx + dir*(pad - t/2), fy - th/2, fz, 2);
      for (const s of [-1,1])
        S(t*0.86, eh, ew, C.cm(0.3), web, fx + dir*(pad - t*0.63), fy - eh/2, fz + s*(L/2 - ew/2), 2);
    }
  };
  const tag = (x, y, z, dir) => {
    if (dir === 0) {
      S(C.cm(4.2), C.cm(2.6), C.cm(0.7), C.cm(0.12), tagW, x, y, z, 2);
      S(C.cm(2.6), C.cm(0.7), C.cm(0.8), C.cm(0.1), tagG, x, y + C.cm(0.95), z, 2);
    } else {
      S(C.cm(0.7), C.cm(2.6), C.cm(4.2), C.cm(0.12), tagW, x, y, z, 2);
      S(C.cm(0.8), C.cm(0.7), C.cm(2.6), C.cm(0.1), tagG, x, y + C.cm(0.95), z, 2);
    }
  };
  const gap = C.cm(1.2);
  const bw = (C.w - gap)/2 - pad, bd = C.d - pad, bt = C.seatH/2, zc = -pad/2;
  const deckR = C.w/2 - pad, deckF = C.d/2 - pad, deckB = -C.d/2;
  for (const sx of [-1,1]) {
    const cx = sx*(bw + gap)/2;
    for (let lv = 0; lv < 2; lv++) {
      const y = lv*bt;
      S(bw, bt, bd, C.cm(3.2), fab, cx, y, zc, 4);
      S(bw - C.cm(13), C.cm(0.7), C.cm(0.5), C.cm(0.2), zip, cx, y + C.cm(1.5), deckF - C.cm(0.16), 2);
      grip(cx, y + bt/2, deckF, 0);
      grip(sx*deckR, y + bt/2, zc + C.cm(3), sx);
    }
    S(bw - C.cm(11), C.cm(1.6), bd - C.cm(11), C.cm(0.8), fab, cx, C.seatH - C.cm(1.1), zc, 3);
  }
  tag(deckR - C.cm(16), C.seatH - C.cm(4.4), deckF - C.cm(0.1), 0);
  const bolW = C.cm(55.9), bolD = C.cm(27.9), bolH = C.h - C.seatH - C.cm(0.4), g2 = C.cm(0.9);
  const bz = deckB + bolD/2;
  for (const sx of [-1,1]) {
    const bx = sx*(bolW + g2)/2;
    S(bolW, bolH, bolD, C.cm(4.2), fab, bx, C.seatH, bz, 4);
    S(bolW - C.cm(10), C.cm(1.4), bolD - C.cm(8), C.cm(0.7), fab, bx, C.seatH + bolH - C.cm(1.0), bz, 3);
    S(bolW - C.cm(14), C.cm(0.7), C.cm(0.5), C.cm(0.2), zip, bx, C.seatH + C.cm(2.4), bz + bolD/2 - C.cm(0.16), 2);
    grip(bx, C.seatH + bolH*0.48, bz + bolD/2, 0);
  }
  const wW = C.cm(55.9), wL = C.cm(38.1), wH = C.cm(27.9);
  const rin = (wL + wH - Math.hypot(wL, wH))/2, bev = Math.min(C.cm(1.7), rin*0.45);
  const k = (rin - bev)/rin, ix = wL - rin, iy = rin;
  const P = (px, py) => [ix + k*(px - ix), iy + k*(py - iy)];
  const wx = deckR - wL, wzF = deckF;
  C.ext([P(0,0), P(wL,0), P(wL,wH)], wW, fab, wx, C.seatH, wzF - wW + bev, 'xy', bev);
  S(C.cm(0.5), C.cm(0.7), wW - C.cm(12), C.cm(0.2), zip, deckR - C.cm(0.16), C.seatH + C.cm(1.5), wzF - wW/2, 2);
  grip(deckR, C.seatH + wH*0.42, wzF - wW/2, 1);
  tag(deckR - C.cm(0.1), C.seatH + C.cm(4.6), wzF - C.cm(10), 1);
};

   实物尺寸 55×27.5×21.2 英寸，坐高 9.4 英寸（两层 4.7 英寸叠起来）。 */

MODELS['hw02e'] = (C) => {

  const alu   = C.M(0xd7dade, {rough:.26, metal:.72, envI:.8});

  for(const sz of [-1,1]) C.rb(BW, cm(1.8), cm(4.2), cm(0.8), white, 0, 0, sz*(BD/2 - cm(2.1)), 2);
  // 立柱（上细下粗一点点）+ 中部旋钮

  C.box(PW - cm(2.4), cm(0.5), PD - cm(2.4), panel, 0, H - cm(0.75), 0);         // 上发光面

};
MODELS['lunix'] = (C) => {
  const cm = C.cm, W = C.w, D = C.d, H = C.h;
  const IN = (v)=> cm(v*2.54);
  // sheen 是丝绒的关键，但给大了整块会被冲成白的（第一版 .55 就白了）
  const vel  = C.M(C.col, {fabric:true, rough:.94, sheen:.22, sheenColor:0xffffff, envI:.14});
  const velD = C.M(new C.THREE.Color(C.col).multiplyScalar(.86), {fabric:true, rough:.96, sheen:.16, envI:.12});
  const velL = C.M(new C.THREE.Color(C.col).lerp(new C.THREE.Color(0xffffff), 0.05),
                   {fabric:true, rough:.92, sheen:.26, envI:.15});
  const zipM = C.M(new C.THREE.Color(C.col).multiplyScalar(.55), {rough:.5, metal:.25});
  const T = IN(4.7);                                  // 单块海绵厚度
  const seatD = IN(27.5), pieceW = IN(27.5);
  const backH = IN(11.8), cylR = IN(11.8)/2;
  const R = cm(2.6);                                  // 海绵圆角

  /* 沙发本体只占 55"x27.5"，散件摆在它外面。把沙发挪到整个占地的后左角，
     前面和右边留出散件区——这样 spec 的 w/d 就是「沙发 + 散件」的真实占地。 */
  const SOFA_W = IN(55), SOFA_D = IN(27.5);
  const OX = 0, OZ = 0;    // 沙发放在模型原点；散件按相对沙发的固定英寸偏移摆，
                           // 最后统一把整组重心归零。不要用 W/D 推位置——
                           // 那样改 spec 尺寸又会反过来改变包围盒，来回收敛不了。

  const foam = (w,h,d,mat,x,y,z,r)=>{
    const rr = Math.max(0.006, Math.min(r==null?R:r, w/2.2, h/2.2, d/2.2));
    return C.rb(w, h, d, rr, mat, x, y, z, 3);
  };
  const zip = (len,x,y,z,axis)=>{
    const t = cm(0.9);
    if(axis==='x') foam(len, t, t, zipM, x, y, z, t*0.45);
    else           foam(t, t, len, zipM, x, y, z, t*0.45);
  };

  // ---- 沙发形态：底座两层各两块 ----
  for(let lv=0; lv<2; lv++){
    for(const sx of [-1,1]){
      const cx = OX + sx*pieceW/2;
      foam(pieceW - cm(0.8), T, seatD - cm(0.8), lv? velL : vel, cx, lv*T, OZ);
      zip(pieceW - cm(3), cx, lv*T + T - cm(0.5), OZ + seatD/2 - cm(0.6), 'x');
    }
  }
  const seatTop = 2*T;
  // ---- 靠背 ----
  for(const sx of [-1,1])
    foam(pieceW - cm(0.8), backH, T, vel, OX + sx*pieceW/2, seatTop, OZ - (SOFA_D/2 - T/2));
  zip(SOFA_W - cm(6), OX, seatTop + backH - cm(0.6), OZ - (SOFA_D/2 - T - cm(0.3)), 'x');
  // ---- 扶手 ----
  for(const sx of [-1,1])
    foam(T, T, seatD - cm(1.6), velD, OX + sx*(SOFA_W/2 - T/2), seatTop, OZ + cm(1.0));
  // ---- 圆柱抱枕 ----
  for(const sx of [-1,1]){
    const cyl = new C.THREE.Mesh(
      new C.THREE.CylinderGeometry(cylR, cylR, IN(11.8) - cm(1.0), 26, 1, false), velL);
    cyl.rotation.x = Math.PI/2;
    cyl.position.set(OX + sx*IN(13.0), seatTop + cylR, OZ - (SOFA_D/2 - T - cylR + cm(1.2)));
    cyl.castShadow = cyl.receiveShadow = true; C.g.add(cyl);
    for(const sz of [-1,1]){
      const cap = new C.THREE.Mesh(new C.THREE.TorusGeometry(cylR - cm(1.0), cm(0.7), 8, 24), velD);
      cap.position.set(OX + sx*IN(13.0), seatTop + cylR,
        OZ - (SOFA_D/2 - T - cylR + cm(1.2)) + sz*(IN(11.8)/2 - cm(0.6)));
      C.g.add(cap);
    }
  }

  /* ---- 剩下 6 块搭堡垒的配件：散放在沙发前面和右边 ----
     摆成沙发时它们本来就是散在地上的，所以 spec 的占地把这块地也算进去。
     每块都用 Group 包一层：mesh 自己负责"形状+落地"，Group 只负责绕竖轴转向。
     直接给 mesh 叠 rotation.x + rotation.y 会按 XYZ 欧拉序复合，把块转翻、沉到地板以下。 */
  const FZ = SOFA_D/2 + IN(11);       // 散件区中心：沙发前沿再往外 11 英寸
  const place = (mesh, ang, px, pz)=>{
    const holder = new C.THREE.Group();
    C.g.remove(mesh); holder.add(mesh);
    holder.rotation.y = ang;
    holder.position.set(px, 0, pz);
    C.g.add(holder);
    return holder;
  };
  const BV = cm(1.6);                 // ExtrudeGeometry 的倒角外扩量

  // 带圆孔的方块 ×2：竖着立在地上
  for(const i of [0,1]){
    const sq = IN(13.75), hole = IN(5.4);
    const sh = new C.THREE.Shape();
    sh.moveTo(-sq/2,-sq/2); sh.lineTo(sq/2,-sq/2); sh.lineTo(sq/2,sq/2); sh.lineTo(-sq/2,sq/2); sh.closePath();
    const hp = new C.THREE.Path(); hp.absarc(0, 0, hole, 0, Math.PI*2, true); sh.holes.push(hp);
    const geo = new C.THREE.ExtrudeGeometry(sh, {depth:T - 2*BV, bevelEnabled:true, bevelSize:BV,
      bevelThickness:BV, bevelSegments:2, curveSegments:16});
    geo.computeVertexNormals();
    const mm = new C.THREE.Mesh(geo, i? velD : vel);
    mm.position.set(0, sq/2 + BV, 0);                 // 抬到地面之上
    mm.castShadow = mm.receiveShadow = true; C.g.add(mm);
    place(mm, i? -0.42 : 0.34, -SOFA_W/2 + IN(9) + i*IN(15.5), FZ + (i? IN(4.5) : -IN(3)));
  }

  // 半圆柱 ×2：直边贴地、拱面朝上。
  // 用半圆形状直接挤出，不靠 CylinderGeometry + 旋转——那样很容易转成圆面朝下，
  // 整块沉到地板以下正好一个半径（实测 -17.5cm）。
  for(const i of [0,1]){
    const rr = IN(6.9);
    const sh = new C.THREE.Shape();
    sh.moveTo(-rr, 0); sh.lineTo(rr, 0);
    sh.absarc(0, 0, rr, 0, Math.PI, false);
    sh.closePath();
    const geo = new C.THREE.ExtrudeGeometry(sh, {depth:T, bevelEnabled:false, curveSegments:22});
    geo.computeVertexNormals();
    const mm = new C.THREE.Mesh(geo, i? vel : velL);
    mm.position.set(0, 0, -T/2);
    mm.castShadow = mm.receiveShadow = true; C.g.add(mm);
    place(mm, i? 0.5 : 2.4, IN(6) + i*IN(12), FZ + (i? -IN(6) : IN(7)));
  }

  // 直角三棱柱 ×2：躺平放，一块紧挨着另一块叠了半块高
  for(const i of [0,1]){
    const wg = IN(11.8);
    const mm = C.ext([[0,0],[wg,0],[0,wg]], T, i? velL : velD, 0,0,0, 'xz');
    mm.position.set(-wg/2, T + (i? T : 0), -wg/2);    // 'xz' 的挤出方向是 -y，所以整体抬 T
    mm.castShadow = mm.receiveShadow = true;
    place(mm, i? -2.35 : 0.62, SOFA_W/2 - IN(2) + i*IN(3), FZ + (i? IN(8) : -IN(5)));
  }

  /* 把整组的水平重心归到原点：2D 图例和碰撞检测都假定家具原点 = 占地中心，
     散件挂在一侧会把重心带偏。 */
  C.g.updateMatrixWorld(true);
  const bb = new C.THREE.Box3().setFromObject(C.g);
  const off = new C.THREE.Vector3();
  bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x -= off.x; ch.position.z -= off.z; }
};
MODELS['kallax-a'] = (C) => {
  const W = C.w, D = C.d, H = C.h;
  const F  = C.cm(3.9);
  const T  = C.cm(1.6);
  const EB = C.cm(0.16);
  const CELL = C.cm(33.5);
  const cols = Math.max(1, Math.round((W - 2*F + T) / (CELL + T)));
  const rows = Math.max(1, Math.round((H - 2*F + T) / (CELL + T)));
  const innerW = W - 2*F, innerH = H - 2*F;
  const cw = (innerW - (cols - 1) * T) / cols;
  const ch = (innerH - (rows - 1) * T) / rows;
  const body = C.M(C.col, {rough:.80});
  const edge = C.M(C.col2 ? C.col.clone().lerp(C.col2, .55) : C.col, {rough:.50});
  const fitM = C.M(C.col.clone().lerp(new C.THREE.Color(0xdadad6), .55), {rough:.45});
  const core = D - 2*EB, zb = (D - EB) / 2;
  const plate = (w, h, x, y, ends) => {
    const wc = ends ? w - 2*EB : w;
    C.box(wc, h, core, body, x, y, 0);
    C.box(wc, h, EB, edge, x, y,  zb);
    C.box(wc, h, EB, edge, x, y, -zb);
    if (ends) for (const s of [-1, 1]) C.box(EB, h, D, edge, x + s * (w - EB) / 2, y, 0);
  };
  plate(W, F, 0, 0, 1);
  plate(W, F, 0, H - F, 1);
  for (const s of [-1, 1]) plate(F, innerH, s * (W - F) / 2, F, 0);
  C.rep(rows - 1, (j) => plate(innerW, T, 0, F + (j + 1) * ch + j * T, 0));
  for (let i = 1; i < cols; i++) {
    const x = -W/2 + F + i * cw + (i - 0.5) * T;
    C.rep(rows, (r) => plate(T, ch, x, F + r * (ch + T), 0));
  }
  const fx = -W/2 + F + cw * 0.72, fz = -D/2 + C.cm(6);
  C.box(C.cm(3.8), C.cm(5.0), C.cm(1.1), fitM, fx, H - F - C.cm(5.0), fz);
  C.box(C.cm(2.2), C.cm(1.0), C.cm(4.0), fitM, fx, H - F - C.cm(1.0), fz - C.cm(1.5));
};

  plate(W, F, 0, 0, 1);
  plate(W, F - CAP, 0, H - F, 1);
  for (const s of [-1, 1]) plate(F, innerH, s * (W - F) / 2, F, 0);

  const vx = [-(W - F) / 2, (W - F) / 2];

    const x = -W / 2 + F + i * cw + (i - 0.5) * T;

    C.box(C.cm(4.4), C.cm(4.4), C.cm(2.4), brkM, s * (W / 2 - F - C.cm(2.2)), H - F - C.cm(5.6), -D / 2 + C.cm(9));
    C.box(C.cm(2.0), C.cm(1.2), C.cm(3.6), brkM, s * (W / 2 - F - C.cm(1.0)), H - F - C.cm(1.2), -D / 2 + C.cm(7.6));

};
MODELS['kallax-d'] = (C) => {
  const W = C.w, D = C.d, H = C.h;
  const F = C.cm(3.9), T = C.cm(1.6);
  const iw = W - 2 * F, ih = H - 2 * F;
  const cols = Math.max(1, Math.round((iw + T) / (C.cm(33.5) + T)));
  const rows = Math.max(1, Math.round((ih + T) / (C.cm(33.5) + T)));
  const cw = (iw - (cols - 1) * T) / cols;
  const ch = (ih - (rows - 1) * T) / rows;
  const eb = C.cm(0.55), er = C.cm(0.18), cd = D - C.cm(0.9);
  const zV = D / 2 - eb / 2, zH = zV - C.cm(0.07);
  const tint = (t) => C.col.clone().lerp(C.col2 || C.col, 0.4).multiplyScalar(t);
  const face = C.M(C.col, {rough: .80, clear: .06, clearRough: .55});
  const edge = C.M(C.col.clone().lerp(C.col2 || C.col, 0.15), {rough: .55, clear: .22, clearRough: .30});
  const dkS = C.M(tint(.92), {rough: .86});
  const dkU = C.M(tint(.97), {rough: .84});
  const dkD = C.M(tint(.84), {rough: .88});
  const mSideL = [dkS, face, face, dkS, edge, edge];
  const mSideR = [face, dkS, face, dkS, edge, edge];
  const mTop = [face, face, face, dkD, edge, edge];
  const mBot = [face, face, dkU, dkS, edge, edge];
  const mVert = [dkS, dkS, face, face, edge, edge];
  const mShelf = [face, face, dkU, dkD, edge, edge];
  const band = (w, h, x, y, z) => C.rb(w - 2 * er, h - 2 * er, eb, er, edge, x, y + er, z, 3);
  const vx = [], sy = [], cx = [];
  for (let i = 0; i < cols; i++) {
    cx.push(-W / 2 + F + i * (cw + T) + cw / 2);
    if (i < cols - 1) vx.push(-W / 2 + F + (i + 1) * cw + i * T + T / 2);
  }
  for (let r = 0; r < rows - 1; r++) sy.push(F + (r + 1) * ch + r * T);
  C.box(F, H, cd, mSideL, -W / 2 + F / 2, 0, 0);
  C.box(F, H, cd, mSideR, W / 2 - F / 2, 0, 0);
  C.box(iw, F, cd, mBot, 0, 0, 0);
  C.box(iw, F, cd, mTop, 0, H - F, 0);
  for (const x of vx) C.box(T, ih, cd, mVert, x, F, 0);
  for (const y of sy) for (const x of cx) C.box(cw, T, cd, mShelf, x, y, 0);
  for (const s of [1, -1]) {
    band(F, H, -W / 2 + F / 2, 0, s * zV);
    band(F, H, W / 2 - F / 2, 0, s * zV);
    band(iw, F, 0, 0, s * zH);
    band(iw, F, 0, H - F, s * zH);
    for (const x of vx) band(T, ih, x, F, s * zV);
    for (const y of sy) band(iw, T, 0, y, s * zH);
  }
  const fit = C.M(C.col.clone().lerp(new C.THREE.Color(0xf2efe8), .45), {rough: .5});
  const fz = -D / 2 + C.cm(4.2);
  for (const fx of (cols > 2 ? [cx[1], cx[cols - 2]] : [0])) {
    C.box(C.cm(3.6), C.cm(4.6), C.cm(1.0), fit, fx, H - F - C.cm(4.6), fz);
    C.box(C.cm(2.2), C.cm(0.9), C.cm(3.4), fit, fx, H - F - C.cm(0.9), fz - C.cm(1.2));
  }
};

MODELS['wk-mat'] = (C) => {

MODELS['bergmund-bar'] = (C) => {
  const cm = C.cm, T = C.THREE;
  /* BERGMUND 吧凳（座高62cm）：染色实木四腿四面微外撇，
     Gunnared 平织布罩把座面与靠背整体包起来（下缘一圈缝边），
     两侧与后方各一道高横撑、前方一道低横撑作踏脚并压一条不锈钢踏脚片。 */
  const fabC = C.col2 ? C.col2.clone() : C.col.clone().lerp(new T.Color(0xffffff), .55);
  const wood  = C.M(C.col, {wood:'beech', rough:.54, clear:.20, clearRough:.28, envI:.24});
  const fab   = C.M(fabC,  {fabric:true, rough:.94, envI:.17, sheen:.16});
  const fabD  = C.M(fabC.clone().multiplyScalar(.82), {fabric:true, rough:.96, envI:.14});
  const steel = C.M(0xd2d5d8, {metal:.55, rough:.38, envI:.30});   // 拉丝不锈钢踏脚片（金属度压低，否则整条映成天空蓝）

  /* [x, y, 圆角半径]（cm）→ 圆角多边形（ft） */
  const rp = (pts) => { const o = [], n = pts.length;
    for(let i=0;i<n;i++){ const p=pts[i], a=pts[(i+n-1)%n], b=pts[(i+1)%n];
      const l1=Math.hypot(a[0]-p[0],a[1]-p[1])||1e-4, l2=Math.hypot(b[0]-p[0],b[1]-p[1])||1e-4;
      const u1=[(a[0]-p[0])/l1,(a[1]-p[1])/l1], u2=[(b[0]-p[0])/l2,(b[1]-p[1])/l2];
      const ang=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
      const t=Math.min(p[2]/Math.max(.05,Math.tan(ang/2)), l1*.5, l2*.5);
      const A=[p[0]+u1[0]*t,p[1]+u1[1]*t], B=[p[0]+u2[0]*t,p[1]+u2[1]*t];
      for(let k=0;k<=7;k++){ const s=k/7, m=1-s;
        o.push([cm(m*m*A[0]+2*m*s*p[0]+s*s*B[0]), cm(m*m*A[1]+2*m*s*p[1]+s*s*B[1])]); } }
    return o; };

  /* ---------- 四条方料腿：上端 4.3cm 见方，落地收到 3.5cm，前后左右都微外撇 ---------- */
  const LT = 51.6;                                  // 腿顶（座箱下沿）
  const legPos = [[1,1],[-1,1],[1,-1],[-1,-1]];     // [sx, sz]，sz=+1 为正面
  for(const [sx,sz] of legPos){
    const bx = sx*19.4, bz = sz*(sz>0 ? 21.7 : 21.2);
    const tx = sx*16.4, tz = sz*(sz>0 ? 14.6 : 13.4);
    const dx = cm(tx-bx), dy = cm(LT), dz = cm(tz-bz), L = Math.hypot(dx,dy,dz);
    const lift = cm(2.475) * Math.hypot(dx,dz) / L;       // 斜柱底面最低角抬到 y=0
    const m = C.cyl(cm(3.041), cm(2.475), L, wood, cm(bx+tx)/2, lift + dy/2 - L/2, cm(bz+tz)/2, 4);
    m.geometry.rotateY(Math.PI/4);                  // 4 边柱转成正方向（面朝 x/z）
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), new T.Vector3(dx/L,dy/L,dz/L));
  }

  /* ---------- 横撑：两侧 + 后方在 27cm，前方压到 17.5cm 当踏脚 ---------- */
  const legX = (y)=> 19.4 + (16.4-19.4)*(y/LT);
  const legZF = (y)=> 21.7 + (14.6-21.7)*(y/LT);
  const legZB = (y)=> -21.2 + (-13.4+21.2)*(y/LT);
  const yS = 27.0, yF = 17.5;
  for(const sx of [-1,1])
    C.rb(cm(2.3), cm(3.9), cm(legZF(yS)-legZB(yS)), cm(.45), wood,
         sx*cm(legX(yS)), cm(yS-1.95), cm(legZF(yS)+legZB(yS))/2, 2);
  C.rb(cm(2*legX(yS)-3.4), cm(3.9), cm(2.3), cm(.45), wood, 0, cm(yS-1.95), cm(legZB(yS)), 2);
  C.rb(cm(2*legX(yF)-3.4), cm(3.9), cm(2.3), cm(.45), wood, 0, cm(yF-1.95), cm(legZF(yF)), 2);
  /* 不锈钢踏脚片压在前横撑顶面 */
  C.rb(cm(29.0), cm(.4), cm(3.0), cm(.15), steel, 0, cm(yF+1.85), cm(legZF(yF)), 2);

  /* ---------- 软包座面：梯形（前宽后窄）圆角块 + 顶部微鼓 + 下缘一圈布罩缝边 ---------- */
  const seatPoly = (bv, ex) => rp([
    [-(22.15+ex-bv),  19.15+ex-bv, Math.max(.5, 5.2-bv)],
    [-(21.15+ex-bv), -(18.75+ex-bv), Math.max(.4, 3.6-bv)],
    [ (21.15+ex-bv), -(18.75+ex-bv), Math.max(.4, 3.6-bv)],
    [ (22.15+ex-bv),  19.15+ex-bv, Math.max(.5, 5.2-bv)]]);
  C.ext(seatPoly(1.7, 0),    cm(10.2), fab,  0, cm(61.4-1.7), 0, 'xz', cm(1.7));   // 座箱 51.2~61.4
  C.ext(seatPoly(.9, -1.7),  cm(2.6),  fab,  0, cm(62.0-.9),  0, 'xz', cm(.9));    // 顶面微鼓 59.4~62.0
  C.ext(seatPoly(.5, .25),   cm(1.4),  fabD, 0, cm(53.6-.5),  0, 'xz', cm(.5));    // 布罩下缘缝边

  /* ---------- 靠背：上窄下宽、顶部大圆角的软包板，后倾 10.9° ---------- */
  const TR = .19, cB = Math.cos(TR), sB = Math.sin(TR);
  const backPoly = (bv, ex) => rp([
    [-(19.5+ex-bv), -(2.0+ex-bv), 1.8],
    [ (19.5+ex-bv), -(2.0+ex-bv), 1.8],
    [ (17.3+ex-bv),  33.6+ex-bv,  8.4],
    [-(17.3+ex-bv),  33.6+ex-bv,  8.4]]);
  /* 主板：厚 7cm，顶点落在 h=97，后缘落在 z=-24 */
  const bpy = 97.0 - (33.6*cB + 5.4*sB), bpz = -24.0 + (33.6*sB + 1.6*cB);
  C.ext(backPoly(1.6, 0), cm(7.0), fab, 0, cm(bpy), cm(bpz), 'xy', cm(1.6)).rotation.x = -TR;
  /* 正面软垫：沿背板法向前移 5.8cm */
  C.ext(backPoly(.8, -2.4), cm(2.2), fab, 0, cm(bpy+5.8*sB), cm(bpz+5.8*cB), 'xy', cm(.8)).rotation.x = -TR;
  /* 布罩沿边一圈明缝（前后各一道，夹在厚度中间） */
  C.ext(backPoly(.35, .15), cm(1.0), fabD, 0, cm(bpy+2.35*sB), cm(bpz+2.35*cB), 'xy', cm(.35)).rotation.x = -TR;

  C.g.updateMatrixWorld(true);
  const bb = new T.Box3().setFromObject(C.g), off = new T.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x -= off.x; ch.position.z -= off.z; }
};

MODELS['skogsta-stool'] = (C) => {
  const cm = C.cm, T = C.THREE;
  /* SKOGSTA 吧凳（座高62cm）：全实木相思木温莎式——
     圆车腿四面大外撇、实木马鞍座、弯木半圆背弓 + 3 根车圆背档、四面圆棒横撑（前后低、两侧高）。 */
  const woodC = C.col.clone(); woodC.offsetHSL(0, .10, -.02);   // 相思木比目录色再暖一档
  /* 相思木本色偏暖：envMapIntensity / clearcoat 一高就把饱和度冲没（见 AGENTS.md §5.4），压到 .22 才留得住木色 */
  const wood  = C.M(woodC, {wood:'birch', rough:.54, clear:.13, clearRough:.30, envI:.22});
  const woodD = C.M(woodC.clone().multiplyScalar(.86), {wood:'birch', rough:.58, clear:.10, envI:.20});
  const screw = C.M(0x8b9096, {metal:.85, rough:.34, envI:.8});
  const V = T.Vector3;

  const rp = (pts) => { const o = [], n = pts.length;
    for(let i=0;i<n;i++){ const p=pts[i], a=pts[(i+n-1)%n], b=pts[(i+1)%n];
      const l1=Math.hypot(a[0]-p[0],a[1]-p[1])||1e-4, l2=Math.hypot(b[0]-p[0],b[1]-p[1])||1e-4;
      const u1=[(a[0]-p[0])/l1,(a[1]-p[1])/l1], u2=[(b[0]-p[0])/l2,(b[1]-p[1])/l2];
      const ang=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
      const t=Math.min(p[2]/Math.max(.05,Math.tan(ang/2)), l1*.5, l2*.5);
      const A=[p[0]+u1[0]*t,p[1]+u1[1]*t], B=[p[0]+u2[0]*t,p[1]+u2[1]*t];
      for(let k=0;k<=7;k++){ const s=k/7, m=1-s;
        o.push([cm(m*m*A[0]+2*m*s*p[0]+s*s*B[0]), cm(m*m*A[1]+2*m*s*p[1]+s*s*B[1])]); } }
    return o; };

  /* ---------- 四条车圆腿：脚下 Ø3.2、腿顶 Ø4.2，前后左右都大幅外撇 ---------- */
  const LT = 59.0, rB = 1.45, rT = 2.2;
  const foot = (sx,sz)=>[sx*18.9, sz*21.4], top = (sx,sz)=>[sx*13.8, sz*12.6];
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const f = foot(sx,sz), t = top(sx,sz);
    const dx = cm(t[0]-f[0]), dz = cm(t[1]-f[1]), dy = cm(LT), L = Math.hypot(dx,dy,dz);
    const lift = cm(rB) * Math.hypot(dx,dz) / L;               // 斜柱底面圆盘最低点抬到 y=0
    const m = C.cyl(cm(rT), cm(rB), L, wood,
                    cm(f[0]+t[0])/2, lift + dy/2 - L/2, cm(f[1]+t[1])/2, 16);
    m.quaternion.setFromUnitVectors(new V(0,1,0), new V(dx/L,dy/L,dz/L));
  }
  const legX = (y)=> 18.9 + (13.8-18.9)*(y/LT), legZ = (y)=> 21.4 + (12.6-21.4)*(y/LT);

  /* ---------- 圆棒横撑：前后 20cm（前撑当踏脚），两侧 25cm，端头带一颗螺钉 ---------- */
  const yA = 20.0, yB = 25.0;
  for(const sz of [-1,1]){
    C.tube(cm(2*legX(yA)), cm(1.55), wood, 0, cm(yA), sz*cm(legZ(yA)), 'x');
    for(const sx of [-1,1]) C.cyl(cm(.42), cm(.42), cm(.5), screw,
      sx*cm(legX(yA)-1.2), cm(yA+1.3), sz*cm(legZ(yA)), 10);
  }
  for(const sx of [-1,1]){
    C.tube(cm(2*legZ(yB)), cm(1.15), wood, sx*cm(legX(yB)), cm(yB), 0, 'z');
    for(const sz of [-1,1]) C.cyl(cm(.38), cm(.38), cm(.5), screw,
      sx*cm(legX(yB)), cm(yB+.95), sz*cm(legZ(yB)-1.0), 10);
  }

  /* ---------- 实木马鞍座：中段最宽的圆润六边轮廓，厚 3.6cm，下缘倒角一圈 ---------- */
  const seatPoly = (bv, ex) => rp([
    [-(17.0+ex-bv),  18.0+ex-bv, 6.5],
    [-(20.4+ex-bv),   2.0+ex-bv, 11.0],
    [-(16.0+ex-bv), -(18.5+ex-bv), 6.0],
    [ (16.0+ex-bv), -(18.5+ex-bv), 6.0],
    [ (20.4+ex-bv),   2.0+ex-bv, 11.0],
    [ (17.0+ex-bv),  18.0+ex-bv, 6.5]]);
  C.ext(seatPoly(.9, 0),   cm(3.6), wood,  0, cm(62.0-.9), 0, 'xz', cm(.9));      // 58.4~62.0
  C.ext(seatPoly(.5, -1.6),cm(1.6), woodD, 0, cm(58.6-.5), 0, 'xz', cm(.5));      // 座下收口

  /* ---------- 背弓：半圆形弯木带（下端两根立柱插进座面），后倾 11.5° ---------- */
  const TB = .20, cB = Math.cos(TB), sB = Math.sin(TB);
  const yc = 14.5, Ro = 13.8, Ri = 11.5, y0 = -4.5, xo0 = 14.5, xi0 = 9.7;
  const bow = [], NS = 7, NA = 20;
  for(let i=0;i<=NS;i++){ const t=i/NS; bow.push([cm(-(xo0+(Ro-xo0)*t)), cm(y0+(yc-y0)*t)]); }
  for(let i=1;i<NA;i++){ const a=Math.PI-i/NA*Math.PI; bow.push([cm(Ro*Math.cos(a)), cm(yc+Ro*Math.sin(a))]); }
  for(let i=NS;i>=0;i--){ const t=i/NS; bow.push([cm(xo0+(Ro-xo0)*t), cm(y0+(yc-y0)*t)]); }
  for(let i=0;i<=NS;i++){ const t=i/NS; bow.push([cm(xi0+(Ri-xi0)*t), cm(y0+(yc-y0)*t)]); }
  for(let i=1;i<NA;i++){ const a=i/NA*Math.PI; bow.push([cm(Ri*Math.cos(a)), cm(yc+Ri*Math.sin(a))]); }
  for(let i=NS;i>=0;i--){ const t=i/NS; bow.push([cm(-(xi0+(Ri-xi0)*t)), cm(y0+(yc-y0)*t)]); }
  const bpy = 91.0 - (29.0*cB + 1.7*sB), bpz = -13.5 - (-4.5*sB + .5*cB);
  C.ext(bow, cm(2.4), wood, 0, cm(bpy), cm(bpz), 'xy', cm(.7)).rotation.x = -TB;

  /* ---------- 3 根车圆背档：由座面直插内弧 ---------- */
  const bx = (lx,ly,lz)=>[cm(lx), cm(bpy + ly*cB + lz*sB), cm(bpz - ly*sB + lz*cB)];
  for(const lx of [-7.2, 0, 7.2]){
    const yTop = yc + Math.sqrt(Math.max(0, (Ri-.7)*(Ri-.7) - lx*lx)) + .6, yBot = -3.5;
    const p = bx(lx, (yTop+yBot)/2, 1.2), L = cm(yTop-yBot);
    const m = C.cyl(cm(.78), cm(.95), L, wood, p[0], p[1]-L/2, p[2], 14);
    m.rotation.x = -TB;
  }

  C.g.updateMatrixWorld(true);
  const bb = new T.Box3().setFromObject(C.g), off = new T.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x -= off.x; ch.position.z -= off.z; }
};

MODELS['franklin-fold'] = (C) => {
  const cm = C.cm, T = C.THREE, V = T.Vector3;
  /* FRANKLIN 折叠吧凳（座高63cm）：两副连续弯钢管交叉铰接——
     外框（前腿+靠背弓）一根管从左前脚绕到右前脚，中途在踏脚处折弯并焊一根带灰色套的踏脚杆；
     内框（座面框+后腿）一根管从左后脚绕座面前缘到右后脚。座板与背板都是白色覆膜桦木胶合板（露胶合层边）。 */
  const tube = C.M(C.col, {rough:.42, metal:.20, envI:.42});
  const lam  = C.M(C.col.clone().lerp(new T.Color(0xffffff), .25), {rough:.36, clear:.30, clearRough:.16, envI:.30});
  const ply  = C.M(0xd7b98c, {wood:'birch', rough:.56, clear:.16, envI:.4});
  const gray = C.M(0x63676b, {plastic:true, rough:.62, envI:.16});
  const rivet= C.M(0x8e9398, {metal:.82, rough:.34, envI:.8});

  /* 相邻管段必须多伸出一个半径互相搭接：C.tube 的胶囊端帽正好收在端点上，
     直接首尾相接会在每个折点掐出一道腰，看起来像一串香肠。 */
  const seg = (p,q,r,m)=>{ const dx=q[0]-p[0], dy=q[1]-p[1], dz=q[2]-p[2], L=Math.hypot(dx,dy,dz)||1e-4;
    const mm=C.tube(L+2*r, r, m, (p[0]+q[0])/2, (p[1]+q[1])/2, (p[2]+q[2])/2, 'y');
    mm.quaternion.setFromUnitVectors(new V(0,1,0), new V(dx/L,dy/L,dz/L)); return mm; };
  const path = (pl,r,m)=>{ for(let i=0;i<pl.length-1;i++) seg(pl[i],pl[i+1],r,m); };
  const P = (x,y,z)=>[cm(x), cm(y), cm(z)];

  const rp = (pts) => { const o = [], n = pts.length;
    for(let i=0;i<n;i++){ const p=pts[i], a=pts[(i+n-1)%n], b=pts[(i+1)%n];
      const l1=Math.hypot(a[0]-p[0],a[1]-p[1])||1e-4, l2=Math.hypot(b[0]-p[0],b[1]-p[1])||1e-4;
      const u1=[(a[0]-p[0])/l1,(a[1]-p[1])/l1], u2=[(b[0]-p[0])/l2,(b[1]-p[1])/l2];
      const ang=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
      const t=Math.min(p[2]/Math.max(.05,Math.tan(ang/2)), l1*.5, l2*.5);
      const A=[p[0]+u1[0]*t,p[1]+u1[1]*t], B=[p[0]+u2[0]*t,p[1]+u2[1]*t];
      for(let k=0;k<=7;k++){ const s=k/7, m=1-s;
        o.push([cm(m*m*A[0]+2*m*s*p[0]+s*s*B[0]), cm(m*m*A[1]+2*m*s*p[1]+s*s*B[1])]); } }
    return o; };

  const RA = cm(1.15), RB = cm(1.10);
  /* 外框（前腿 → 座面外侧 → 靠背弓），一根连续管 */
  const A = [[23.45,  1.55, 20.55], [22.20, 19.00, 15.10], [20.60, 36.00,  4.90],
             [19.15, 47.00, -3.40], [17.80, 61.50,-11.50], [17.40, 67.00,-15.20],
             [17.00, 78.00,-17.45], [16.60, 88.00,-19.55], [15.70, 91.45,-20.30],
             [13.00, 93.15,-20.60], [ 9.50, 93.55,-20.60]];
  for(const s of [-1,1]) path(A.map(p=>P(s*p[0], p[1], p[2])), RA, tube);
  seg(P(-9.5, 93.55, -20.60), P(9.5, 93.55, -20.60), RA, tube);          // 靠背顶横梁
  /* 踏脚横杆（外框），套灰色塑料护套 */
  seg(P(-22.20, 19.00, 15.10), P(22.20, 19.00, 15.10), cm(1.05), tube);
  C.tube(cm(37.0), cm(1.48), gray, 0, cm(19.00), cm(15.10), 'x');
  /* 座面后部托杆（外框） */
  seg(P(-17.85, 60.20, -11.80), P(17.85, 60.20, -11.80), cm(1.00), tube);

  /* 内框（后腿 → 座面侧边 → 前横杆），一根连续管 */
  const B = [[13.80,  1.55,-19.20], [15.30, 24.00,-11.80], [16.60, 47.00, -3.40],
             [16.10, 57.50,  4.60], [16.00, 60.20,  9.40], [16.00, 60.30, 15.60]];
  for(const s of [-1,1]) path(B.map(p=>P(s*p[0], p[1], p[2])), RB, tube);
  seg(P(-16.0, 60.30, 15.60), P(16.0, 60.30, 15.60), RB, tube);          // 座面前横杆
  /* 交叉处铆钉 */
  for(const s of [-1,1]) C.cyl(cm(.62), cm(.62), cm(3.4), rivet, s*cm(17.9), cm(47.0)-cm(.31), cm(-3.40), 12)
    .rotation.z = Math.PI/2;
  /* 四个灰色脚垫 */
  for(const s of [-1,1]){
    C.lathe([[cm(.1),0],[cm(1.30),0],[cm(1.45),cm(.6)],[cm(1.30),cm(2.2)],[cm(.1),cm(2.7)]], gray, s*cm(23.45), 0, cm(20.55), 16);
    C.lathe([[cm(.1),0],[cm(1.30),0],[cm(1.45),cm(.6)],[cm(1.30),cm(2.2)],[cm(.1),cm(2.7)]], gray, s*cm(13.80), 0, cm(-19.20), 16);
  }

  /* ---------- 座板：34×34 白色覆膜胶合板，边缘露桦木胶合层 ---------- */
  const sq = (bv, ex, rr) => rp([
    [-(17.0+ex-bv),  17.0+ex-bv, rr], [-(17.0+ex-bv), -(17.0+ex-bv), rr+1.6],
    [ (17.0+ex-bv), -(17.0+ex-bv), rr+1.6], [ (17.0+ex-bv),  17.0+ex-bv, rr]]);
  C.ext(sq(.35, 0, 4.0),   cm(1.55), ply, 0, cm(62.90-.35), 0, 'xz', cm(.35));   // 芯层 61.35~62.90
  C.ext(sq(.18, -.14, 4.0),cm(.42),  lam, 0, cm(62.94-.18), 0, 'xz', cm(.18));   // 上覆膜
  C.ext(sq(.18, -.14, 4.0),cm(.42),  lam, 0, cm(61.53-.18), 0, 'xz', cm(.18));   // 下覆膜
  for(const sx of [-1,1]) for(const sz of [-1,1])
    C.cyl(cm(.45), cm(.45), cm(.4), rivet, sx*cm(15.6), cm(61.15), sz*cm(9.0), 10);

  /* ---------- 背板：31×13.8 圆角胶合板，卡在两根立管之间，随背弓后倾 11.5° ---------- */
  const TF = .20, cF = Math.cos(TF), sF = Math.sin(TF);
  const bp = (bv, ex) => rp([
    [-(15.5+ex-bv), -(6.9+ex-bv), 3.4], [ (15.5+ex-bv), -(6.9+ex-bv), 3.4],
    [ (15.5+ex-bv),  (6.9+ex-bv), 4.2], [-(15.5+ex-bv),  (6.9+ex-bv), 4.2]]);
  const py = 86.0, pz = -17.30;
  C.ext(bp(.32, 0), cm(1.45), ply, 0, cm(py), cm(pz), 'xy', cm(.32)).rotation.x = -TF;
  C.ext(bp(.16, -.14), cm(.40), lam, 0, cm(py+1.32*sF), cm(pz+1.32*cF), 'xy', cm(.16)).rotation.x = -TF;
  C.ext(bp(.16, -.14), cm(.40), lam, 0, cm(py-.09*sF),  cm(pz-.09*cF),  'xy', cm(.16)).rotation.x = -TF;
  for(const sx of [-1,1]) for(const sy of [-1,1]){
    const q = [cm(sx*13.6), cm(py + sy*4.4*cF - .2*sF), cm(pz - sy*4.4*sF - .2*cF)];
    C.cyl(cm(.42), cm(.42), cm(.4), rivet, q[0], q[1], q[2], 10).rotation.x = Math.PI/2 - TF;
  }

  C.g.updateMatrixWorld(true);
  const bb = new T.Box3().setFromObject(C.g), off = new T.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x -= off.x; ch.position.z -= off.z; }
};

MODELS['teodores'] = (C) => {

  const glideM = C.M(0x3c3f44, {rough:.74, envI:.16});

  const bar=(a,b,sA,sB,mat,pw,seg)=>{
    const dx=b[0]-a[0], dy=b[1]-a[1], dz=b[2]-a[2];
    const Lc=Math.hypot(dx,dy,dz)||1e-4, H=cm(Lc), n=seg||18, e=pw||4.2;
    const geo=new T.CylinderGeometry(1,1,H,n,1), p=geo.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i), r=Math.hypot(x,z);
      const t=Math.min(1,Math.max(0,(y+H/2)/H));
      const rx=cm(sA[0]+(sB[0]-sA[0])*t)/2, rz=cm(sA[1]+(sB[1]-sA[1])*t)/2;
      if(r>1e-9){ const ca=Math.abs(x/r), sa=Math.abs(z/r);
        const k=1/Math.pow(Math.pow(ca,e)+Math.pow(sa,e),1/e);

  const SM=(cl,n)=>{ const c=new T.CatmullRomCurve3(cl.map(q=>new T.Vector3(q[0],q[1],0)),false,'catmullrom',0.4);
    return c.getSpacedPoints(n).map(v=>[v.x,v.y]); };
  const BAND=(cl,th)=>{ const n=cl.length,A=[],B=[];
    for(let i=0;i<n;i++){ const q=cl[i], a=cl[Math.max(0,i-1)], b=cl[Math.min(n-1,i+1)];
      let tx=b[0]-a[0], ty=b[1]-a[1]; const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
      A.push([q[0]+ty*th/2, q[1]-tx*th/2]); B.push([q[0]-ty*th/2, q[1]+tx*th/2]); }
    const o=[]; for(const q of A) o.push([cm(-q[0]),cm(q[1])]);

    return o; };
  const SHELL=(prof,W,mat,wf,bend,bev)=>{
    const m=C.ext(prof, cm(W), mat, 0,0,0, 'zy', bev?cm(bev):0);
    const g0=m.geometry; g0.computeBoundingBox();

      if(u<ax0)ax0=u; if(u>ax1)ax1=u; if(v<ay0)ay0=v; if(v>ay1)ay1=v; }
    const su=1/Math.max(1e-4,ax1-ax0), sv=1/Math.max(1e-4,ay1-ay0);
    for(let i=0;i<p.count;i++){ U[i*2]=(U[i*2]-ax0)*su; U[i*2+1]=(U[i*2+1]-ay0)*sv; }

  {
    const p=st.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i)/CM, z=p.getY(i)/CM;
      const ex=Math.max(0,(Math.abs(x)-15.0)/5.0), ef=Math.max(0,(z-11.0)/6.5);

      dp += 0.55*Math.max(0, 1-(x*x/260 + (z+2)*(z+2)/230));
      p.setZ(i, p.getZ(i)+cm(dp));
    }
    st.geometry.computeVertexNormals(); st.geometry.computeBoundingBox();
  }
  /* 座面下的两个注塑凸台 + 前腿顶被座面侧缘包住的小圆角块 */
  for(const s of [-1,1]) C.cyl(cm(1.5),cm(1.8),cm(1.1),shellM,s*cm(11),cm(42.6),cm(9.5),14);
  for(const s of [-1,1]) C.rb(cm(2.8),cm(2.8),cm(4.0),cm(0.9),shellM,s*cm(18.1),cm(42.0),cm(13.8),3);

  /* —— 靠背板：整体接近矩形，只有上两角是大圆角；横向内凹（两侧向前包）—— */

             [-22.3,74.4],[-22.5,77.4],[-21.8,79.2]];
  const wfB=(z,y)=>{
    let f=1;
    const t=Math.max(0,(y-76.0)/3.6); f*=Math.sqrt(Math.max(0.05,1-t*t));
    const b=Math.max(0,(53.9-y)/1.6); f*=Math.sqrt(Math.max(0.30,1-0.55*b*b));

/* KIVIK（Tresund 面料）：实拍是细密不规则的杂色织纹（羊毛混纺感），
   通用网格 fabricTexture 替代不了，专做一张。 */
let _kivikWeaveTex = null;
function kivikWeaveTexture(){
  if(_kivikWeaveTex) return _kivikWeaveTex;
  srand(1007);
  const N=512, c=document.createElement('canvas'); c.width=c.height=N;
  const g=c.getContext('2d');
  g.fillStyle='#f7f6f3'; g.fillRect(0,0,N,N);
  for(let y=0;y<N;y+=2){
    g.fillStyle=`rgba(72,66,58,${(0.05+rnd01()*0.11).toFixed(3)})`; g.fillRect(0,y,N,1);
    g.fillStyle=`rgba(255,255,255,${(0.03+rnd01()*0.05).toFixed(3)})`; g.fillRect(0,y+1,N,1);
  }
  for(let x=0;x<N;x+=2){ g.fillStyle=`rgba(58,54,48,${(0.04+rnd01()*0.09).toFixed(3)})`; g.fillRect(x,0,1,N); }
  for(let i=0;i<9000;i++){
    g.fillStyle = rnd01()<0.5 ? `rgba(255,255,255,${(0.04+rnd01()*0.10).toFixed(3)})`
                               : `rgba(40,36,32,${(0.03+rnd01()*0.09).toFixed(3)})`;
    g.fillRect(rnd01()*N, rnd01()*N, 1+rnd01(), 1);
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(14,14); t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  _kivikWeaveTex=t; return t;
}

   比例反推（工作室正面图 48×32 亮度网格 + 垂直剖面）：

     高 ≈ 42；深 ≈ 45（顶面透视带宽 64px，用坐垫顶面 21px↔63cm 标定反推，初版误读尺寸图
     把深写成 60 太厚，用户对照实拍指出）；背面贴底座背板，略后仰
   · 背框顶 ≈ 73（比垫顶低 ~10，照片正面完全被垫遮住，取「高不少」的合理估计）
   坐垫数不随宽度变（2+2，228cm 尺寸图明确）；全部尺寸由 C.w/C.d/C.h 导出。 */
MODELS['kivik'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const W=C.w, D=C.d, H=C.h;
  // 织物：密集杂色织纹；背框略深一档，与坐垫区分
  const fab  = C.M(C.col, {fabric:true, rough:.94, sheen:.20, envI:.15});
  fab.map = kivikWeaveTexture();
  const fabD = C.M(new T.Color(C.col).multiplyScalar(.88), {fabric:true, rough:.95, sheen:.14, envI:.12});
  fabD.map = kivikWeaveTexture();
  const footM = C.M(0x151412, {plastic:true, envI:.22});

  const ARM=cm(24);           // 扶手宽（尺寸图 24cm）
  const innerW = W - 2*ARM;   // 两扶手之间的内开口
  const BASE_TOP=cm(14);      // 箱体底座顶面（比例反推 14）；坐垫顶面落在 45（尺寸图座高）

  // 四条黑色小脚：分解图见四角黑色垫块，箱体坐在上面
  for(const sx of [-1,1]) for(const sz of [-1,1])
    C.box(cm(9), cm(2), cm(9), footM, sx*(W/2-cm(10.5)), 0, sz*(D/2-cm(10.5)));

  // 箱体底座：满宽落地，矮箱
  C.rb(W, BASE_TOP-cm(2), D, cm(3), fab, 0, cm(2));

  // 坐垫 ×2：巨厚整块软垫，顶面落在 45（座高）。手动建而不走 C.cushion：
  // cushion 的顶枕会探出 h*0.41，31cm 厚垫会冲到 57cm。底座 14→43 + 顶枕 33→45 + 包边缝
  const seatD=cm(63), cw=(innerW-cm(1.5))/2, sz=D/2-seatD/2-cm(0.5);
  for(const sx of [-1,1]){
    const x=sx*(cw/2+cm(0.75));
    C.rb(cw, cm(29), seatD, cm(4.5), fab, x, BASE_TOP, sz);
    C.rb(cw*0.94, cm(12), seatD*0.94, cm(4), fab, x, BASE_TOP+cm(19), sz);
    C.rb(cw+cm(0.3), cm(1.1), seatD+cm(0.3), cm(0.5), fab, x, BASE_TOP+cm(10), sz);
  }

  // 背框：两扶手之间，顶面 73（比靠背垫顶低 ~10，正面视角被垫遮住）
  C.rb(innerW, cm(59), cm(17), cm(2.5), fabD, 0, BASE_TOP, -(D/2-cm(8.5)));

  // 靠背垫 ×2：高 42、深 45（比例反推），整件最高的元素，顶面 ~83 略后仰
  // （后仰绕底面中心，后上角升到 83）。mesh 只管形状+抬升，后仰交外层 Group。
  const bw=(innerW-cm(2))/2, bcH=cm(42), bcTh=cm(45),
        bcZ=-D/2+bcTh/2+cm(0.5);   // 背面贴沙发后背，前缘伸到座区
  for(const sx of [-1,1]){
    const bc=C.rb(bw, bcH, bcTh, cm(5), fab, 0, 0, 0);
    const holder=new T.Group();
    C.g.remove(bc); holder.add(bc);
    holder.position.set(sx*(bw/2+cm(1)), BASE_TOP+cm(25), bcZ);   // 底 39，顶 81，后上角 ≈83
    holder.rotation.x=-0.05;
    C.g.add(holder);
  }

  // 扶手 ×2：一体低箱体，落地→顶面 62，外侧与底座齐平
  for(const sx of [-1,1])
    C.rb(ARM, cm(60), D, cm(3), fab, sx*(W/2-ARM/2), cm(2));

  // 水平重心归零（2D 图例与碰撞都假定原点 = 占地中心）
  C.g.updateMatrixWorld(true);
  const bb=new T.Box3().setFromObject(C.g), off=new T.Vector3();
  bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

/* SÖDERHAMN 三人(198×99×83)：尺寸全部来自官方尺寸图 work/ref/soder_4_dims.png（逐箭头核对），
   无标注项见 work/briefs/soderhamn.md：扶手宽 28.5=(198-2×70-1)/2 推导；背框深 17、坐垫深 55

  const W=C.w, D=C.d, H=C.h;
  const fab  = C.M(C.col, {fabric:true, rough:.92, sheen:.18, envI:.15});
  const fabD = C.M(new T.Color(C.col).multiplyScalar(.88), {fabric:true, rough:.95, sheen:.14, envI:.12});
  const legM = C.M('#c9ae83', {wood:'beech', envI:.5});

  const ARM=cm(28.5);          // 扶手宽：内开口放 2×70 靠背垫+1cm 缝
  const innerW=W-2*ARM;        // 141
  const BASE_TOP=cm(14);       // 箱顶（尺寸图 14）；座高 40（尺寸图）

  // 4 条锥形细腿：高 6（尺寸图），前缩进 6（尺寸图），侧/后缩进 ~8（比例估计）
  for(const sx of [-1,1]) for(const sz of [-1,1])
    C.legT(cm(0.9), cm(1.3), cm(6), legM, sx*(W/2-cm(8)), sz>0? D/2-cm(6) : -(D/2-cm(8)), 0);

  // 箱体底座：满宽满深 6→14，圆角
  C.rb(W, cm(8), D, cm(3), fab, 0, cm(6));

  // 坐垫 ×2：14→40（厚 26）手动建；前缘齐底座前缘，深 55（比例估计）
  const seatD=cm(55), cw=(innerW-cm(1.5))/2, sz=D/2-seatD/2;
  for(const sx of [-1,1]){
    const x=sx*(cw/2+cm(0.75));
    C.rb(cw, cm(24), seatD, cm(4.5), fab, x, BASE_TOP, sz);
    C.rb(cw*0.94, cm(12), seatD*0.94, cm(4), fab, x, BASE_TOP+cm(14), sz);
    C.rb(cw+cm(0.3), cm(1.1), seatD+cm(0.3), cm(0.5), fab, x, BASE_TOP+cm(8), sz);
  }

  // 背框：14→69（尺寸图），深 17 贴后（比例估计）
  C.rb(innerW, cm(55), cm(17), cm(2.5), fabD, 0, BASE_TOP, -(D/2-cm(8.5)));

  // 靠背垫 ×2：70×48（尺寸图）×高 40，底 41 顶 81，外层 Group 后仰 2.3°（后上角 ≈82.6=整高附近）
  const bw=cm(70), bcH=cm(40), bcTh=cm(48),
        bcZ=-D/2+bcTh/2+cm(0.5);
  for(const sx of [-1,1]){
    const bc=C.rb(bw, bcH, bcTh, cm(5), fab, 0, 0, 0);
    const holder=new T.Group();
    C.g.remove(bc); holder.add(bc);
    holder.position.set(sx*(bw/2+cm(0.5)), cm(41), bcZ);
    holder.rotation.x=-0.04;
    C.g.add(holder);
  }

  // 扶手 ×2：软包低箱，6→54（尺寸图），顶叠薄枕
  for(const sx of [-1,1]){
    C.rb(ARM, cm(48), D, cm(3.5), fab, sx*(W/2-ARM/2), cm(6));
    C.rb(ARM-cm(1), cm(5), D-cm(2), cm(3), fab, sx*(W/2-ARM/2), cm(49));
  }

  // 水平重心归零
  C.g.updateMatrixWorld(true);
  const bb=new T.Box3().setFromObject(C.g), off=new T.Vector3();
  bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }

/* GLADOM 托盘桌 Ø45×53：尺寸图 work/ref/gladom_33.png——圆盘带盘沿、5 根细圆腿、
   离地 ~10 五角星交叉横撑（图里可见）；腿径/撑径/盘沿高比例估计。 */
MODELS['gladom'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const W=C.w, D=C.d, H=C.h;
  const M1 = C.M(C.col, {metal:.85, rough:.4, envI:.85});
  const R=W/2, TOP_T=cm(2.5), legR=cm(1.25), brR=cm(0.7), lr=R-cm(3);
  C.cyl(R, R, TOP_T, M1, 0, H-TOP_T, 0, 40);
  C.torus(R-cm(1), cm(1.2), M1, 0, H-cm(0.8), 0, Math.PI/2);   // 水平盘沿（不转是竖环！）
  const n=5, ang=i=>-Math.PI/2+i*2*Math.PI/n;
  for(let i=0;i<n;i++){
    // 外层 Group 只转竖轴定方位，mesh 只单轴外撇（不叠欧拉角）
    const g=new T.Group(); g.rotation.y=-ang(i);   // 局部 +x 对准该腿的外撇方向
    const m=new T.Mesh(new T.CylinderGeometry(legR, legR*1.15, H-TOP_T-cm(0.5), 10), M1);
    m.position.set(lr, (H-TOP_T-cm(0.5))/2, 0); m.rotation.z=-0.03;
    m.castShadow=m.receiveShadow=true; g.add(m); C.g.add(g);
  }
  for(let i=0;i<n;i++){   // 五角星横撑：连隔一根的腿（Group 转竖轴定向，mesh 单轴倒平）
    const a=ang(i), b=ang((i+2)%n), y=cm(10);
    const ax=Math.cos(a)*lr, az=Math.sin(a)*lr, bx=Math.cos(b)*lr, bz=Math.sin(b)*lr;
    const dx=bx-ax, dz=bz-az, len=Math.sqrt(dx*dx+dz*dz);
    const gg=new T.Group();
    gg.position.set((ax+bx)/2, y, (az+bz)/2); gg.rotation.y=Math.atan2(dx, dz);
    const m=new T.Mesh(new T.CapsuleGeometry(brR, Math.max(0.005, len-2*brR), 4, 10), M1);
    m.rotation.x=Math.PI/2; m.castShadow=m.receiveShadow=true;
    gg.add(m); C.g.add(gg);
  }
  C.g.updateMatrixWorld(true);
  const bb=new T.Box3().setFromObject(C.g), off=new T.Vector3();
  bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

/* MORABO 三人沙发 206×92×81：尺寸图 v05_0815815（扶手顶 67/座高 47/底座离地 16/背垫宽 61×2）；
   扶手宽 42/座深 64/背框深 26/腿位/拉扣为实拍比例估计（brief: work/briefs/morabo.md）。 */
MODELS['morabo'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const W=C.w, D=C.d, H=C.h;
  const M1 = C.M(C.col, {fabric:true, sheen:.15, envI:.15});
  const chrome = C.M('#d8dadc', {metal:.95, rough:.18, envI:.95});
  // 底座 16→38（图标 16）
  C.rb(W, cm(22), D, cm(2.5), M1, 0, cm(16), 0);
  // 扶手 42 宽，16→67（图标 67）
  for(const sx of [-1,1])
    C.rb(cm(42), cm(51), D, cm(3), M1, sx*(W/2-cm(21)), cm(16), 0);
  // 背框 122 宽×26 深，38→81（背在 -z，与 2D 图例/通用回退同向）
  C.rb(W-cm(84), cm(43), cm(26), cm(2.5), M1, 0, cm(38), -(D/2-cm(13)));
  // 座垫 ×2：60.5 宽，35→47.5（座高 47 图标），深 64
  for(const sx of [-1,1])
    C.rb(cm(60.5), cm(12.5), cm(64), cm(4.5), M1, sx*cm(30.75), cm(35), D/2-cm(32));
  // 背垫 ×2：61 宽（图标）×30 高×20 厚，50→80，前倾 3°，3×3 拉扣
  for(const sx of [-1,1]){
    const c = C.rb(cm(61), cm(30), cm(20), cm(5), M1, 0, 0, 0, 3);
    C.g.remove(c);
    const g = new T.Group();
    g.position.set(sx*cm(31), cm(50), -cm(11)); g.rotation.x=0.05;   // 单轴前倾（朝 +z）
    c.position.set(0, cm(15), 0);
    g.add(c);
    for(const bx of [-cm(18),0,cm(18)]) for(const by of [-cm(9.5),0,cm(9.5)]){
      const b = new T.Mesh(new T.SphereGeometry(cm(1.0), 10, 8), M1);
      b.position.set(bx, by, cm(9.5)); b.castShadow=b.receiveShadow=true;
      g.add(b);
    }
    C.g.add(g);
  }
  // 腿 ×4：镀铬喇叭脚 0→8 + 布包腿 6.5→17.5（v00/v09）
  for(const [lx,lz] of [[-64,33],[64,33],[-64,-28],[64,-28]]){
    const x=cm(lx), z=cm(lz);
    C.cyl(cm(5), cm(5), cm(0.8), chrome, x, 0, z, 20);        // 底盘
    C.cyl(cm(2.6), cm(3.4), cm(7.2), chrome, x, cm(0.8), z, 20); // 锥脚
    C.cyl(cm(2.2), cm(2.8), cm(11), M1, x, cm(6.5), z, 14);   // 布腿
  }
  C.g.updateMatrixWorld(true);
  const bb=new T.Box3().setFromObject(C.g), off=new T.Vector3();
  bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

   扶手 66/背垫 57×3 高出座面 44）；chaise 宽 95/扶手 24/背框深 24/腿为实拍比例估计（brief: friheten.md）。 */

/* ===== 性能：按材质合并 mesh，大幅减少 draw call（几何逐顶点保留，外观完全不变） ===== */
function _concatGeos(list){
  let total=0;
  for(const g of list) total += g.attributes.position.count;
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2);
  let o3=0, o2=0;
  for(const g of list){
    const cnt=g.attributes.position.count;
    pos.set(g.attributes.position.array, o3);
    if(g.attributes.normal) nor.set(g.attributes.normal.array, o3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array, o2);
    o3 += cnt*3; o2 += cnt*2;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
  geo.computeBoundingSphere();
  return geo;
}
