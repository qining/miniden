}

/* 镜子的实景反射：给每面镜子在镜面前方烘一张立方体贴图当 envMap。
   平面镜用立方体贴图会有视差误差，但比"反射窗外城市全景"正确得多，
   而且只在场景重建时烘一次（每面 6 张 128px）。光追走的是真反射，不用这个。 */
function installMirrorProbes(){
  if(!three || !three.mirrors || !three.mirrors.length) return;
  const list = three.mirrors.slice(0, 4);                 // 封顶，别让烘焙拖慢重建
  const NRM = {S:[0,0,1], N:[0,0,-1], E:[1,0,0], W:[-1,0,0]};
  const hidden = [];
  for(const m of list){ hidden.push([m, m.visible]); m.visible = false; }
  try{
    for(const m of list){
      if(m.userData.mirrorEnv){ m.userData.mirrorEnv.dispose(); m.userData.mirrorEnv = null; }
      const rt = new THREE.WebGLCubeRenderTarget(128, {generateMipmaps:true,
        minFilter:THREE.LinearMipmapLinearFilter, magFilter:THREE.LinearFilter});
      const cam = new THREE.CubeCamera(0.2, 220, rt);
      const n = NRM[m.userData.mirrorFace] || NRM.S;
      m.getWorldPosition(cam.position);
      cam.position.x += n[0]*0.12; cam.position.z += n[2]*0.12;   // 挪到镜面前一点
      three.scene.add(cam);
      cam.update(three.renderer, three.scene);
      three.scene.remove(cam);
      m.material.envMap = rt.texture;
      m.material.envMapIntensity = 1.0;
      m.material.needsUpdate = true;
      m.userData.mirrorEnv = rt;
    }
  }catch(e){ console.warn('镜子反射烘焙失败，退回环境贴图:', e.message); }
  for(const [m, v] of hidden) m.visible = v;
  requestRender();
}

/* 按需渲染：只有场景/相机真正变化时才画一帧（原先每帧无条件渲染，白占 GPU 与电量） */
function requestRender(){ if(three) three.needsRender=true; }
function requestShadowUpdate(){ if(three){ three.renderer.shadowMap.needsUpdate=true; three.needsRender=true; } }
function buildEnvironment(){
  const night = three.night;
  const tex = cityPanorama(night);
  const pm=new THREE.PMREMGenerator(three.renderer); pm.compileEquirectangularShader();
  if(three.env) three.env.dispose();
  const env=pm.fromEquirectangular(tex).texture;
  three.scene.environment=env; three.env=env;   // 环境反射两种视角都保留（玻璃/石材反射靠它）
  three.panorama=tex;
  applyBackdrop();
  pm.dispose();
}
/* 照明方案：娃娃屋=均匀泛光（看清造型与贴图，不受灯具影响）；室内=真实灯光 */
function applyLightMode(){
  if(!three) return;
  const fp = three.camMode==='fp', night = !!three.night;
  const {sun, amb, hemi, renderer} = three;
  if(!fp){                                   // 娃娃屋：柔和均匀，弱方向光只用来交代体块
    sun.color.set(0xfff4e6); sun.intensity=0.55; sun.position.copy(three.sunHome);
    amb.color.set(0xffffff); amb.intensity=0.95;
    hemi.color.set(0xdfe9f7); hemi.groundColor.set(0x9a9184); hemi.intensity=0.85;
    renderer.toneMappingExposure=0.98;
  } else if(night){
    sun.color.set(0x93a9d4); sun.intensity=0.16; sun.position.set(30,26,-34);
    amb.color.set(0x2c3550); amb.intensity=0.10;
    hemi.color.set(0x3a4d78); hemi.groundColor.set(0x14161c); hemi.intensity=0.16;
    renderer.toneMappingExposure=1.25;
  } else {
    sun.color.set(0xffeeda); sun.intensity=1.85; sun.position.copy(three.sunHome);
    amb.color.set(0xf2f4f8); amb.intensity=0.28;
    hemi.color.set(0xbfd4ff); hemi.groundColor.set(0x3a3226); hemi.intensity=0.55;
    renderer.toneMappingExposure=0.92;
  }
  const on = three.lightsOn!==false;
  const fix = !on ? 0 : (fp ? 1 : 0.06);     // 娃娃屋里灯具几乎不参与照明，避免局部过曝
  three.furnGroup.traverse(o=>{
    if(o.isLight && o.userData.baseI!=null) o.intensity=o.userData.baseI*fix;
    if(o.isMesh && o.material && o.material.userData && o.material.userData.emisBase!=null)
      o.material.emissiveIntensity = on ? o.material.userData.emisBase : 0.0;
  });
  requestShadowUpdate();
}
function setLights(on){
  if(!three) return;
  three.lightsOn = !!on;
  $('#lampOn').classList.toggle('on', !!on);
  $('#lampOff').classList.toggle('on', !on);
  applyLightMode(); requestRender();
}
/* 窗外景只在室内视角渲染；娃娃屋视角保持干净背景 */
function applyBackdrop(){
  if(!three) return;
  const fp = three.camMode==='fp';
  if(fp && three.panorama){
    three.scene.background = three.panorama;
    three.scene.fog = new THREE.Fog(three.night?0x0b1018:0xb9cfe2, 130, 430);
    requestRender();
  } else {
    three.scene.background = new THREE.Color(three.night?0x0a0c11:0x141821);
    three.scene.fog = null;
    requestRender();
  }
}
/* 白天 / 夜晚 */
function setDayNight(night){

  $('#dnNight').classList.toggle('on', night);

function buildStatic3D(){
  // 所有静态构件挂在一个可整体替换的 Group 上，墙体编辑后重建
  if(three.staticGroup){
    disposeOwned(three.staticGroup);
    three.scene.remove(three.staticGroup);
  }
  const scene = new THREE.Group();
  three.scene.add(scene); three.staticGroup = scene;
  three.mirrors = [];              // 每次重建静态构件都要重新收集镜面
  const matWall = new THREE.MeshPhysicalMaterial({color:0xd8d5d0, roughness:1.0,
    specularIntensity:.05, envMapIntensity:.10});   // 哑光乳胶漆：几乎不反光
  const matGlass = new THREE.MeshPhysicalMaterial({color:0xa8c8e8, transparent:true, opacity:.18, roughness:.05, metalness:.1});
  const matFrame = new THREE.MeshStandardMaterial({color:0x1b1d20, roughness:.45, metalness:.5});
  const matDark = new THREE.MeshStandardMaterial({color:0x2a2d33, roughness:.8, side:THREE.DoubleSide});
  // 地板
  const shape = new THREE.Shape();
  const fl = FLOORPTS;
  shape.moveTo(fl[0][0], fl[0][1]);
  for(let i=1;i<fl.length;i++) shape.lineTo(fl[i][0], fl[i][1]);
  const floorGeo = new THREE.ShapeGeometry(shape);
  const floor = new THREE.Mesh(floorGeo, new THREE.MeshPhysicalMaterial({map:woodTexture(), normalMap:normalFromTexture(woodTexture(),0.55),
    color:0xffffff, roughness:.42, clearcoat:.30, clearcoatRoughness:.26, envMapIntensity:.5, side:THREE.DoubleSide}));
  floor.rotation.x = Math.PI/2; floor.receiveShadow=true;
  // 天花板：法线朝上 + BackSide → 只在室内（从下往上看）可见，俯视娃娃屋视角自动穿透
  const ceil = new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshPhysicalMaterial({color:0xe4e2de, roughness:1.0, specularIntensity:.04,
      envMapIntensity:.08, side:THREE.FrontSide}));
  ceil.rotation.x = Math.PI/2; ceil.position.y = CEIL_H; ceil.receiveShadow = true;
  scene.add(ceil);
  // ShapeGeometry 在 xy 平面, rotate 后 y->z
  floor.scale.z=1;
  scene.add(floor);
  // 阳台板
  const ps = new THREE.Shape(); ps.moveTo(PATIO[0][0],PATIO[0][1]);
  for(let i=1;i<4;i++) ps.lineTo(PATIO[i][0],PATIO[i][1]);
  const patio = new THREE.Mesh(new THREE.ShapeGeometry(ps), matDark);
  patio.rotation.x=Math.PI/2; patio.position.y=-0.05; patio.receiveShadow=true;
  scene.add(patio);
  // 阳台与建筑转角间的补板（封住透出背景的楔形缝）
  const pwPts=[C(36.3,253.9),C(126.8,309.2),C(88,226)];
  const pw=new THREE.Shape(); pw.moveTo(pwPts[0][0],pwPts[0][1]); pw.lineTo(pwPts[1][0],pwPts[1][1]); pw.lineTo(pwPts[2][0],pwPts[2][1]); pw.closePath();
  const pwm=new THREE.Mesh(new THREE.ShapeGeometry(pw), matDark);
  pwm.rotation.x=Math.PI/2; pwm.position.y=-0.05; scene.add(pwm);
  // 阳台栏板（底图外侧三边为栏杆）
  for(const [ia,ib] of [[1,2],[2,3],[3,0]]){
    const rseg={x1:PATIO[ia][0],y1:PATIO[ia][1],x2:PATIO[ib][0],y2:PATIO[ib][1]};
    const gl=wallMesh(rseg,3.0,.08,matGlass); if(gl){ gl.castShadow=false; scene.add(gl); }
    const tr=wallMesh(rseg,.12,.16,matFrame); if(tr){ tr.position.y=3.0; scene.add(tr); }
    const br=wallMesh(rseg,.2,.16,matFrame); if(br){ br.position.y=0.1; scene.add(br); }
  }

  // （厚度=各段 wd，端头咬合进相邻墙/结构块；不再用固定 0.45ft 盒子，避免与厚墙带/楔块接缝错台）
  let wk=0; // 微错高计数：避免相邻墙顶面共面产生 z-fighting 条纹
  for(const q of wallPolys()){
    const sh = new THREE.Shape();
    sh.moveTo(q[0][0], q[0][1]);
    for(let i=1;i<4;i++) sh.lineTo(q[i][0], q[i][1]);
    sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh,{depth:CEIL_H-0.004*(wk%6), bevelEnabled:false});
    const m = new THREE.Mesh(g, matWall);
    m.rotation.x = Math.PI/2; m.position.y = CEIL_H;
    // 亚毫米平移错位：相邻段咬合处侧面共面会 z-fighting，错开 <1mm 肉眼不可见
    m.position.x = 0.0008*((wk%3)-1); m.position.z = 0.0008*(((wk+1)%3)-1);
    m.castShadow = m.receiveShadow = true;
    scene.add(m); wk++;
  }
  // 门洞过梁厚度取同链相邻 'w' 段的 wd，与两侧墙面齐平
  const lintelWd=(s)=>{
    for(const o of effWalls()){
      if(o.t!=='w') continue;
      for(const p of [[s.x1,s.y1],[s.x2,s.y2]]) for(const q of [[o.x1,o.y1],[o.x2,o.y2]])
        if(Math.hypot(p[0]-q[0],p[1]-q[1])<0.06) return o.wd||6.5;
    }
    return 6.5;
  };
  for(const s of effWalls()){
    if(s.t==='o'||s.t==='w') continue;
    if(s.t==='d'){ // 门洞过梁：厚度与同链墙一致、顶面与墙顶同族微错高，两侧面齐平不出台阶
      const th=(s.wd||lintelWd(s))/S;
      const h=CEIL_H-6.8-0.004*(wk%6);
      const m = wallMesh(s, h, th, matWall, true);
      if(m){ m.position.y = 6.8+h/2; scene.add(m); wk++; }
      continue;
    }
    if(s.t==='g'){
      if(s.fc){
        const blk = new THREE.MeshStandardMaterial({color:0x17181b, roughness:.4, metalness:.55});
        if(s.slider){
          // 阳台推拉门：下方门扇 + 顶部 30cm 亮子，全黑钢框
          const TR=0.98;                                   // 亮子高 30cm
          const dh=CEIL_H-TR;
          const gl1 = wallMesh(s, dh-0.16, .09, matGlass); if(gl1){ gl1.castShadow=false; gl1.position.y=(dh-0.16)/2+0.08; scene.add(gl1); }
          const gl2 = wallMesh(s, TR-0.14, .09, matGlass); if(gl2){ gl2.castShadow=false; gl2.position.y=dh+(TR-0.14)/2+0.07; scene.add(gl2); }
          const sill=wallMesh(s,.16,.30,blk,true); if(sill){ sill.position.y=0.08; scene.add(sill); }
          const mull=wallMesh(s,.14,.30,blk,true); if(mull){ mull.position.y=dh; scene.add(mull); }   // 亮子分隔横档
          const head=wallMesh(s,.16,.30,blk,true); if(head){ head.position.y=CEIL_H-0.08; scene.add(head); }
          const dx=s.x2-s.x1, dy=s.y2-s.y1, L=Math.hypot(dx,dy);
          for(const t of [0, 0.5, 1]){                      // 边框 + 中间对开缝
            const mm=new THREE.Mesh(new THREE.BoxGeometry(.16,CEIL_H,.32), blk);
            mm.position.set(s.x1+dx*t, CEIL_H/2, s.y1+dy*t); mm.castShadow=true; scene.add(mm);

  const kt = new THREE.Mesh(new THREE.BoxGeometry(9.72, .16, 2.53), matTop);
  kt.position.set(26.16, 3.08, 14.33); scene.add(kt);
  const uc = new THREE.Mesh(new THREE.BoxGeometry(12.6, 2.6, 1.3), matCab);
  uc.position.set(25.18, 6.5, 13.78); scene.add(uc);
  // 中岛（船形轮廓拉伸）
  const isS = new THREE.Shape();
  isS.moveTo(ISL.a[0],ISL.a[1]); isS.lineTo(ISL.b[0],ISL.b[1]);
  isS.lineTo(ISL.e[0],ISL.e[1]);
  isS.quadraticCurveTo(ISL.cp2[0],ISL.cp2[1],ISL.d[0],ISL.d[1]);
  isS.closePath();
  const isGeo = new THREE.ExtrudeGeometry(isS,{depth:3.0, bevelEnabled:false});
  const island = new THREE.Mesh(isGeo, matCab);
  island.rotation.x=Math.PI/2; island.position.y=3.0; island.castShadow=true;
  scene.add(island);
  // 台面：沿轮廓法向等距外挑 3cm（不能用 scale——那是绕世界原点缩放，会把台面整体平移）
  const isPts = isS.getPoints(72).map(p=>[p.x,p.y]);
  if(Math.hypot(isPts[0][0]-isPts[isPts.length-1][0], isPts[0][1]-isPts[isPts.length-1][1])<1e-6) isPts.pop();
  let area2=0;
  for(let i=0;i<isPts.length;i++){ const j=(i+1)%isPts.length;
    area2 += isPts[i][0]*isPts[j][1] - isPts[j][0]*isPts[i][1]; }
  const sgn = area2>0 ? 1 : -1;                      // 保证法向朝外
  const OVH = 0.1;                                   // 外挑 3cm
  const isOff = isPts.map((p,i)=>{
    const a=isPts[(i-1+isPts.length)%isPts.length], b=isPts[(i+1)%isPts.length];
    const n1=[(p[1]-a[1]),-(p[0]-a[0])], n2=[(b[1]-p[1]),-(b[0]-p[0])];
    const l1=Math.hypot(n1[0],n1[1])||1, l2=Math.hypot(n2[0],n2[1])||1;
    let nx=(n1[0]/l1+n2[0]/l2), ny=(n1[1]/l1+n2[1]/l2);
    const ln=Math.hypot(nx,ny)||1; nx/=ln; ny/=ln;
    return new THREE.Vector2(p[0]+nx*OVH*sgn, p[1]+ny*OVH*sgn);
  });
  const isTopGeo = new THREE.ExtrudeGeometry(new THREE.Shape(isOff),{depth:.13, bevelEnabled:false});
  const isTop = new THREE.Mesh(isTopGeo, matTop);
  isTop.rotation.x=Math.PI/2; isTop.position.y=3.15; isTop.castShadow=true; isTop.receiveShadow=true;
  scene.add(isTop);
  mergeByMaterial(scene, 8);   // 静态构件按材质合并：draw call 大幅下降，几何逐顶点保留
  requestShadowUpdate();
  applyBackdrop();   // 雾与背景由视角模式统一决定
  // 反射要等家具也进场了才有意义，推迟到本轮同步任务跑完
  setTimeout(()=>{ try{ installMirrorProbes(); }catch(e){ console.warn(e); } }, 0);
}
/* =====================================================================
   照片级渲染：渐进式累积
   每帧抖动相机子像素(抗锯齿) + 在锥内抖动太阳方向(面光源软阴影)
   + 抖动天光方向(近似环境遮蔽/漫反射)，多帧平均得到收敛画面

/* =====================================================================
   GPU 路径追踪（真·光线追踪）

   浏览器里拿不到显卡的 RT core —— WebGPU 至今没有 ray query / RT pipeline，
   WebGL2 更没有。所以这里是「用 GPU 的通用计算单元跑软件光追」：
   自建 BVH → 打包进浮点纹理 → 片元着色器里遍历 → 逐帧累积。
   路径积分是真的（多次弹射的全局光照、真反射、真折射、真软阴影），
   只是求交靠 shader 算，不是硬件加速。

   与旧的「照片级渲染」的区别：那个是抖动光源的光栅化累积（软阴影 + 伪 AO），
   没有真正的间接光；这个是无偏路径追踪。
   ===================================================================== */
const PT_W = 2048;                                    // 数据纹理宽度
let PT = null;                                        // 当前构建好的场景数据

function ptDataTex(f32, texels){
  const H = Math.max(1, Math.ceil(texels / PT_W));
  const data = new Float32Array(PT_W * H * 4);
  data.set(f32.subarray(0, Math.min(f32.length, PT_W * H * 4)));
  const t = new THREE.DataTexture(data, PT_W, H, THREE.RGBAFormat, THREE.FloatType);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}

/* ---------- 1. 收集场景三角形 ---------- */
function ptCollect(){
  const scene = three.scene;
  scene.updateMatrixWorld(true);
  const meshes = [];
  scene.traverse(o=>{
    if(!o.isMesh || !o.geometry || !o.material || Array.isArray(o.material)) return;
    if(o.userData && o.userData.ptSkip) return;
    let p = o, vis = true;
    while(p){ if(!p.visible){ vis = false; break; } p = p.parent; }
    if(!vis) return;
    const g = o.geometry;
    if(!g.attributes || !g.attributes.position) return;
    const n = g.index ? (g.index.count/3) : (g.attributes.position.count/3);
    if(n >= 1) meshes.push({o, n: Math.floor(n)});
  });
  let nTri = 0; for(const m of meshes) nTri += m.n;
  if(!nTri) return null;

  const mats = [], matIdx = new Map(), maps = [], mapIdx = new Map();
  const matIdOf = (m)=>{
    if(matIdx.has(m.uuid)) return matIdx.get(m.uuid);
    const id = mats.length; matIdx.set(m.uuid, id);
    let layer = -1, rx = 1, ry = 1, ox = 0, oy = 0;
    if(m.map && m.map.image){
      if(mapIdx.has(m.map.uuid)) layer = mapIdx.get(m.map.uuid);
      else { layer = maps.length; mapIdx.set(m.map.uuid, layer); maps.push(m.map); }
      rx = m.map.repeat.x; ry = m.map.repeat.y; ox = m.map.offset.x; oy = m.map.offset.y;
    }
    const glass = !!(m.transparent && m.opacity != null && m.opacity < 0.75);
    const ei = (m.emissiveIntensity == null ? 1 : m.emissiveIntensity);
    mats.push({
      c: m.color || {r:1,g:1,b:1},
      rough: Math.max(0.015, m.roughness == null ? 0.85 : m.roughness),
      metal: m.metalness == null ? 0 : m.metalness,
      er: m.emissive ? m.emissive.r*ei : 0,
      eg: m.emissive ? m.emissive.g*ei : 0,
      eb: m.emissive ? m.emissive.b*ei : 0,
      trans: glass ? 0.93 : 0,
      ior: m.ior || 1.5,
      layer, rx, ry, ox, oy
    });
    return id;
  };

  const P = new Float32Array(nTri*12);      // 3 texel/三角形：xyz + matId
  const A = new Float32Array(nTri*12);      // 3 texel/三角形：法线八面体编码 xy + uv
  const cen = new Float32Array(nTri*3), bmn = new Float32Array(nTri*3), bmx = new Float32Array(nTri*3);
  const oct = (x,y,z)=>{                    // 法线八面体编码（省一个通道）
    const s = Math.abs(x)+Math.abs(y)+Math.abs(z) || 1;
    let ox2 = x/s, oy2 = y/s;
    if(z < 0){ const t = ox2; ox2 = (1-Math.abs(oy2))*(t>=0?1:-1); oy2 = (1-Math.abs(t))*(oy2>=0?1:-1); }
    return [ox2, oy2];
  };
  const mtx = new THREE.Matrix4(), nm = new THREE.Matrix3();
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
  const na = new THREE.Vector3(), nb = new THREE.Vector3(), nc = new THREE.Vector3();
  let ti = 0;
  for(const {o} of meshes){
    const g = o.geometry, mi = matIdOf(o.material);
    mtx.copy(o.matrixWorld); nm.getNormalMatrix(mtx);
    const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
    const ix = g.index;
    const cnt = ix ? ix.count : pos.count;
    for(let k = 0; k + 2 < cnt; k += 3){
      const i0 = ix ? ix.getX(k) : k, i1 = ix ? ix.getX(k+1) : k+1, i2 = ix ? ix.getX(k+2) : k+2;
      va.fromBufferAttribute(pos, i0).applyMatrix4(mtx);
      vb.fromBufferAttribute(pos, i1).applyMatrix4(mtx);
      vc.fromBufferAttribute(pos, i2).applyMatrix4(mtx);
      if(nor){ na.fromBufferAttribute(nor,i0).applyMatrix3(nm).normalize();
               nb.fromBufferAttribute(nor,i1).applyMatrix3(nm).normalize();
               nc.fromBufferAttribute(nor,i2).applyMatrix3(nm).normalize(); }
      else { na.subVectors(vb,va).cross(vc.clone().sub(va)).normalize(); nb.copy(na); nc.copy(na); }
      const o12 = ti*12;
      P[o12+0]=va.x; P[o12+1]=va.y; P[o12+2]=va.z; P[o12+3]=mi;
      P[o12+4]=vb.x; P[o12+5]=vb.y; P[o12+6]=vb.z; P[o12+7]=0;
      P[o12+8]=vc.x; P[o12+9]=vc.y; P[o12+10]=vc.z; P[o12+11]=0;
      const e0=oct(na.x,na.y,na.z), e1=oct(nb.x,nb.y,nb.z), e2=oct(nc.x,nc.y,nc.z);
      A[o12+0]=e0[0]; A[o12+1]=e0[1]; A[o12+2]=uv?uv.getX(i0):0; A[o12+3]=uv?uv.getY(i0):0;
      A[o12+4]=e1[0]; A[o12+5]=e1[1]; A[o12+6]=uv?uv.getX(i1):0; A[o12+7]=uv?uv.getY(i1):0;
      A[o12+8]=e2[0]; A[o12+9]=e2[1]; A[o12+10]=uv?uv.getX(i2):0; A[o12+11]=uv?uv.getY(i2):0;
      const o3 = ti*3;
      cen[o3]=(va.x+vb.x+vc.x)/3; cen[o3+1]=(va.y+vb.y+vc.y)/3; cen[o3+2]=(va.z+vb.z+vc.z)/3;
      bmn[o3]=Math.min(va.x,vb.x,vc.x); bmn[o3+1]=Math.min(va.y,vb.y,vc.y); bmn[o3+2]=Math.min(va.z,vb.z,vc.z);
      bmx[o3]=Math.max(va.x,vb.x,vc.x); bmx[o3+1]=Math.max(va.y,vb.y,vc.y); bmx[o3+2]=Math.max(va.z,vb.z,vc.z);
      ti++;
    }
  }
  return {nTri: ti, P, A, cen, bmn, bmx, mats, maps};
}

/* ---------- 2. 分箱 SAH BVH ---------- */
function ptBuildBVH(nTri, cen, bmn, bmx){
  const idx = new Uint32Array(nTri); for(let i=0;i<nTri;i++) idx[i]=i;
  const nodes = new Float32Array(Math.max(4, nTri*2) * 8);
  let nodeCnt = 1;
  const LEAF = 4, BINS = 12, MAXD = 44;
  const bC = new Int32Array(BINS*3);
  const bB = new Float32Array(BINS*3*6);
  const setB = (ni, first, count)=>{
    let x0=Infinity,y0=Infinity,z0=Infinity,x1=-Infinity,y1=-Infinity,z1=-Infinity;
    for(let i=first;i<first+count;i++){
      const t=idx[i]*3;
      if(bmn[t]<x0)x0=bmn[t]; if(bmn[t+1]<y0)y0=bmn[t+1]; if(bmn[t+2]<z0)z0=bmn[t+2];
      if(bmx[t]>x1)x1=bmx[t]; if(bmx[t+1]>y1)y1=bmx[t+1]; if(bmx[t+2]>z1)z1=bmx[t+2];
    }
    const o=ni*8;
    nodes[o]=x0; nodes[o+1]=y0; nodes[o+2]=z0; nodes[o+3]=first;
    nodes[o+4]=x1; nodes[o+5]=y1; nodes[o+6]=z1; nodes[o+7]=count;
  };
  setB(0, 0, nTri);
  const stack = [[0, 0]];
  const tmp = new Uint32Array(nTri);
  while(stack.length){
    const [ni, depth] = stack.pop();
    const o = ni*8, first = nodes[o+3], count = nodes[o+7];
    if(count <= LEAF || depth >= MAXD) continue;
    // 质心包围盒
    let cx0=Infinity,cy0=Infinity,cz0=Infinity,cx1=-Infinity,cy1=-Infinity,cz1=-Infinity;
    for(let i=first;i<first+count;i++){
      const t=idx[i]*3;
      if(cen[t]<cx0)cx0=cen[t]; if(cen[t]>cx1)cx1=cen[t];
      if(cen[t+1]<cy0)cy0=cen[t+1]; if(cen[t+1]>cy1)cy1=cen[t+1];
      if(cen[t+2]<cz0)cz0=cen[t+2]; if(cen[t+2]>cz1)cz1=cen[t+2];
    }
    const ext=[cx1-cx0, cy1-cy0, cz1-cz0], mn=[cx0,cy0,cz0];
    bC.fill(0);
    for(let b=0;b<BINS*3;b++){ const q=b*6;
      bB[q]=bB[q+1]=bB[q+2]=Infinity; bB[q+3]=bB[q+4]=bB[q+5]=-Infinity; }
    for(let i=first;i<first+count;i++){
      const t=idx[i]*3;
      for(let ax=0;ax<3;ax++){
        if(ext[ax] <= 1e-9) continue;
        let b = Math.floor((cen[t+ax]-mn[ax])/ext[ax]*BINS); if(b>=BINS) b=BINS-1; if(b<0) b=0;
        bC[ax*BINS+b]++;
        const q=(ax*BINS+b)*6;
        for(let c=0;c<3;c++){ if(bmn[t+c]<bB[q+c]) bB[q+c]=bmn[t+c]; if(bmx[t+c]>bB[q+3+c]) bB[q+3+c]=bmx[t+c]; }
      }
    }
    const area=(x0,y0,z0,x1,y1,z1)=>{ const dx=Math.max(0,x1-x0),dy=Math.max(0,y1-y0),dz=Math.max(0,z1-z0);
      return 2*(dx*dy+dy*dz+dz*dx); };
    let bestCost=Infinity, bestAx=-1, bestBin=-1;
    const L=new Float32Array(6), R=new Float32Array(6);
    const lC=new Int32Array(BINS), lA=new Float32Array(BINS), rC=new Int32Array(BINS), rA=new Float32Array(BINS);
    for(let ax=0;ax<3;ax++){
      if(ext[ax] <= 1e-9) continue;
      L[0]=L[1]=L[2]=Infinity; L[3]=L[4]=L[5]=-Infinity; let acc=0;
      for(let b=0;b<BINS;b++){
        const q=(ax*BINS+b)*6;
        for(let c=0;c<3;c++){ if(bB[q+c]<L[c])L[c]=bB[q+c]; if(bB[q+3+c]>L[3+c])L[3+c]=bB[q+3+c]; }
        acc += bC[ax*BINS+b]; lC[b]=acc; lA[b]=acc? area(L[0],L[1],L[2],L[3],L[4],L[5]) : 0;
      }
      R[0]=R[1]=R[2]=Infinity; R[3]=R[4]=R[5]=-Infinity; acc=0;
      for(let b=BINS-1;b>=0;b--){
        const q=(ax*BINS+b)*6;
        for(let c=0;c<3;c++){ if(bB[q+c]<R[c])R[c]=bB[q+c]; if(bB[q+3+c]>R[3+c])R[3+c]=bB[q+3+c]; }
        acc += bC[ax*BINS+b]; rC[b]=acc; rA[b]=acc? area(R[0],R[1],R[2],R[3],R[4],R[5]) : 0;
      }
      for(let b=0;b<BINS-1;b++){
        if(!lC[b] || !rC[b+1]) continue;
        const cost = lA[b]*lC[b] + rA[b+1]*rC[b+1];
        if(cost < bestCost){ bestCost=cost; bestAx=ax; bestBin=b; }
      }
    }
    if(bestAx < 0) continue;
    const parentArea = area(nodes[o],nodes[o+1],nodes[o+2],nodes[o+4],nodes[o+5],nodes[o+6]);
    if(parentArea > 0 && bestCost/parentArea + 0.5 >= count) continue;   // 分不划算就留成叶子
    // 分区
    let lo=first, hi=first+count;
    let w=0;
    for(let i=first;i<first+count;i++){
      const t=idx[i]*3;
      let b=Math.floor((cen[t+bestAx]-mn[bestAx])/ext[bestAx]*BINS); if(b>=BINS)b=BINS-1; if(b<0)b=0;
      if(b<=bestBin) tmp[lo++]=idx[i]; else tmp[--hi]=idx[i];
    }
    const nl = lo-first;
    if(nl===0 || nl===count) continue;
    for(let i=first;i<first+count;i++) idx[i]=tmp[i];
    // 右半边刚才是倒着写的，顺序无所谓
    const li=nodeCnt++, ri=nodeCnt++;
    setB(li, first, nl); setB(ri, first+nl, count-nl);
    nodes[o+3]=li; nodes[o+7]=0;                       // 内部节点：leftFirst=左孩子，count=0
    stack.push([li, depth+1], [ri, depth+1]);
  }
  return {nodes, nodeCnt, idx};
}

/* ---------- 3. 贴图打包成 2D 数组纹理 ---------- */
function ptMapArray(maps, size){
  const L = Math.max(1, maps.length);
  const data = new Uint8Array(size*size*4*L);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d', {willReadFrequently:true});
  for(let i=0;i<maps.length;i++){
    const im = maps[i].image;
    g.clearRect(0,0,size,size);
    try{
      if(im && (im instanceof HTMLCanvasElement || im instanceof HTMLImageElement ||
                (typeof ImageBitmap!=='undefined' && im instanceof ImageBitmap) || im instanceof OffscreenCanvas)){
        g.drawImage(im, 0, 0, size, size);
      } else if(im && im.data && im.width){          // DataTexture
        const tc=document.createElement('canvas'); tc.width=im.width; tc.height=im.height;
        const tg=tc.getContext('2d');
        const idt=tg.createImageData(im.width, im.height);
        const src=im.data, comp=src.length/(im.width*im.height);
        for(let p=0;p<im.width*im.height;p++){
          idt.data[p*4]=src[p*comp]; idt.data[p*4+1]=src[p*comp+(comp>1?1:0)];
          idt.data[p*4+2]=src[p*comp+(comp>2?2:0)]; idt.data[p*4+3]=comp>3?src[p*comp+3]:255;
        }
        tg.putImageData(idt,0,0); g.drawImage(tc,0,0,size,size);
      } else { g.fillStyle='#ffffff'; g.fillRect(0,0,size,size); }
    }catch(e){ g.fillStyle='#ffffff'; g.fillRect(0,0,size,size); }
    data.set(g.getImageData(0,0,size,size).data, i*size*size*4);
  }
  const t = new THREE.DataArrayTexture(data, size, size, L);
  t.format = THREE.RGBAFormat; t.type = THREE.UnsignedByteType;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}

/* ---------- 4. 灯光 ---------- */
function ptLights(){
  const out = [];
  const p = new THREE.Vector3(), tp = new THREE.Vector3();
  three.scene.traverse(o=>{
    if(!o.isLight || !o.visible || !(o.intensity > 0)) return;
    let q=o, vis=true; while(q){ if(!q.visible){vis=false;break;} q=q.parent; }
    if(!vis) return;
    o.updateMatrixWorld(true);
    p.setFromMatrixPosition(o.matrixWorld);
    if(o.isDirectionalLight){
      if(o.target) o.target.updateMatrixWorld(true);
      tp.setFromMatrixPosition(o.target ? o.target.matrixWorld : new THREE.Matrix4());
      const d = p.clone().sub(tp).normalize();
      out.push([0,0,0,0, o.color.r,o.color.g,o.color.b,o.intensity, d.x,d.y,d.z,0, 0,0,0.030,0]);
    } else if(o.isSpotLight){
      if(o.target) o.target.updateMatrixWorld(true);
      tp.setFromMatrixPosition(o.target ? o.target.matrixWorld : new THREE.Matrix4());
      const d = tp.clone().sub(p).normalize();
      const co = Math.cos(o.angle), pc = Math.cos(o.angle*(1-(o.penumbra||0)));
      out.push([p.x,p.y,p.z,2, o.color.r,o.color.g,o.color.b,o.intensity,
                d.x,d.y,d.z,(o.distance||0), co,pc,0.10,0]);
    } else if(o.isPointLight){
      out.push([p.x,p.y,p.z,1, o.color.r,o.color.g,o.color.b,o.intensity,
                0,0,0,(o.distance||0), 0,0,0.13,0]);
    }
  });
  return out;
}

/* ---------- 5. 构建 ---------- */
function ptBuild(onProgress){
  const t0 = performance.now();
  const S = ptCollect();
  if(!S) return null;
  onProgress && onProgress('收集三角形 '+S.nTri.toLocaleString());
  const B = ptBuildBVH(S.nTri, S.cen, S.bmn, S.bmx);
  onProgress && onProgress('BVH '+B.nodeCnt.toLocaleString()+' 节点');
  // 按 BVH 顺序重排三角形，叶子就能直接用连续区间，省一张索引纹理
  const P = new Float32Array(S.nTri*12), A = new Float32Array(S.nTri*12);
  for(let i=0;i<S.nTri;i++){
    const s = B.idx[i]*12, d = i*12;
    for(let k=0;k<12;k++){ P[d+k]=S.P[s+k]; A[d+k]=S.A[s+k]; }
  }
  const M = new Float32Array(S.mats.length*16);
  S.mats.forEach((m,i)=>{
    const o=i*16;
    M[o]=m.c.r; M[o+1]=m.c.g; M[o+2]=m.c.b; M[o+3]=m.rough;
    M[o+4]=m.er; M[o+5]=m.eg; M[o+6]=m.eb; M[o+7]=m.metal;
    M[o+8]=m.layer; M[o+9]=m.rx; M[o+10]=m.ry; M[o+11]=m.trans;
    M[o+12]=m.ox; M[o+13]=m.oy; M[o+14]=m.ior; M[o+15]=0;
  });
  const lights = ptLights();
  const LT = new Float32Array(Math.max(1,lights.length)*16);
  lights.forEach((l,i)=>LT.set(l, i*16));
  const data = {
    nTri: S.nTri, nNode: B.nodeCnt, nMat: S.mats.length, nLight: lights.length,
    tPos: ptDataTex(P, S.nTri*3),
    tAttr: ptDataTex(A, S.nTri*3),
    tBVH: ptDataTex(B.nodes.subarray(0, B.nodeCnt*8), B.nodeCnt*2),
    tMat: ptDataTex(M, S.mats.length*4),
    tLight: ptDataTex(LT, Math.max(1,lights.length)*4),
    tMaps: ptMapArray(S.maps, 512),
    nMaps: S.maps.length,
    ms: Math.round(performance.now()-t0)
  };
  return data;
}
function ptDispose(){
  if(!PT) return;
  ['tPos','tAttr','tBVH','tMat','tLight','tMaps'].forEach(k=>{ if(PT[k]) PT[k].dispose(); });
  PT = null;
}

/* ---------- 6. 着色器 ---------- */
const PT_FRAG = `
precision highp float;
precision highp int;
precision highp sampler2DArray;
out vec4 outColor;
uniform sampler2D tPos, tAttr, tBVH, tMat, tLight, tEnv;
uniform sampler2DArray tMaps;
uniform vec2  uRes;
uniform vec3  uCamPos;
uniform mat4  uCamMat;
uniform float uTanHalf, uAspect;
uniform int   uFrame, uBounces, uNLight, uHasEnv, uEnvSRGB, uMode;
uniform float uEnvInt, uClamp;
uniform vec3  uSkyTop, uSkyBot;
const float PI = 3.14159265359;
const int   TW = ${PT_W};

uint rngState;
uint pcg(){ rngState = rngState*747796405u + 2891336453u;
  uint w = ((rngState >> ((rngState >> 28u) + 4u)) ^ rngState) * 277803737u;
  return (w >> 22u) ^ w; }
float rnd(){ return float(pcg()) * (1.0/4294967296.0); }

vec4 fx(sampler2D t, int i){ return texelFetch(t, ivec2(i % TW, i / TW), 0); }

vec3 octDec(vec2 e){
  vec3 n = vec3(e.x, e.y, 1.0-abs(e.x)-abs(e.y));
  float t = max(-n.z, 0.0);
  n.x += n.x >= 0.0 ? -t : t;
  n.y += n.y >= 0.0 ? -t : t;
  return normalize(n);
}
vec3 srgb2lin(vec3 c){ return mix(c/12.92, pow((c+0.055)/1.055, vec3(2.4)), step(vec3(0.04045), c)); }

struct Hit { float t; int tri; vec2 bary; };

bool triHit(vec3 ro, vec3 rd, int tri, inout float tBest, out vec2 bary){
  vec3 a = fx(tPos, tri*3+0).xyz;
  vec3 b = fx(tPos, tri*3+1).xyz;
  vec3 c = fx(tPos, tri*3+2).xyz;
  vec3 e1 = b-a, e2 = c-a;
  vec3 pv = cross(rd, e2);
  float det = dot(e1, pv);
  if(abs(det) < 1e-12) return false;
  float inv = 1.0/det;
  vec3 tv = ro-a;
  float u = dot(tv, pv)*inv; if(u < 0.0 || u > 1.0) return false;
  vec3 qv = cross(tv, e1);
  float v = dot(rd, qv)*inv; if(v < 0.0 || u+v > 1.0) return false;
  float t = dot(e2, qv)*inv;
  if(t > 2e-4 && t < tBest){ tBest = t; bary = vec2(u,v); return true; }
  return false;
}
float boxHit(vec3 ro, vec3 invD, vec3 bmin, vec3 bmax, float tMax){
  vec3 t0 = (bmin-ro)*invD, t1 = (bmax-ro)*invD;
  vec3 tn = min(t0,t1), tf = max(t0,t1);
  float a = max(max(tn.x,tn.y),tn.z);
  float b = min(min(tf.x,tf.y),tf.z);
  return (a <= b && b > 0.0 && a < tMax) ? max(a, 0.0) : -1.0;
}
int matOf(int tri){ return int(fx(tPos, tri*3).w + 0.5); }

bool trace(vec3 ro, vec3 rd, float tMax, out Hit h){
  vec3 invD = vec3(1.0)/rd;          // 除零得 ±Inf，slab 判定仍然正确
  h.t = tMax; h.tri = -1; h.bary = vec2(0.0);
  int stack[48]; int sp = 0; int node = 0;
  for(int guard = 0; guard < 8192; guard++){
    vec4 n0 = fx(tBVH, node*2+0);
    vec4 n1 = fx(tBVH, node*2+1);
    int cnt = int(n1.w);
    if(cnt > 0){
      int first = int(n0.w);
      for(int k = 0; k < cnt; k++){
        vec2 bc;
        if(triHit(ro, rd, first+k, h.t, bc)){ h.tri = first+k; h.bary = bc; }
      }
    } else {
      int l = int(n0.w), r = l+1;
      vec4 l0 = fx(tBVH, l*2+0), l1 = fx(tBVH, l*2+1);
      vec4 r0 = fx(tBVH, r*2+0), r1 = fx(tBVH, r*2+1);
      float dl = boxHit(ro, invD, l0.xyz, l1.xyz, h.t);
      float dr = boxHit(ro, invD, r0.xyz, r1.xyz, h.t);
      int nearN = l, farN = r; float dn = dl, df = dr;
      if(dr >= 0.0 && (dl < 0.0 || dr < dl)){ nearN = r; farN = l; dn = dr; df = dl; }
      if(dn >= 0.0){
        if(df >= 0.0 && sp < 48){ stack[sp] = farN; sp++; }
        node = nearN; continue;
      }
    }
    if(sp == 0) break;
    sp--; node = stack[sp];
  }
  return h.tri >= 0;
}

/* 阴影光线：any-hit 遍历，撞到不透明面立刻返回，遇玻璃衰减后继续。
   （原先是「找最近交点」循环 4 次，等于跑 4 遍完整遍历，非常慢）*/
vec3 visibility(vec3 ro, vec3 rd, float tMax){
  vec3 tr = vec3(1.0);
  vec3 invD = vec3(1.0)/rd;
  int stack[48]; int sp = 0; int node = 0;
  for(int guard = 0; guard < 8192; guard++){
    vec4 n0 = fx(tBVH, node*2+0);
    vec4 n1 = fx(tBVH, node*2+1);
    int cnt = int(n1.w);
    if(cnt > 0){
      int first = int(n0.w);
      for(int k = 0; k < cnt; k++){
        float tb = tMax; vec2 bc;
        if(triHit(ro, rd, first+k, tb, bc)){
          int mi = matOf(first+k);
          vec4 m2 = fx(tMat, mi*4+2);
          if(m2.w < 0.5) return vec3(0.0);                 // 不透明 → 全遮挡
          vec4 m0 = fx(tMat, mi*4+0);
          tr *= mix(vec3(1.0), m0.rgb, 0.6) * m2.w;
          if(max(tr.r, max(tr.g, tr.b)) < 0.02) return vec3(0.0);
        }
      }
    } else {
      int l = int(n0.w), r = l+1;
      vec4 l0 = fx(tBVH, l*2+0), l1 = fx(tBVH, l*2+1);
      vec4 r0 = fx(tBVH, r*2+0), r1 = fx(tBVH, r*2+1);
      float dl = boxHit(ro, invD, l0.xyz, l1.xyz, tMax);
      float dr = boxHit(ro, invD, r0.xyz, r1.xyz, tMax);
      if(dl >= 0.0 && dr >= 0.0){ if(sp < 48){ stack[sp] = r; sp++; } node = l; continue; }
      if(dl >= 0.0){ node = l; continue; }
      if(dr >= 0.0){ node = r; continue; }
    }
    if(sp == 0) break;
    sp--; node = stack[sp];
  }
  return tr;
}

float D_GGX(float ndh, float a){ float a2=a*a; float d=ndh*ndh*(a2-1.0)+1.0; return a2/max(PI*d*d, 1e-9); }
float V_Smith(float ndl, float ndv, float a){
  float a2 = a*a;
  float gv = ndl*sqrt(ndv*ndv*(1.0-a2)+a2);
  float gl = ndv*sqrt(ndl*ndl*(1.0-a2)+a2);
  return 0.5/max(gv+gl, 1e-6);
}
vec3 evalBRDF(vec3 N, vec3 V, vec3 L, vec3 alb, float rough, float metal){
  float ndl = max(dot(N,L), 0.0), ndv = max(dot(N,V), 1e-4);
  if(ndl <= 0.0) return vec3(0.0);
  vec3 H = normalize(V+L);
  float ndh = max(dot(N,H), 0.0), vdh = max(dot(V,H), 0.0);
  float a = max(rough*rough, 1e-4);
  vec3 F0 = mix(vec3(0.04), alb, metal);
  vec3 F  = F0 + (1.0-F0)*pow(1.0-vdh, 5.0);
  vec3 spec = F * D_GGX(ndh, a) * V_Smith(ndl, ndv, a);
  vec3 diff = (1.0-F)*(1.0-metal)*alb/PI;
  return diff + spec;
}
vec3 onb(vec3 n, vec3 v){
  vec3 up = abs(n.y) < 0.92 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
  vec3 t = normalize(cross(up, n)), b = cross(n, t);
  return v.x*t + v.y*b + v.z*n;
}
vec3 cosineDir(vec3 n){
  float r1 = rnd(), r2 = rnd();
  float r = sqrt(r1), phi = 2.0*PI*r2;
  return onb(n, vec3(r*cos(phi), r*sin(phi), sqrt(max(0.0, 1.0-r1))));
}
vec3 ggxDir(vec3 n, vec3 v, float a){
  float r1 = rnd(), r2 = rnd();
  float phi = 2.0*PI*r1;
  float ct = sqrt((1.0-r2)/(1.0+(a*a-1.0)*r2));
  float st = sqrt(max(0.0, 1.0-ct*ct));
  vec3 h = onb(n, vec3(st*cos(phi), st*sin(phi), ct));
  return reflect(-v, h);
}
vec3 envRad(vec3 d){
  vec3 c = mix(uSkyBot, uSkyTop, clamp(d.y*0.5+0.5, 0.0, 1.0));
  if(uHasEnv == 1){
    float u = atan(d.z, d.x)/(2.0*PI) + 0.5;
    float v = asin(clamp(d.y,-1.0,1.0))/PI + 0.5;
    vec3 e = texture(tEnv, vec2(u, v)).rgb;
    if(uEnvSRGB == 1) e = srgb2lin(e);
    c += e*uEnvInt;
  }
  return c;
}

/* 单盏灯的直接光贡献（含可见性） */
vec3 oneLight(int li, vec3 P, vec3 N, vec3 V, vec3 alb, float rough, float metal){
  vec4 L0 = fx(tLight, li*4+0);
  vec4 L1 = fx(tLight, li*4+1);
  vec4 L2 = fx(tLight, li*4+2);
  vec4 L3 = fx(tLight, li*4+3);
  int type = int(L0.w + 0.5);
  vec3 Ld; float dist; vec3 E;
  if(type == 0){
    vec3 d = normalize(L2.xyz);
    float ang = rnd()*2.0*PI, rr = L3.z*sqrt(rnd());
    vec3 up = abs(d.y) < 0.92 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
    vec3 t1 = normalize(cross(up, d)), t2 = cross(d, t1);
    Ld = normalize(d + (cos(ang)*t1 + sin(ang)*t2)*rr);
    dist = 1e5;
    E = L1.rgb*L1.w;
  } else {
    vec3 rv = normalize(vec3(rnd()*2.0-1.0, rnd()*2.0-1.0, rnd()*2.0-1.0) + vec3(1e-4));
    vec3 lp = L0.xyz + rv*L3.z;
    vec3 dv = lp - P; dist = length(dv);
    if(dist < 1e-5) return vec3(0.0);
    Ld = dv/dist;
    float atten = 1.0/max(dist*dist, 1e-6);
    if(L2.w > 0.0){ float f = clamp(1.0 - pow(dist/L2.w, 4.0), 0.0, 1.0); atten *= f*f; }
    E = L1.rgb*L1.w*atten;
    if(type == 2){
      float cd = dot(normalize(L2.xyz), -Ld);
      float sp = smoothstep(L3.x, L3.y, cd);
      if(sp <= 0.0) return vec3(0.0);
      E *= sp;
    }
  }
  float ndl = dot(N, Ld);
  if(ndl <= 0.0) return vec3(0.0);
  if(max(E.r,max(E.g,E.b))*ndl < 1e-5) return vec3(0.0);     // 太暗就别浪费一条阴影光线
  vec3 vis = visibility(P + N*2e-3, Ld, dist - 4e-3);
  if(dot(vis,vis) <= 0.0) return vec3(0.0);
  return evalBRDF(N, V, Ld, alb, rough, metal) * E * ndl * vis;
}
/* 直接光：首次弹射多采几盏（画面里看得见的部分噪点最刺眼），深层只采一盏 */
vec3 directLight(vec3 P, vec3 N, vec3 V, vec3 alb, float rough, float metal, int bounce){
  if(uNLight == 0) return vec3(0.0);
  int want = bounce == 0 ? min(uNLight, 6) : 1;
  if(want >= uNLight){
    vec3 s = vec3(0.0);
    for(int i = 0; i < 32; i++){ if(i >= uNLight) break; s += oneLight(i, P, N, V, alb, rough, metal); }
    return s;
  }
  vec3 s = vec3(0.0);
  for(int j = 0; j < 6; j++){
    if(j >= want) break;
    int li = int(min(float(uNLight)-0.001, rnd()*float(uNLight)));
    s += oneLight(li, P, N, V, alb, rough, metal);
  }
  return s * float(uNLight) / float(want);
}

/* 取交点的材质与着色量 */
struct Surf { vec3 N; vec3 alb; vec3 emis; float rough; float metal; float trans; float ior; };
Surf surfAt(Hit h, vec3 rd){
  Surf s;
  vec4 a0 = fx(tAttr, h.tri*3+0), a1 = fx(tAttr, h.tri*3+1), a2 = fx(tAttr, h.tri*3+2);
  float w = 1.0 - h.bary.x - h.bary.y;
  vec3 Ng = normalize(octDec(a0.xy)*w + octDec(a1.xy)*h.bary.x + octDec(a2.xy)*h.bary.y);
  vec2 uv = a0.zw*w + a1.zw*h.bary.x + a2.zw*h.bary.y;
  s.N = dot(Ng, rd) > 0.0 ? -Ng : Ng;
  int mi = matOf(h.tri);
  vec4 m0 = fx(tMat, mi*4+0), m1 = fx(tMat, mi*4+1),
       m2 = fx(tMat, mi*4+2), m3 = fx(tMat, mi*4+3);
  s.alb = m0.rgb; s.rough = m0.a;
  s.emis = m1.rgb; s.metal = m1.a;
  s.trans = m2.w; s.ior = m3.z;
  if(m2.x >= 0.0){
    vec2 tuv = uv*vec2(m2.y, m2.z) + vec2(m3.x, m3.y);
    s.alb *= srgb2lin(texture(tMaps, vec3(fract(tuv), m2.x)).rgb);
  }
  return s;
}

void main(){
  ivec2 pc = ivec2(gl_FragCoord.xy);
  rngState = uint(pc.x) * 1973u + uint(pc.y) * 9277u + uint(uFrame) * 26699u + 1u;
  pcg(); pcg();

  /* ---- G-buffer 模式：一条主光线，给降噪器提供 albedo / 法线 / 深度 ---- */
  if(uMode > 0){
    vec2 ndc = (gl_FragCoord.xy/uRes)*2.0 - 1.0;
    vec3 dc = normalize(vec3(ndc.x*uTanHalf*uAspect, ndc.y*uTanHalf, -1.0));
    vec3 rd = normalize((uCamMat*vec4(dc, 0.0)).xyz);
    vec3 ro = uCamPos; float travel = 0.0;
    for(int k = 0; k < 4; k++){                   // 玻璃穿过去，记录后面的实体
      Hit h;
      if(!trace(ro, rd, 1e5, h)){
        outColor = uMode == 1 ? vec4(1.0) : vec4(0.0);   // 天空：albedo=1、深度=0（不参与滤波）
        return;
      }
      Surf s = surfAt(h, rd);
      travel += h.t;
      if(s.trans > 0.5 && k < 3){ ro = ro + rd*(h.t + 1e-3); continue; }
      if(uMode == 1) outColor = vec4(max(s.alb + s.emis*0.5, vec3(0.02)), 1.0);
      else           outColor = vec4(s.N, travel);
      return;
    }
    outColor = uMode == 1 ? vec4(1.0) : vec4(0.0);
    return;
  }

  /* ---- 路径追踪 ---- */
  vec2 px = gl_FragCoord.xy + vec2(rnd(), rnd()) - 0.5;
  vec2 ndc = px/uRes*2.0 - 1.0;
  vec3 dc = normalize(vec3(ndc.x*uTanHalf*uAspect, ndc.y*uTanHalf, -1.0));
  vec3 rd = normalize((uCamMat*vec4(dc, 0.0)).xyz);
  vec3 ro = uCamPos;

  vec3 L = vec3(0.0), T = vec3(1.0);
  for(int b = 0; b < 12; b++){
    if(b >= uBounces) break;
    Hit h;
    if(!trace(ro, rd, 1e5, h)){ L += T*envRad(rd); break; }
    Surf s = surfAt(h, rd);
    vec3 P = ro + rd*h.t;
    vec3 V = -rd;
    L += T*s.emis;

    if(s.trans > 0.5){
      bool back = dot(s.N, rd) > 0.0;
      float eta = back ? s.ior : 1.0/s.ior;
      float c = clamp(dot(s.N, V), 0.0, 1.0);
      float r0 = (1.0-s.ior)/(1.0+s.ior); r0 = r0*r0;
      float F = r0 + (1.0-r0)*pow(1.0-c, 5.0);
      vec3 refr = refract(-V, s.N, eta);
      if(rnd() < F || dot(refr,refr) < 1e-6){ rd = reflect(-V, s.N); }
      else { rd = normalize(refr); T *= mix(vec3(1.0), s.alb, 0.35); }
      ro = P + rd*1e-3;
      continue;
    }

    L += T*directLight(P, s.N, V, s.alb, s.rough, s.metal, b);

    float pSpec = clamp(0.05 + s.metal*0.85 + (1.0-s.rough)*0.22, 0.05, 0.95);
    float a = max(s.rough*s.rough, 1e-4);
    vec3 nd = rnd() < pSpec ? ggxDir(s.N, V, a) : cosineDir(s.N);
    if(dot(nd, s.N) <= 0.0) break;
    vec3 H = normalize(V+nd);
    float ndh = max(dot(s.N,H), 1e-4), vdh = max(dot(V,H), 1e-4);
    float pdf = D_GGX(ndh, a)*ndh/(4.0*vdh)*pSpec + max(dot(nd,s.N),0.0)/PI*(1.0-pSpec);
    if(pdf < 1e-8) break;
    T *= evalBRDF(s.N, V, nd, s.alb, s.rough, s.metal) * max(dot(s.N,nd),0.0) / pdf;
    ro = P + s.N*2e-3;
    rd = nd;

    float q = max(T.r, max(T.g, T.b));
    if(b > 2){
      if(q < 0.02) break;
      float pq = clamp(q, 0.05, 0.95);
      if(rnd() > pq) break;
      T /= pq;
    }
  }
  // NaN 会被加法混合永久累进累积缓冲，那个像素从此变成一个亮点，再多采样也洗不掉。
  // 必须在写出前挡掉——min/clamp 碰到 NaN 的行为是未定义的，挡不住。
  L = mix(vec3(0.0), L, vec3(equal(L, L)));
  L = min(max(L, vec3(0.0)), vec3(uClamp));      // 钳掉萤火虫
  outColor = vec4(L, 1.0);
}
`;

/* À-Trous 边缘保持小波降噪（Dammertz 等）：按法线/深度/颜色差加权的多级 5x5 滤波。
   输入是「除掉 albedo 的辐照度」，滤完再乘回 albedo —— 这样贴图细节不会被抹平。 */
const PT_DENOISE = `
precision highp float;
out vec4 outColor;
uniform sampler2D tIn, tNrm;
uniform vec2 uRes;
uniform int uStep;
uniform float uSigC, uSigN, uSigZ;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c0 = texelFetch(tIn, p, 0).rgb;
  vec4 g0 = texelFetch(tNrm, p, 0);
  if(g0.w <= 0.0){ outColor = vec4(c0, 1.0); return; }      // 天空/窗外：不滤，保住锐度
  float kk[5]; kk[0]=0.0625; kk[1]=0.25; kk[2]=0.375; kk[3]=0.25; kk[4]=0.0625;
  vec3 sum = vec3(0.0); float wsum = 0.0;
  ivec2 R = ivec2(uRes);
  /* 深度权重要沿「局部深度梯度」比，不能直接比深度差：
     天花板、地板这类掠射面上相邻像素的深度本来就变化很快，
     直接比深度差会把邻居全判成不同表面而拒绝，滤波在最需要它的地方失效
     （真机出图里天花板噪得最厉害就是这个原因）。 */
  float zL = texelFetch(tNrm, ivec2(max(p.x-1,0), p.y), 0).w;
  float zR2= texelFetch(tNrm, ivec2(min(p.x+1,R.x-1), p.y), 0).w;
  float zD = texelFetch(tNrm, ivec2(p.x, max(p.y-1,0)), 0).w;
  float zU = texelFetch(tNrm, ivec2(p.x, min(p.y+1,R.y-1)), 0).w;
  vec2 gz = vec2((zR2>0.0&&zL>0.0)?(zR2-zL)*0.5:0.0, (zU>0.0&&zD>0.0)?(zU-zD)*0.5:0.0);
  for(int dy = -2; dy <= 2; dy++){
    for(int dx = -2; dx <= 2; dx++){
      ivec2 q = p + ivec2(dx, dy)*uStep;
      if(q.x < 0 || q.y < 0 || q.x >= R.x || q.y >= R.y) continue;
      vec4 g = texelFetch(tNrm, q, 0);
      if(g.w <= 0.0) continue;
      vec3 c = texelFetch(tIn, q, 0).rgb;
      float wn = pow(max(dot(g0.xyz, g.xyz), 0.0), uSigN);
      vec2 off = vec2(float(dx), float(dy)) * float(uStep);
      float zPred = g0.w + dot(gz, off);                 // 按局部梯度外推的深度
      float zTol = uSigZ * max(g0.w, 0.5) + abs(dot(gz, off)) * 2.0 + 0.01;
      float wz = exp(-abs(zPred - g.w) / zTol);
      vec3 dc = c - c0;
      /* 颜色相似度的 σ 必须相对于局部亮度，不能用绝对值：
         室内日光场景的辐照度量级是 1~3，而原来的绝对 σ 只有 0.03 量级，
         于是每个邻居都被判成「边缘」拒绝掉，整个滤波形同虚设
         （真机 40spp 出图满屏噪点就是这个原因）。 */
      float wc = exp(-dot(dc, dc) / max(1e-5, uSigC * (dot(c0, c0) + 0.05)));
      float w = kk[dx+2]*kk[dy+2]*wn*wz*wc;
      sum += c*w; wsum += w;
    }
  }
  outColor = vec4(sum/max(wsum, 1e-6), 1.0);
}
`;
/* 累积图 ÷ 采样数 ÷ albedo → 交给降噪器 */
const PT_DEMOD = `
precision highp float;
out vec4 outColor;
uniform sampler2D tAcc, tAlb;
uniform vec2 uRes;
uniform float uN;
/* 除掉 albedo 得到辐照度，顺便做一道萤火虫抑制。
   为什么必须在降噪之前做：À-Trous 的颜色相似度权重会把孤立的超亮样本
   当成「边缘」保留下来，越滤越突出——实测满家具客厅 40spp 出图满屏白点就是这个。
   做法是把明显高于八邻域的像素压回邻域上限（邻域也亮的地方不动，所以真实高光不受影响）。 */
vec3 demod(ivec2 q){
  vec3 c = texelFetch(tAcc, q, 0).rgb / max(uN, 1.0);
  vec3 a = max(texelFetch(tAlb, q, 0).rgb, vec3(0.045));
  return c/a;
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c = demod(p);
  ivec2 R = ivec2(uRes);
  vec3 mx = vec3(0.0), sum = vec3(0.0); float cnt = 0.0;
  for(int dy=-1; dy<=1; dy++) for(int dx=-1; dx<=1; dx++){
    if(dx==0 && dy==0) continue;
    ivec2 q = p + ivec2(dx,dy);
    if(q.x<0||q.y<0||q.x>=R.x||q.y>=R.y) continue;
    vec3 v = demod(q);
    mx = max(mx, v); sum += v; cnt += 1.0;
  }
  if(cnt > 0.0){
    vec3 mean = sum/cnt;
    // 允许到「邻域最大值」和「均值的 3 倍」里更宽松的那个，再高就是孤点
    vec3 lim = max(mx, mean*3.0);
    c = min(c, lim);
  }
  outColor = vec4(c, 1.0);
}
`;
/* 乘回 albedo → ACES → sRGB */
const PT_RESOLVE = `
precision highp float;
out vec4 outColor;
uniform sampler2D tIrr, tAlb, tAcc;
uniform float uExp, uN;
uniform int uDenoise;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c;
  if(uDenoise == 1) c = texelFetch(tIrr, p, 0).rgb * max(texelFetch(tAlb, p, 0).rgb, vec3(0.045));
  else              c = texelFetch(tAcc, p, 0).rgb / max(uN, 1.0);
  c = aces(c*uExp);
  c = mix(c*12.92, 1.055*pow(max(c, vec3(0.0031308)), vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c));
  outColor = vec4(c, 1.0);
}
`;

/* 分块数决策（抽成纯函数是为了能单测——真实 GPU 计时在 headless 下测不到）。
   目标：任何显卡上单个 draw 都短于看门狗阈值。TILE_MAX 取 70ms，
   离常见的 2s 阈值有近 30 倍余量。 */
function ptPickGrid(perPx, px, minTX, maxTX, tileMax){
  let want = minTX;
  while(want < maxTX && perPx * px / (want*want) > tileMax) want *= 2;
  return want;
}
function ptAdjustGrid(TX, perTile, minTX, maxTX, tileMax, tileMin){
  if(perTile > tileMax && TX < maxTX) return TX*2;
  if(perTile < tileMin && TX > minTX) return TX/2;
  return TX;
}
/* ---------- 7. 渲染循环 ---------- */
const PT_QUALITY = {
  draft:  {spp:120,  bounces:4, maxPx: 480*1000, label:'草稿'},
  normal: {spp:320,  bounces:6, maxPx: 900*1000, label:'标准'},
  fine:   {spp:900,  bounces:8, maxPx:1600*1000, label:'精细'}
};
function ptRender(samples, ptOpts){
  ptOpts = ptOpts || {};
  if(!three || three.photo) return;
  if(!three.renderer.capabilities.isWebGL2){ alert('当前浏览器没有 WebGL2，无法使用光线追踪渲染。'); return; }
  const Q = PT_QUALITY[ptOpts.quality || state.ptQ || 'normal'] || PT_QUALITY.normal;
  samples = samples || Q.spp;
  const denoiseOn = ptOpts.denoise != null ? !!ptOpts.denoise : (state.ptDN !== false);
  const {renderer, cam, canvas} = three;
  const bar = $('#photoBar'), lbl = $('#photoTxt');
  bar.style.display = 'flex';
  lbl.textContent = '光线追踪：正在构建 BVH…';
  let cancelled = false;
  three.photo = {cancel(){ cancelled = true; }};

  setTimeout(()=>{
    let built = null;
    try{ built = ptBuild(m=>{ lbl.textContent = '光线追踪：'+m; }); }
    catch(e){ console.error(e); }
    if(!built){ lbl.textContent=''; bar.style.display='none'; three.photo=null;
                alert('场景里没有可追踪的几何。'); return; }
    ptDispose(); PT = built;

    const W = canvas.clientWidth||canvas.width, H = canvas.clientHeight||canvas.height;
    const MAXPX = ptOpts.maxPx || Q.maxPx;
    const sc = Math.min(1, Math.sqrt(MAXPX/(W*H)));
    const rw = Math.max(64, Math.round(W*sc)), rh = Math.max(64, Math.round(H*sc));
    const RT = (dep)=> new THREE.WebGLRenderTarget(rw, rh, {type:THREE.HalfFloatType,
      format:THREE.RGBAFormat, minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, depthBuffer:!!dep});
    const accRT = RT(false), albRT = RT(false), nrmRT = RT(false), dnA = RT(false), dnB = RT(false);
    const oCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const VS3 = 'out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }';

    /* 环境光填充：光栅视图靠 amb+hemi 假装全局光照，但路径追踪是**真的**在算 GI，
       原样叠上去等于把房间塞进一个发光白球里——对比度全被抹平，
       窗外城市糊成一片灰，白色家具（KALLAX 那种）直接和墙融在一起看不见。
       只保留很小一份当天光残留，主光照交给真正的环境贴图和太阳。 */
    const AMB_FILL = 0.32;                      // 实测：1.0 冲平对比度，0.12 又偏暗
    const hemi = three.hemi, amb = three.amb;
    const ambC = new THREE.Color(amb.color).multiplyScalar(amb.intensity);
    const top = new THREE.Color(hemi.color).multiplyScalar(hemi.intensity).add(ambC)
                  .multiplyScalar(AMB_FILL/Math.PI);
    const bot = new THREE.Color(hemi.groundColor).multiplyScalar(hemi.intensity).add(ambC)
                  .multiplyScalar(AMB_FILL/Math.PI);
    const pano = three.panorama || null;

    const uni = {
      tPos:{value:PT.tPos}, tAttr:{value:PT.tAttr}, tBVH:{value:PT.tBVH},
      tMat:{value:PT.tMat}, tLight:{value:PT.tLight}, tMaps:{value:PT.tMaps},
      tEnv:{value:pano},
      uRes:{value:new THREE.Vector2(rw,rh)},
      uCamPos:{value:new THREE.Vector3()}, uCamMat:{value:new THREE.Matrix4()},
      uTanHalf:{value:1}, uAspect:{value:rw/rh},
      uFrame:{value:0}, uBounces:{value:ptOpts.bounces||Q.bounces}, uNLight:{value:PT.nLight},
      uHasEnv:{value:pano?1:0}, uEnvSRGB:{value:(pano&&pano.encoding===THREE.sRGBEncoding)?1:0},
      uEnvInt:{value:1.0}, uClamp:{value:24.0}, uMode:{value:0},   // 环境贴图给足：日光本来就该从窗户进来
      uSkyTop:{value:new THREE.Vector3(top.r,top.g,top.b)},
      uSkyBot:{value:new THREE.Vector3(bot.r,bot.g,bot.b)}
    };
    const mk=(frag, extra, blend)=>new THREE.ShaderMaterial(Object.assign({
      glslVersion:THREE.GLSL3, vertexShader:VS3, fragmentShader:frag,
      depthTest:false, depthWrite:false}, extra||{},
      blend? {blending:THREE.AdditiveBlending, transparent:true} : {}));
    const ptMat = mk(PT_FRAG, {uniforms:uni}, true);
    const gMat  = mk(PT_FRAG, {uniforms:uni}, false);
    const dnMat = mk(PT_DENOISE, {uniforms:{
      tIn:{value:null}, tNrm:{value:nrmRT.texture}, uRes:{value:new THREE.Vector2(rw,rh)},
      uStep:{value:1}, uSigC:{value:0.6}, uSigN:{value:48.0}, uSigZ:{value:0.06}}}, false);
    const dmMat = mk(PT_DEMOD, {uniforms:{
      tAcc:{value:accRT.texture}, tAlb:{value:albRT.texture}, uN:{value:1},
      uRes:{value:new THREE.Vector2(rw,rh)}}}, false);
    const rsMat = mk(PT_RESOLVE, {uniforms:{
      tIrr:{value:dnA.texture}, tAlb:{value:albRT.texture}, tAcc:{value:accRT.texture},
      uExp:{value:renderer.toneMappingExposure}, uN:{value:1}, uDenoise:{value:denoiseOn?1:0}}}, false);

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), ptMat); quad.frustumCulled=false;
    const qs = new THREE.Scene(); qs.add(quad);
    const blit=(mat, target)=>{ quad.material=mat; renderer.setRenderTarget(target||null);
      renderer.autoClear=true; renderer.render(qs, oCam); };

    cam.updateMatrixWorld(true);
    uni.uCamPos.value.setFromMatrixPosition(cam.matrixWorld);
    uni.uCamMat.value.copy(cam.matrixWorld);
    uni.uTanHalf.value = Math.tan(cam.fov*Math.PI/360);
    uni.uAspect.value = rw/rh;

    const savedPR = renderer.getPixelRatio(), savedAC = renderer.autoClear;
    renderer.setPixelRatio(1);
    renderer.setSize(rw, rh, false);          // 只设一次：每帧 setSize 会重建默认帧缓冲，是之前卡住的元凶
    // G-buffer（各一条主光线）
    uni.uMode.value = 1; blit(gMat, albRT);
    uni.uMode.value = 2; blit(gMat, nrmRT);
    uni.uMode.value = 0;
    renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000,1); renderer.clear(true,true,true);
    renderer.setRenderTarget(null);

    /* 分块必须细到「单个 draw 短于 GPU 看门狗阈值」。draw 一长驱动就重置上下文，
       累积缓冲被清空但采样计数还在涨，最后除以完整 spp 就得到一张欠曝多噪的图——
       用户看到的现象是「进度卡在 40% 很久，然后突然结束，图像像只跑了一半」。

       格子数不能拍脑袋定死：同样 8x8，强显卡上一块 3ms、弱显卡上可能 300ms。
       下面按实测的单块耗时自适应——开头先标定一次，之后每轮采样边界再校正。
       TILE_MAX 取 70ms：离常见的 2s 看门狗阈值有近 30 倍余量。 */
    let TX = 8, NT = TX*TX;                    // 起步 8x8，标定后可能升到 32x32
    const TX_MIN = 4, TX_MAX = 32;
    const TILE_MAX = 70, TILE_MIN = 6;         // 单块目标耗时区间（ms）
    let spp = 0, tile = 0, tilesDone = 0, gridNote = '', weakGPU = 0;
    const t0 = performance.now();
    let lastPreview = 0;

    /* GPU 栅栏：renderer.render() 只是把命令排进队列就立刻返回。
       不等 GPU 真画完就接着排，队列越堆越深，最后卡在某次提交上不动——
       进度条也就跟着假死。用 fenceSync 把节奏交给 GPU，进度从此反映真实完成量。 */
    const gl = renderer.getContext();
    let fence = null, gpuMs = 0, perTile = 0, batchTiles = 8, waitStart = 0, polls = 0;
    const FENCE_MAX_POLL = 120;                // 兜底：等太久就放行，绝不允许卡死
    let useFence = !!gl.fenceSync, fenceMiss = 0;
    const fencePut = ()=>{
      if(useFence){ fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
                    waitStart = performance.now(); polls = 0; }
      gl.flush();
    };
    const fenceDrop = ()=>{ if(fence){ try{ gl.deleteSync(fence); }catch(_){} fence = null; } };
    const fenceReady = ()=>{
      if(!fence) return true;                  // 不支持 fenceSync 就不节流
      // 首次轮询带 FLUSH bit，保证这个 fence 一定会被推进去执行
      const r = gl.clientWaitSync(fence, polls === 0 ? gl.SYNC_FLUSH_COMMANDS_BIT : 0, 0);
      polls++;
      if(r === gl.ALREADY_SIGNALED || r === gl.CONDITION_SATISFIED){
        const dt = performance.now() - waitStart;
        if(dt > 0) gpuMs = dt;                 // 计时器被冻结时（headless 虚拟时间）保留上次的值
        fenceMiss = 0; fenceDrop(); return true;
      }
      if(r === gl.WAIT_FAILED || polls > FENCE_MAX_POLL){
        // 这个平台上 fence 不好使（swiftshader 就不 signal）。连着几次都等不到就干脆别用，
        // 否则每步白等上百次轮询，比不节流还慢。
        if(++fenceMiss >= 3){ useFence = false; }
        fenceDrop(); return true;
      }
      return false;
    };

    // 上下文丢失不能装作没事继续跑，否则最后交出来的是半成品还不告诉用户
    let ctxLost = false;
    const onCtxLost = (e)=>{ e.preventDefault(); ctxLost = true; };
    canvas.addEventListener('webglcontextlost', onCtxLost, false);

    const denoise = (iters)=>{
      dmMat.uniforms.uN.value = Math.max(1, spp);
      blit(dmMat, dnA);
      let src = dnA, dst = dnB;
      // 现在 uSigC 是无量纲系数（见 shader 里的相对化）：采样越多噪声越小，σ 越紧
      dnMat.uniforms.uSigC.value = Math.min(2.5, Math.max(0.02, 2.5/Math.max(1, spp)));
      for(let i=0;i<iters;i++){
        dnMat.uniforms.tIn.value = src.texture;
        dnMat.uniforms.uStep.value = 1<<i;
        blit(dnMat, dst);
        const t=src; src=dst; dst=t;
      }
      rsMat.uniforms.tIrr.value = src.texture;
    };
    const present = (iters)=>{
      if(denoiseOn && spp>0) denoise(iters);
      rsMat.uniforms.uN.value = Math.max(1, spp);
      blit(rsMat, null);
    };

    const finish = (aborted)=>{
      canvas.removeEventListener('webglcontextlost', onCtxLost, false);
      fenceDrop();
      renderer.setRenderTarget(null); renderer.setScissorTest(false);
      renderer.autoClear = savedAC;
      let out = null;
      if(!aborted && spp > 0){
        present(5);
        const cv = document.createElement('canvas'); cv.width=rw; cv.height=rh;
        cv.getContext('2d').drawImage(renderer.domElement, 0, 0, rw, rh);
        out = cv;
      }
      [accRT,albRT,nrmRT,dnA,dnB].forEach(t=>t.dispose());
      [ptMat,gMat,dnMat,dmMat,rsMat].forEach(m=>m.dispose());
      quad.geometry.dispose();
      ptDispose();
      renderer.setSize(canvas.clientWidth||canvas.width, canvas.clientHeight||canvas.height, false);
      renderer.setPixelRatio(savedPR);
      three.photo = null; bar.style.display = 'none';
      requestShadowUpdate(); requestRender();
      three.ptResult = out;
      if(ptOpts.onDone) ptOpts.onDone(out, spp);
      else if(out) showPhotoResult(out, {spp, want:samples, lost:ctxLost,
                                         secs:(performance.now()-t0)/1000});
      if(ctxLost && !ptOpts.onDone)
        alert('显卡上下文在渲染过程中被重置了（多半是单帧太重，触发了驱动看门狗）。\n'
            + '已用 ' + spp + '/' + samples + ' 次采样出图，画面会偏噪。\n'
            + '建议把光追质量降一档，或把窗口调小一些再试。');
    };

    /* 开跑前先标定：画一小条（1/64 画面）量出满负载耗时，据此选初始格子数。
       不标定的话，弱显卡要等第一块画完（可能好几秒）才知道该切细——而那一块
       本身就可能已经把看门狗踩了。 */
    const calibrate = ()=>{
      if(!useFence) return;
      const cw = Math.max(8, Math.round(rw/8)), ch2 = Math.max(8, Math.round(rh/8));
      quad.material = ptMat; uni.uFrame.value = 1;
      renderer.autoClear = false;
      renderer.setRenderTarget(accRT);
      renderer.setScissorTest(true);
      renderer.setScissor(0, 0, cw, ch2);
      renderer.setViewport(0, 0, rw, rh);
      const tc = performance.now();
      renderer.render(qs, oCam);
      renderer.setScissorTest(false);
      renderer.setRenderTarget(null);
      renderer.autoClear = savedAC;
      const gl2 = gl;
      const f2 = gl2.fenceSync(gl2.SYNC_GPU_COMMANDS_COMPLETE, 0);
      gl2.flush();
      let r2, guard = 0;
      do { r2 = gl2.clientWaitSync(f2, guard === 0 ? gl2.SYNC_FLUSH_COMMANDS_BIT : 0, 0); guard++; }
      while(r2 === gl2.TIMEOUT_EXPIRED && guard < 4000);
      gl2.deleteSync(f2);
      const dt = performance.now() - tc;
      if(dt <= 0) return;                        // 计时器被冻结（headless 虚拟时间）
      const perPx = dt / (cw*ch2);               // ms/像素（满弹射、含 NEE）
      const want = ptPickGrid(perPx, rw*rh, TX_MIN, TX_MAX, TILE_MAX);
      if(want !== TX){ gridNote = '标定→'+want+'x'+want; TX = want; NT = TX*TX; }
      // 切到最细格子仍然重，说明这台机器扛不住当前档位——如实告诉用户
      if(perPx * (rw*rh) / (TX_MAX*TX_MAX) > TILE_MAX)
        weakGPU = Math.round(perPx * (rw*rh) / (TX*TX));
      perTile = perPx * (rw*rh) / NT;
      batchTiles = Math.max(1, Math.min(NT, Math.round(40/Math.max(perTile, 0.5))));
      // 标定那一小块也是有效采样，但只覆盖 1/64 画面，直接清掉避免那块偏亮
      renderer.setRenderTarget(accRT);
      renderer.setClearColor(0x000000, 1); renderer.clear(true, false, false);
      renderer.setRenderTarget(null);
    };
    try{ calibrate(); }catch(e){ console.warn('分块标定失败，用默认 8x8:', e.message); }

    const step = ()=>{
      if(cancelled){ finish(true); return; }
      if(ctxLost){ finish(false); return; }        // 上下文没了：拿现有采样收工并告知
      if(!fenceReady()){                           // 上一批 GPU 还没画完就别再排新的
        const el0 = ((performance.now()-t0)/1000).toFixed(1);
        lbl.textContent = '光线追踪 '+(((spp + tile/NT)/samples)*100).toFixed(1)+'%（'+spp+'/'+samples
          +' spp · 已用 '+el0+'s · 等待 GPU…）';
        setTimeout(step, 8); return;
      }
      // 按实测单块耗时调批量，目标一批 ~40ms：太小调度开销大，太大踩看门狗。
      // 量不到（不支持 fence / 计时器被冻结）就保持默认批量，别退化成一次一块。
      if(useFence && gpuMs > 0){
        perTile = gpuMs / Math.max(1, batchTiles);
        batchTiles = Math.max(1, Math.min(NT, Math.round(40 / Math.max(perTile, 0.5))));
        /* 单块本身太重就把格子切细（弱显卡上 8x8 可能一块就几百毫秒）。
           只在采样边界改，保证每个像素每轮恰好被采一次。 */
        if(tile === 0){
          const nx = ptAdjustGrid(TX, perTile, TX_MIN, TX_MAX, TILE_MAX, TILE_MIN);
          if(nx !== TX){
            gridNote = TX+'x'+TX+'→'+nx+'x'+nx;
            TX = nx; NT = TX*TX;
            perTile = perTile * (nx > TX ? 0.25 : 4);   // 面积变了，估值同步缩放
            batchTiles = Math.max(1, Math.min(NT, Math.round(40/Math.max(perTile,0.5))));
          }
        }
      } else if(!useFence){
        batchTiles = NT;                       // 无栅栏可用：退回按帧排一整轮
      }
      const fs = performance.now();
      quad.material = ptMat;
      renderer.autoClear = false;
      let batch = 0;
      do {
        const tx = tile % TX, ty = (tile/TX)|0;
        const x0 = Math.floor(tx*rw/TX), x1 = Math.floor((tx+1)*rw/TX);
        const y0 = Math.floor(ty*rh/TX), y1 = Math.floor((ty+1)*rh/TX);
        uni.uFrame.value = tilesDone + 1;
        renderer.setRenderTarget(accRT);
        renderer.setScissorTest(true);
        renderer.setScissor(x0, y0, x1-x0, y1-y0);
        renderer.setViewport(0, 0, rw, rh);
        renderer.render(qs, oCam);
        renderer.setScissorTest(false);
        renderer.setRenderTarget(null);
        tile++; tilesDone++; batch++;
        if(tile >= NT){ tile = 0; spp++; }
      } while(batch < batchTiles && spp < samples);
      renderer.autoClear = savedAC;
      fencePut();                                  // 插栅栏，下一轮要等它完成

      const now = performance.now();
      if(spp > 0 && (now-lastPreview > 700 || spp >= samples)){ present(3); lastPreview = now; }

      // 进度按「完成的采样轮数」算，格子数中途变了也不会跳
      const frac = (spp + tile/NT) / samples;
      const el = (now-t0)/1000;
      const eta = frac>0.004 ? Math.max(0, el/frac - el) : 0;
      const fmt = (v)=> v>=60 ? Math.floor(v/60)+'分'+String(Math.round(v%60)).padStart(2,'0')+'秒' : v.toFixed(0)+'秒';
      lbl.textContent = '光线追踪 '+(frac*100).toFixed(1)+'%（'+spp+'/'+samples+' spp · 已用 '+fmt(el)+
        (eta>1?' · 约剩 '+fmt(eta):'')+' · '+PT.nTri.toLocaleString()+' 三角形 / '+PT.nLight+' 光源'+
        (denoiseOn?' · 降噪开':'')
        +(perTile>0?' · '+perTile.toFixed(0)+'ms/块 @'+TX+'x'+TX:'')+'）'
        +(weakGPU? ' ⚠ 单块仍需 '+weakGPU+'ms，这台机器建议降到草稿档' : '');
      if(spp >= samples){ finish(false); return; }
      setTimeout(step, 0);
    };
    setTimeout(step, 0);
  }, 40);
}

function chairTab(K){ return (t)=>{
  if(t<=K[0][0]) return K[0][1];
  for(let i=1;i<K.length;i++) if(t<=K[i][0]){ const a=K[i-1], b=K[i];
    return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]); }
  return K[K.length-1][1]; }; }

function chairOutl(cm, wf, H, t0, t1, n){
  const P=[];
  for(let i=0;i<=n;i++){ const t=t0+(t1-t0)*i/n; P.push([ cm(wf(t)), cm(t*H)]); }
  for(let i=n;i>=0;i--){ const t=t0+(t1-t0)*i/n; P.push([-cm(wf(t)), cm(t*H)]); }
  return P; }

function chairSpl(K){
  const n=K.length, at=(i)=>K[Math.max(0,Math.min(n-1,i))];
  return (t)=>{
    const u=Math.max(0,Math.min(0.999999,t))*(n-1), i=Math.floor(u), f=u-i;
    const p0=at(i-1), p1=at(i), p2=at(i+1), p3=at(i+2);
    const c=(a,b,c2,d)=>0.5*(2*b+(-a+c2)*f+(2*a-5*b+4*c2-d)*f*f+(-a+3*b-3*c2+d)*f*f*f);
    return [c(p0[0],p1[0],p2[0],p3[0]), c(p0[1],p1[1],p2[1],p3[1])]; }; }

function chairBend(m, sp, H, bow, dz){
  const pa=m.geometry.attributes.position;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i), u=pa.getY(i), v=pa.getZ(i);
    const t=Math.max(0,Math.min(1,u/H));
    const p=sp(t), a=sp(Math.max(0,t-0.004)), b=sp(Math.min(1,t+0.004));
    let ty=b[0]-a[0], tz=b[1]-a[1];
    const L=Math.hypot(ty,tz)||1; ty/=L; tz/=L;
    const o=v+dz-bow*x*x;                       // 厚度偏移 + 横向包裹弧度（边缘往后收）
    pa.setXYZ(i, x, p[0]-tz*o, p[1]+ty*o);      // 法线 = 切线左转 90°，指向椅子正前方
  }
  pa.needsUpdate=true;
  m.geometry.computeVertexNormals();
  m.geometry.computeBoundingBox(); m.geometry.computeBoundingSphere();
  return m; }

function chairMid(depth, bevel){ return -(depth/2-(bevel||0)); }

function chairRing(o, i2){
  const P=[];
  for(let k=0;k<o.length;k++) P.push(o[k]);
  P.push(o[0]); P.push(i2[0]);
  for(let k=i2.length-1;k>=1;k--) P.push(i2[k]);
  P.push(i2[0]);
  return P; }

/* 脚轮：黑胎 + 亮色轮毂 + 塑料轮壳，psi 为所在爪的方位角（只绕竖轴转，不叠复合角） */
function chairCaster(C, psi, RC, RW, mShell, mTire, mHub){
  const cm=C.cm, s=Math.sin(psi), c=Math.cos(psi);
  const x=cm(RC)*s, z=cm(RC)*c, TT=RW*0.34, RT=RW-TT;
  const hs=C.rb(cm(5.2), cm(4.4), cm(6.4), cm(1.1), mShell, x, cm(RW*1.05), z); hs.rotation.y=psi;
  const nk=C.cyl(cm(1.5), cm(1.9), cm(2.6), mShell, x, cm(RW*1.05+4.2), z, 12); nk.rotation.y=psi;
  const tire=C.torus(cm(RT), cm(TT), mTire, x, cm(RW), z); tire.rotation.y=Math.PI/2+psi;
  const hub=C.sph(cm(RW*0.62), mHub, x, cm(RW), z, 12);
  hub.rotation.y=psi; hub.scale.x=0.42;
  return [hs,tire,hub,nk]; }

/* 贴图密度要随家具尺寸变，否则 40cm 床头柜和 200cm 沙发纹理一样大。
   把缩放吸附到几档并缓存——每 clone 一次都会多一次 GPU 上传，不能按件克隆。 */
const _texVar=new Map();
const _TEX_LADDER=[0.25,0.5,0.75,1,1.5,2,3,4,6,8];
function texScaled(base, ftSize, per){
  if(!base) return base;
  const want = Math.max(0.25, (ftSize||3) / (per||3));
  let s=_TEX_LADDER[0];
  for(const v of _TEX_LADDER) if(Math.abs(v-want) < Math.abs(s-want)) s=v;
  if(Math.abs(s-1)<1e-6) return base;
  const key = base.uuid+'|'+s;
  let t=_texVar.get(key);
  if(!t){
    t = base.clone(); t.needsUpdate = true;
    t.repeat.set(base.repeat.x*s, base.repeat.y*s);
    _texVar.set(key, t);
  }
  return t;
}

/* 泛型建模的统一材质工厂：按 kind 决定贴图 / 粗糙度 / 金属度 / 环境反射强度。
   之前这里只有 `new MeshStandardMaterial({color, roughness:.85})`——
   25 个 kind 全是无贴图纯色板。 */
const _furnMatCache=new Map();
const FURN_SOFT = ['sofa','sofaL','armchair','playCouch','bed','stool','officeChair','swivelChair','chair'];
const FURN_CASE = ['bookcase','shelf','dresser','nightstand','shoeCab','tvBench','desk','deskSitStand',
                   'sideTable','coffeeTable','tableRect','tableRound','tableFold','tableDrawer','crib','box','rocking','xylophone','wobble','sandTable','playKitchen'];
const FURN_METAL= ['bedMetal','cart'];
function furnMats(spec, col){
  const kind = spec.kind || 'box';
  const size = cm2ft(Math.max(spec.w||90, spec.d||60));
  const key = [kind, spec.wood||'', col.getHexString(), Math.round(size*4)].join('|');
  const hit = _furnMatCache.get(key);
  if(hit) return hit;
  let base=null, rough=.8, metal=0, envI=.30, clear=0, nStr=.6, per=3;
  if(FURN_SOFT.includes(kind)){ base=fabricTexture(); rough=.95; envI=.18; nStr=1.0; per=5; }
  else if(FURN_METAL.includes(kind)){ base=powderCoatTexture(); rough=.44; metal=.55; envI=.55; nStr=.5; per=4; }
  else if(kind==='rug' || kind==='playMat'){ base=carpetTexture(); rough=1.0; envI=.08; nStr=1.6; per=6; }
  else if(kind==='lamp'){ base=fabricTexture(); rough=.9; envI=.20; nStr=.8; per=2; }
  else if(FURN_CASE.includes(kind)){
    base = spec.wood ? woodSpecies(spec.wood) : laminateTexture();
    rough = spec.wood ? .42 : .52; envI=.28; clear = spec.wood ? .35 : .14; nStr = spec.wood ? .85 : .45;
    per = spec.wood ? 4 : 5;
  }
  else { base=plasticTexture(); rough=.55; envI=.35; nStr=.4; per=3; }
  const map = texScaled(base, size, per);
  const nrm = normalFromTexture(map, nStr);
  const mk=(c)=>{
    const p={color:c, map, normalMap:nrm, roughness:rough, metalness:metal, envMapIntensity:envI};
    if(clear>0){ const m=new THREE.MeshPhysicalMaterial(p);
      m.clearcoat=clear; m.clearcoatRoughness=.22; return m; }
    return new THREE.MeshStandardMaterial(p);
  };
  const out = {mat: mk(col.clone()), matD: mk(col.clone().multiplyScalar(.78))};
  _furnMatCache.set(key, out);
  return out;
}

function roundedRectShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
const _rboxCache={};
function rboxGeo(w,h,d,r,seg){
  r=Math.max(0.006, Math.min(r, w/2-0.004, h/2-0.004, d/2-0.004));
  const key=[w,h,d,r,seg||3].map(v=>v.toFixed(3)).join('_');
  if(_rboxCache[key]) return _rboxCache[key];
  // 注意：bevelSize 会把轮廓向外扩张 r，所以基形要先缩 2r，成品才恰好是 w×h×d
  const geo=new THREE.ExtrudeGeometry(roundedRectShape(Math.max(0.002,w-2*r), Math.max(0.002,h-2*r), Math.max(0.001,r*0.6)),
    {depth:Math.max(0.004,d-2*r), bevelEnabled:true, bevelSize:r, bevelThickness:r,
     bevelSegments:(seg||3), curveSegments:8, steps:1});
  geo.center(); geo.computeVertexNormals();
  _rboxCache[key]=geo; return geo;
}
/* =====================================================================
   逐商品建模注册表：MODELS[specId] = (C) => {...}
   每件家具按官网商品图单独建模；未注册的回退到通用 kind 造型。
   坐标：原点在家具中心地面，y 向上，+z = 正面（朝房间），-z = 背面（靠墙）
   ===================================================================== */
const MODELS = {};

/* =====================================================================
   儿童爬爬架建模工具箱
   —— 这类产品全是「杆件 + 侧板 + 绳网 + 攀岩点」的组合，
      先把这几件做扎实，7 个型号就都能照实物拼出来。
   ===================================================================== */
function pgKit(C){
  const T = C.THREE, cm = C.cm, g = C.g;
  const V = (p)=> new T.Vector3(p[0], p[1], p[2]);
  const K = {};
  /* 任意两点之间的圆棒：横档 / 圆管 / 绳 */
  K.rod = (mat, p0, p1, r, seg)=>{
    const a = V(p0), b = V(p1), d = new T.Vector3().subVectors(b, a), L = d.length();
    if(L < 1e-5) return null;
    const m = new T.Mesh(new T.CylinderGeometry(r, r, L, seg||10), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), d.clone().normalize());
    m.castShadow = m.receiveShadow = true; g.add(m); return m;
  };
  /* 任意两点之间的方料：立柱 / 扁腿 / 横梁。w 为截面宽（绕自身轴 roll 弧度） */
  K.beam = (mat, p0, p1, w, t, roll)=>{
    const a = V(p0), b = V(p1), d = new T.Vector3().subVectors(b, a), L = d.length();
    if(L < 1e-5) return null;
    const m = new T.Mesh(new T.BoxGeometry(w, L, t), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), d.clone().normalize());
    if(roll) m.rotateOnAxis(new T.Vector3(0,1,0), roll);
    m.castShadow = m.receiveShadow = true; g.add(m); return m;
  };
  /* 侧板：pts 画在 (z, y) 平面上，沿 -x 方向拉厚 thick（板占 x-thick … x） */
  K.side = (pts, thick, mat, x, y, z, bevel)=>{
    const m = C.ext(pts, thick, mat, 0, 0, 0, 'xy', bevel);
    m.rotation.y = -Math.PI/2;
    m.position.set(x, y, z);
    return m;
  };
  /* 横档梯：两条侧轨 + n 根圆档。a/b 是梯子下端/上端的中线端点 */
  K.ladder = (matRail, matRung, a, b, width, n, railW, rungR)=>{
    const A = V(a), B = V(b), d = new T.Vector3().subVectors(B, A);
    const ax = new T.Vector3().crossVectors(d, new T.Vector3(0,1,0));
    if(ax.lengthSq() < 1e-6) ax.set(1,0,0);
    ax.normalize().multiplyScalar(width/2);
    for(const s of [-1, 1])
      K.beam(matRail, [A.x+ax.x*s, A.y+ax.y*s, A.z+ax.z*s],
                      [B.x+ax.x*s, B.y+ax.y*s, B.z+ax.z*s], railW, railW*0.55);
    for(let i=0;i<n;i++){
      const t = (i+0.5)/n;
      const p = new T.Vector3().copy(A).addScaledVector(d, t);
      K.rod(matRung, [p.x-ax.x, p.y-ax.y, p.z-ax.z], [p.x+ax.x, p.y+ax.y, p.z+ax.z], rungR, 10);
    }
  };
  /* 绳网：四角围成的矩形区域内拉经纬绳，交点打结 */
  K.net = (mat, o, ex, ez, nx, nz, r)=>{
    const O = V(o);
    for(let i=0;i<=nx;i++){
      const u = i/nx;
      K.rod(mat, [O.x+ex[0]*u, O.y+ex[1]*u, O.z+ex[2]*u],
                 [O.x+ex[0]*u+ez[0], O.y+ex[1]*u+ez[1], O.z+ex[2]*u+ez[2]], r, 6);
    }
    for(let j=0;j<=nz;j++){
      const v = j/nz;
      K.rod(mat, [O.x+ez[0]*v, O.y+ez[1]*v, O.z+ez[2]*v],
                 [O.x+ez[0]*v+ex[0], O.y+ez[1]*v+ex[1], O.z+ez[2]*v+ex[2]], r, 6);
    }
  };
  /* 攀岩点：彩色异形抓手（两片错位的圆角块 + 螺丝） */
  K.hold = (i, x, y, z, nx, s)=>{
    const PAL = [0x2f7fd6, 0x3fa93f, 0xf2c318, 0x8a3fb5, 0xe0483c, 0xe87c1e, 0xd94f9a];
    const mt = C.M(PAL[i % PAL.length], {rough:.38, clear:.55});
    s = s || 1;
    const a = new T.Mesh(rboxGeo(cm(9)*s, cm(5.5)*s, cm(5)*s, cm(1.6)*s, 3), mt);
    const b = new T.Mesh(rboxGeo(cm(6)*s, cm(4)*s, cm(6.5)*s, cm(1.6)*s, 3), mt);
    const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(0,0,1), V(nx).normalize());
    a.position.set(x, y, z); a.quaternion.copy(q); a.translateZ(cm(2.5));
    b.position.set(x, y, z); b.quaternion.copy(q);
    b.translateZ(cm(3.4)); b.translateY(cm(-1.6)); b.rotateZ(0.35);
    a.castShadow = b.castShadow = true; g.add(a); g.add(b);
    const sc = new T.Mesh(new T.CylinderGeometry(cm(0.7), cm(0.7), cm(1.2), 8),
      C.M(0xc9ccd2, {rough:.28, metal:.85}));
    sc.position.set(x, y, z); sc.quaternion.copy(q); sc.rotateX(Math.PI/2); sc.translateY(cm(4.2));
    g.add(sc);
  };
  /* 木螺丝/圆帽：接缝处点缀，近看不至于「一块整木」 */
  K.screw = (mat, x, y, z, nx, r)=>{
    const m = new T.Mesh(new T.CylinderGeometry(r, r, cm(0.5), 8), mat);
    m.position.set(x, y, z);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), V(nx).normalize());
    g.add(m); return m;
  };
  return K;
}

/* ---- Avenlur Chestnut 8-in-1 可折叠爬爬架 ---- */
MODELS['chestnut'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  const wood = C.M(C.col, {wood:'pine', rough:.46});
  const woodD = C.M(new C.THREE.Color(C.col).multiplyScalar(.92), {wood:'pine', rough:.5});
  const acc = C.col2 ? C.M(C.col2, {rough:.45, clear:.4}) : woodD;   // 彩色横杆款
  const rope = C.M(0xe8e2d4, {rough:.95});
  const BT = cm(3.2);                                    // 板厚
  const frames = [-0.42, -0.06, 0.40];                   // 三榀 A 形架的 x 位置
  // 屋脊横梁（同时是猴子架单杠）
  K.rod(wood, [-W*0.47, H-cm(3), 0], [W*0.47, H-cm(3), 0], cm(3.0), 14);
  // 梁上的花瓣形折叠连接盘
  for(const fx of [-0.47,-0.30,-0.06,0.16,0.40,0.47]){
    const p = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(7.5), cm(7.5), cm(2.2), 16), woodD);
    p.rotation.z = Math.PI/2; p.position.set(W*fx, H-cm(3), 0); p.castShadow=true; C.g.add(p);
    K.screw(C.M(0x2a2c30,{rough:.4,metal:.6}), W*fx+cm(1.3), H-cm(3), 0, [1,0,0], cm(1.6));
  }
  // A 形架：扁腿 + 落地横撑
  for(const fx of frames){
    for(const sz of [-1, 1]){
      K.beam(wood, [W*fx, H-cm(3), 0], [W*fx, cm(1.5), sz*D*0.47], cm(9), BT);
      K.beam(woodD, [W*fx-cm(6), cm(1.5), sz*D*0.47], [W*fx+cm(6), cm(1.5), sz*D*0.47], cm(7), cm(4));
    }
    K.beam(wood, [W*fx, H*0.30, -D*0.33], [W*fx, H*0.30, D*0.33], cm(6), cm(3));   // 中部拉撑
  }
  // 落地长边纵梁
  for(const sz of [-1, 1])
    K.beam(woodD, [-W*0.46, cm(2.2), sz*D*0.47], [W*0.46, cm(2.2), sz*D*0.47], cm(8), cm(3.6));
  // 左端：竖向肋木（瑞典梯）
  for(let i=0;i<9;i++){
    const y = cm(14) + i*(H-cm(24))/8;
    K.beam(acc, [-W*0.47, y, -D*0.30], [-W*0.47, y, D*0.30], cm(5.5), cm(3.4));
  }
  for(const sz of [-1,1]) K.beam(wood, [-W*0.47, 0, sz*D*0.30], [-W*0.47, H-cm(3), sz*D*0.30], cm(8), BT);
  // 中段：圆档梯（爬到梁上）
  K.ladder(wood, acc, [W*0.16, cm(2), D*0.42], [W*0.16, H-cm(8), D*0.05], cm(42), 6, cm(6), cm(1.9));
  // 右端外侧：攀岩板 + 抓手
  const rw = D*0.52, rTop = H-cm(10), rBot = cm(4);
  const rockX = W*0.40 + cm(6);
  K.beam(wood, [rockX, rBot, D*0.46], [rockX, rTop, -D*0.02], rw, cm(2.6), Math.PI/2);
  for(let i=0;i<10;i++){
    const t = (i+0.5)/10;
    const y = rBot + (rTop-rBot)*t, z = D*0.46 + (-D*0.48)*t;
    K.hold(i, rockX+cm(2.2), y, z + (i%2? cm(9):-cm(9)), [1,0,0.35], 0.95);
  }
  // 绳网 + 吊环 + 圆盘秋千
  K.net(rope, [W*0.02, H-cm(8), -D*0.05], [W*0.20, 0, 0], [0, -H*0.55, D*0.30], 4, 4, cm(0.9));
  for(const sx of [-0.16, -0.10]){
    K.rod(rope, [W*sx, H-cm(6), 0], [W*sx, H*0.42, D*0.06], cm(0.9), 6);
    C.torus(cm(7), cm(1.6), acc, W*sx, H*0.40, D*0.06, Math.PI/2);
  }
  for(const sx of [-0.30, -0.24]) K.rod(rope, [W*sx, H-cm(6), 0], [W*(sx*0.96), H*0.30, D*0.10], cm(0.9), 6);
  const disc = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(19), cm(19), cm(3.2), 20), wood);
  disc.position.set(-W*0.27, H*0.29, D*0.10); disc.castShadow = true; C.g.add(disc);
  // 前方长斜坡（滑梯/爬坡两用）
  const s0 = [-W*0.20, H*0.56, -D*0.16], s1 = [W*0.06, cm(2), D*0.52];
  K.beam(wood, s0, s1, D*0.20, cm(2.8), Math.PI/2);
  for(const sw of [-1, 1]){
    const off = sw*D*0.10;
    K.beam(woodD, [s0[0], s0[1]+cm(4), s0[2]+off], [s1[0], s1[1]+cm(4), s1[2]+off], cm(5), cm(5));
  }
};

/* ---- Avenlur Hazel 折叠攀爬三角 + 斜坡 + 拱桥（三件套） ---- */
MODELS['hazel'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  const wood = C.M(C.col, {wood:'pine', rough:.44});
  const woodD = C.M(new C.THREE.Color(C.col).multiplyScalar(.9), {wood:'pine', rough:.5});
  const acc = C.col2 ? C.M(C.col2, {rough:.42, clear:.45}) : wood;
  const BT = cm(2.0);
  /* 1) 右侧：攀爬三角（两片梯形侧板 + 圆档） */
  const triX = W*0.30, triHalf = D*0.46;
  const triPts = (s)=>[[-triHalf,0],[-triHalf+cm(5),0],[cm(3),H-cm(2)],[-cm(3),H-cm(2)],[triHalf-cm(5),0],[triHalf,0],
                       [cm(6),H-cm(6)],[-cm(6),H-cm(6)]];
  for(const sx of [-1, 1]){
    // 侧板做成「人」字：两条斜腿 + 顶部圆头
    for(const lz of [-1, 1]){
      K.beam(wood, [triX+sx*D*0.22, cm(1), lz*triHalf], [triX+sx*D*0.22, H-cm(4), 0], cm(7), BT+cm(0.6));
    }
    const cap = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(3.5), cm(3.5), BT+cm(0.6), 14), wood);
    cap.rotation.z = Math.PI/2; cap.position.set(triX+sx*D*0.22, H-cm(4), 0); C.g.add(cap);
    for(const lz of [-1,1]) K.screw(C.M(0xbfc3c9,{rough:.3,metal:.8}),
      triX+sx*(D*0.22+BT*0.6), cm(6), lz*(triHalf-cm(4)), [sx,0,0], cm(1.0));
  }
  for(let side=0; side<2; side++){
    const lz = side? 1 : -1;
    for(let i=0;i<7;i++){
      const t = (i+1)/8;
      const y = cm(1) + (H-cm(5))*t, z = lz*triHalf*(1-t);
      K.rod(acc, [triX-D*0.22, y, z], [triX+D*0.22, y, z], cm(1.7), 10);
    }
  }
  /* 2) 中间：可翻面斜坡板（一面光滑滑梯，一面圆木攀爬点） */
  const rTop = [W*0.06, H*0.62, 0], rBot = [-W*0.16, cm(2), 0];
  K.beam(wood, rTop, rBot, D*0.60, cm(2.4), Math.PI/2);
  for(const s of [-1,1]) K.beam(woodD, [rTop[0], rTop[1]+cm(2), s*D*0.29], [rBot[0], rBot[1]+cm(2), s*D*0.29], cm(3.4), cm(3.4));
  for(let i=0;i<5;i++){
    const t = (i+0.6)/6;
    const x = rTop[0] + (rBot[0]-rTop[0])*t, y = rTop[1] + (rBot[1]-rTop[1])*t + cm(2.6);
    for(const s of [-0.5, 0.5]){
      const k = new C.THREE.Mesh(new C.THREE.CylinderGeometry(cm(4.2), cm(4.2), cm(1.8), 14), woodD);
      k.position.set(x + (i%2? cm(3):-cm(3)), y, s*D*0.22);
      k.rotation.x = Math.PI/2; k.rotation.z = -0.42; k.castShadow = true; C.g.add(k);
    }
  }
  const hook = C.M(0xb9bdc4, {rough:.3, metal:.85});
  for(const s of [-1,1]) K.rod(hook, [rTop[0]-cm(3), rTop[1]+cm(3), s*D*0.26], [rTop[0]+cm(5), rTop[1]+cm(6), s*D*0.26], cm(1.0), 8);
  /* 3) 左侧：拱桥 / 摇摇板 */
  const arcX = -W*0.34, arcR = D*0.62, arcH = H*0.86;
  const arcPts = [];
  const NA = 16;
  for(let i=0;i<=NA;i++){ const a = Math.PI*i/NA; arcPts.push([Math.cos(a)*arcR, Math.sin(a)*arcH]); }
  for(let i=NA;i>=0;i--){ const a = Math.PI*i/NA; arcPts.push([Math.cos(a)*(arcR-cm(9)), Math.sin(a)*(arcH-cm(9))]); }
  for(const sx of [-1, 1]) K.side(arcPts, BT+cm(0.4), wood, arcX + sx*D*0.24 + (sx>0?BT:0), cm(0.4), 0);
  for(let i=1;i<NA;i++){
    const a = Math.PI*(i+0.0)/NA;
    const z = Math.cos(a)*(arcR-cm(4.5)), y = Math.sin(a)*(arcH-cm(4.5)) + cm(0.4);
    K.beam(acc, [arcX-D*0.24, y, z], [arcX+D*0.24, y, z], cm(5.5), cm(2.2), 0);
  }
  for(const sx of [-1,1]) for(const sz of [-1,1])
    K.beam(woodD, [arcX+sx*D*0.24, cm(0.4), sz*(arcR-cm(2))], [arcX+sx*D*0.24, cm(3.4), sz*(arcR-cm(10))], cm(5), cm(4));
};

/* ---- Avenlur Magnolia 7-in-1 室内木质游乐架 ---- */
MODELS['magnolia'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;
  const wood = C.M(C.col, {wood:'pine', rough:.44});
  const woodD = C.M(new C.THREE.Color(C.col).multiplyScalar(.9), {wood:'pine', rough:.5});
  const acc = C.col2 ? C.M(C.col2, {rough:.42, clear:.45}) : wood;
  const rope = C.M(0xf0ebdd, {rough:.95});
  const BT = cm(3.0);
  // 梯形骨架：四条外撇扁腿（下宽上窄）
  const topHW = W*0.40, topHD = D*0.30, botHW = W*0.49, botHD = D*0.47;
  const legTop = [], legBot = [];
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const a = [sx*botHW, 0, sz*botHD], b = [sx*topHW, H-cm(4), sz*topHD];
    K.beam(wood, a, b, cm(9), BT);
    legTop.push(b); legBot.push(a);
  }
  // 顶部：一圈边框 + 横向猴子架圆档
  for(const sz of [-1,1]) K.beam(wood, [-topHW, H-cm(4), sz*topHD], [topHW, H-cm(4), sz*topHD], cm(7), cm(4));
  for(const sx of [-1,1]) K.beam(wood, [sx*topHW, H-cm(4), -topHD], [sx*topHW, H-cm(4), topHD], cm(7), cm(4));
  const nBar = Math.max(5, Math.round(W*2/cm(18)));
  for(let i=1;i<nBar;i++){
    const x = -topHW + 2*topHW*i/nBar;
    K.rod(wood, [x, H-cm(4), -topHD+cm(2)], [x, H-cm(4), topHD-cm(2)], cm(2.2), 10);
  }
  // 左侧面：圆档梯
  K.ladder(wood, wood, [-botHW+cm(3), cm(2), -botHD*0.55], [-topHW+cm(3), H-cm(8), -topHD*0.55], D*0.52, 6, cm(7), cm(2.1));
  // 后侧面：横档（另一面梯）
  for(let i=0;i<5;i++){
    const t = (i+0.7)/6, y = H*t;
    const sx1 = -(botHW + (topHW-botHW)*t), sx2 = -sx1;
    K.rod(wood, [sx1*0.98, y, -(botHD + (topHD-botHD)*t)*0.98], [sx2*0.98, y, -(botHD + (topHD-botHD)*t)*0.98], cm(2.1), 10);
  }
  // 中间：绳网 + 顶部横杆
  K.net(rope, [-W*0.10, H-cm(9), -D*0.16], [W*0.30, 0, 0], [0, -H*0.55, D*0.10], 5, 5, cm(0.8));
  K.rod(acc, [-W*0.10, H-cm(9), -D*0.16], [W*0.20, H-cm(9), -D*0.16], cm(2.0), 10);
  // 右中：攀岩板 + 抓手
  const rockX0 = W*0.10, rockX1 = W*0.34;
  K.beam(wood, [(rockX0+rockX1)/2, cm(1), D*0.30], [(rockX0+rockX1)/2, H-cm(8), D*0.13],
         rockX1-rockX0, cm(2.4), Math.PI/2);
  for(let i=0;i<7;i++){
    const t = (i+0.5)/7, y = cm(6) + (H-cm(20))*t, z = D*0.30 + (-D*0.17)*t;
    K.hold(i, rockX0 + (rockX1-rockX0)*(i%2? 0.32:0.68), y, z + cm(3), [0,0,1], 0.9);
  }
  // 右端：绳梯
  for(const s of [-1,1]) K.rod(rope, [W*0.44, H-cm(6), s*D*0.10], [W*0.47, cm(4), s*D*0.10], cm(0.9), 6);
  for(let i=0;i<6;i++){
    const t=(i+0.5)/6, y=H-cm(10)-(H-cm(18))*t, x=W*(0.44+0.03*t);
    K.rod(acc, [x, y, -D*0.10], [x, y, D*0.10], cm(1.8), 10);
  }
  // 左侧：木板秋千
  for(const s of [-1,1]) K.rod(rope, [-W*0.30, H-cm(6), s*D*0.09], [-W*0.30, H*0.36, s*D*0.09], cm(0.9), 6);
  const seat = new C.THREE.Mesh(rboxGeo(cm(34), cm(3), cm(17), cm(1.2), 3), wood);
  seat.position.set(-W*0.30, H*0.36, 0); seat.castShadow = true; C.g.add(seat);
  // 中层小平台
  K.beam(wood, [-W*0.05, H*0.40, -D*0.02], [W*0.10, H*0.40, D*0.16], cm(2.6), D*0.28, Math.PI/2);
};

/* ---- Avenlur Sweetgum 8-in-1 感统攀爬架 ---- */
MODELS['sweetgum'] = (C)=>{
  const K = pgKit(C), cm = C.cm, W = C.w, D = C.d, H = C.h;

  const aX = [-W*0.06, W*0.30];

    for(const sz of [-1,1]) K.beam(wood, [ax, cm(2), sz*D*0.46], [ax, H-cm(5), sz*D*0.06], POST, POST);
    K.beam(wood, [ax, H-cm(5), -D*0.06], [ax, H-cm(5), D*0.06], POST, POST);
