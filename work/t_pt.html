  const white = C.M('#f4f6f8', {fabric:true, rough:.8, envI:.15});
  // 斜面方向：(z 0, y 46.5) → (z -52.7, y 0.8)，长 69.5
  const slopeAng = Math.PI - Math.atan2(52.7, 45.7);   // 绕 x 旋转把 +y_local 映射到 (0,-0.655,-0.756)
  // 蓝色布底（圆角浅盘）：宽 90.2 沿 x，深 52.7 沿 z
  C.box(cm(90.2),cm(0.6),cm(52.7),fab, 0,0,-cm(26.35));   // 布底（box 不 bevel，尺寸精确）
  C.box(cm(90.2),cm(4),cm(2.4),fab, 0,0,-cm(1.2));        // 前底沿起的布边
  // 前面框：左右立柱 + 上沿带（前面开口面 z=0）
  for(const sx of [-1,1]) C.box(cm(6),cm(46.8),cm(2.4),fab, sx*cm(42.1),cm(0.6),-cm(1.2));
  C.box(cm(84.2),cm(5.3),cm(2.4),fab, 0,cm(47.4),-cm(1.2));
  // 白色横杆（轴 x）+ 两端白布套 + 蓝端帽；整体后移 2.7 使布套前缘齐前面开口面
  C.tube(cm(88.6),cm(2.2),white, 0,cm(47.7),-cm(2.7),'x');
  for(const sx of [-1,1]){
    C.tube(cm(16),cm(2.7),white, sx*cm(34),cm(47.7),-cm(2.7),'x');
    C.tube(cm(2),cm(2.5),fab, sx*cm(41),cm(47.7),-cm(2.7),'x'); }
  // 横杆挂扣（拉网蓝布带）
  for(const sx of [-1,1]) C.box(cm(1.2),cm(5),cm(1.2),fab, sx*cm(20),cm(42.7),-cm(2.4));
  // 斜网（整面，横杆 → 后底沿）
  const net=new T.Mesh(new T.PlaneGeometry(cm(86),cm(69.5),12,10),netM);
  net.rotation.x=-slopeAng;
  net.position.set(0,cm(23.65),-cm(26.35)); net.castShadow=false; C.g.add(net);
  // 两侧三角网（前面柱顶 → 后底 → 前底）
  for(const sx of [-1,1]){
    const sh=new T.Shape();
    sh.moveTo(cm(0),cm(52.7)); sh.lineTo(-cm(52.7),cm(0.2)); sh.lineTo(cm(0),cm(0.2)); sh.closePath();
    const m=new T.Mesh(new T.ShapeGeometry(sh,8),netM);
    m.rotation.y=-Math.PI/2; m.position.x=sx*cm(44.5); m.castShadow=false; C.g.add(m); }
  // 斜边蓝布带（两侧，沿斜边的胶囊管）
  for(const sx of [-1,1]){
    const m=new T.Mesh(new T.CapsuleGeometry(cm(1.6),cm(57.8),4,14),fab);
    m.rotation.x=-slopeAng; m.position.set(sx*cm(44.0),cm(24.6),-cm(26.0));
    m.castShadow=m.receiveShadow=true; C.g.add(m); }
  // 后底沿蓝布带
  C.box(cm(88),cm(4.5),cm(2.4),fab, 0,cm(0.6),-cm(51.5));
  C.g.updateMatrixWorld(true);
  const bb=new C.THREE.Box3().setFromObject(C.g), off=new C.THREE.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

// ===== MÅLA 儿童画架（66×48.3×111.8cm，A 型松木 + 白板 + 红五金） =====
MODELS['mala'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const wood = C.M('#e4ccad', {wood:'pine', rough:.7, envI:.5});
  const wboard = C.M('#f2f2ee', {rough:.28, clear:.3, envI:.3});
  const red  = C.M('#df6746', {plastic:true, rough:.5, envI:.3});
  // A 字架（侧视，z-y 平面）：顶点 (z=6,y=111.8)，前脚 (z=20,0)，后脚 (z=-24,0)
  // 前腿陡（7.3°），后腿斜（15.3°）；侧板整宽 66
  const leg=(z1,y1,z2,y2)=>{
    const dz=z2-z1, dy=y2-y1, len=Math.sqrt(dz*dz+dy*dy);
    const m=new T.Mesh(new T.BoxGeometry(cm(66),len,cm(3.8)),wood);
    m.position.set(0,(y1+y2)/2,(z1+z2)/2);
    m.rotation.x=Math.atan2(dz,dy);      // 长轴对准 (dy,dz) 方向
    m.castShadow=m.receiveShadow=true; C.g.add(m); return m; };
  leg(cm(20),0,cm(6),cm(110));          // 前段（底 z=20 → 顶点 z=6，白板面，向 +z）
  leg(cm(6),cm(110),-cm(24),0);         // 后段（斜撑到后脚）
  const thF=Math.atan2(14,110);         // 前板倾角（顶向 -z）
  // 白板（贴前板面，平行）
  const wbZ=14.5;
  const wb=new T.Mesh(new T.BoxGeometry(cm(60),cm(46),cm(2)),wboard);
  wb.position.set(0,cm(58),cm(wbZ)); wb.rotation.x=-thF; wb.castShadow=true; C.g.add(wb);
  // 白板边框四边
  for(const [dy,dz] of [[24.5,1.0],[-24.5,1.0],[0,2.6],[0,-2.6]]){
    const f=new T.Mesh(new T.BoxGeometry(cm(60),cm(3),cm(1.6)),wboard);
    f.position.set(0,cm(58+dy*1.02),cm(wbZ+dz)); f.rotation.x=-thF; f.castShadow=true; C.g.add(f); }
  // 顶部纸托辊（白圆柱，横在前板上方）
  const railT=new T.Mesh(new T.CylinderGeometry(cm(1.8),cm(1.8),cm(62),16),wboard);
  railT.rotation.z=Math.PI/2; railT.position.set(0,cm(86),cm(wbZ+3.2)); railT.castShadow=true; C.g.add(railT);
  // 顶横杆 + 两端红色 pivot 旋钮
  C.box(cm(64),cm(4),cm(4),wboard, 0,cm(107.8),cm(6));
  for(const sx of [-1,1]){
    const kn=new T.Mesh(new T.CylinderGeometry(cm(1.9),cm(1.9),cm(2.4),20),red);
    kn.rotation.z=Math.PI/2; kn.position.set(sx*cm(31.6),cm(109.8),cm(6));
    kn.castShadow=true; C.g.add(kn); }
  // 红色纸托盘带（前板下 1/3，可前伸）+ 两端红色卡扣
  const tray=new T.Mesh(new T.BoxGeometry(cm(58),cm(3.2),cm(3.4)),red);
  tray.position.set(0,cm(44),cm(wbZ+3.2)); tray.rotation.x=-thF; tray.castShadow=true; C.g.add(tray);
  for(const sx of [-1,1]){
    const cl=new T.Mesh(new T.BoxGeometry(cm(3),cm(4.2),cm(3.2)),red);
    cl.position.set(sx*cm(28.5),cm(44),cm(wbZ+3.2)); cl.rotation.x=-thF; cl.castShadow=true; C.g.add(cl); }
  // 白板四角红色固定螺钉
  for(const sx of [-1,1]) for(const sy of [-1,1]){
    const sc=new T.Mesh(new T.CylinderGeometry(cm(1),cm(1),cm(1),10),red);
    sc.rotation.x=-thF+Math.PI/2; sc.position.set(sx*cm(27),cm(58+sy*21.5),cm(wbZ+1.1-sy*1.7));
    sc.castShadow=true; C.g.add(sc); }
  // 后腿上白色中托板
  const railB=new T.Mesh(new T.BoxGeometry(cm(58),cm(3),cm(3)),wboard);
  railB.position.set(0,cm(55),cm(-12.4)); railB.rotation.x=Math.atan2(30,110); railB.castShadow=true; C.g.add(railB);
  // 前后脚轨（整宽贴地）
  C.box(cm(66),cm(3),cm(4.6),wood, 0,0,cm(19));
  C.box(cm(66),cm(3),cm(4.6),wood, 0,0,cm(-23));
  C.g.updateMatrixWorld(true);
  const bb=new C.THREE.Box3().setFromObject(C.g), off=new C.THREE.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};
// ===== RIGGA 高度可调移动挂衣架（111×51.1×145cm，白色钢架+外弯腿+脚轮） =====
// 实际结构（对照 PE727742/PE558487）：2 根立柱在短边中段（z=0），顶一根 x 向挂衣杆
// （两端伸出立柱外 5.5）；底部 100×40 框（y15）内嵌 3 根 x 向格杆（即「4 层」）；
// 4 条腿从框角向外弯下到脚轮——占地 111×51.1 是脚轮外缘。
/* Hape Rainbow Xylophone E0606（对照 work/ref/xylophone/hxylo_*.jpg；所有尺寸 cm，一律 C.cm→英尺）：
   D/pill 形胶合板底座（两端半圆，左端带提手切槽），五根彩色音条（长轴沿深度 z，蓝最长→红最短，
   近端对齐），每根条顶 2 白桩，两根蓝槌斜卧右侧平面。提手在 -x 端。 */
MODELS['hape-xylo'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const wood = C.M(C.col2, {wood:'birch', rough:.6});
  const white = C.M('#f5f3ec', {rough:.5});
  const mal   = C.M('#3aa7d9', {plastic:true, rough:.4});
  // ---- 底座：外轮廓 = 两个半圆盖（半径 d/2）+ 上下直边；提手切槽 = 左盖上的椭圆孔 ----
  const Rw=cm(6.9), Rd=cm(6.85);
  const pts=[];
  const arc=(cx0,a0,a1,n)=>{ for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n;
    pts.push([cx0+Rd*Math.cos(a), Rd*Math.sin(a)]); } };
  arc( Rw,-Math.PI/2, Math.PI/2, 24);      // 右盖（下→上）
  arc(-Rw, Math.PI/2, Math.PI*1.5, 24);     // 左盖（上→下）
  const sh = new T.Shape(pts.map(p=>new T.Vector2(p[0],p[1])));
  const hole=new T.Path();
  for(let i=0;i<=24;i++){ const a=2*Math.PI*i/24;
    const x=cm(-9.5)+cm(1.8)*Math.cos(a), y=cm(4.3)*Math.sin(a);
    i? hole.lineTo(x,y) : hole.moveTo(x,y); }
  sh.holes.push(hole);
  const geo=new T.ExtrudeGeometry(sh,{depth:cm(2),bevelEnabled:false});
  geo.rotateX(Math.PI/2);                      // 挤出沿 -y（shape y→世界 z），顶面在 position.y
  const base=new T.Mesh(geo,wood);
  base.position.set(0,cm(2),0); base.castShadow=base.receiveShadow=true;
  C.g.add(base);
  // ---- 五根音条（z 轴长轴，近端对齐 z=-5.5）+ 条顶 2 白桩 ----
  const bars=[
    [-6,11,'#2ea3d8'], [-3,9,'#7ac244'], [0,7.5,'#f5c33b'],
    [3,6,'#ef8a2f'], [6,4.5,'#e0452e']
  ];
  const z0=-5.5;
  for(const [x,len,colr] of bars){
    const m=C.M(colr,{plastic:true,rough:.45});
    C.rb(cm(2.6),cm(1.5),cm(len),cm(1.1),m, cm(x), cm(2), cm(z0+len/2), 4);
    for(const dz of [1.2, len-1.2])
      C.cyl(cm(.45),cm(.45),cm(.7),white, cm(x), cm(3.5), cm(z0+dz), 12);
  }
  // ---- 右端小半圆凸起（参照实拍右端木件；顶面 ≤ 4.2 ≤ spec 4.3）----
  const lipPts=[];
  for(let i=0;i<=18;i++){ const a=-Math.PI/2 + Math.PI*i/18;          // 右半圆：从 -z 经 +x 到 +z
    lipPts.push([cm(9.5)+cm(3.2)*Math.cos(a), cm(3.2)*Math.sin(a)]); }
  lipPts.push([cm(9.5), cm(3.2)]);
  const lipGeo=new T.ExtrudeGeometry(new T.Shape(lipPts.map(p=>new T.Vector2(p[0],p[1]))),{depth:cm(2.2),bevelEnabled:false});
  lipGeo.rotateX(Math.PI/2);
  const lip=new T.Mesh(lipGeo,wood);
  lip.position.set(0,cm(4.2),0); lip.castShadow=lip.receiveShadow=true;
  C.g.add(lip);
  // ---- 两根蓝槌：平放底座顶面（y=2），头部朝前，斜向错开 ----
  const mallet=(x,z,ang)=>{
    const gg=new T.Group();
    const t=new T.Mesh(new T.CapsuleGeometry(cm(.5),cm(7),4,14),mal);
    t.position.set(0,cm(.5),0); t.rotation.x=Math.PI/2; t.castShadow=true;
    const hd=new T.Mesh(new T.SphereGeometry(cm(1),16,12),mal);
    hd.position.set(0,cm(1),cm(3.5)); hd.castShadow=true;
    gg.add(t); gg.add(hd);
    gg.position.set(cm(x), cm(2), cm(z));
    gg.rotation.y=ang;
    C.g.add(gg);
  };
  mallet(8.5,-2.5,0.3);
  mallet(8.5,2.2,-0.25);
  // 水平重心归零（真实顶点 bbox）
  C.g.updateMatrixWorld(true);
  const bb=new T.Box3();
  C.g.traverse(o=>{ if(o.isMesh&&o.geometry){
    const pos=o.geometry.attributes.position, v=new T.Vector3();
    for(let i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld); bb.expandByPoint(v); } } });
  const off=new T.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

/* Blueberry & Third The Balance Board（对照 work/ref/bt-board/bt_0.png / bt_8.png，全部 cm→C.cm→英尺）：
   波罗的海桦木胶合板：上层微圆角平板（y 8.7→10.2），下半椭球摇摆底座（尖点触地，

/* Little Tikes 3-in-1 Sports Zone（对照 work/ref/sportszone/sz_0.jpg / sz_1.jpg / sz_4.jpg，全部 cm→C.cm→英尺）：
   布局：球门在左（-x）、篮架杆在中、保龄球在右（+x）；网朝后（-z）、碗朝前（+z）。

  const gz=-2;

  C.tube(cm(21), cm(2.2), RED, cm(-11.5), cm(26), cm(gz), 'x');

  net.rotation.y=Math.PI/2; net.position.set(cm(-20.5), cm(11), cm(gz)); net.castShadow=true; C.g.add(net);
  C.rb(cm(26), cm(3.5), cm(6), cm(1.2), LGREEN, cm(-27), 0, cm(-15.4), 3);
  C.rb(cm(8), cm(3), cm(10), cm(1.2), LGREEN, cm(-40), 0, cm(gz-2), 3);
  C.rb(cm(8), cm(3), cm(10), cm(1.2), LGREEN, cm(-24), 0, cm(gz-2), 3);
  C.sph(cm(6), WHITE, cm(-37), cm(6), cm(8), 20);
  // —— 篮球（中）：黄主杆 + 红接环 + 蓝上杆 + 绿篮板(顶=62.2) + LED 屏 + 3 按钮 + 橙筐 + 绿裙 + 蓝碗 ——
  C.cyl(cm(3.2), cm(3.8), cm(38), YELLOW, 0, 0, 0, 24);
  C.cyl(cm(4), cm(4), cm(6), RED, 0, cm(34), 0, 24);
  C.cyl(cm(4), cm(4), cm(2), YELLOW, 0, cm(40), 0, 24);
  C.cyl(cm(2.2), cm(2.2), cm(6), BLUE, 0, cm(42), 0, 16);
  C.rb(cm(24), cm(24), cm(2.4), cm(3), GREEN, 0, cm(38.2), cm(-1.2), 4);
  C.box(cm(11), cm(11), cm(0.8), LED, 0, cm(46), cm(0.1));
  C.tube(cm(2.2), cm(1.1), M('#f2a516'), cm(-9), cm(46), cm(0.6), 'z');
  C.tube(cm(2.2), cm(1.1), M('#2f9fd8'), cm(-9), cm(50.5), cm(0.6), 'z');
  C.tube(cm(2.2), cm(1.1), M('#e03a2f'), cm(-9), cm(55), cm(0.6), 'z');
  C.torus(cm(5), cm(1.8), ORANGE, 0, cm(40), cm(2.5), Math.PI/2);
  C.cyl(cm(5.5), cm(3.5), cm(5), DGREEN, 0, cm(35), cm(2.5), 20);

/* Delta Lil' Climber 三合一（对照 work/ref/deltaclimber/dc_silo_01，全部 cm→C.cm→英尺）：
   左 A 字三角(双框架×2腿+顶横+8横档/框) + 中央斜板(131.8长,绕 z -0.49rad：板+侧轨×2+5抓握点)
   + 右圆顶拱门(腿×2+半圆环 extrude+5横档+2手柄洞)。x=长 181.6 z=宽 63.5 y=高 68.6。 */
MODELS['lilclimb'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const WOODC=C.M('#f0e7cf',{wood:'birch', rough:.55, envI:.35});
  const TEAL=C.M('#9fd0c4',{plastic:true, rough:.5, envI:.15});
  const PINK=C.M('#f0c4c9',{plastic:true, rough:.5, envI:.15});
  const YEL=C.M('#efe0a0',{plastic:true, rough:.5, envI:.15});
  const BLACK=C.M('#26262a',{flat:true, rough:.8});
  const PASTELS=[TEAL, PINK, YEL, TEAL, PINK, YEL, TEAL, PINK];
  // —— 左：A 字三角（两块平板 z ±30.25，底角铰接到顶 (-73.75,66)；8 横杆跨 z）——
  for(const sz of [30.25, -30.25]){
    const L1=C.box(cm(4), cm(70), cm(3), WOODC, 0, 0, 0);
    L1.position.set(cm(-81.4), cm(34.6), cm(sz)); L1.rotation.z=0.23;
    const L2=C.box(cm(4), cm(70), cm(3), WOODC, 0, 0, 0);
    L2.position.set(cm(-71.1), cm(34.6), cm(sz)); L2.rotation.z=-0.23;
  }
  C.box(cm(4), cm(3), cm(60), WOODC, cm(-73.75), cm(64.5), 0);
  const kb=C.cyl(cm(2), cm(2), cm(1), BLACK, 0, 0, 0, 12);
  kb.rotation.x=Math.PI/2; kb.position.set(cm(-79), cm(64.5), cm(31.6));
  for(let i=0;i<8;i++){
    C.tube(cm(60), cm(1.25), PASTELS[i], cm(-73.75), cm(8+7.5*i), 0, 'z');
  }
  // —— 中：斜板（组在 (-0.25,33) 绕 z -0.49rad：(-58.5,64)→(58,2)）——
  const gg=new T.Group(); gg.position.set(cm(-0.25), cm(33), 0); gg.rotation.z=-0.49; C.g.add(gg);
  const addR=(w,h,d,mat,x,y,z)=>{ const mm=new T.Mesh(new T.BoxGeometry(w,h,d),mat);
    mm.position.set(x,y,z); mm.castShadow=mm.receiveShadow=true; gg.add(mm); };
  addR(cm(131.8), cm(3), cm(63), WOODC, 0, 0, 0);
  addR(cm(131.8), cm(5), cm(2.5), WOODC, 0, cm(3), cm(-30));
  addR(cm(131.8), cm(5), cm(2.5), WOODC, 0, cm(3), cm(30));
  // 5 抓握点（板面上，x 局部 -45..+42）
  const gx=[-45, -18, 8, 30, 42];
  for(let i=0;i<5;i++){
    const g=C.sph(cm(2.4), PASTELS[i%3], cm(gx[i]), cm(3.5), cm((i-2)*6));
    g.scale.y=0.55;
  }
  // —— 右：圆顶拱门（腿 x 61/87 + 半圆环 23..49 + 5 横档 + 2 手柄洞）——
  for(const sz of [30.25, -30.25]){
    C.box(cm(5), cm(36), cm(3), WOODC, cm(61), 0, cm(sz));
    C.box(cm(5), cm(36), cm(3), WOODC, cm(87), 0, cm(sz));
  }
  const pts=[];
  for(let i=0;i<=8;i++){ const a=Math.PI*(1-i/8); pts.push([cm(74+13*Math.cos(a)), cm(36+13*Math.sin(a))]); }
  for(let i=0;i<=8;i++){ const a=Math.PI*i/8; pts.push([cm(74+10*Math.cos(a)), cm(36+10*Math.sin(a))]); }
  C.ext(pts, cm(61.5), WOODC, 0, 0, cm(-30.75), 'xy');
  for(let i=0;i<5;i++){
    C.tube(cm(60), cm(1.25), PASTELS[i%3], cm(74), cm([12,22,32,42,47][i]), 0, 'z');
  }
  for(const sx of [60.5, 87.5]){
    const lp=C.torus(cm(2.8), cm(0.9), WOODC, 0, 0, 0);
    lp.position.set(cm(sx), cm(4.7), cm(31.4));
  }
  // 水平重心归零（真实顶点 bbox）
  C.g.updateMatrixWorld(true);
  const bb9=new T.Box3();
  C.g.traverse(o=>{ if(o.isMesh&&o.geometry){
    const pos=o.geometry.attributes.position, v=new T.Vector3();
    for(let i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld); bb9.expandByPoint(v); } } });
  const off9=new T.Vector3(); bb9.getCenter(off9);
  for(const ch of C.g.children){ ch.position.x-=off9.x; ch.position.z-=off9.z; }
};

/* LÄTT 儿童桌+2椅（套装 119×48×48）：桌 63×48×45（松木方框+白色面板，4 全高方腿），
   椅 28×28×48、座高 28（白座板+白背顶板，中间镂空）。两椅对称摆桌短边两侧、椅背朝外。
   轴向：桌长边沿 x；椅背朝 ±x（s=+1 右椅椅背朝 +x）。 */
MODELS['laett'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const pine  = C.M(C.col, {wood:'pine', rough:.62, envI:.5});
  const panel = C.M(C.col2, {rough:.8, envI:.15});
  const steel = C.M('#c9ccd2', {metal:.9, rough:.35, envI:.85});
  // —— 桌（63×48×45，中心原点）——
  for(const [lx,lz] of [[-28.5,-21],[28.5,-21],[-28.5,21],[28.5,21]])
    C.box(cm(3), cm(43), cm(3), pine, cm(lx), 0, cm(lz));
  // 桌下围板环 36.6→42.6（外 63×48，条宽 6）
  for(const sz of [-21,21])   C.box(cm(63), cm(6), cm(6), pine, 0, cm(36.6), cm(sz));
  for(const sx of [-28.5,28.5]) C.box(cm(6), cm(6), cm(36), pine, cm(sx), cm(36.6), 0);
  // 桌面框边 42.6→45（内框 50×35，框条宽 6.5，微倒角）
  for(const sz of [-20.75,20.75]) C.rb(cm(63), cm(2.4), cm(6.5), cm(0.5), pine, 0, cm(42.6), cm(sz), 2);
  for(const sx of [-28.25,28.25]) C.rb(cm(6.5), cm(2.4), cm(35), cm(0.5), pine, cm(sx), cm(42.6), 0, 2);
  // 白色顶板 50×35（顶面 44.8，低于框边 0.2）
  C.box(cm(50), cm(1.4), cm(35), panel, 0, cm(43.4), 0);
  // 桌角螺丝（角腿外侧面 y≈40）
  for(const [sx,sz] of [[-1,1],[1,1],[-1,-1],[1,-1]]){
    const m = C.cyl(cm(1.1), cm(1.1), cm(0.4), steel, cm(sx*30.2), cm(39.8), cm(sz*21), 12);
    m.rotation.z = Math.PI/2;
  }
  // —— 椅（28×28×48，中心 x=±45.5，s=±1 椅背朝外）——
  for(const s of [-1,1]){
    const cx = 45.5*s;
    for(const [lx,lz] of [[-11.5,-11.5],[11.5,-11.5],[-11.5,11.5],[11.5,11.5]])
      C.box(cm(2.6), cm(27), cm(2.6), pine, cm(cx+lx), 0, cm(lz));
    // 座圈 25.6→28（外 28×28，条宽 3.4）
    for(const sz of [-12.3,12.3]) C.box(cm(28), cm(2.4), cm(3.4), pine, cm(cx), cm(25.6), cm(sz));
    for(const sx2 of [-12.3,12.3]) C.box(cm(3.4), cm(2.4), cm(21.2), pine, cm(cx+sx2), cm(25.6), 0);
    // 白座板 20.4×20.4（顶面 27.9）
    C.box(cm(20.4), cm(1.3), cm(20.4), panel, cm(cx), cm(26.6), 0);
    // 椅背：立柱 25.6→48 + 顶梁 45.4→48 + 白背顶板 42→48
    for(const sz of [-11.5,11.5]) C.rb(cm(2.6), cm(22.4), cm(2.6), cm(0.4), pine, cm(cx+s*12.7), cm(25.6), cm(sz), 2);
    C.rb(cm(2.6), cm(2.6), cm(25.8), cm(0.4), pine, cm(cx+s*12.7), cm(45.4), 0, 2);
    C.box(cm(1.3), cm(6), cm(21.2), panel, cm(cx+s*11.4), cm(42), 0);
    // 椅背立柱外侧螺丝
    for(const sz of [-11.5,11.5]){
      const m = C.cyl(cm(1), cm(1), cm(0.4), steel, cm(cx+s*14.1), cm(30), cm(sz), 12);
      m.rotation.z = Math.PI/2;
    }
  }
  // 水平重心归零（对称件，理论上≈0，保险起见）
  C.g.updateMatrixWorld(true);
  const bb=new T.Box3();
  C.g.traverse(o=>{ if(o.isMesh&&o.geometry){
    const pos=o.geometry.attributes.position, v=new T.Vector3();
    for(let i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld); bb.expandByPoint(v); }
  }});
  const off=new T.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

MODELS['rigga'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const wte = C.M('#f2f3f4', {metal:.35, rough:.45, envI:.5});
  const cst = C.M('#c8cacc', {metal:.6, rough:.5, envI:.6});
  const drk = C.M('#4a4c52', {metal:.4, rough:.5, envI:.4});
  const FX=cm(50), FZ=cm(20);                // 框半宽/半深（100×40）
  // 两根立柱：框顶 → 挂衣杆中心
  for(const sx of [-1,1])
    C.cyl(cm(1.25),cm(1.25),cm(128.7),wte, sx*FX, cm(15), 0);
  // 顶部镀铬套管（立柱穿杆处）
  for(const sx of [-1,1])
    C.cyl(cm(1.45),cm(1.45),cm(1.8),cst, sx*FX, cm(142.3), 0);
  // 顶部挂衣杆（两端伸出立柱外 5.5）
  C.tube(cm(111),cm(1.3),wte, 0, cm(143.7), 0, 'x');
  // 底部框（y15）
  C.tube(cm(100),cm(1.1),wte, 0, cm(13.9),  FZ, 'x');
  C.tube(cm(100),cm(1.1),wte, 0, cm(13.9), -FZ, 'x');
  C.tube(cm(40), cm(1.1),wte,  FX, cm(13.9), 0, 'z');
  C.tube(cm(40), cm(1.1),wte, -FX, cm(13.9), 0, 'z');
  // 框内 3 根 x 向格杆（挂衣杆 + 3 根 = 「4 层」）
  for(const bz of [-13.3, 0, 13.3])
    C.tube(cm(92),cm(1.0),wte, 0, cm(12.9), cm(bz), 'x');
  // 4 条外弯腿：框角 → 外弯 → 脚轮（占地 111×51.1 含脚轮外缘）
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const p0=new T.Vector3(sx*FX, cm(15), sz*FZ);
    const p1=new T.Vector3(sx*cm(54.3), cm(11.5), sz*cm(23.05));
    const p2=new T.Vector3(sx*cm(54.3), cm(5.0), sz*cm(23.05));
    const leg=new T.Mesh(new T.TubeGeometry(new T.QuadraticBezierCurve3(p0,p1,p2), 12, cm(1.2), 10), wte);
    leg.castShadow=leg.receiveShadow=true; C.g.add(leg);
    const cx=sx*cm(54.3), cz=sz*cm(23.05);
    const wheel=new T.Mesh(new T.CylinderGeometry(cm(2.5),cm(2.5),cm(2.4),18),wte);
    wheel.rotation.z=Math.PI/2; wheel.position.set(cx,cm(2.5),cz);
    wheel.castShadow=true; C.g.add(wheel);
    const cap=new T.Mesh(new T.CylinderGeometry(cm(1.1),cm(1.1),cm(2.5),14),drk);
    cap.rotation.z=Math.PI/2; cap.position.set(cx,cm(2.5),cz);
    cap.castShadow=true; C.g.add(cap); }
  C.g.updateMatrixWorld(true);
  const bb=new C.THREE.Box3().setFromObject(C.g), off=new C.THREE.Vector3(); bb.getCenter(off);
  for(const ch of C.g.children){ ch.position.x-=off.x; ch.position.z-=off.z; }
};

// ===== NIPÅSEN 门厅衣帽架带换鞋凳（79×35×190cm，黑色钢架） =====
// 实际结构（对照 PE965439/PE965440）：圆角顶框（2 条拱形侧框 + 顶杆），2 根中段立柱，
// 两排扁平挂钩条（各 3 组三钩 = 18 钩），条板换鞋凳（顶 58.2），网格鞋架（顶 36）。
MODELS['nipasen'] = (C) => {
  const cm=C.cm, T=C.THREE;
  const blk  = C.M('#2a2b2d', {metal:.35, rough:.5, envI:.45});
  const blkL = C.M('#333438', {metal:.4, rough:.55, envI:.4});
  const msh  = C.M('#43454b', {metal:.65, rough:.5, envI:.55, flat:true, map:meshWeaveTexture()});
  msh.normalMap = normalFromTexture(meshWeaveTexture(), 1.0);
  // 两条拱形侧框（前立柱 → 圆角 → 顶 → 圆角 → 后立柱，通到地面）
  for(const sx of [-1,1]){
    const px = sx*cm(38.35);
    const pts = [];
    for(let i=0;i<=4;i++) pts.push(new T.Vector3(px, cm(178.5*i/4), cm(16.35)));
    for(let i=1;i<=5;i++){ const th=i*Math.PI/10;
      pts.push(new T.Vector3(px, cm(178.5+9.5*Math.sin(th)), cm(6.85+9.5*Math.cos(th)))); }
    for(let i=1;i<=3;i++) pts.push(new T.Vector3(px, cm(188), cm(6.85-13.7*i/3)));
    for(let i=1;i<=5;i++){ const th=Math.PI/2+i*Math.PI/10;
      pts.push(new T.Vector3(px, cm(178.5+9.5*Math.sin(th)), cm(-6.85+9.5*Math.cos(th)))); }
    for(let i=0;i<=4;i++) pts.push(new T.Vector3(px, cm(178.5*i/4), cm(-16.35)));
    const arch=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 48, cm(1.15), 10), blk);
    arch.castShadow=arch.receiveShadow=true; C.g.add(arch); }
  // 顶杆（顶 190）
  C.tube(cm(76.7),cm(1.15),blk, 0, cm(188.85), 0, 'x');
  // 两根中段立柱（座面 → 顶杆下缘）
  for(const sx of [-1,1]) C.cyl(cm(1.15),cm(1.15),cm(129.5),blk, sx*cm(13.17), cm(58.2), 0);
  // 中段立柱顶部小安装板
  for(const sx of [-1,1]) C.box(cm(2.5),cm(1.5),cm(3.5),blkL, sx*cm(13.17), cm(186.2), 0);
  // 两排挂钩条：扁条（3 段，被中段立柱打断）+ 每组 3 个 J 钩
  const segs=[[-37.2,-14.32],[-14.32,14.32],[14.32,37.2]];
  for(const by of [171, 134.6]){
    for(const [a,b] of segs) C.box(cm(b-a),cm(7.2),cm(2.2),blkL, cm((a+b)/2), cm(by-3.6), 0);
    for(const mx of [-26.33, 0, 26.33]){
      C.box(cm(2.8),cm(7),cm(1.2),blk, cm(mx), cm(by-3.5), cm(1.1));
      for(const ho of [-2.6, 0, 2.6]){
        const s = ho===0 ? 1 : 0.82;
        const pts=[ new T.Vector3(0,0,0), new T.Vector3(0,cm(5.5),0) ];
        for(let i=1;i<=9;i++){ const th=Math.PI-(270*Math.PI/180)*i/9;
          pts.push(new T.Vector3(0, cm(5.5+1.8*Math.sin(th)), cm(1.8+1.8*Math.cos(th)))); }
        const hook=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 10, cm(0.55), 8), blk);
        hook.scale.set(s,s,s);
        hook.position.set(cm(mx+ho*s), cm(by+1), cm(2.3+1.0*s));
        hook.rotation.y = ho===0 ? 0 : (ho<0 ? -0.35 : 0.35);
        hook.castShadow=true; C.g.add(hook); }
    } }
  // 换鞋凳：框（顶 54.8）+ 6 条黑板座面（顶 58.2）
  for(const sz of [-1,1]) C.box(cm(79),cm(1.4),cm(2),blk, 0, cm(53.4), sz*cm(16.35));
  for(const sx of [-1,1]) C.box(cm(2),cm(1.4),cm(32.7),blk, sx*cm(38.35), cm(53.4), 0);
  for(let i=0;i<6;i++) C.box(cm(79),cm(3.4),cm(5.2),blkL, 0, cm(54.8), cm(-14.25+i*5.7));

/* ===== 性能：按材质合并 mesh，大幅减少 draw call（几何逐顶点保留，外观完全不变） ===== */
function _concatGeos(list){
  let total=0;
  for(const g of list) total += g.attributes.position.count;
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2);
  let o3=0, o2=0;
  for(const g of list){
    const cnt=g.attributes.position.count;
    pos.set(g.attributes.position.array, o3);
    if(g.attributes.normal) nor.set(g.attributes.normal.array, o3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array, o2);
    o3 += cnt*3; o2 += cnt*2;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
  geo.computeBoundingSphere();
  return geo;
}
const MERGE_ON = location.search.indexOf('nomerge')<0;   // ?nomerge 可关掉合并做 A/B 对照
function mergeByMaterial(root, minMeshes){
  if(!MERGE_ON) return root;
  root.updateMatrixWorld(true);
  const meshes=[];
  root.traverse(o=>{ if(o!==root && o.isMesh && o.geometry && o.material && !Array.isArray(o.material)) meshes.push(o); });
  if(meshes.length < (minMeshes==null?4:minMeshes)) return root;
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets=new Map();
  for(const m of meshes){
    // 透明材质不合并：多层透明面依赖逐网格的由远及近排序，合并会改变混合结果
    if(m.material.transparent || m.material.opacity<1) continue;
    const key=m.material.uuid+'|'+(m.castShadow?1:0)+(m.receiveShadow?1:0)+'|'+(m.renderOrder||0);
    let b=buckets.get(key);
    if(!b){ b={mat:m.material, cs:!!m.castShadow, rs:!!m.receiveShadow, ro:m.renderOrder||0, list:[]}; buckets.set(key,b); }
    b.list.push(m);
  }
  for(const b of buckets.values()){
    if(b.list.length<2) continue;         // 只有一个成员就别重建：避免顶点浮点漂移导致贴图采样偏移
    const geos=[];
    for(const m of b.list){
      const src = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      src.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld));

      geos.push(src);
      if(m.parent) m.parent.remove(m);
    }
    const merged=_concatGeos(geos);
    for(const g of geos) g.dispose();
    const mesh=new THREE.Mesh(merged, b.mat);
    mesh.castShadow=b.cs; mesh.receiveShadow=b.rs; mesh.renderOrder=b.ro;
    mesh.userData.mergedOwned=true;      // 合并出来的几何归本组所有，可安全释放
    root.add(mesh);
  }
  return root;
}
/* 只释放本组自有的几何；材质与贴图是共享的，释放会导致反复重传 GPU */
function disposeOwned(root){
  root.traverse(o=>{
    if(o.isMesh && o.geometry && o.userData.mergedOwned) o.geometry.dispose();
    else if(o.isMesh && o.geometry && o.geometry.userData && o.geometry.userData.owned) o.geometry.dispose();
  });
}
function modelCtx(g, spec, col, col2, matlib, it){
  const cm = cm2ft;

    mm.castShadow=mm.receiveShadow=true; g.add(mm); return mm; };
  const C = {
    g, THREE, cm, spec, col, col2,
    it, cct: it? itemCCT(it) : (spec.cct||3000), lum: it? itemLum(it) : (spec.lum||800),

    seatH: cm2ft(spec.seatH || 45),
    m: matlib,
    /* 材质工厂：M(色, {rough, metal, clear, sheen, fabric, wood}) */
    M(color, o){ o=o||{};
      const p = {color:new THREE.Color(color), roughness:(o.rough==null?.7:o.rough), metalness:o.metal||0};
      if(o.envI!=null) p.envMapIntensity=o.envI;
      if(o.plastic){ p.map=plasticTexture(); p.normalMap=normalFromTexture(plasticTexture(),0.35);
                     if(o.envI==null) p.envMapIntensity=.32; }
      if(o.fabric){ p.map=fabricTexture(); p.roughness=(o.rough==null?.95:o.rough); p.envMapIntensity=(o.envI==null?.25:o.envI); }
      if(o.leather){ p.map=leatherTexture(); p.normalMap=normalFromTexture(leatherTexture(),1.1);
                     p.roughness=(o.rough==null?.55:o.rough); if(o.envI==null) p.envMapIntensity=.35; }
      if(o.wood){ const tx=woodSpecies(typeof o.wood==='string'?o.wood:(spec.wood||'oak'));
        p.map=tx; p.normalMap=normalFromTexture(tx,0.85);
        p.roughness=(o.rough==null?.42:o.rough); if(o.clear==null) o.clear=.38;
        if(o.envI==null) p.envMapIntensity=.6; }
      // 兜底：任何没显式指定贴图的材质也给一张极淡的微表面贴图。
      // 纯色平面在近景和光追里一眼假，而这几张贴图都接近白色，几乎不改变原有配色。
      if(!p.map && !o.flat){
        const base = (o.metal||0) >= 0.5 ? brushedSteelTexture()
                   : (o.metal||0) > 0    ? powderCoatTexture()
                   : laminateTexture();
        p.map = base;
        p.normalMap = normalFromTexture(base, (o.metal||0)>=0.5 ? 0.30 : 0.35);
        if(p.envMapIntensity==null) p.envMapIntensity = (o.metal||0)>=0.5 ? .85 : .32;
      }

        if(o.sheen!=null){ mm.sheen=o.sheen; mm.sheenRoughness=.6; mm.sheenColor=new THREE.Color(o.sheenColor||0xffffff); }
        return mm;
      }
      return new THREE.MeshStandardMaterial(p);
    },
    /* 方盒（y=底面高度） */
    box(w,h,d,mat,x,y,z){ return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),x,y,z,true,h); },
    /* 圆角方盒（y=底面高度，r=倒角半径，seg=倒角细分） */
    rb(w,h,d,r,mat,x,y,z,seg){ return add(new THREE.Mesh(rboxGeo(w,h,d,r,seg||3),mat),x,y,z,true,h); },
    /* 圆柱/圆锥（y=底面高度） */
    cyl(rTop,rBot,h,mat,x,y,z,seg){ return add(new THREE.Mesh(new THREE.CylinderGeometry(rTop,rBot,h,seg||20),mat),x,y,z,true,h); },
    /* 胶囊管：len 为总长，center 定位，axis 'x'|'y'|'z' */
    tube(len,r,mat,x,y,z,axis){ const mm=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(0.005,len-2*r),4,14),mat);
      mm.position.set(x||0,y||0,z||0);
      if(axis==='x') mm.rotation.z=Math.PI/2; if(axis==='z') mm.rotation.x=Math.PI/2;

    sph(r,mat,x,y,z,seg){ const mm=new THREE.Mesh(new THREE.SphereGeometry(r,seg||18,(seg||18)*0.7),mat);
      mm.position.set(x||0,y||0,z||0); mm.castShadow=true; g.add(mm); return mm; },
    torus(R,r,mat,x,y,z,rotX){ const mm=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,24),mat);
      mm.position.set(x||0,y||0,z||0); if(rotX) mm.rotation.x=rotX; mm.castShadow=true; g.add(mm); return mm; },
    /* 旋转体：pts=[[半径,高度],...] 自下而上 */
    lathe(pts,mat,x,y,z,seg){ const v=pts.map(p=>new THREE.Vector2(Math.max(0.0005,p[0]),p[1]));

    /* 任意多边形拉伸：pts=[[x,y],...]（在局部平面内），depth=厚度；

    ext(pts,depth,mat,x,y,z,plane,bevel){
      const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));

      if(bevel){ o.bevelSize=bevel; o.bevelThickness=bevel; o.bevelSegments=3; o.depth=Math.max(0.004,depth-2*bevel); }

    /* 软包坐垫：圆角+顶面微鼓+四周包边线 */

    bar(len,r,mat,x,y,z,axis){ C.tube(len,r,mat,x,y,z,axis||'x');

/* 贴图兜底：各 kind 分支里就地 new 出来的材质很容易漏贴图（实测漏了十几处）。
   建完模统一扫一遍，按金属度补一张极淡的微表面贴图 + 法线贴图。
   玻璃、纯自发光件跳过；已有贴图的只补法线。
   要显式退出的话，给材质挂 userData.noTex / noNrm。 */
function ensureTextured(root){
  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of list){
      if(!m || m.isMeshBasicMaterial) continue;
      if(m.transparent && m.opacity != null && m.opacity < 0.8) continue;      // 玻璃
      if(m.emissiveIntensity != null && m.emissiveIntensity >= 1.5) continue;  // 发光面
      const metal = m.metalness || 0;
      if(!m.map && !(m.userData && m.userData.noTex)){
        const base = metal >= 0.5 ? brushedSteelTexture()
                   : metal > 0    ? powderCoatTexture()
                   : laminateTexture();
        m.map = base;
        if(m.envMapIntensity == null || m.envMapIntensity === 1)
          m.envMapIntensity = metal >= 0.5 ? .85 : .32;
        m.needsUpdate = true;
      }
      if(m.map && !m.normalMap && !(m.userData && m.userData.noNrm)){
        m.normalMap = normalFromTexture(m.map, metal >= 0.5 ? .30 : .45);
        m.needsUpdate = true;
      }
    }
  });
  return root;
}

      const L=new THREE.PointLight(lc, lm*0.72/(4*Math.PI), dist, 2);
      L.position.set(0,y,0); L.castShadow=!!spec.shadow;

    if(kind==='downlight'){
      const r=wf/2;
      // 嵌入式：只有薄边圈与发光面露在天花面上，筒体在天花之上（室内看不见）
      const ring=new THREE.Mesh(new THREE.CylinderGeometry(r, r, .035, 24), trim);
      ring.position.set(0, CEIL_H-.017, 0); g.add(ring);                       // 齐平边圈

      const drop=CEIL_H-cm2ft(165);

  // —— 高精度材质：织物有织纹、木材有木纹、金属分哑光/镀铬 ——
  const matWood = new THREE.MeshStandardMaterial({map:furnWoodTexture(), color:0x8a6b4a, roughness:.62});

  // —— 造型基元 ——
  const rb=(w,h,d,r,m,x=0,y=0,z=0,seg)=>{                 // 圆角体（y 为底部对齐）

    c.scale.y=1; c.geometry=c.geometry;
    const cr=(crown==null?0.035:crown);

  const legT=(topR,botR,h,m,x,z,tilt)=>{                  // 锥形腿（可外撇）

  ensureTextured(g);
  mergeByMaterial(g);
  g.position.set(it.x, 0, it.y);

}
/* 增量同步：只重建"几何/材质相关属性变了"的家具；单纯移动或旋转只更新变换矩阵。
   原先每次家具变动都全量重建——拖动时每个指针事件都重建全部家具几何（10 件约 300ms）。*/
function furnSig(it, spec, shadow){
  return [spec.id, spec.w, spec.d, spec.h, spec.kind, spec.model||'', spec.color||'', spec.color2||'',
          it.color||'', it.cct||'', it.dim==null?'':it.dim, shadow?1:0,
          it.custom? JSON.stringify(it.custom):''].join('|');
}
function sync3D(){
  if(!three) return;
  if(!three.furnMap) three.furnMap=new Map();
  const map=three.furnMap, alive=new Set();
  let lightBudget=6;                       // 只给前几盏灯开阴影，避免帧率崩塌
  let changed=0;
  for(const it of state.items){
    const base=itemSpec(it); if(!base) continue;
    let spec=base, shadow=false;
    if(isLight(base) && lightBudget>0){ shadow=true; spec=Object.assign({},base,{shadow:true}); lightBudget--; }
    alive.add(it.uid);
    const sig=furnSig(it, base, shadow);
    const prev=map.get(it.uid);
    if(prev && prev.sig===sig){                        // 几何没变 → 只更新位姿
      prev.g.position.set(it.x, 0, it.y);
      prev.g.rotation.y = -(it.rot||0)*Math.PI/180;
      continue;
    }
    if(prev){ disposeOwned(prev.g); three.furnGroup.remove(prev.g); }
    const g=furn3D(it,spec);
    three.furnGroup.add(g);
    map.set(it.uid, {g, sig});
    changed++;
  }
  for(const [uid,rec] of [...map]){                    // 清理已删除的家具
    if(alive.has(uid)) continue;
    disposeOwned(rec.g); three.furnGroup.remove(rec.g); map.delete(uid); changed++;
  }
  if(changed) applyLightMode();                        // 只有增删/换件才需要重算照明
  requestShadowUpdate();
}
function sync3Dfull(){                                 // 强制全量重建（材质方案整体变化时用）
  if(!three) return;
  disposeOwned(three.furnGroup); three.furnGroup.clear();
  if(three.furnMap) three.furnMap.clear();
  sync3D();
}

/* 瑞典语字母折叠：目录里有 Å/Ä/Ö（还有当直径符号用的 Ø），英文键盘打不出来。
   搜索时把「查询词」和「商品名」两边都折成 ASCII 再比对，所以 poang / POÄNG /
   poäng 都能搜到 POÄNG，而列表显示的仍然是正确的瑞典语拼写。
   NFD 分解能处理 å ä ö é ü 这类「基字母+变音符」；ø æ ß đ ł ð þ 不可分解，单独映射。*/
const FOLD_EXTRA = {'ø':'o','æ':'ae','ß':'ss','œ':'oe','đ':'d','ł':'l','ð':'d','þ':'th','ŋ':'n'};
const _foldCache = new Map();
function foldText(s){
  if(!s) return '';
  const hit=_foldCache.get(s); if(hit!==undefined) return hit;
  const v = s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')        // 去掉变音符号（CJK 不受影响）
    .replace(/[øæßœđłðþŋ]/g, ch=>FOLD_EXTRA[ch]||ch);
  if(_foldCache.size<4000) _foldCache.set(s, v);            // 逐字输入会产生很多临时串，封顶
  return v;
}

/* =====================================================================
   目录缩略图：把每件家具用独立的小 renderer 渲成 3/4 视角小图，
   替掉原来那个纯色块。按需渲染（滚动到可视区才画）+ 结果缓存，
   所以开局不会卡；搜索重建列表时直接命中缓存。
   ===================================================================== */
const THUMB_W = 320, THUMB_H = 240;      // 卡片按 4:3 显示，渲得大一点才看得清
let _thumbGL = null, _thumbDead = false;
function thumbGL(){
  if(_thumbGL || _thumbDead) return _thumbGL;
  try{
    const cv = document.createElement('canvas'); cv.width = THUMB_W; cv.height = THUMB_H;
    const r = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, preserveDrawingBuffer:true});
    r.setPixelRatio(1); r.setSize(THUMB_W, THUMB_H, false);
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
    r.physicallyCorrectLights = false;          // 缩略图要的是看清造型，不是物理正确
    const scene = new THREE.Scene();
    // 注意：physicallyCorrectLights=false 时 three 会把光照乘 π 作补偿，
    // 按物理直觉给的强度会高出三倍多——浅色件直接推成纯白，
    // 沙色和石灰色两个配色的缩略图看起来一模一样。这组数是实测调出来的。
    scene.add(new THREE.AmbientLight(0xffffff, 0.22));
    scene.add(new THREE.HemisphereLight(0xe6effc, 0x8e8578, 0.28));
    const k = new THREE.DirectionalLight(0xfff6e8, 0.55); k.position.set(4, 7, 6); scene.add(k);
    const f = new THREE.DirectionalLight(0xd8e8ff, 0.18); f.position.set(-5, 2, -4); scene.add(f);
    const cam = new THREE.PerspectiveCamera(26, THUMB_W/THUMB_H, 0.02, 400);
    _thumbGL = {r, cv, scene, cam};
  }catch(e){ _thumbDead = true; console.warn('缩略图渲染器不可用:', e.message); }
  return _thumbGL;
}
const _thumbCache = new Map();
function furnThumb(spec){
  if(_thumbCache.has(spec.id)) return _thumbCache.get(spec.id);
  let url = null;
  const G = thumbGL();
  if(G){
    let g = null;
    try{
      g = furn3D({uid:-1, ref:spec.id, x:0, y:0, rot:0}, spec);
      g.position.set(0,0,0);
      g.rotation.y = -Math.PI*0.17;                       // 微微转个角度，看得出体块
      g.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(g);
      if(box.isEmpty()) throw new Error('空包围盒');
      const size = new THREE.Vector3(), ctr = new THREE.Vector3();
      box.getSize(size); box.getCenter(ctr);
      const R = Math.max(size.length()*0.5, 0.05);
      // 视角按体型选：吸顶灯本来就是从下往上看的；地毯/爬行垫这种扁平件
      // 用常规 25° 仰角看基本是一条线，得压成俯视。
      const flat = size.y < 0.22 * Math.max(size.x, size.z);
      const dir = isLight(spec) ? new THREE.Vector3(0.45, -0.42, 1).normalize()
                : flat          ? new THREE.Vector3(0.34, 1.00, 0.62).normalize()
                                : new THREE.Vector3(0.58, 0.46, 1).normalize();
      // 按包围盒八个角的投影迭代贴合。用包围球半径定距离会把细高件（书柜）
      // 缩到只占画面 15%，displayed 到 52px 就什么都看不见了。
      const corners = [];
      for(let i=0;i<8;i++) corners.push(new THREE.Vector3(
        (i&1)?box.max.x:box.min.x, (i&2)?box.max.y:box.min.y, (i&4)?box.max.z:box.min.z));
      let dist = R / Math.tan(26*Math.PI/360) * 1.1;
      for(let iter=0; iter<4; iter++){
        G.cam.position.copy(ctr).addScaledVector(dir, dist);
        G.cam.lookAt(ctr);
        G.cam.updateMatrixWorld(true);
        G.cam.matrixWorldInverse.copy(G.cam.matrixWorld).invert();
        G.cam.updateProjectionMatrix();
        let mx = 0;
        for(const c of corners){ const p = c.clone().project(G.cam);
          mx = Math.max(mx, Math.abs(p.x), Math.abs(p.y)); }
        if(!(mx > 0)) break;
        dist *= mx / 0.90;                      // 目标：最长边占画面 90%
        if(Math.abs(mx - 0.90) < 0.02) break;
      }
      G.cam.position.copy(ctr).addScaledVector(dir, dist);
      G.cam.lookAt(ctr);
      G.cam.updateMatrixWorld(true);
      G.cam.matrixWorldInverse.copy(G.cam.matrixWorld).invert();
      G.cam.updateProjectionMatrix();
      G.scene.add(g);
      G.r.render(G.scene, G.cam);
      // 第二遍：按真实剪影收紧并居中。包围盒的角常常是空气——开放式框架（爬爬架）
      // 和平面旋转过的矩形（爬行垫）尤其明显，只按包围盒取景会白留三四成画面。
      const meas = document.createElement('canvas'); meas.width = THUMB_W; meas.height = THUMB_H;
      const mg = meas.getContext('2d'); mg.drawImage(G.cv, 0, 0);
      const md = mg.getImageData(0, 0, THUMB_W, THUMB_H).data;
      let bx0=1e9, bx1=-1, by0=1e9, by1=-1;
      for(let y=0;y<THUMB_H;y++) for(let x=0;x<THUMB_W;x++){
        if(md[(y*THUMB_W+x)*4+3] > 12){
          if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; } }
      if(bx1 >= 0){
        const sxs=(bx1-bx0+1)/THUMB_W, sys=(by1-by0+1)/THUMB_H;
        const k=Math.max(sxs, sys);
        const ndcx=((bx0+bx1+1)/2/THUMB_W)*2-1, ndcy=-(((by0+by1+1)/2/THUMB_H)*2-1);
        if(k > 0.03 && (k < 0.86 || Math.abs(ndcx) > 0.04 || Math.abs(ndcy) > 0.04)){
          const rt=new THREE.Vector3(), upv=new THREE.Vector3(), fw=new THREE.Vector3();
          G.cam.matrixWorld.extractBasis(rt, upv, fw);
          const halfH=Math.tan(26*Math.PI/360)*dist, halfW=halfH*G.cam.aspect;
          const tgt=ctr.clone().addScaledVector(rt, ndcx*halfW).addScaledVector(upv, ndcy*halfH);
          dist *= Math.min(1.6, Math.max(0.4, k/0.90));
          G.cam.position.copy(tgt).addScaledVector(dir, dist);
          G.cam.lookAt(tgt);
          G.cam.updateMatrixWorld(true);
          G.cam.matrixWorldInverse.copy(G.cam.matrixWorld).invert();
          G.cam.updateProjectionMatrix();
          G.r.render(G.scene, G.cam);
        }
      }
      url = G.cv.toDataURL('image/png');
    }catch(e){ url = null; }
    if(g){ G.scene.remove(g); try{ disposeOwned(g); }catch(e){} }
  }
  _thumbCache.set(spec.id, url);
  return url;
}
/* 渲染排队：每帧最多占用十几毫秒，滚动时不掉帧 */
const _thumbQ = [];
let _thumbBusy = false;
function _thumbFallback(el, spec){ el.style.backgroundImage=''; el.style.backgroundColor = spec.color || '#7d848e'; }
function _thumbApply(el, spec, url){
  if(url){ el.style.backgroundImage = 'url('+url+')'; el.style.backgroundColor = '#12151a'; el.classList.add('has'); }
  else _thumbFallback(el, spec);
}
function queueThumb(el, spec){
  if(spec.img){ el.style.backgroundImage = 'url('+spec.img+')'; el.style.backgroundColor='transparent';
                el.classList.add('has'); return; }
  if(_thumbCache.has(spec.id)){ _thumbApply(el, spec, _thumbCache.get(spec.id)); return; }
  _thumbQ.push([el, spec]);
  if(!_thumbBusy){ _thumbBusy = true; setTimeout(_runThumbs, 0); }
}
function _runThumbs(){
  const t0 = performance.now();
  while(_thumbQ.length && performance.now()-t0 < 16){
    const [el, spec] = _thumbQ.shift();
    if(!el.isConnected) continue;
    _thumbApply(el, spec, furnThumb(spec));
  }
  if(_thumbQ.length) setTimeout(_runThumbs, 0);
  else _thumbBusy = false;
}
let _thumbIO = null;
function observeThumbs(container){
  const all = [...CATALOG, ...state.customCat];
  const nodes = container.querySelectorAll('.ph[data-thumb]');
  if(!('IntersectionObserver' in window)){          // 没有 IO 就全排队
    nodes.forEach(el=>{ const sp = all.find(c=>c.id===el.dataset.thumb); if(sp) queueThumb(el, sp); });
    return;
  }
  if(!_thumbIO){
    _thumbIO = new IntersectionObserver(es=>{
      for(const e of es){
        if(!e.isIntersecting) continue;
        _thumbIO.unobserve(e.target);
        const sp = [...CATALOG, ...state.customCat].find(c=>c.id===e.target.dataset.thumb);
        if(sp) queueThumb(e.target, sp);
      }
    }, {root: $('#catList'), rootMargin: '220px 0px'});
  }
  nodes.forEach(el=>_thumbIO.observe(el));
}

function buildCatalog(filter=''){
  const listEl = $('#catList'); listEl.innerHTML='';
  const cats = {};
  const all = [...CATALOG, ...state.customCat];
  const q = foldText(String(filter).trim());
  for(const c of all){
    if(q && !(foldText(c.name).includes(q) || foldText(c.cat).includes(q))) continue;
    (cats[c.cat] = cats[c.cat]||[]).push(c);
  }
  let first=true;
  for(const cat in cats){
    const grp = document.createElement('div'); grp.className='catGroup'+((first||filter)?' open':''); first=false;
    const h = document.createElement('h3'); h.innerHTML=`${cat}<span>▾</span>`;
    h.onclick=()=>grp.classList.toggle('open');
    grp.appendChild(h);
    const items = document.createElement('div'); items.className='catGrid';
    for(const c of cats[cat]){
      const card = document.createElement('div'); card.className='catCard';
      const p = fmtPrice(c);
      const tip = (c.name + (c.note? ' — '+c.note : '')).replace(/"/g,'&quot;');
      card.innerHTML = `<div class="ph" data-thumb="${c.id}" style="background-color:${c.color}"></div>
        <div class="meta">
          <div class="nm2" title="${tip}">${c.name}</div>
          <div class="sub"><span>${fmtLen(cm2ft(c.w))}×${fmtLen(cm2ft(c.d))}</span>${p?`<b class="${isBuiltIn(c)?'builtin':''}">${p}</b>`:''}</div>
        </div>`;
      card.onclick=()=>addItem(c.id);
      items.appendChild(card);
    }
    grp.appendChild(items); listEl.appendChild(grp);
  }
  observeThumbs(listEl);
  // 分类展开时里面的行才进入可视区，得再挂一次
  listEl.querySelectorAll('.catGroup h3').forEach(h=>{
    const prev = h.onclick;
    h.onclick = ()=>{ prev && prev(); setTimeout(()=>observeThumbs(listEl), 0); };
  });
}

/* =====================================================================
   币种：美元 / 加元
   两地标价常常不只差一个汇率（IKEA 加拿大定价普遍比美国高出汇率之外的一截，
   Avenlur / QUADRO 这类本来就只给加元价），所以：
     - price   = 美国实际标价（USD）
     - priceCA = 加拿大实际标价（CAD）
   哪个币种有当地实际标价就直接用；只有另一边的价时才按汇率折算，
   并且**必须标上 ≈**，让用户知道那不是当地实际标价。
   ===================================================================== */
const FX_DEFAULT = 1.38;                 // 1 USD ≈ ? CAD（2026-09 量级，可在界面上改）
function fxRate(){ const v = +(state.fx || FX_DEFAULT); return (v > 0.2 && v < 5) ? v : FX_DEFAULT; }
function curNow(){ return state.cur === 'cad' ? 'cad' : 'usd'; }
const CUR_SYM = {usd:'US$', cad:'CA$'};
/* 固定在墙/天花上的灯（筒灯/吸顶灯/镜前灯/吊灯）是公寓自带的，不参与购物 */
function isBuiltIn(spec){ return isLight(spec); }
/* 返回 {v, exact} 或 null。exact=false 表示是汇率折算出来的估值 */
function priceOf(spec, cur){
  if(!spec || isBuiltIn(spec)) return null;
  cur = cur || curNow();
  const usd = (spec.price != null && spec.price > 0) ? spec.price : null;
  const cad = (spec.priceCA != null && spec.priceCA > 0) ? spec.priceCA : null;
  if(cur === 'cad'){
    if(cad != null) return {v: cad, exact: true};
    if(spec.caNA) return null;                       // 加拿大不售，折算出来也没意义
    if(usd != null) return {v: usd * fxRate(), exact: false};
  } else {
    if(usd != null) return {v: usd, exact: true};
    if(cad != null) return {v: cad / fxRate(), exact: false};
  }
  return null;
}
function fmtMoney(v, cur){
  cur = cur || curNow();
  return CUR_SYM[cur] + Math.round(v).toLocaleString();
}
function fmtPrice(spec, cur){
  if(isBuiltIn(spec)) return '公寓自带';
  if((cur || curNow()) === 'cad' && spec.caNA && spec.priceCA == null) return '加拿大无售';
  const p = priceOf(spec, cur);
  if(!p) return '';
  return (p.exact ? '' : '≈') + fmtMoney(p.v, cur);
}
function setCurrency(c){
  state.cur = (c === 'cad') ? 'cad' : 'usd';
  syncCurUI(); buildCatalog($('#catSearch') ? $('#catSearch').value : '');
  updateTotals(); updatePlacedList(); updateProps(); save();
}
function syncCurUI(){
  const c = curNow();
  const a = $('#curUSD'), b = $('#curCAD'), f = $('#fxRate');
  if(a) a.classList.toggle('on', c === 'usd');
  if(b) b.classList.toggle('on', c === 'cad');
  if(f && document.activeElement !== f) f.value = fxRate();
}

function addItem(refId){
  // 放到当前视图中心附近
  const cx = (vb.x+vb.w/2)/S, cy=(vb.y+vb.h/2)/S;
  const it = {uid:uidSeq++, ref:refId, x:Math.round(cx*4)/4, y:Math.round(cy*4)/4, rot:0};
  state.items.push(it); selected=it.uid;
  drawFurniture(); save();
}
function updateTotals(){
  const cur = curNow();
  let sum=0, buy=0, fixed=0, approx=0, unknown=0, na=0;
  for(const it of state.items){
    const s=itemSpec(it); if(!s) continue;
    if(isBuiltIn(s)){ fixed++; continue; }
    buy++;
    const p=priceOf(s, cur);
    if(!p){ if(cur==='cad' && s.caNA) na++; else unknown++; continue; }
    sum += p.v; if(!p.exact) approx++;
  }
  const tail = [];
  if(approx)  tail.push(`${approx} 件按汇率折算`);
  if(na)      tail.push(`${na} 件加拿大无售`);
  if(unknown) tail.push(`${unknown} 件无价`);
  if(fixed)   tail.push(`${fixed} 件固定灯具不计价`);
  $('#totals').innerHTML = `采购 ${buy} 件 · 合计约 <b>${approx?'≈':''}${fmtMoney(sum, cur)}</b>` +
    (tail.length ? ` <span class="muted" style="font-size:11px">（${tail.join('、')}）</span>` : '');
}
function updatePlacedList(){
  const el2 = $('#plRows'); el2.innerHTML='';
  const buy = [], fixed = [];
  for(const it of state.items){
    const s=itemSpec(it); if(!s) continue;
    (isBuiltIn(s) ? fixed : buy).push([it, s]);
  }
  $('#plCount').textContent = buy.length;
  const mkRow = (it, s, showPrice)=>{
    const row=document.createElement('div'); row.className='plRow'+(it.uid===selected?' sel':'');
    const p = showPrice ? fmtPrice(s) : '';
    row.innerHTML=`<div class="dot" style="background:${itemColor(it)}"></div><span>${s.name}</span>`+
      (p?`<span class="plPrice">${p}</span>`:'')+`<span class="x" title="删除">✕</span>`;
    row.onclick=(e)=>{ if(e.target.classList.contains('x')){ state.items=state.items.filter(i=>i.uid!==it.uid); if(selected===it.uid)selected=null; drawFurniture(); save(); }
      else { selected=it.uid; drawFurniture(); } };
    el2.appendChild(row);
  };
  for(const [it, s] of buy) mkRow(it, s, true);
  // 固定灯具是公寓自带的，跟购物无关——单独一节，不进采购清单、不计价
  if(fixed.length){
    const h=document.createElement('div'); h.className='plFixedHead';
    h.textContent=`固定灯具 ${fixed.length} 件 · 公寓自带，不计价`;
    el2.appendChild(h);
    for(const [it, s] of fixed) mkRow(it, s, false);
  }
}
function updateProps(){
  const it = state.items.find(i=>i.uid===selected);
  if(!it){ $('#pTitle').textContent='未选中家具'; $('#pInfo').style.display='block'; $('#pFields').style.display='none'; return; }

  syncLightUI(it);
  $('#pColor').value = /^#/.test(itemColor(it))? itemColor(it) : '#8a7d6b';
  const _pp = priceOf(s);
  $('#pPrice').textContent = isBuiltIn(s) ? '公寓自带（不计价）' : (fmtPrice(s) || '—');
  $('#pPrice').title = isBuiltIn(s) ? '固定在墙/天花上的灯具属于公寓自带，不计入采购清单'
    : (_pp && !_pp.exact ? '当地没有实际标价，按汇率 1 USD = '+fxRate()+' CAD 折算，仅供参考' : '');
  const a=$('#pUrl'); if(s.url){a.href=s.url; a.textContent='打开产品页 ↗';} else {a.removeAttribute('href'); a.textContent='—';}
  // 离墙距离提示
  $('#pClear').textContent = `位置 (${it.x.toFixed(2)}, ${it.y.toFixed(2)}) ft`;
}
$('#pRot').addEventListener('input', e=>{ const it=state.items.find(i=>i.uid===selected); if(it){ it.rot=Math.round((+e.target.value||0)*10)/10; drawFurniture(); save(); }});

$('#pRot90').onclick=()=>{ const it=state.items.find(i=>i.uid===selected); if(it){ it.rot=(it.rot+90)%360; drawFurniture(); save(); }};
function syncLightUI(it){

/* ===== 2D 量尺寸 =====
   点第一下定起点，移动时实时预览，点第二下落定。可以连续量多条，
   长度跟着单位切换走。Esc 或再点一次「量尺寸」退出。 */
const meas = {on:false, list:[], p0:null, hover:null};
function measFmt(a, b){
  const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
  return {L, txt: fmtLen(L, {precise:true})};
}
function drawMeasure(){
  if(!gMeas) return;
  gMeas.innerHTML = '';
  const k = Math.max(0.05, (svg.getScreenCTM()||{a:1}).a || 1);   // 标注按屏幕尺寸恒定
  const seg = (a, b, live)=>{
    const col = live ? '#ffd45e' : '#26e0a8';
    el('line',{x1:a[0]*S, y1:a[1]*S, x2:b[0]*S, y2:b[1]*S, stroke:col,
      'stroke-width':1.6/k, 'stroke-dasharray': live? (5/k)+' '+(4/k) : ''}, gMeas);
    for(const p of [a, b]){                                    // 端点十字
      el('line',{x1:(p[0]-4/k/S)*S, y1:p[1]*S, x2:(p[0]+4/k/S)*S, y2:p[1]*S, stroke:col,'stroke-width':1.4/k}, gMeas);
      el('line',{x1:p[0]*S, y1:(p[1]-4/k/S)*S, x2:p[0]*S, y2:(p[1]+4/k/S)*S, stroke:col,'stroke-width':1.4/k}, gMeas);
    }
    const {txt} = measFmt(a, b);
    const mx=(a[0]+b[0])/2*S, my=(a[1]+b[1])/2*S;
    let ang = Math.atan2(b[1]-a[1], b[0]-a[0])*180/Math.PI;
    if(ang > 90 || ang < -90) ang += 180;                      // 字不倒着写
    const g2 = el('g',{transform:`translate(${mx} ${my}) rotate(${ang})`}, gMeas);
    const w = txt.length*6.2/k + 10/k, h = 14/k;
    el('rect',{x:-w/2, y:-h-3/k, width:w, height:h, rx:3/k, fill:'rgba(12,14,18,.82)',
      stroke:col,'stroke-width':0.8/k}, g2);
    const t = el('text',{x:0, y:-6/k,'text-anchor':'middle','font-size':10/k, fill:col}, g2);
    t.textContent = txt;
  };
  for(const m of meas.list) seg(m[0], m[1], false);
  if(meas.p0 && meas.hover) seg(meas.p0, meas.hover, true);
}
function measStart(){
  meas.on = true; meas.p0 = null; meas.hover = null;
  $('#btnMeas').classList.add('on');
  document.body.classList.add('measuring');
  $('#hint').innerHTML = '<b>量尺寸</b>：点一下定起点，再点一下落定 · 按住 Shift 锁定水平/垂直 · Esc 退出 · 「清除」删除全部';
  drawMeasure();
}
function measEnd(){
  if(!meas.on) return;
  meas.on = false; meas.p0 = null; meas.hover = null;
  $('#btnMeas').classList.remove('on');
  document.body.classList.remove('measuring');
  if(state.view === '2d') setView('2d');
  drawMeasure();
}
function measClear(){ meas.list = []; meas.p0 = null; meas.hover = null; drawMeasure(); }
function measSnap(p, ref, shift){
  if(!shift || !ref) return p;
  return Math.abs(p[0]-ref[0]) > Math.abs(p[1]-ref[1]) ? [p[0], ref[1]] : [ref[0], p[1]];
}
function measClick(ftPt, shift){
  const p = measSnap(ftPt, meas.p0, shift);
  if(!meas.p0){ meas.p0 = p; }
  else { meas.list.push([meas.p0, p]); meas.p0 = null; }
  meas.hover = null; drawMeasure();
}
function measMove(ftPt, shift){
  if(!meas.on || !meas.p0) return;
  meas.hover = measSnap(ftPt, meas.p0, shift);
  drawMeasure();
}

/* 视图共三档：'2d' | 'doll'(3D 俯瞰) | 'fp'(室内)。
   后两档共用同一个 WebGL 画布，只是相机模式不同——所以到处要问的是"是不是 3D"。 */
function is3D(){ return state.view === 'doll' || state.view === 'fp'; }
function setView(v){
  if(v === '3d') v = 'doll';                       // 兼容旧调用
  state.view = v;
  const in3 = is3D(), fp = (v === 'fp');
  $('#btn2d').classList.toggle('on', v==='2d');
  $('#btnDoll').classList.toggle('on', v==='doll');
  $('#btnFP').classList.toggle('on', fp);
  $('#svg2d').style.display = v==='2d'?'block':'none';

function installSplitter(id, target, side){
  const sp = $(id), el2 = $(target);
  if(!sp || !el2) return;
  sp.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const startX = ev.clientX, startW = el2.getBoundingClientRect().width;
    sp.classList.add('dragging');
    sp.setPointerCapture(ev.pointerId);
    const move = e2=>{
      const dx = (e2.clientX - startX) * (side === 'left' ? 1 : -1);
      const w = Math.max(220, Math.min(window.innerWidth*0.7, startW + dx));
      el2.style.width = w + 'px';
      fitCanvasSoon();
    };
    const up = ()=>{
      sp.classList.remove('dragging');
      sp.removeEventListener('pointermove', move);
      sp.removeEventListener('pointerup', up);
      const p = panelState();
      p[side === 'left' ? 'catW' : 'prW'] = Math.round(el2.getBoundingClientRect().width);
      panelSave(p);
    };
    sp.addEventListener('pointermove', move);
    sp.addEventListener('pointerup', up);
  });

  sp.addEventListener('dblclick', ()=>{
    el2.style.width = (side === 'left' ? 400 : 300) + 'px';

    panelSave(p); fitCanvasSoon();
  });
}

function setDoorWidth(newLenFt){
  const s=wallEdit.sel; if(!s||s.kind!=='door') return;
  const d=selDoor(); if(!d) return;
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6, u=[dx/L,dy/L];
  const link=doorLinkage(d, s);
  const moveEnd = (wallEdit.dEndSel!=null) ? wallEdit.dEndSel : (d.hinge?0:1);
  const rg=link.range(moveEnd);
  let L2=Math.max(DOOR_MIN, newLenFt);
  if(moveEnd===1){ L2=Math.min(L2, L+rg[1]); L2=Math.max(L2, Math.max(DOOR_MIN, L+rg[0])); }
  else           { L2=Math.min(L2, L-rg[0]); L2=Math.max(L2, Math.max(DOOR_MIN, L-rg[1])); }
  if(Math.abs(L2-L)<1e-9){ wMsg('已到墙垛允许的极限', true); return; }
  if(moveEnd===1) link.apply(d.x1,d.y1, d.x1+u[0]*L2, d.y1+u[1]*L2);
  else            link.apply(d.x2-u[0]*L2, d.y2-u[1]*L2, d.x2, d.y2);
  geoChanged(); updateWallBarFromSel();
  if(Math.abs(L2-Math.max(DOOR_MIN,newLenFt))>1e-6) wMsg('门宽已夹到墙垛允许范围：'+lenLabel(L2), true);
}
function nudgeDoor(signAlong, stepFt){ // 激活端点则改宽，否则整体滑动
  const s=wallEdit.sel; if(!s||s.kind!=='door') return false;
  const d=selDoor(); if(!d) return false;
  const dx=d.x2-d.x1, dy=d.y2-d.y1, L=Math.hypot(dx,dy)||1e-6, u=[dx/L,dy/L];
  let dd=stepFt*signAlong;
  const link=doorLinkage(d, s);
  const cl=(k,v)=>{ const r=link.range(k); return Math.max(r[0], Math.min(r[1], v)); };
  if(wallEdit.dEndSel===0){
    dd=cl(0,dd); if(L-dd<DOOR_MIN) dd=L-DOOR_MIN;
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1+u[0]*dd, d.y1+u[1]*dd, d.x2, d.y2);
  } else if(wallEdit.dEndSel===1){
    dd=cl(1,dd); if(L+dd<DOOR_MIN) dd=DOOR_MIN-L;
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1, d.y1, d.x2+u[0]*dd, d.y2+u[1]*dd);
  } else {
    dd=Math.max(link.range(0)[0], Math.min(link.range(1)[1], dd));
    if(Math.abs(dd)<1e-9) return true;
    link.apply(d.x1+u[0]*dd, d.y1+u[1]*dd, d.x2+u[0]*dd, d.y2+u[1]*dd);

}

function fpAim(){

  const {cam, controls}=three;
  const y=three.fpYaw||0, p=three.fpPitch||0;
  const dir=new THREE.Vector3(Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p));

  cam.lookAt(cam.position.x+dir.x, cam.position.y+dir.y, cam.position.z+dir.z);  // 直接定朝向

function insideFloorPt(x,z){
  const test=(poly)=>{ let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if((yi>z)!==(yj>z) && x<(xj-xi)*(z-yi)/(yj-yi)+xi) inside=!inside; }
    return inside; };

function walkTo(x,z){
  if(!three) return;
  const cam=three.cam, from=cam.position.clone(), to=new THREE.Vector3(x, EYE_H, z);
  const dist=from.distanceTo(to);
  const dur=Math.min(900, 260+dist*45);
  const t0=performance.now();
  if(three.walk){ clearInterval(three.walk.iv); three.walk.cancel=true; }
  const ease=t=>t<.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const anim={cancel:false};
  // 用定时器而非 rAF 驱动：页面无合成帧时 rAF 会被饿死，动画卡在原地
  anim.iv=setInterval(()=>{
    if(anim.cancel){ clearInterval(anim.iv); return; }
    const t=Math.min(1,(performance.now()-t0)/dur);
    cam.position.lerpVectors(from, to, ease(t));
    cam.position.y=EYE_H;
    fpAim();
    if(t>=1){ clearInterval(anim.iv); three.walk=null; requestShadowUpdate(); }
  }, 16);
  three.walk=anim;
}

function pickFurniture(ev){
  if(!three) return null;
  const cv=three.canvas, r=cv.getBoundingClientRect();
  // r147 的 Raycaster 不刷新 matrixWorld，而本 app 按需渲染：刚改完位姿还没渲染就射线，会打到旧位置
  three.cam.updateMatrixWorld(true);
  three.furnGroup.updateMatrixWorld(true);
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(ndc, three.cam);
  const hits=rc.intersectObjects(three.furnGroup.children, true);
  if(!hits.length || !three.furnMap) return null;
  const g2uid=new Map();
  for(const [uid,rec] of three.furnMap) g2uid.set(rec.g, uid);
  const cands=[];
  for(const h of hits){
    let o=h.object;
    while(o && o.parent!==three.furnGroup) o=o.parent;   // 回溯到家具组
    if(!o) continue;
    const uid=g2uid.get(o); if(uid==null) continue;
    if(cands.some(c=>c.uid===uid)) continue;
    const it=state.items.find(i=>i.uid===uid);
    const sp=it?itemSpec(it):null;
    cands.push({uid, group:o, point:h.point, isLight:!!(sp&&isLight(sp))});
  }
  if(!cands.length) return null;
  // 俯视时吸顶灯永远挡在射线最前面；只要底下还有别的家具，就优先拾取家具
  const nonLight=cands.filter(c=>!c.isLight);
  const pick = nonLight.length ? nonLight[0] : cands[0];
  return {uid:pick.uid, group:pick.group, point:pick.point};
}
function groundAt(ev){
  const cv=three.canvas, r=cv.getBoundingClientRect();
  three.cam.updateMatrixWorld(true);
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(ndc, three.cam);
  const p=new THREE.Vector3();
  return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), p) ? p : null;
}

<script>

async function runPT(){
  const log=[];
  const T=(n,ok,x)=>log.push((ok?'PASS':'FAIL')+' '+n+(x!==undefined?' | '+x:''));
  const wait=(ms)=>new Promise(r=>setTimeout(r,ms||150));

    try{ localStorage.removeItem('planner_v1'); }catch(e){}

      ['besta180',19.5,21,0],['poang',24.8,25,-40],['strandmon',23,30,150],
      ['billy',14.9,22.5,90],['vittsjo_sh',14.9,30,90],['docksta',29,29.5,0],
      ['tobias',27.4,29.5,90],['odger',29,27.9,0],['raskog-0',31,26,0],
      ['vidja',16.3,21.6,0],['hw-02e',26.6,31.4,0],
      ['dl-6',18,22.5,0],['dl-6',23,22.5,0],['dl-6',28,22.5,0],
      ['dl-6',18,27.5,0],['dl-6',23,27.5,0],['dl-6',28,27.5,0],
      ['cl-flush-l',29,29.5,0],['pendant',21,19,0]];
    for(const [id,x,y,rot] of LIVING)
      if(CATALOG.some(c=>c.id===id)) state.items.push({uid:uidSeq++, ref:id, x, y, rot});
    refresh(); setView('3d'); await wait(3200);
    setCamMode('fp'); await wait(600);
    three.cam.position.set(22, EYE_H, 31); fpYaw=Math.PI; fpPitch=-0.05;
    if(typeof applyFP==='function') applyFP();
    await wait(300);

    /* ---- 1. 场景收集 ---- */
    const S=ptCollect();
    T('pt-collect-tris', !!S && S.nTri>80000, S? (S.nTri.toLocaleString()+' 三角形 · '+S.mats.length+' 材质 · '+S.maps.length+' 贴图') : 'null');
    let finite=true;

    T('pt-collect-finite', finite);

    /* ---- 2. BVH 正确性（CPU 独立校验）---- */
    const B=ptBuildBVH(S.nTri, S.cen, S.bmn, S.bmx);
    T('pt-bvh-built', B.nodeCnt>1 && B.nodeCnt<S.nTri*2, B.nodeCnt.toLocaleString()+' 节点');
    const seen=new Uint8Array(S.nTri); let dup=0;

    const N=B.nodes; let leafSum=0, badTri=0, badChild=0, maxDepth=0, leaves=0, maxLeaf=0;

      mo.observe(el, {childList:true, characterData:true, subtree:true});

    const shaderErr=window.__EPT.slice(errs0).filter(m=>/shader|GLSL|program|compil/i.test(m));
    T('pt-shader-compiles', shaderErr.length===0, shaderErr.join(' ;; ').slice(0,400));

    if(off){

                            .filter(v=>v!==null);
      T('pt-progress-updates', off.seenTxt.length>=3, off.seenTxt.length+' 次文案变化');
      T('pt-progress-nonzero', pcts.some(v=>v>0), '出现过的百分比: '+pcts.slice(0,6).join(',')+
        (pcts.length? ' 最大='+Math.max.apply(null,pcts)+'%' : ' 无'));

      const g=off.cv.getContext('2d');

      let sum=0,nz=0,mx=0;
      for(let i=0;i<d.length;i+=4){ const l=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;

      T('pt-image-has-range', mx>60, '峰值='+mx.toFixed(0));

      T('pt-denoise-keeps-brightness', s2/(d2.length/4) > 6, '降噪后均值='+(s2/(d2.length/4)).toFixed(1));
    }
    /* ===== v3.5：GPU 栅栏节流 / NaN 防护 / 上下文丢失 ===== */
    // 进度必须由 GPU 真实完成量驱动：文案里出现「等待 GPU」说明栅栏在起作用；
    // 就算没等到，也必须单调且最后落到 100%
    // 每次渲染各自判断单调性——两次独立渲染串起来比会误判（第二次从头开始）
    const pctOf = (run)=> (run? run.seenTxt : []).map(t=>{ const m=t.match(/([\d.]+)%/);
      return m? parseFloat(m[1]) : null; }).filter(v=>v!==null);
    const pctA = pctOf(off), pctB = pctOf(on);
    T('pt-progress-reaches-full', pctA.length>0 && Math.max.apply(null, pctA) >= 87,
      '最大进度 '+Math.max.apply(null, pctA)+'%');
    T('pt-progress-never-jumps-back',
      pctA.every((v,i)=>i===0 || v>=pctA[i-1]-0.01) &&
      pctB.every((v,i)=>i===0 || v>=pctB[i-1]-0.01),
      '降噪关 '+pctA.length+' 次 / 降噪开 '+pctB.length+' 次采样点，各自单调');
    T('pt-progress-fine-grained', pctA.length >= 20,
      pctA.length+' 次进度更新（粒度太粗会让用户以为卡住了）');
    T('pt-fence-throttles', typeof WebGL2RenderingContext!=='undefined' &&
      !!three.renderer.getContext().fenceSync, '浏览器支持 fenceSync');
    // 早停时上报的 spp 必须是真实完成量，不能谎报成 samples
    T('pt-reports-real-spp', off.spp<=8 && off.spp>0, '请求 8，实际完成 '+off.spp);
    // NaN 防护：出图里不能有孤立的极亮点（NaN 会被加法混合永久累进）
    if(off && off.cv){
      const g4=off.cv.getContext('2d'), w4=off.cv.width, h4=off.cv.height;
      const d4=g4.getImageData(0,0,w4,h4).data;
      const L4=(x,y)=>{ const i=(y*w4+x)*4; return d4[i]*0.299+d4[i+1]*0.587+d4[i+2]*0.114; };
      let spikes=0;
      for(let y=1;y<h4-1;y++) for(let x=1;x<w4-1;x++){
        const c=L4(x,y);
        if(c<200) continue;
        const nb=(L4(x-1,y)+L4(x+1,y)+L4(x,y-1)+L4(x,y+1))/4;
        if(c-nb>110) spikes++;            // 比四邻亮出一大截 = 孤立亮点
      }
      // 阈值随采样数收紧：萤火虫大致按 1/sqrt(spp) 衰减，NaN 则完全不衰减
      const spikeLim = 0.02/Math.sqrt(Math.max(1, off.spp));
      T('pt-no-nan-spikes', spikes/(w4*h4) < spikeLim,
        spikes+' 个孤立亮点 / '+(w4*h4)+' 像素 = '+((spikes/(w4*h4))*100).toFixed(2)
        +'%（'+off.spp+' spp 的上限 '+(spikeLim*100).toFixed(2)+'%）');
      window.__spike8 = spikes/(w4*h4);
    }
    /* NaN 与萤火虫的决定性区分：提高采样数后孤立亮点必须显著变少。
       萤火虫是未收敛的高方差样本，会随采样衰减；NaN 被加法混合永久累进，不会。 */
    const hi = await runOnce(false, 32);
    if(hi && hi.cv && window.__spike8 != null){
      const g5=hi.cv.getContext('2d'), w5=hi.cv.width, h5=hi.cv.height;
      const d5=g5.getImageData(0,0,w5,h5).data;
      const L5=(x,y)=>{ const i=(y*w5+x)*4; return d5[i]*0.299+d5[i+1]*0.587+d5[i+2]*0.114; };
      let sp5=0;
      for(let y=1;y<h5-1;y++) for(let x=1;x<w5-1;x++){
        const c=L5(x,y); if(c<200) continue;
        const nb=(L5(x-1,y)+L5(x+1,y)+L5(x,y-1)+L5(x,y+1))/4;
        if(c-nb>110) sp5++; }
      const f8=window.__spike8, f32=sp5/(w5*h5);
      T('pt-spikes-are-fireflies-not-nan', f32 < f8*0.75,
        '8spp '+(f8*100).toFixed(2)+'% → 32spp '+(f32*100).toFixed(2)
        +'%（NaN 不会随采样衰减）');
    } else T('pt-spikes-are-fireflies-not-nan', false, '高采样对照渲染失败');

    /* KALLAX 这类白色格架在光追下曾经「快隐身」：把光栅用的 amb+hemi 假环境光
       原样叠到真 GI 上，等于把房间塞进发光白球，对比度被抹平，白家具和白墙糊成一片。
       这里用「结构对比度」守住——格子的明暗层次必须还在。 */
    const kal = CATALOG.find(c=>c.id==='kallax-a-0');
    if(kal){
      state.items=[{uid:9001, ref:kal.id, x:22, y:21.4, rot:0},
                   {uid:9002, ref:'dl-6', x:22, y:23.5, rot:0}];
      refresh(); await wait(1200);
      three.cam.position.set(22, EYE_H, 26); fpYaw=Math.PI; fpPitch=-0.02;
      if(typeof fpAim==='function') fpAim();
      await wait(400);
      const kr = await new Promise(r=>{
        ptRender(24, {maxPx:140*100, bounces:4, denoise:false, onDone:(cv,spp)=>r({cv,spp})});
        setTimeout(()=>r(null), 300000);
      });
      if(kr && kr.cv){
        const g6=kr.cv.getContext('2d'), w6=kr.cv.width, h6=kr.cv.height;
        const d6=g6.getImageData(0,0,w6,h6).data;
        // 只看画面中段（KALLAX 所在的横条），算亮度标准差 = 结构可辨识度
        let sum=0, sum2=0, n=0;
        for(let y=Math.floor(h6*0.35); y<Math.floor(h6*0.85); y++)
          for(let x=Math.floor(w6*0.25); x<Math.floor(w6*0.75); x++){
            const i=(y*w6+x)*4, v=d6[i]*0.299+d6[i+1]*0.587+d6[i+2]*0.114;
            sum+=v; sum2+=v*v; n++; }
        const mean=sum/n, sd=Math.sqrt(Math.max(0, sum2/n - mean*mean));
        T('pt-kallax-visible', sd > 18 && mean > 25 && mean < 235,
          '格架区域 亮度均值 '+mean.toFixed(1)+' 标准差 '+sd.toFixed(1)
          +'（标准差太小=糊成一片，均值贴边=过曝或全黑）');
      } else T('pt-kallax-visible', false, '渲染没返回');
      state.items=[]; refresh();
    }
    // 环境光填充不能压过真 GI：光追里的天光残留应该远小于光栅的 amb+hemi
    T('pt-ambient-fill-modest', /AMB_FILL\s*=\s*0\.[0-4]/.test(ptRender.toString()),
      '环境光填充系数保持在 0.0~0.4');

    /* ===== 分块自适应：单个 draw 必须短于看门狗阈值（v3.7） =====
       真实 GPU 计时在 headless 下测不到（虚拟时间冻结 performance.now），
       所以直接测决策函数本身。 */
    const GRID = [4, 32, 70, 6];        // minTX, maxTX, tileMax(ms), tileMin(ms)
    const PXS = [480000, 900000, 1600000];
    let gridBad = [], gridTab = [];
    for(const px of PXS){
      for(const us of [0.05, 0.2, 1, 2, 5, 10, 20]){     // 每像素耗时，覆盖强显卡到极弱
        const perPx = us/1000;
        const tx = ptPickGrid(perPx, px, GRID[0], GRID[1], GRID[2]);
        const per = perPx*px/(tx*tx);
        if(per > GRID[2] && tx < GRID[1]) gridBad.push(px/1000+'k/'+us+'µs 没切够细');
        if(tx < GRID[0] || tx > GRID[1]) gridBad.push(px/1000+'k/'+us+'µs 越界 '+tx);
        if(px===900000) gridTab.push(us+'µs→'+tx+'x'+tx);
      }
    }
    T('pt-grid-keeps-draw-short', gridBad.length===0,
      gridBad.length? gridBad.join(' | ') : '标准档: '+gridTab.join(' '));
    // 弱显卡必须真的切到更细：8x8 不是万能答案
    T('pt-grid-scales-with-gpu',
      ptPickGrid(0.0002, 900000, 4, 32, 70) === 4 &&      // 强显卡：4x4 就够
      ptPickGrid(0.005,  900000, 4, 32, 70) >= 16 &&      // 弱显卡：必须 ≥16x16
      ptPickGrid(0.02,   900000, 4, 32, 70) === 32,       // 极弱：顶到 32x32
      '0.2µs→'+ptPickGrid(0.0002,900000,4,32,70)+'x · 5µs→'+ptPickGrid(0.005,900000,4,32,70)
      +'x · 20µs→'+ptPickGrid(0.02,900000,4,32,70)+'x');
    // 运行中校正：太慢就加倍、太快就减半、区间内不动
    T('pt-grid-adjusts-at-runtime',
      ptAdjustGrid(8, 200, 4, 32, 70, 6) === 16 &&
      ptAdjustGrid(8, 2,   4, 32, 70, 6) === 4  &&
      ptAdjustGrid(8, 30,  4, 32, 70, 6) === 8  &&
      ptAdjustGrid(32, 999, 4, 32, 70, 6) === 32 &&       // 到顶不再加
      ptAdjustGrid(4, 0.1, 4, 32, 70, 6) === 4,           // 到底不再减
      '慢→加倍 / 快→减半 / 区间内不动 / 到顶到底都夹住');

    T('pt-cleanup', PT===null, PT===null?'已释放':'仍占用');
    T('pt-quality-presets', !!(PT_QUALITY.draft&&PT_QUALITY.normal&&PT_QUALITY.fine),
      Object.keys(PT_QUALITY).map(k=>PT_QUALITY[k].label+':'+PT_QUALITY[k].spp+'spp').join(' '));
  }catch(e){ log.push('EXC '+e.message+' | '+(e.stack||'').split('\n')[1]); }
  log.push('ERRS: '+JSON.stringify(window.__EPT.slice(0,6)));
  const pre=document.createElement('pre'); pre.id='tpt'; pre.textContent=log.join('\n');
  document.body.appendChild(pre);
}
</script>
